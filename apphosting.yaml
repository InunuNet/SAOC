runConfig:
  runtime: nodejs22
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 2
env:
  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    value: "26yfbug4"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SANITY_DATASET
    value: "production"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAfJhvCRX705OYTH6CN7WqfGO5DDpnss6Y"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "saoc-webapp.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "saoc-webapp"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "saoc-webapp.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1003063203247"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1003063203247:web:77f89e8963900274060b5a"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "saoc-webapp"
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: FIREBASE_ADMIN_CLIENT_EMAIL
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
    availability:
      - RUNTIME
  # Who may hold admin. Read live per request by lib/admin-auth.ts — an empty or
  # missing value fails closed for everyone, which is exactly what happened before
  # this entry existed. Contract-check fixture addresses belong in .env.local only,
  # never here. See docs/admin-access.md.
  - variable: ADMIN_EMAIL_ALLOWLIST
    secret: ADMIN_EMAIL_ALLOWLIST
    availability:
      - RUNTIME
  - variable: SANITY_REVALIDATE_SECRET
    secret: SANITY_REVALIDATE_SECRET
    availability:
      - RUNTIME
  - variable: SANITY_API_TOKEN
    secret: SANITY_API_TOKEN
    availability:
      - RUNTIME
  # The checkout route builds notify_url/return_url/cancel_url on this at REQUEST time,
  # falling back to https://saoc.co.za — which still resolves to the OLD Joomla site, so
  # without this entry every deployed payment's ITN would be delivered there and the
  # ticket would sit permanently 'reserved'. A public origin, not a secret. RUNTIME only:
  # a BUILD entry would bake the origin into the bundle and defeat the per-environment
  # lookup. If the backend is renamed or a custom domain is cut over, this changes with
  # it — and it must never be saoc.co.za until that domain points at this app.
  - variable: SITE_URL
    value: "https://saoc-prod--saoc-webapp.europe-west4.hosted.app"
    availability:
      - RUNTIME
  # PayFast SANDBOX credentials. Without these the deployed checkout route returns
  # "Payment gateway is not configured" and no purchase can be tested at all — the state
  # this backend was in until 2026-08-13. These are the council's own sandbox account
  # values, not PayFast's public 10000100/46f0cd694581a test pair, so they are held in
  # Secret Manager rather than inlined here. RUNTIME only: the signature is computed per
  # request, and a BUILD entry would bake credentials into the bundle.
  # Going live means adding the LIVE equivalents alongside these and switching
  # lib/payfast.ts off the sandbox host — do not repurpose these three variables for it.
  - variable: PAYFAST_SANDBOX_MERCHANT_ID
    secret: PAYFAST_SANDBOX_MERCHANT_ID
    availability:
      - RUNTIME
  - variable: PAYFAST_SANDBOX_MERCHANT_KEY
    secret: PAYFAST_SANDBOX_MERCHANT_KEY
    availability:
      - RUNTIME
  - variable: PAYFAST_SANDBOX_PASSPHRASE
    secret: PAYFAST_SANDBOX_PASSPHRASE
    availability:
      - RUNTIME
  - variable: RECOVERY_TOKEN_SECRET
    secret: RECOVERY_TOKEN_SECRET
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_FROM_ADDRESS
    value: "SAOC <noreply@mail.saoc.co.za>"
    availability:
      - RUNTIME
