runConfig:
  runtime: nodejs22
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 2
env:
  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    value: "26yfbug4"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SANITY_DATASET
    value: "production"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAfJhvCRX705OYTH6CN7WqfGO5DDpnss6Y"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "saoc-webapp.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "saoc-webapp"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "saoc-webapp.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1003063203247"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1003063203247:web:77f89e8963900274060b5a"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "saoc-webapp"
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: FIREBASE_ADMIN_CLIENT_EMAIL
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
    availability:
      - RUNTIME
  # Who may hold admin. Read live per request by lib/admin-auth.ts — an empty or
  # missing value fails closed for everyone, which is exactly what happened before
  # this entry existed. Contract-check fixture addresses belong in .env.local only,
  # never here. See docs/admin-access.md.
  - variable: ADMIN_EMAIL_ALLOWLIST
    secret: ADMIN_EMAIL_ALLOWLIST
    availability:
      - RUNTIME
  - variable: SANITY_REVALIDATE_SECRET
    secret: SANITY_REVALIDATE_SECRET
    availability:
      - RUNTIME
  - variable: SANITY_API_TOKEN
    secret: SANITY_API_TOKEN
    availability:
      - RUNTIME
  # The checkout route (and every transactional email — vendor notifications, ticket
  # confirmations) builds links on this at REQUEST time, falling back to https://saoc.co.za —
  # which still resolves to the OLD Joomla site, so without this entry every deployed payment's
  # ITN and every emailed link would go there and the ticket would sit permanently 'reserved'.
  # A public origin, not a secret. RUNTIME only: a BUILD entry would bake the origin into the
  # bundle and defeat the per-environment lookup.
  #
  # beta.saoc.co.za is the current live origin for this backend — verified 2026-09-02 by a
  # BrowserAgent running the full vendor flow against https://beta.saoc.co.za on deployed
  # revision saoc-prod-build-2026-09-02-001. It replaced the raw *.hosted.app origin because
  # Firebase *.hosted.app / *.run.app URLs must never appear in anything user-facing (they
  # leaked into vendor-application review-button links and ticket confirmation emails before
  # this change). Do NOT set this to the bare saoc.co.za apex — the apex's nameservers are
  # still on the old cPanel host and do not point at this app; cutting the apex over to this
  # backend is a separate DNS migration (see project memory
  # project_domain_migration_resend_sequencing). Once that migration lands, change this value
  # to https://saoc.co.za and update this comment accordingly.
  - variable: SITE_URL
    value: "https://beta.saoc.co.za"
    availability:
      - RUNTIME
  # PayFast SANDBOX credentials. Without these the deployed checkout route returns
  # "Payment gateway is not configured" and no purchase can be tested at all — the state
  # this backend was in until 2026-08-13. These are the council's own sandbox account
  # values, not PayFast's public 10000100/46f0cd694581a test pair, so they are held in
  # Secret Manager rather than inlined here. RUNTIME only: the signature is computed per
  # request, and a BUILD entry would bake credentials into the bundle.
  # Going live means adding the LIVE equivalents alongside these and switching
  # lib/payfast.ts off the sandbox host — do not repurpose these three variables for it.
  - variable: PAYFAST_SANDBOX_MERCHANT_ID
    secret: PAYFAST_SANDBOX_MERCHANT_ID
    availability:
      - RUNTIME
  - variable: PAYFAST_SANDBOX_MERCHANT_KEY
    secret: PAYFAST_SANDBOX_MERCHANT_KEY
    availability:
      - RUNTIME
  - variable: PAYFAST_SANDBOX_PASSPHRASE
    secret: PAYFAST_SANDBOX_PASSPHRASE
    availability:
      - RUNTIME
  # Ozow SANDBOX credentials. Same rationale as the PayFast block above: without these the
  # deployed checkout route returns "Payment gateway is not configured" for Ozow specifically.
  # RUNTIME only: signatures are computed per request.
  - variable: OZOW_SANDBOX_SITE_CODE
    secret: OZOW_SANDBOX_SITE_CODE
    availability:
      - RUNTIME
  - variable: OZOW_SANDBOX_PRIVATE_KEY
    secret: OZOW_SANDBOX_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: OZOW_SANDBOX_API_KEY
    secret: OZOW_SANDBOX_API_KEY
    availability:
      - RUNTIME
  - variable: RECOVERY_TOKEN_SECRET
    secret: RECOVERY_TOKEN_SECRET
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  # Sending domains are segregated by category, not shared -- see lib/email.ts. Each needs its
  # own DNS verification in Resend before it can send (tickets.saoc.co.za, forms.saoc.co.za).
  - variable: RESEND_FROM_TICKETS
    value: "SAOC Tickets <tickets@tickets.saoc.co.za>"
    availability:
      - RUNTIME
  - variable: RESEND_FROM_FORMS
    value: "SAOC <noreply@forms.saoc.co.za>"
    availability:
      - RUNTIME
  # Reply-to for every outbound category (tickets + forms alike) -- "Enable Receiving" is OFF
  # on both sending subdomains, so FROM is a dead end for anyone who hits Reply. Not a secret;
  # same explicit-default pattern as RESEND_FROM_TICKETS/RESEND_FROM_FORMS above.
  - variable: RESEND_REPLY_TO
    value: "info@saoc.co.za"
    availability:
      - RUNTIME

  # Vendor flow HMAC secrets (mission vendor-gated-registration-flow). Both were missing from
  # this file entirely until 2026-09-01, which meant application approval refused in production
  # (the route validates the secret is configured BEFORE any write, so the application stayed
  # `pending` and no registration code was ever issued) and no stand-payment link could mint.
  # Created in Secret Manager 2026-09-01 with CSPRNG values; rotating either one invalidates
  # every code/link already issued under it, which is acceptable pre-launch but not after.
  - variable: VENDOR_REGISTRATION_TOKEN_SECRET
    secret: VENDOR_REGISTRATION_TOKEN_SECRET
    availability:
      - RUNTIME
  - variable: VENDOR_STAND_PAYMENT_TOKEN_SECRET
    secret: VENDOR_STAND_PAYMENT_TOKEN_SECRET
    availability:
      - RUNTIME
