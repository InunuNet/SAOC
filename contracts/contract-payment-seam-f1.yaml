schema: athanor.contract/v1
slug: payment-seam-f1
goal: >-
  Mission payment-provider-seam F1 — define a gateway-neutral PaymentProvider interface in
  lib/payments/ and stand up PayFast as its first adapter, composing the primitives already
  extracted into lib/payfast.ts. This is a PURE, ADDITIVE move: no behaviour change, and NEITHER
  API ROUTE IS TOUCHED (route rewiring is F2, kept separate so a regression in F3's live sandbox
  purchase has one candidate cause instead of two). The goldens were generated by EXECUTING the
  real pre-move code on 2026-08-19 — every signature, parameter string and field order in
  contracts/golden/payment-seam-f1/payfast-wire.golden.json came off the live functions, not off
  a transcription. Full decision record, per-assertion defeating mutations, the interface
  specification @dev implements against, and the pre-existing stale-ITN-pin finding:
  contracts/golden/payment-seam-f1/README.md
created_at: '2026-08-19'
autonomy: high

# ⚠️ F1 IS ADDITIVE ONLY. app/api/tickets/checkout/route.ts, app/api/tickets/itn/route.ts and
# lib/payfast.ts are all sha256-pinned by A10 to their pre-F1 state. At the end of F1 the adapter
# is production code that no route calls yet — that is correct and deliberate, not an oversight.
#
# ⚠️ PRE-EXISTING DEFECT, FLAGGED NOT FIXED: all four existing pins of app/api/tickets/itn/route.ts
# (ticketing-f1-show-collision, ticketing-m1-m2, ticketing-f10-itn-repin, ticketing-hardening) are
# already STALE against the current file — 253c15c4…/553f67d8… pinned versus a71f9505… on disk,
# drift almost certainly from the 2026-08-18 source-IP "logged, not enforced" change. F1 does not
# correct them: a re-pin is a ceremony with an architect-authored expected file, not an in-passing
# edit. It BLOCKS F2, which reopens that file. See the golden README, "The stale ITN pins".

features:
  - id: F1
    name: >-
      PaymentProvider interface + PayFast adapter, behind goldens that pin today's on-the-wire
      behaviour byte-for-byte.

      (1) lib/payments/types.ts (new) — the gateway-neutral interface and its types, exactly as
      specified in contracts/golden/payment-seam-f1/interface.golden.md: PaymentStatus,
      InitiateInput, InitiateResult, NotificationRequestLike, ProviderNotification,
      VerifyFailureReason, VerifyNotificationResult, ConfirmResult, RefundInput, RefundResult, and
      PaymentProvider with six members — readiness, initiate, verifyNotification,
      confirmNotification, mapStatus, refund. (Amended 2026-08-19: readiness(operation) was added by
      F2 after the five-member form was proven to reserve a seat BEFORE refusing on unset gateway
      credentials, which fail-closed-guards.golden.md forbids. interface.golden.md already listed
      six; a contract and its own golden disagreeing about the interface surface is how the next
      author picks the wrong one, so the contract follows the golden here.) Drawn against three real redirect-plus-webhook gateways (PayFast now, Ozow
      the council's preference, Peach Brad's own site), not against PayFast alone. ZERO PayFast
      vocabulary may appear in this file (A8). confirmNotification is the one member beyond the
      four named in the mission brief; it exists because today's ITN route performs PayFast's
      server-confirm round-trip AFTER the amount check and AFTER the already-settled short-circuit,
      so folding it into verifyNotification would reorder a security sequence — which F1 forbids.
      All three target gateways have such a step, so it is a genuine seam member and not a leak.

      (2) lib/payments/payfast.ts (new) — createPayfastProvider(deps?) and the default instance
      payfastProvider, the ONLY file under lib/payments/ permitted to name PayFast. deps carries
      env, fetch and resolveTrustedIps, all optional and all defaulting to the real thing, so the
      checks below run offline and credential-free. Env is read PER CALL, never captured at
      construction: Firebase App Hosting supplies these variables with RUNTIME availability only,
      and a snapshotting factory would refuse every real purchase in production while passing every
      offline test (A4 case 5).

      (3) lib/payments/index.ts (new) — `export const paymentProvider: PaymentProvider =
      payfastProvider` plus type re-exports. This one const IS the provider-selection mechanism.
      No registry, no workspace package, no host adapters, no PAYMENT_PROVIDER env switch:
      packaging is explicitly deferred (Brad, 2026-08-19) and A8 step 5 enforces it.

      (4) lib/payfast.ts — NOT MOVED, NOT MODIFIED (A10). It already holds the extracted primitives
      and four other contracts' check scripts import it by that path; relocating it would churn
      three green gates for no F1 benefit. The adapter composes it.

      (5) refund() — a DECLARED SIGNATURE ONLY, returning { ok: false, reason: 'not-supported' }
      and making no network call. Verified 2026-08-19: there is no refund code anywhere in app/ or
      lib/ today, only marketing copy on /refunds. A pure move cannot move what does not exist, and
      inventing a PayFast refund API call here would smuggle in unverifiable behaviour that no
      route reaches and no live test exercises (A7).
    status: pending

goldens:
  - contracts/golden/payment-seam-f1/README.md
  - contracts/golden/payment-seam-f1/interface.golden.md
  - contracts/golden/payment-seam-f1/fail-closed-guards.golden.md
  - contracts/golden/payment-seam-f1/payfast-wire.golden.json
  - contracts/checks/payment-seam-f1/_golden.mjs
  - contracts/checks/payment-seam-f1/tsconfig.typecheck.json
  - contracts/checks/payment-seam-f1/fixtures/payment-seam-typecheck.ts

assertions:
  phase: 4
  checks:
    - id: A1
      description: >-
        OUTBOUND WIRE EQUIVALENCE. initiate() reproduces today's checkout signing byte-for-byte:
        the same eight fields in the same INSERTION ORDER (which IS the signature base-string
        order — PayFast uses attribute order, not alphabetical), the same process URL, and the
        pinned MD5 on the passphrase-present, passphrase-absent and empty-passphrase paths. Case 1
        is the non-vacuous positive control; case 4 asserts the two digests genuinely differ, so
        cases 1-3 cannot be satisfied by an implementation that ignores the passphrase. FAILS ON:
        the module not existing (pre-move, unresolved import); any field renamed, added, dropped or
        reordered; changed amount or URL construction; the `if (passphrase)` truthiness test being
        changed to a null check. DOES NOT FAIL ON a swap between the outbound and inbound
        parameter-string algorithms: @qa routed initiate() through the INBOUND builder during F1
        review and A1 still passed, because the outbound golden's eight fields contain no blanks
        and nothing needing trim, so both algorithms agree on that one input. A3 is what kills that
        mutation, and A3 alone — never cite A1 as evidence the two builders stayed separate.
      command: npx tsx contracts/checks/payment-seam-f1/check-outbound-initiate.mjs

    - id: A2
      description: >-
        INBOUND ITN VERIFICATION EQUIVALENCE + TAMPER SUITE — the assertion that decides whether
        someone can mint themselves a paid ticket for free through the seam. Ten cases over one
        golden ITN body: genuine accepted (positive control, checked first); a foreign-algorithm
        digest, a tampered amount, reversed field order with a replayed signature, a missing
        signature, an empty signature and a different merchant's passphrase all rejected; an unset
        or empty passphrase failing closed BEFORE any digest is computed and before any DNS
        lookup; a field posted after `signature` excluded (break, not continue); signature checked
        before the reference check; and an untrusted source IP still verifying, because that check
        has been log-only since 2026-08-18. FAILS ON: the module not existing (pre-move); the
        outbound algorithm being reused for inbound verification (the exact ticketing-F10 defect);
        the passphrase guard being dropped, moved after the digest, or weakened; posted field order
        not being preserved; the source-IP result being allowed to flip `verified` to false.
      command: npx tsx contracts/checks/payment-seam-f1/check-inbound-verify.mjs

    - id: A3
      description: >-
        THE TWO SIGNATURE ALGORITHMS MUST NOT BE UNIFIED, observed THROUGH THE SEAM rather than by
        grepping for two function names. PayFast documents genuinely different outbound (trims,
        skips blanks) and inbound (neither) parameter-string algorithms; collapsing them into one
        "shared helper" is the single most likely mistake a pure move can make, and is exactly what
        ticketing-F10 was opened to fix. The same padded item name is fed to initiate() and to
        verifyNotification(); both pinned digests must hold, and case 3 asserts they differ. Under
        unification exactly one of them changes, whichever direction the collapse goes. FAILS ON:
        the module not existing (pre-move); initiate() routed through the inbound builder;
        verifyNotification() routed through the outbound builder; any added trim or blank-skip on
        the inbound path; any removed trim on the outbound path.
      command: npx tsx contracts/checks/payment-seam-f1/check-builder-divergence.mjs

    - id: A4
      description: >-
        FAIL-CLOSED CREDENTIAL GUARDS. Missing or empty-string merchant id/key refuse the
        initiation by RETURN VALUE (never by throwing), and the refusal carries no fields and no
        processUrl — nothing a caller could mistake for a postable form. Case 1 is the positive
        control; cases 2-4 cover all five missing/empty combinations, matching today's
        `!merchantId || !merchantKey`. Case 5 is the one with no equivalent in the current code and
        the highest production stakes: the SAME provider instance is called twice against a mutated
        env object and must refuse then succeed, proving env is read per call. FAILS ON: the module
        not existing (pre-move); a throw instead of a refusal; a refusal carrying fields; empty
        strings treated as present; config snapshotted at construction — which would refuse every
        real App Hosting purchase while passing every test that sets env before import.
      command: npx tsx contracts/checks/payment-seam-f1/check-fail-closed-config.mjs

    - id: A5
      description: >-
        mapStatus PRESERVES THE ONE-WAY-TO-PAID RULE. Today the ITN route flips an order to paid
        only on a strict, case-sensitive, untrimmed `payment_status === 'COMPLETE'`. Case 1 is the
        positive control; case 2 runs nine near-misses ('complete', 'Complete', 'COMPLETED',
        'COMPLETE ', ' COMPLETE', '', FAILED, PENDING, CANCELLED) plus null and requires none of
        them to yield 'paid'; case 5 asserts the mapping is not constant. FAILS ON: the module not
        existing (pre-move); a toUpperCase/toLowerCase/trim "improvement"; an unrecognised gateway
        string falling through to 'paid'; null mapping to anything but 'unknown'.
      command: npx tsx contracts/checks/payment-seam-f1/check-map-status.mjs

    - id: A6
      description: >-
        SERVER-CONFIRM ROUND-TRIP, wire shape pinned rather than described. With the source-IP
        check log-only since 2026-08-18, this and the signature check ARE the security boundary.
        Case 2 pins the exact URL, method, content type and BYTE-EXACT body — which must be the
        INBOUND param string, the same bytes the digest was computed over, so a switch to the
        outbound builder (the pre-F10 bug) goes red here. Case 4 proves 'VALID' is matched exactly,
        not by substring or case-insensitively (INVALID, valid, Valid, VALID!, NOT VALID, '' and
        'VALIDATION FAILED' are all refused). Case 5 proves a thrown or rejected fetch becomes a
        refusal, never an exception and never a confirmation. Runs offline; fetch is injected.
        FAILS ON: the module not existing (pre-move); a changed URL; a body rebuilt with the
        outbound builder or re-serialised from a re-parse; a loose VALID match; a network error
        treated as confirmed.
      command: npx tsx contracts/checks/payment-seam-f1/check-server-confirm.mjs

    - id: A7
      description: >-
        refund() IS A DECLARED SIGNATURE, NOT AN INVENTED INTEGRATION. Verified by grep across app/
        and lib/ on 2026-08-19: there is no refund code in this repository, only marketing copy on
        /refunds. The adapter must return { ok: false, reason: 'not-supported' } by value and make
        ZERO network calls (the injected fetch throws if touched). FAILS ON: the module not
        existing (pre-move); refund() throwing; refund() returning ok:true, a silent lie a caller
        would treat as a completed refund; refund() calling a PayFast refund API nothing in this
        codebase has ever exercised — unverifiable new behaviour smuggled in under a refactor.
      command: npx tsx contracts/checks/payment-seam-f1/check-refund-declared-unsupported.mjs

    - id: A8
      description: >-
        THE INTERFACE IS GATEWAY-NEUTRAL, and selection is a single config point. lib/payments/
        types.ts must contain no PayFast vocabulary in EITHER CASING — the snake_case wire names
        (m_payment_id, pf_payment_id, amount_gross/fee/net, merchant_key, merchant_id) and their
        camelCase equivalents (mPaymentId, pfPaymentId, amountGross/Fee/Net, merchantKey,
        merchantId), plus payfast, passphrase, eng/process, eng/query, itn, md5. The camelCase half
        was added after @qa defeated the original snake_case-only list empirically during F1
        review, adding `readonly merchantId`, `readonly pfPaymentId` and `readonly amountGross` to
        types.ts and watching all three pass: in a TypeScript interface camelCase is the LIKELIER
        leak shape, which is exactly how the seam becomes PayFast wearing a coat with this
        assertion still green. Re-verified after the fix — old pattern misses the mutation, new
        pattern catches it. Every other file under lib/payments/ is held to the same vocabulary
        ban; index.ts may additionally name the vendor ONLY as the identifier `payfastProvider` and
        the module specifier './payfast' (both stripped, any residue fails), because a selection
        point must name what it selects and a blanket ban there is unsatisfiable by correct code.
        A count-based rule was rejected (the file legitimately holds three occurrences over two
        lines, and a count breaks on reformatting), as was an import-line rule (the `export const`
        assignment is not an import). lib/payments/index.ts must export a paymentProvider binding
        and must NOT look like a registry (no PAYMENT_PROVIDER env switch, no dynamic import, no
        Record<string, PaymentProvider>) — judged over CODE only, since @dev's own header comment
        correctly documents the absence of all three and an unfiltered grep failed the file for
        saying so.
        Step 1 hard-fails if the file is absent, so this cannot pass vacuously; step 4 proves the
        ban pattern can actually fire by running it against the adapter, which certainly does name
        PayFast. OBSERVED FAILING against unfixed code on 2026-08-19 (exit 1, "lib/payments/
        types.ts does not exist"). @qa should re-observe it by adding `m_payment_id` to a comment
        in types.ts. FAILS ON: PayFast vocabulary leaking into the interface — which would make the
        seam PayFast wearing a coat, so the second gateway reopens it, which is the entire outcome
        this mission exists to prevent.
      command: bash contracts/checks/payment-seam-f1/check-interface-gateway-neutral.sh

    - id: A9
      description: >-
        RECOVERY_TOKEN_SECRET IS NOT A PAYMENT-PROVIDER CONCERN and did not cross the seam, and
        its guard is asserted BY SOURCE POSITION rather than by presence — a bare presence grep
        (this check's earlier form) is satisfied by a comment that merely mentions the name.
        Harmless while A10 sha-pins the whole route, but F2 reopens that file and re-cuts the pin,
        at which point a presence grep would be the only local guard left, so it is hardened here
        rather than inherited. Comment lines are excluded, so prose cannot satisfy it; verified
        empirically against a comment-only fixture. It
        mints our own HMAC-SHA256 ticket-recovery token and has nothing to do with any gateway; its
        fail-closed guard is additionally load-bearing BY SOURCE POSITION for another contract
        (contracts/checks/ticketing-checkout-orders/check-fail-closed-secret-guard.sh proves it
        sits textually before the reservation write). Step 1 hard-fails if lib/payments/ is absent,
        so a green cannot mean "nothing to search". OBSERVED FAILING against unfixed code on
        2026-08-19 (exit 1, "lib/payments/ does not exist"). FAILS ON: the secret name, recoveryToken
        or mintRecoveryToken appearing under lib/payments/; the guard disappearing from the
        checkout route.
      command: bash contracts/checks/payment-seam-f1/check-recovery-secret-boundary.sh

    - id: A10
      description: >-
        F1 IS ADDITIVE — NEITHER ROUTE NOR lib/payfast.ts IS TOUCHED. ⚠️ THIS IS AN F1-WINDOW
        ASSERTION AND GOES RED THE MOMENT F2 LEGITIMATELY BEGINS, by design: F2's whole job is to
        rewire these routes. A red A10 after F2 has started is the assertion working, not a
        regression. It is superseded by contract-payment-seam-f2.yaml's A3, which pins the ITN
        route to its post-rewire value; evaluate A10 only against a tree where F2 has not yet
        landed. sha256 pins taken from the
        working tree on 2026-08-19 before any code moved: checkout b458ed70…, itn a71f9505…,
        lib/payfast.ts b5ab57a2…. This is a BAN, and it currently passes because the ban has not
        been crossed; @qa must observe it failing by appending a blank line to either route and
        re-running. Keeping F1 additive is what gives F3's live sandbox purchase ONE candidate
        cause if it regresses instead of two — the stated reason the mission was split this way.
        FAILS ON: @dev rewiring either route inside F1 (F1 silently becoming F1+F2); any edit to
        lib/payfast.ts, whose primitives four other contracts' check scripts import by that path.
        NOTE: the value pinned here for the ITN route is the CURRENT file only, as a boundary — it
        is deliberately not an endorsement of that content, and the four OTHER pins of that same
        file are already stale (see the golden README, "The stale ITN pins").
      command: bash contracts/checks/payment-seam-f1/check-routes-untouched.sh

    - id: A11
      description: >-
        COMPILER-DRIVEN proof of the seam's exported shape — not a grep, which would be satisfied
        by a method with the wrong arity, the wrong argument type, or a result union whose arms
        leak into each other. Eight properties: the adapter and the factory's return both
        structurally satisfy PaymentProvider; lib/payments/index.ts's export is typed as the
        NEUTRAL interface; InitiateResult, VerifyNotificationResult and RefundResult each narrow by
        their discriminant with @ts-expect-error proving the wrong-arm field is genuinely
        inaccessible; confirmNotification takes the ProviderNotification the verify step produced
        (not a request, not a raw body — the coupling that keeps the confirm body byte-identical to
        the digest body); mapStatus is synchronous, accepts null and returns the neutral union,
        with 'COMPLETE' proven NOT assignable to PaymentStatus; and a plain object satisfies
        NotificationRequestLike, proving lib/payments/ does not drag in Next.js types. EXTENDED
        2026-08-19 to cover the sixth member: the fixture never mentioned `readiness`, so this
        compiler-driven member proof passed without exercising it at all — A8 covered its BEHAVIOUR
        and nothing covered its SHAPE. Check 7b now asserts that readiness is SYNCHRONOUS by its
        annotation rather than by a comment (it sits in front of every checkout, and a promise a
        caller forgets to await is always truthy — it fails open), that its argument is the
        ProviderOperation union and not a string (with @ts-expect-error proving 'refund' and an
        arbitrary string are both rejected, and that the argument is required — a global "is this
        configured?" is not the contract), and that ProviderReadiness narrows by `ready` with
        @ts-expect-error proving the ready arm's `reason` and `missing` are genuinely inaccessible.
        Runs under its own scoped tsconfig because the root tsconfig excludes contracts/ from pnpm
        type-check. OBSERVED FAILING against unfixed code on 2026-08-19 (exit 2, unresolved
        imports); check 7b observed failing the same day against three mutated COPIES of the
        interface (readiness returned Promise<ProviderReadiness> -> TS2322; readiness declared with
        no argument -> TS2554; readiness declared taking `string` -> TS2578 unused
        '@ts-expect-error'), with the unmutated control clean.
      command: npx tsc --noEmit -p contracts/checks/payment-seam-f1/tsconfig.typecheck.json

    - id: A12
      description: >-
        HYGIENE GATE, DELIBERATELY NOT A PROPERTY ASSERTION — recorded as such rather than dressed
        up as evidence of the move. pnpm lint and pnpm type-check both pass today and will pass
        after F1, so neither distinguishes pre-move from post-move code and neither may be cited as
        proof that the seam works. They are here only to catch a broken build or a lint regression
        introduced by the new files. Every claim about behaviour rests on A1-A11.
      command: pnpm lint && pnpm type-check
