schema: athanor.contract/v1
feature: D3
spec: d3-ticket-model
name: D3 Ticket data model — TicketStatus / TicketType / Ticket types in types/index.ts + Firestore schema doc
created_at: '2026-06-13T00:00:00.000000+00:00'

# NOTE ON SCHEMA: this project's gate runner consumes the `verify.kind` form
# (file_exists | file_contains | shell). Assertions below cover three areas:
#   1. Type definitions added to types/index.ts (TicketStatus, TicketType, Ticket)
#   2. All required Ticket fields present
#   3. docs/firestore-ticket-schema.md exists and documents the `tickets` collection
# Plus type-check and lint gates. No buy flow, no Stripe integration — types + doc only.

# ---------------------------------------------------------------------------
# CORRECTION NOTE — 2026-08-16
# ---------------------------------------------------------------------------
# D3-16 and D3-19 originally required a `stripePaymentIntentId` field on Ticket and in
# this doc. That field was DELIBERATELY REMOVED when the project moved off Stripe onto
# PayFast — contract-payfast-m1.yaml A1 requires it be fully absent from types/app/docs/lib
# ('if grep -rq "stripePaymentIntentId" types app docs lib; then exit 1; fi'), and its A2/A3
# require the replacement fields m_payment_id and pf_payment_id instead. Since D3 asserted
# the field's presence and payfast-m1 asserted its absence, D3's gate was permanently red
# (verified 2026-08-16: 19 pass, 2 fail — D3-16, D3-19) — not a false green, but a
# contradiction that trains people to ignore red on this contract.
#
# Both assertions are corrected below to check for the CURRENT payment-reference fields
# (m_payment_id, pf_payment_id) instead of the removed one. This is not a weakening: the
# verification method (grep-for-a-field-name against source text, since the artifact under
# test IS source text) is unchanged and sound; only the field names being checked for were
# wrong. No other D3 assertion is touched — D3-01 through D3-15, D3-17, D3-18 all still
# describe the current Ticket shape correctly and are left as-is.
#

assertions:
  # ---- 1-3: union + interface declarations exist and are exported ----
  - id: D3-01
    description: types/index.ts exports a TicketStatus type
    verify:
      kind: shell
      cmd: grep -Eq "export (type|interface) TicketStatus" types/index.ts

  - id: D3-02
    description: TicketStatus enumerates all four states (reserved, paid, cancelled, checked-in)
    verify:
      kind: shell
      cmd: grep -q "'reserved'" types/index.ts && grep -q "'paid'" types/index.ts && grep -q "'cancelled'" types/index.ts && grep -q "'checked-in'" types/index.ts

  - id: D3-03
    description: types/index.ts exports a TicketType type
    verify:
      kind: shell
      cmd: grep -Eq "export (type|interface) TicketType" types/index.ts

  - id: D3-04
    description: TicketType enumerates all three tiers (general, member, vip)
    verify:
      kind: shell
      cmd: grep -q "'general'" types/index.ts && grep -q "'member'" types/index.ts && grep -q "'vip'" types/index.ts

  - id: D3-05
    description: types/index.ts exports a Ticket type/interface
    verify:
      kind: shell
      cmd: grep -Eq "export (type|interface) Ticket\b" types/index.ts

  # ---- 4: Ticket carries the Timestamp type import ----
  - id: D3-06
    description: types/index.ts imports the Firestore Timestamp type used by Ticket fields
    verify:
      kind: file_contains
      path: types/index.ts
      pattern: 'Timestamp'

  # ---- 5-13: Ticket field coverage ----
  - id: D3-07
    description: Ticket declares an id field
    verify:
      kind: file_contains
      path: types/index.ts
      pattern: 'id: string'

  - id: D3-08
    description: Ticket declares a bookingRef field
    verify:
      kind: file_contains
      path: types/index.ts
      pattern: 'bookingRef: string'

  - id: D3-09
    description: Ticket declares a showId field
    verify:
      kind: file_contains
      path: types/index.ts
      pattern: 'showId: string'

  - id: D3-10
    description: Ticket declares an attendeeName field
    verify:
      kind: file_contains
      path: types/index.ts
      pattern: 'attendeeName: string'

  - id: D3-11
    description: Ticket declares an attendeeEmail field
    verify:
      kind: file_contains
      path: types/index.ts
      pattern: 'attendeeEmail: string'

  - id: D3-12
    description: Ticket declares a ticketType field of type TicketType
    verify:
      kind: file_contains
      path: types/index.ts
      pattern: 'ticketType: TicketType'

  - id: D3-13
    description: Ticket declares a status field of type TicketStatus
    verify:
      kind: file_contains
      path: types/index.ts
      pattern: 'status: TicketStatus'

  - id: D3-14
    description: Ticket declares a nullable purchasedAt Timestamp field
    verify:
      kind: shell
      cmd: 'grep -Eq "purchasedAt: Timestamp \| null" types/index.ts'

  - id: D3-15
    description: Ticket declares a nullable checkedInAt Timestamp field
    verify:
      kind: shell
      cmd: 'grep -Eq "checkedInAt: Timestamp \| null" types/index.ts'

  - id: D3-16
    description: >-
      [CORRECTED 2026-08-16, was: "Ticket declares a nullable stripePaymentIntentId
      field"] Ticket declares nullable PayFast payment-reference fields (m_payment_id,
      pf_payment_id) — stripePaymentIntentId was removed by contract-payfast-m1.yaml A1
      when the project moved from Stripe to PayFast; m_payment_id/pf_payment_id are its
      replacement, required by that same contract's A2/A3. See this file's CORRECTION NOTE.
    verify:
      kind: shell
      cmd: 'grep -Eq "m_payment_id: string \| null" types/index.ts && grep -Eq "pf_payment_id: string \| null" types/index.ts'

  # ---- 14-16: Firestore schema documentation ----
  - id: D3-17
    description: docs/firestore-ticket-schema.md exists
    verify:
      kind: file_exists
      path: docs/firestore-ticket-schema.md

  - id: D3-18
    description: schema doc names the tickets collection
    verify:
      kind: file_contains
      path: docs/firestore-ticket-schema.md
      pattern: 'tickets'

  - id: D3-19
    description: >-
      [CORRECTED 2026-08-16, was: required stripePaymentIntentId in the schema doc]
      schema doc documents every current Ticket field name, including the PayFast
      payment-reference fields (m_payment_id, pf_payment_id) that replaced the removed
      stripePaymentIntentId. See this file's CORRECTION NOTE.
    verify:
      kind: shell
      cmd: grep -q "bookingRef" docs/firestore-ticket-schema.md && grep -q "showId" docs/firestore-ticket-schema.md && grep -q "attendeeName" docs/firestore-ticket-schema.md && grep -q "attendeeEmail" docs/firestore-ticket-schema.md && grep -q "ticketType" docs/firestore-ticket-schema.md && grep -q "status" docs/firestore-ticket-schema.md && grep -q "purchasedAt" docs/firestore-ticket-schema.md && grep -q "checkedInAt" docs/firestore-ticket-schema.md && grep -q "m_payment_id" docs/firestore-ticket-schema.md && grep -q "pf_payment_id" docs/firestore-ticket-schema.md

  # ---- 17-18: Gates ----
  - id: D3-GATE-01
    description: pnpm type-check passes — strict TS, zero errors
    verify:
      kind: shell
      cmd: pnpm type-check
      expect_exit: 0

  - id: D3-GATE-02
    description: pnpm lint passes with zero errors
    verify:
      kind: shell
      cmd: pnpm lint
      expect_exit: 0

phases:
  - id: 1
    assertions:
      - D3-01
      - D3-02
      - D3-03
      - D3-04
      - D3-05
      - D3-06
      - D3-07
      - D3-08
      - D3-09
      - D3-10
      - D3-11
      - D3-12
      - D3-13
      - D3-14
      - D3-15
      - D3-16
      - D3-17
      - D3-18
      - D3-19
      - D3-GATE-01
      - D3-GATE-02
