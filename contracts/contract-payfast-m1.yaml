schema: athanor.contract/v1
slug: payfast-ticketing
goal: >-
  PayFast payment plumbing (M1): rework the Firestore ticket schema off its
  Stripe-shaped field to PayFast fields, add a server-side checkout initiation
  route with MD5 signing against the PayFast Sandbox, and add a fail-closed ITN
  webhook handler that only marks a ticket paid after full security validation.
created_at: '2026-07-03'
autonomy: high

features:
  - id: F1
    name: Rework Firestore ticket schema off Stripe-shaped field to PayFast fields
    status: pending
  - id: F2
    name: PayFast checkout initiation route + lib/payfast.ts signing
    status: pending
  - id: F3
    name: PayFast ITN handler with fail-closed security validation
    status: pending

goldens:
  - contracts/golden/payfast-m1/README.md
  - contracts/golden/payfast-m1/signature-vectors.json
  - contracts/golden/payfast-m1/ticket-reserved.golden.json
  - contracts/golden/payfast-m1/ticket-paid.golden.json
  - contracts/golden/payfast-m1/checkout-request.golden.json
  - contracts/golden/payfast-m1/checkout-response.golden.json
  - contracts/golden/payfast-m1/itn-sample.golden.json
  - contracts/golden/payfast-m1/payfast-hosts.golden.json

# ---------------------------------------------------------------------------
# CORRECTION NOTE — 2026-08-18
# ---------------------------------------------------------------------------
# A1 and A6 were the same stale/self-defeating grep-family defect already retired
# elsewhere in the P1 weak-assertion audit (commits 808ca7b, 0b5f0ea, f4a37bd;
# .agent/memory/project/learned.md "P1 weak-assertion audit"). Both were red for
# reasons unrelated to the property they claim to protect, and both are corrected
# in place rather than retired via SUPERSEDED/exit 77, because the underlying
# property still holds and is still checkable by grep-on-source.
#
# A1 originally forbade `stripePaymentIntentId` under types/app/docs/lib. docs/
# is dropped from scope: it legitimately contains the string in migration-history
# prose that explains the field was removed (docs/payfast-integration.md:16,
# docs/sprint-2026-08-16.md:87), not in a live field reference. types/app/lib —
# where the string is actually load-bearing — are unchanged; a real reintroduction
# of a Stripe-shaped field still fails this check exactly as before.
#
# A6 originally required the literal `m_payment_id` inside both
# app/api/admin/tickets/route.ts and app/api/admin/checkin/route.ts. The latter
# went stale when ticketing-hardening F1 (2026-08-11, predates this correction)
# extracted all check-in admission/read logic out of that route into
# lib/checkin.ts — the route now only authenticates and delegates. Retargeted to
# the three facts that now jointly prove "admin ticket read paths still read the
# current field set": the tickets route (unchanged), lib/checkin.ts (where the
# delegated read now lives, matched against its actual read-access shape
# `data['m_payment_id'] as string` per QA mutation testing — see TIGHTENED note
# below), and that the checkin route still imports from '@/lib/checkin'.
#
# TIGHTENED 2026-08-18 (post-QA): A6's lib/checkin.ts leg was first written as a
# bare substring grep for "m_payment_id", which QA's mutation testing showed goes
# green even when the real read is deleted and replaced by a comment merely
# containing that word. Tightened to require the actual read-access shape present
# in the file today, following A2/A3's existing precedent in this same contract
# of matching a full field-declaration pattern rather than a bare substring.
#
# Full per-assertion decision record with file:line citations:
# contracts/golden/production-blockers-f2-payfast-assertions/README.md
#
# No other assertion in this contract is touched by this correction.
#
assertions:
  phase: 4
  checks:
    # ---------- F1: schema rework ----------
    - id: A1
      description: >-
        [CORRECTED 2026-08-18, was: "stripePaymentIntentId fully removed from types,
        app, docs, lib"] stripePaymentIntentId fully removed from the data model and
        application code (types, app, lib). docs/ dropped from scope: the old grep
        tripped on legitimate migration-history prose that explains the field was
        removed rather than reintroducing it (docs/payfast-integration.md:16,
        docs/sprint-2026-08-16.md:87 — both verified, neither is a live field
        reference). A real reintroduction of a Stripe-shaped field anywhere in
        types/app/lib still fails this check. See
        contracts/golden/production-blockers-f2-payfast-assertions/README.md for the
        full decision record; contract-d3-ticket-model.yaml D3-16 separately confirms
        the Ticket type declares m_payment_id/pf_payment_id in place of the removed
        field.
      command: 'if grep -rq "stripePaymentIntentId" types app lib; then exit 1; fi'
    - id: A2
      description: F1 - Ticket declares nullable m_payment_id field
      command: 'grep -Eq "m_payment_id: string \| null" types/index.ts'
    - id: A3
      description: F1 - Ticket declares nullable pf_payment_id field
      command: 'grep -Eq "pf_payment_id: string \| null" types/index.ts'
    - id: A4
      description: F1 - Ticket declares numeric amount field
      command: 'grep -Eq "amount: number" types/index.ts'
    - id: A5
      description: F1 - schema doc updated to PayFast fields (no Stripe leftover)
      command: 'grep -q "m_payment_id" docs/firestore-ticket-schema.md && grep -q "pf_payment_id" docs/firestore-ticket-schema.md'
    - id: A6
      description: >-
        [CORRECTED 2026-08-18, was: required the literal "m_payment_id" inside
        app/api/admin/checkin/route.ts itself] admin ticket read routes still read
        against the new field set. Original went stale when ticketing-hardening F1
        (2026-08-11) extracted all check-in admission/read logic out of
        app/api/admin/checkin/route.ts into lib/checkin.ts — the route now only
        authenticates and delegates, so the literal legitimately stopped appearing
        there. Rewritten to check the field where it actually lives now:
        app/api/admin/tickets/route.ts (unchanged, direct read, still true),
        lib/checkin.ts (the delegated read for the check-in path), and that the route
        genuinely delegates to lib/checkin.ts rather than reimplementing the read
        inline. See
        contracts/golden/production-blockers-f2-payfast-assertions/README.md for the
        full decision record. TIGHTENED 2026-08-18 (QA mutation-8 finding): the
        lib/checkin.ts leg was a bare substring grep for "m_payment_id" and went
        green when the real read was deleted and replaced by a comment merely
        containing that word. Now requires the actual read-access shape
        (data['m_payment_id'] as string) present in the file today, matching the
        field-declaration-pattern precedent A2/A3 already use in this contract rather
        than a bare substring.
      command: 'grep -q "m_payment_id" app/api/admin/tickets/route.ts && grep -Eq "data\[.m_payment_id.\] as string" lib/checkin.ts && grep -q "from ''@/lib/checkin''" app/api/admin/checkin/route.ts'

    # ---------- F2: checkout initiation + signing lib ----------
    - id: A7
      description: F2 - shared signing lib exists
      command: 'test -f lib/payfast.ts'
    - id: A8
      description: F2 - lib exports generateSignature
      command: 'grep -Eq "export (async )?(function )?generateSignature|export const generateSignature" lib/payfast.ts'
    - id: A9
      description: F2 - signing uses MD5 via crypto.createHash
      command: 'grep -q "createHash" lib/payfast.ts'
    - id: A10
      description: F2 - checkout route exists
      command: 'test -f app/api/tickets/checkout/route.ts'
    - id: A11
      description: F2 - credentials read from PAYFAST_SANDBOX_* env vars (not hardcoded)
      command: 'grep -rq "PAYFAST_SANDBOX_MERCHANT_ID" app/api/tickets lib && grep -rq "PAYFAST_SANDBOX_MERCHANT_KEY" app/api/tickets lib && grep -rq "PAYFAST_SANDBOX_PASSPHRASE" app/api/tickets lib'
    - id: A12
      description: F2 - no hardcoded PayFast sandbox merchant key literal anywhere in source
      command: 'if grep -rq "46f0cd694581a" app lib scripts; then exit 1; fi'
    - id: A13
      description: F2 - targets the PayFast sandbox host
      command: 'grep -rq "sandbox.payfast.co.za" app/api/tickets lib'
    - id: A14
      description: F2 - creates the ticket in reserved status via firebase-admin
      command: 'grep -q "reserved" app/api/tickets/checkout/route.ts && grep -q "firebase-admin/firestore" app/api/tickets/checkout/route.ts'
    - id: A15
      description: F2 - checkout route never trusts a client-supplied amount (no req amount read)
      command: 'if grep -Eq "body(\.|\[.)amount|amount \} = (await )?req" app/api/tickets/checkout/route.ts; then exit 1; fi'

    # ---------- F3: ITN handler, fail-closed ----------
    - id: A16
      description: F3 - ITN route exists
      command: 'test -f app/api/tickets/itn/route.ts'
    - id: A17
      description: F3 - validates the ITN signature
      command: 'grep -Eq "generateSignature|validateSignature|signature" lib/payments/payfast.ts'
    - id: A18
      description: >-
        F3 - BEHAVIOURAL, CORRECTED 2026-08-20 (this assertion previously asserted the
        INVERSE of shipped behaviour — see contracts/checks/payfast-m1/check-itn-source-ip-
        validation.mts's header for the full correction record; it was passing 5/5 for an
        unrelated reason, order-not-found on both fixtures, and would have stayed green if
        IP-rejection had ever been reintroduced). Source IP is advisory only and never gates
        the ITN write path (deliberate, app/api/tickets/itn/route.ts:69-86,
        lib/payments/payfast.ts verifyNotification — 2026-08-18). Calls route.ts's POST()
        directly with a real dns.lookup()-resolved PayFast IP and a bogus TEST-NET-3 IP,
        both with a valid signature and a successful server-confirm — BOTH must result in
        the ticket becoming paid, proving source IP cannot reject an otherwise-authenticated
        payment. LOCAL-ONLY: needs PAYFAST_SANDBOX_* and FIREBASE_ADMIN_* from .env.local,
        absent from CI; emits a distinct ::warning::...skipping A18 (exit 0, NOT a pass)
        when those creds are unavailable — this exit-0-on-skip shape is a known,
        not-yet-fixed instrument-vs-absence hazard shared by A19-A21, unaddressed here (see
        the check script's header for why not).
      command: 'pnpm exec tsx contracts/checks/payfast-m1/check-itn-source-ip-validation.mts'
      timeout_seconds: 120
    - id: A19
      description: >-
        F3 - BEHAVIOURAL: the server-confirm response is genuinely consumed, not
        fetched-and-ignored, and exact-matched (not substring/prefix). Stubs
        globalThis.fetch and drives four cases (INVALID body, VALID+PENDING,
        VALID+COMPLETE, 'VALIDx' trailing content) through the real POST() handler — see
        contracts/checks/payfast-m1/check-itn-server-confirm-and-status-gating.mts (also
        covers A21). LOCAL-ONLY, same credential/skip convention as A18.
      command: 'pnpm exec tsx contracts/checks/payfast-m1/check-itn-server-confirm-and-status-gating.mts'
      timeout_seconds: 120
    - id: A20
      description: >-
        F3 - BEHAVIOURAL: amount_gross is COMPARED to the reserved ticket's stored
        amount, not merely read. Exercises a gross tamper, an exact match, the
        AMOUNT_MATCH_TOLERANCE_CENTS (1) reject boundary, and an unparseable/sub-cent
        amount, all read directly from route.ts's own integer-cents comparison — see
        contracts/checks/payfast-m1/check-itn-amount-tamper-rejected.mts. LOCAL-ONLY,
        same credential/skip convention as A18.
      command: 'pnpm exec tsx contracts/checks/payfast-m1/check-itn-amount-tamper-rejected.mts'
      timeout_seconds: 120
    - id: A21
      description: >-
        F3 - BEHAVIOURAL: only payment_status COMPLETE (with a VALID server-confirm)
        marks a ticket paid, and the persisted pf_payment_id equals exactly what was
        posted (not blank, not a disconnected value) — folded into A19's script
        (check-itn-server-confirm-and-status-gating.mts) since both claims are proved by
        the same four-scenario run against the same fixture; kept as a separate
        assertion ID because it is a distinct claim from the audit. LOCAL-ONLY, same
        credential/skip convention as A18.
      command: 'pnpm exec tsx contracts/checks/payfast-m1/check-itn-server-confirm-and-status-gating.mts'
      timeout_seconds: 120
    - id: A22
      description: F3 - logs on failure paths (fail-closed, no silent swallow)
      command: 'grep -Eq "console.error|logger\." app/api/tickets/itn/route.ts'
    - id: A23
      description: F3 - server-side only, never imports the client Firebase SDK
      command: 'if grep -Eq "from ''@/lib/firebase''|from ''firebase/app''" app/api/tickets/itn/route.ts; then exit 1; fi'
    - id: A28
      description: >-
        F3 - client IP trust takes the SECOND-TO-LAST X-Forwarded-For hop (the real client
        IP; GCLB appends client-ip then load-balancer-ip, so the last hop is the LB itself
        and only the second-to-last is trustworthy), not the first (spoofable) or the last
      command: 'grep -q "hops\[hops.length - 2\]" lib/payfast.ts'
    - id: A29
      description: F3 - client IP extraction never trusts the first XFF hop as the source of truth
      command: 'if grep -Eq "forwardedFor\.split\(.,.\)\[0\]" lib/payfast.ts app/api/tickets/itn/route.ts; then exit 1; fi'
    - id: A30
      description: >-
        F3 - BEHAVIOURAL: the paid write is atomic and idempotent under a genuine
        concurrent race between two otherwise-identical ITNs (deterministically forced,
        not timing-hoped — see the script's header comment for why a simple sequential
        replay does NOT discriminate this claim, only the route's separate
        non-transactional fast path does), and never resurrects a ticket that transitions
        to 'checked-in' mid-flight. See
        contracts/checks/payfast-m1/check-itn-atomic-idempotent-write.mts. Companion
        structural proof: check-paid-write-inside-transaction-scope.mjs (AST-based,
        CI-runnable, no credentials needed) proves transaction.update(docRef, ...) is a
        lexical descendant of the db.runTransaction callback. The behavioural half is
        LOCAL-ONLY, same credential/skip convention as A18.
      command: 'pnpm exec tsx contracts/checks/payfast-m1/check-itn-atomic-idempotent-write.mts && pnpm exec tsx contracts/checks/payfast-m1/check-paid-write-inside-transaction-scope.mjs'
      timeout_seconds: 150
    - id: A31
      description: >-
        F3 - the transactional re-read (transaction.get(docRef) before
        transaction.update(docRef, ...), inside the SAME db.runTransaction callback,
        get preceding update) is proved both behaviourally and structurally by the same
        two scripts as A30 (check-itn-atomic-idempotent-write.mts /
        check-paid-write-inside-transaction-scope.mjs) — kept as a separate assertion ID
        because it names a distinct claim (re-read-before-write, not merely
        "transactional") from the audit, but not a separate script: A30 and A31 were
        never separable claims once tested behaviourally, since disabling either half of
        the guard breaks the same race and resurrection scenarios.
      command: 'pnpm exec tsx contracts/checks/payfast-m1/check-itn-atomic-idempotent-write.mts && pnpm exec tsx contracts/checks/payfast-m1/check-paid-write-inside-transaction-scope.mjs'
      timeout_seconds: 150
    - id: A32
      description: >-
        F3 - AST/scope proof (TypeScript compiler API, not line-number comparison) that
        the specific fetch(PAYFAST_SANDBOX_VALIDATE_URL, ...) CallExpression is NOT a
        lexical descendant of the db.runTransaction callback and occurs before it in
        source order — a decoy fetch() elsewhere cannot satisfy this. CI-runnable, no
        credentials needed. See
        contracts/checks/payfast-m1/check-server-confirm-fetch-outside-transaction-scope.mjs.
      command: 'pnpm exec tsx contracts/checks/payfast-m1/check-server-confirm-fetch-outside-transaction-scope.mjs'

    # ---------- Correctness + build gates ----------
    - id: A24
      description: signature vectors reproduce exactly (real MD5 correctness gate)
      command: 'pnpm exec tsx scripts/verify-payfast-signature.ts'
    - id: A25
      description: strict TypeScript type-check passes
      command: 'pnpm type-check'
    - id: A26
      description: lint passes with zero errors
      command: 'pnpm lint'
    - id: A27
      description: production build succeeds (bare pnpm build - no pipe, do not mask exit code)
      command: 'pnpm build'
    - id: A33
      description: >-
        F3 - getClientIp() unit test runs against a synthetic 3-hop X-Forwarded-For
        ("spoofedIp, realClientIp, loadBalancerIp") and asserts it extracts "realClientIp"
        specifically (real behaviour gate, not a string match)
      command: 'pnpm exec tsx scripts/verify-payfast-itn-ip.ts'
    - id: A34
      description: >-
        Regression guard (contracts/golden/payfast-m1-residue-cleanup/): a full run of
        the four Firestore-mutating payfast-m1 behavioural checks (A18-A21, A30-A31)
        leaves the `tickets` collection document count unchanged. Pure comparator
        self-test always runs (no credentials needed); the live count-before/count-after
        half is LOCAL-ONLY, same credential/skip convention as A18. See
        contracts/checks/payfast-m1/check-suite-leaves-no-ticket-residue.mjs.
      command: 'pnpm exec tsx contracts/checks/payfast-m1/check-suite-leaves-no-ticket-residue.mjs'
      timeout_seconds: 180
