schema: athanor.contract/v1
slug: build-without-secrets
goal: >-
  Fix the silent two-week production deploy failure: /tickets prerenders at
  BUILD time (export const revalidate = 60) and calls getSoldCountsByTicketType()
  whenever the live nationalShow.salesOpen flag is true (it is), which uses the
  Firebase Admin SDK — but FIREBASE_ADMIN_PROJECT_ID/CLIENT_EMAIL/PRIVATE_KEY are
  correctly RUNTIME-only in apphosting.yaml (sold counts are live inventory;
  baking them at build time would serve stale availability and risk overselling
  — this must not change). The App Hosting builder has no credentials and the
  build dies on every real deploy while every local build passes 100% of the
  time (masked by .env.local) and CI passes 100% of the time (masked by a
  DIFFERENT bug — NEXT_PUBLIC_SANITY_DATASET is an empty-string GitHub secret,
  not unset, so every sanityFetch in CI throws "`dataset` must be provided",
  salesOpen resolves false, and the Admin SDK call is never reached — see
  contracts/golden/build-without-secrets/README.md "Why CI passing was not
  evidence"). This contract asserts the OUTCOME a fix must achieve — pnpm build
  succeeds with .env.local hermetically absent and only apphosting.yaml's
  current BUILD-availability vars present, and no page under app/ both
  prerenders and transitively reaches firebase-admin — without mandating a
  mechanism (force-dynamic, a route handler, deferred hydration, or otherwise
  is @dev's call), and without the forbidden shortcut of promoting the admin
  secrets to BUILD-availability (which negative controls explicitly guard).
created_at: '2026-08-12'
autonomy: high

features:
  - id: F1
    name: >-
      Make /tickets (and any equivalent path @dev's chosen mechanism touches)
      obtain sold counts at REQUEST time, not BUILD time, so `pnpm build`
      succeeds using only apphosting.yaml's BUILD-availability variables — with
      FIREBASE_ADMIN_PROJECT_ID, FIREBASE_ADMIN_CLIENT_EMAIL and
      FIREBASE_ADMIN_PRIVATE_KEY left exactly as RUNTIME-only as they are today,
      SITE_URL and its documented reasoning untouched, and the existing 60s
      CDN-staleness intent (contracts/cms-loop-f1-cdn-purge.yaml) undisturbed on
      every OTHER page that currently carries `export const revalidate = 60`.
    status: pending

goldens:
  - contracts/golden/build-without-secrets/README.md
  - contracts/golden/build-without-secrets/selftest.py
  - contracts/golden/build-without-secrets/build_isolated.sh
  - contracts/golden/build-without-secrets/extract_build_vars.py
  - contracts/golden/build-without-secrets/check_no_prerendered_admin_routes.py
  - contracts/golden/build-without-secrets/check_apphosting_guard.py
  - contracts/golden/build-without-secrets/revalidate-60-pages.golden.txt
  - contracts/golden/build-without-secrets/repro-build-defect.log
  - contracts/golden/build-without-secrets/fixtures/apphosting-fixtures/clean.yaml
  - contracts/golden/build-without-secrets/fixtures/apphosting-fixtures/admin-promoted-to-build.yaml
  - contracts/golden/build-without-secrets/fixtures/apphosting-fixtures/renamed-circumvention.yaml
  - contracts/golden/build-without-secrets/fixtures/apphosting-fixtures/site-url-regressed.yaml
  - contracts/golden/build-without-secrets/fixtures/sweep-fixture

assertions:
  phase: 4
  checks:
    # ================= detector self-test (must run first) =================
    - id: A1
      description: >-
        META - self-test, delegated to selftest.py. Proves extract_build_vars.py
        returns exactly the real repo's 8 BUILD-only vars and refuses a fixture
        with an admin secret promoted to BUILD; proves build_isolated.sh's
        backup/trap/restore machinery restores a synthetic .env.local
        byte-identical after both a successful AND a failed fake build, and that
        its env -i isolation genuinely hides a parent-shell variable from the
        build command (all against an isolated sandbox, never the real
        .env.local); proves check_no_prerendered_admin_routes.py flags the
        fixture's tickets-shaped violation, correctly exempts cookies()-gated
        and force-dynamic pages while still reporting them as reaching
        firebase-admin (proving the exemption reasons about rendering mode, not
        path), and correctly ignores a type-only import to firebase-admin
        (without which most of the real site false-positives via
        types/index.ts's `import type { Timestamp } from
        'firebase-admin/firestore'` — see README "A real gotcha"); proves
        check_apphosting_guard.py's three subcommands pass on a clean fixture
        AND the real apphosting.yaml, and each fails on its matching defect
        fixture; replays repro-build-defect.log (real evidence, captured
        2026-08-12, not synthesized) and asserts it contains the actual
        prerendering error, "Missing Firebase Admin credentials", a recorded
        nonzero exit code, and a recorded successful .env.local restore.
      command: python3 contracts/golden/build-without-secrets/selftest.py
      timeout_seconds: 60

    # ================= the important one =================
    - id: A2
      description: >-
        THE ASSERTION THAT WOULD HAVE CAUGHT THIS TWO WEEKS AGO. Runs the real
        `pnpm build` with .env.local hermetically moved aside (not just
        unset — genuinely absent from the filesystem for the duration of the
        build) and ONLY the current apphosting.yaml's BUILD-availability
        variables injected via `env -i` (so nothing in the ambient shell
        environment can smuggle a credential in either). .env.local is restored
        and verified byte-identical by SHA-256 checksum on every exit path
        (success, failure, or signal) via build_isolated.sh's EXIT/INT/TERM
        trap — a restore failure is treated as more severe than a build failure
        (exit 99) because leaving a developer's real .env.local missing or
        altered would be a worse bug than the one this assertion exists to
        catch. Currently FAILS with "Missing Firebase Admin credentials" while
        prerendering /tickets (see repro-build-defect.log) — expected to pass
        once @dev moves the sold-count fetch to request time.
      command: bash contracts/golden/build-without-secrets/build_isolated.sh apphosting.yaml
      timeout_seconds: 300

    # ================= mechanism-agnostic sweep =================
    - id: A3
      description: >-
        No page under app/ both prerenders (static or ISR — the Next default
        unless it opts into request-time rendering) and transitively imports
        firebase-admin. A2 alone doesn't prove this in general (a build could
        swallow the error and ship a broken page); this is an independent check
        of the actual import graph. Currently FAILS with exactly one violation,
        app/(marketing)/tickets/page.tsx — the known defect. Reports (but does
        not fail on) app/admin/page.tsx and app/(marketing)/events/submit/page.tsx,
        which DO transitively reach firebase-admin but are correctly exempted
        because both call cookies() (see README "Scope: what was swept and why").
      command: python3 contracts/golden/build-without-secrets/check_no_prerendered_admin_routes.py .
      timeout_seconds: 30

    # ================= negative controls: the forbidden shortcut was not taken =================
    - id: A4
      description: >-
        NEGATIVE CONTROL - apphosting.yaml still declares FIREBASE_ADMIN_PROJECT_ID,
        FIREBASE_ADMIN_CLIENT_EMAIL and FIREBASE_ADMIN_PRIVATE_KEY with
        availability exactly [RUNTIME] — proves the fix wasn't achieved by
        making the admin secrets BUILD-available. Passes today (nothing to fix
        yet, this is the baseline that must never regress).
      command: python3 contracts/golden/build-without-secrets/check_apphosting_guard.py apphosting.yaml admin-runtime-only
      timeout_seconds: 15

    - id: A5
      description: >-
        NEGATIVE CONTROL - no BUILD-available env entry in apphosting.yaml is
        secret-sourced or has a credential-shaped name (FIREBASE_ADMIN_*,
        *PRIVATE_KEY*, *CLIENT_EMAIL*, *_TOKEN, *_SECRET). Broader than A4 —
        also catches a renamed circumvention (copying the admin key into a new
        BUILD-available variable under a different name) rather than only the
        three named variables.
      command: python3 contracts/golden/build-without-secrets/check_apphosting_guard.py apphosting.yaml no-build-secrets
      timeout_seconds: 15

    - id: A6
      description: >-
        NEGATIVE CONTROL - SITE_URL is still RUNTIME-only, its value is still
        the real App Hosting URL (not saoc.co.za, the old Joomla domain), and
        its explanatory comment block is still present — guards against an
        editor removing that documented reasoning while touching apphosting.yaml
        for this fix.
      command: python3 contracts/golden/build-without-secrets/check_apphosting_guard.py apphosting.yaml site-url-unchanged
      timeout_seconds: 15

    # ================= negative control: CDN-staleness intent elsewhere is undisturbed =================
    - id: A7
      description: >-
        NEGATIVE CONTROL - every OTHER page that currently declares `export
        const revalidate = 60` (the F1 cms-loop 60s CDN-staleness bound, see
        contracts/cms-loop-f1-cdn-purge.yaml) still declares it. This fix is
        free to change /tickets itself but must not silently ripple the
        directive off unrelated routes. The golden list
        (revalidate-60-pages.golden.txt) deliberately excludes
        app/(marketing)/tickets/page.tsx, the one page this fix is expected to
        touch.
      command: >-
        FAIL=0; while IFS= read -r f; do [ -z "$f" ] && continue; grep -q "export const revalidate = 60" "$f" || { echo "MISSING revalidate=60 in $f"; FAIL=1; }; done < contracts/golden/build-without-secrets/revalidate-60-pages.golden.txt; exit $FAIL
      timeout_seconds: 15

    # ================= negative control: API routes didn't quietly opt into the same trap =================
    - id: A8
      description: >-
        NEGATIVE CONTROL - none of app/api/tickets/** or app/api/admin/**
        declare `export const dynamic = 'force-static'`, which would be the one
        way a route handler (out of scope for A3's page.tsx-only sweep, since
        Next route handlers default to per-request execution) could opt into
        the same static-prerender-plus-admin-SDK trap. Not assumed safe by
        default — verified.
      command: '! grep -rq "force-static" app/api/tickets app/api/admin'
      timeout_seconds: 15
