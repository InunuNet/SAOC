schema: athanor.contract/v1
feature: D6
spec: d6-door-checkin
name: D6 Door check-in — mobile-first QR scanner page (/admin/door) + checkin API route marking tickets checked-in in Firestore
created_at: '2026-06-13T00:00:00.000000+00:00'

# NOTE ON SCHEMA: this project's gate runner consumes the `verify.kind` form
# (file_exists | file_contains | shell). cmd values containing ':' or '|'
# are single-quoted to keep the YAML valid.
#
# SCOPE: door check-in for the SAOC 2027 National Show. A mobile-first client
# page scans a QR code (html5-qrcode), reads a bookingRef, and POSTs it to
# /api/admin/checkin. The route looks up the ticket by bookingRef, marks it
# checked in (checkedInAt + status: 'checked-in'), and returns success/error.
#
# AUTH: NO new mechanism. The checkin route reuses the D5 session-cookie +
# admin-claim pattern (cookies().get('session') → verifySessionCookie →
# decodedToken.admin / role === 'admin'), returning 401/403 when not admin.

assertions:
  # ---- 1: door page (app/admin/door/page.tsx) ----
  - id: D6-01
    description: app/admin/door/page.tsx exists
    verify:
      kind: file_exists
      path: app/admin/door/page.tsx

  - id: D6-02
    description: door page is a client component (needs browser camera access)
    verify:
      kind: shell
      cmd: "grep -Eq \"^['\\\"]use client['\\\"]\" app/admin/door/page.tsx"

  - id: D6-03
    description: door page imports or references html5-qrcode for QR scanning
    verify:
      kind: shell
      cmd: 'grep -q "html5-qrcode" app/admin/door/page.tsx'

  - id: D6-04
    description: door page POSTs the scanned value to /api/admin/checkin
    verify:
      kind: shell
      cmd: "grep -q '/api/admin/checkin' app/admin/door/page.tsx"

  - id: D6-05
    description: door page sends a bookingRef in the check-in request
    verify:
      kind: shell
      cmd: 'grep -q "bookingRef" app/admin/door/page.tsx'

  - id: D6-06
    description: door page has a manual text input fallback (type bookingRef)
    verify:
      kind: shell
      cmd: 'grep -Eq "<input|<form" app/admin/door/page.tsx'

  - id: D6-07
    description: door page shows success/failure feedback (success + error/failure text or colour)
    verify:
      kind: shell
      cmd: "grep -Eqi \"success\" app/admin/door/page.tsx && grep -Eqi \"error|fail|red\" app/admin/door/page.tsx"

  # ---- 2: checkin API route (app/api/admin/checkin/route.ts) ----
  - id: D6-08
    description: app/api/admin/checkin/route.ts exists
    verify:
      kind: file_exists
      path: app/api/admin/checkin/route.ts

  - id: D6-09
    description: checkin route exports a POST handler
    verify:
      kind: shell
      cmd: 'grep -Eq "export (async )?function POST" app/api/admin/checkin/route.ts'

  - id: D6-10
    description: >-
      [RETIRED 2026-08-16] Was: checkin route uses the Admin SDK (initAdmin) — a grep
      for the literal import path in app/api/admin/checkin/route.ts. Stale after the F1
      ticketing-hardening refactor (contract-ticketing-hardening.yaml) extracted all
      Firestore access out of the route into lib/checkin.ts's checkInByBookingRef; the
      route now only calls getAdminSession() and checkInByBookingRef and never imports
      lib/firebase-admin directly, so the grep fails on correct code. See the
      SUPERSESSION NOTE above D6-SERVER-START.
    verify:
      kind: shell
      cmd: >-
        echo "SUPERSEDED: D6-10 retired 2026-08-16 -- the route no longer imports
        lib/firebase-admin directly (extracted to lib/checkin.ts by F1
        ticketing-hardening). That the Admin SDK is genuinely wired and working is now
        proven live by D6-13 below (real HTTP round trip through the route mutates a
        real Firestore document) and by contract-ticketing-hardening.yaml A1-A4 (real
        Firestore transactions via checkInByBookingRef) and A14 (route delegates to
        checkInByBookingRef with no admission logic of its own)." >&2; exit 77

  # D6-11/D6-12/D6-13/D6-16 REPLACED 2026-08-16 (post-audit hardening). The originals
  # were grep-only and would not notice a regression: D6-11's "admin|role" grep was
  # satisfied by the import path '@/lib/firebase-admin' alone (no admin-claim check
  # required); D6-12 matched the digits 401/403 anywhere, including on an unrelated
  # validation error; D6-13/D6-16 checked that unrelated literals merely co-occurred in
  # the file rather than that Firestore was actually wired together or actually mutated.
  # Verified NOT a live vulnerability before this rewrite: app/api/admin/checkin/route.ts
  # calls getAdminSession() (lib/admin-auth.ts) before any Firestore access, and
  # isAdminToken() there enforces admin===true, email_verified===true, and live
  # allowlist membership — this is a detection-gap fix, not an incident response.
  #
  # Replacements below run REAL round trips: a real Firebase session cookie (in D6-11's
  # case, minted directly via Admin SDK createSessionCookie, bypassing the app's own
  # /api/admin/session mint route on purpose so the checkin route's OWN claim check is
  # proved independently of that route's separate enforcement of the same rule), a real
  # HTTP POST to /api/admin/checkin, and a real Firestore read-back of the ticket
  # document. Each was proven 2026-08-16 to catch a deliberately broken variant (claim
  # check stripped from a scratch copy of the route, built and run on a separate port) —
  # see contracts/golden/d6-door-checkin/README.md "Broken-variant evidence". Mirrors
  # the pattern contract-admin-auth-f3-provisioning.yaml's A-REVOKE-01 established:
  # scripts/checks run as real processes/HTTP against a real isolated built server via
  # contracts/checks/admin-auth-hardening/server-ctl.sh (reused, not duplicated).
  #
  # CI vs LOCAL: same precondition shape as contract-admin-auth-f3-provisioning.yaml —
  # these need FIREBASE_ADMIN_PROJECT_ID / FIREBASE_ADMIN_CLIENT_EMAIL /
  # FIREBASE_ADMIN_PRIVATE_KEY / NEXT_PUBLIC_FIREBASE_API_KEY / ADMIN_EMAIL_ALLOWLIST
  # (containing admin-auth-check-allowlisted@saoc.co.za) in .env.local at the repo root.
  # LOCAL-ONLY unless CI's secret store provisions the same values — see "Outstanding
  # human action" in the README. If .env.local (or the equivalent CI secrets) is
  # missing, each check below exits non-zero with a PreconditionError message
  # ("FAIL: <KEY> is not set in .env.local") rather than reporting a silent green;
  # server startup itself (D6-SERVER-START) is the first thing to fail loudly in that
  # case, before any assertion runs, and is never treated as a passing check by the gate.
  #
  # ---------------------------------------------------------------------------
  # SUPERSESSION NOTE (D6-10, D6-14, D6-15, D6-16) — 2026-08-16
  # ---------------------------------------------------------------------------
  # P1 weak-assertion audit, second pass. D6-10/D6-14/D6-15/D6-16 were the four
  # remaining structural greps against app/api/admin/checkin/route.ts, and after
  # 382e157 landed the D6-11/D6-12/D6-13 round-trip checks above, all four went red —
  # not because of any regression, but because commit for F1 (contract-ticketing-
  # hardening.yaml) legitimately extracted every line of admission logic out of the
  # route (Admin SDK access, the checkedInAt write, the Timestamp, the status write)
  # into lib/checkin.ts's checkInByBookingRef, leaving the route as a thin
  # getAdminSession() + checkInByBookingRef() delegate (see route.ts's own comment:
  # "Nothing is read from or written to Firestore before auth passes... every
  # admission rule lives in lib/checkin.ts"). Verified by source read 2026-08-16: the
  # route no longer contains the literals 'lib/firebase-admin', 'checkedInAt',
  # 'Timestamp.now', or 'checked-in' at all — the greps could not possibly pass
  # against genuinely correct current code, exactly the D5-04 lesson repeated (a
  # keyword grep cannot survive a legitimate refactor).
  #
  # All four are retired below (verify.kind: shell, always exits 77, prints a
  # SUPERSEDED message) rather than deleted or rewritten against the new file,
  # because the properties they were protecting are now proven BETTER, not merely
  # elsewhere:
  #   - D6-13 (above, this contract) is a real HTTP round trip through the actual
  #     route — real admin session, real POST, real Firestore read-back — and
  #     directly observes the Admin SDK connection working, checkedInAt being
  #     stamped, and status flipping to 'checked-in'. It supersedes D6-10, D6-14, and
  #     D6-16 outright.
  #   - The server-only nature of checkedInAt (D6-15's intent) is proven by D6-13's
  #     request never sending a checkedInAt value and the field still appearing on
  #     read-back — it can only be server-derived.
  #   - contract-ticketing-hardening.yaml A1-A4 exercise checkInByBookingRef directly
  #     against real Firestore (including concurrency and the double-scan case), A2
  #     specifically re-proving the checkedInAt/status write, and A14 is a structural
  #     check (self-tested against compliant and escaping fixtures) that the route
  #     contains no admission logic of its own and delegates entirely to
  #     checkInByBookingRef.
  # No production code was touched to produce this note or these retirements, and no
  # live vulnerability was found — the code is correct; the four assertions could no
  # longer see it.
  - id: D6-SERVER-START
    description: >-
      Starts (or confirms already running) the isolated locally-built production server
      the checks below test against. Reuses admin-auth-hardening's server-ctl.sh
      directly rather than duplicating it — same script, same port 3400, same
      rsync'd-working-tree build. LOCAL-ONLY (or CI with the same .env.local-equivalent
      secrets provisioned) — see note above.
    verify:
      kind: shell
      cmd: bash contracts/checks/admin-auth-hardening/server-ctl.sh start

  - id: D6-11
    description: >-
      A real, valid session cookie for an authenticated NON-admin user (no admin
      claim) is refused 403 by POST /api/admin/checkin, and the targeted real ticket is
      left unmutated. The cookie is minted directly via Admin SDK createSessionCookie,
      bypassing the app's own session-mint route's admin gate, so this proves the
      checkin route's OWN admin-claim check specifically — the exact regression the
      audit flagged (a route that verifies a session cookie but never checks the admin
      claim would previously still satisfy the old grep). LOCAL-ONLY / CI-with-secrets.
    verify:
      kind: shell
      cmd: node contracts/checks/d6-door-checkin/check-nonadmin-refused.mjs

  - id: D6-12
    description: >-
      No session cookie, and a syntactically invalid session cookie, are both refused
      401 by POST /api/admin/checkin against a real ticket, with a real Firestore
      read-back proving no mutation occurred. LOCAL-ONLY / CI-with-secrets.
    verify:
      kind: shell
      cmd: node contracts/checks/d6-door-checkin/check-noauth-refused.mjs

  - id: D6-13
    description: >-
      A genuine admin session succeeds (200, success:true) against a real paid ticket,
      and the REAL Firestore document is read back afterward to confirm status flips to
      'checked-in' with a real checkedInAt timestamp — not merely that the literals
      'tickets' and 'bookingRef' co-occur in the source. Also the required positive
      control for D6-11/D6-12: without it, a route refusing every caller unconditionally
      would satisfy both of those checks by accident. A second check-in of the same
      ticket is then refused 409, proving the first write was real persisted state, not
      a stateless success response. LOCAL-ONLY / CI-with-secrets.
    verify:
      kind: shell
      cmd: node contracts/checks/d6-door-checkin/check-admin-succeeds.mjs

  - id: D6-14
    description: >-
      [RETIRED 2026-08-16] Was: checkin route sets the checkedInAt field on the ticket —
      a grep for the literal "checkedInAt" in app/api/admin/checkin/route.ts. Stale after
      the F1 ticketing-hardening refactor moved the field write into lib/checkin.ts
      (admit(), via transaction.update(doc.ref, { status: 'checked-in', checkedInAt })).
      See the SUPERSESSION NOTE above D6-SERVER-START.
    verify:
      kind: shell
      cmd: >-
        echo "SUPERSEDED: D6-14 retired 2026-08-16 -- checkedInAt is now set in
        lib/checkin.ts, not app/api/admin/checkin/route.ts. Proven live by D6-13 below
        (real HTTP round trip through the route, real Firestore read-back confirms
        checkedInAt is actually written) and by contract-ticketing-hardening.yaml A2
        (same property at the lib/checkin.ts level, real Firestore read-back)." >&2; exit 77

  - id: D6-15
    description: >-
      [RETIRED 2026-08-16] Was: checkin route writes a server Timestamp for checkedInAt —
      a grep for Timestamp.now()/FieldValue.serverTimestamp() in
      app/api/admin/checkin/route.ts. Stale for the same reason as D6-14: the write
      (Timestamp.now()) now lives in lib/checkin.ts, not the route. See the SUPERSESSION
      NOTE above D6-SERVER-START.
    verify:
      kind: shell
      cmd: >-
        echo "SUPERSEDED: D6-15 retired 2026-08-16 -- the Timestamp.now() call moved to
        lib/checkin.ts (confirmed present there by source read 2026-08-16), not
        app/api/admin/checkin/route.ts. That checkedInAt is server-derived, not
        client-suppliable, is proven live by D6-13 below: its POST body carries only
        bookingRef, never checkedInAt, and the real Firestore read-back afterward shows
        checkedInAt actually stamped -- the value can only have come from the server.
        Also covered by contract-ticketing-hardening.yaml A2." >&2; exit 77

  - id: D6-16
    description: >-
      [RETIRED 2026-08-16] Was: checkin route sets status to 'checked-in' -- a grep for
      the literal "checked-in" and "status" in app/api/admin/checkin/route.ts. Stale for
      the same reason as D6-14/D6-15 -- the write moved to lib/checkin.ts. This
      assertion's own prior note already said D6-13 was the load-bearing proof; it is
      now retired outright rather than kept as a non-load-bearing structural check that
      merely fails on a legitimate refactor. See the SUPERSESSION NOTE above
      D6-SERVER-START.
    verify:
      kind: shell
      cmd: >-
        echo "SUPERSEDED: D6-16 retired 2026-08-16 -- status: 'checked-in' is now set in
        lib/checkin.ts, not app/api/admin/checkin/route.ts. Proven live by D6-13 below
        (real HTTP round trip, real Firestore read-back confirms status actually flips
        to checked-in) and by contract-ticketing-hardening.yaml A2 (same property at the
        lib/checkin.ts level)." >&2; exit 77

  - id: D6-STOP-SERVER
    description: >-
      Stops the isolated production server and removes its scratch build tree,
      whether the checks above passed or failed. If another contract in this session
      started the same server, server-ctl.sh's own lock/refcount handling governs.
    verify:
      kind: shell
      cmd: bash contracts/checks/admin-auth-hardening/server-ctl.sh stop

  - id: D6-17
    description: checkin route returns a structured success response (success + ticket)
    verify:
      kind: shell
      cmd: 'grep -q "success" app/api/admin/checkin/route.ts'

  # ---- 3: dependency — html5-qrcode in package.json ----
  - id: D6-18
    description: html5-qrcode is declared in package.json dependencies
    verify:
      kind: shell
      cmd: 'grep -q "html5-qrcode" package.json'

  # ---- 4: Gates ----
  - id: D6-GATE-01
    description: pnpm type-check passes — strict TS, zero errors
    verify:
      kind: shell
      cmd: pnpm type-check
      expect_exit: 0

  - id: D6-GATE-02
    description: pnpm lint passes with zero errors
    verify:
      kind: shell
      cmd: pnpm lint
      expect_exit: 0

phases:
  - id: 1
    assertions:
      - D6-01
      - D6-02
      - D6-03
      - D6-04
      - D6-05
      - D6-06
      - D6-07
      - D6-08
      - D6-09
      - D6-10
      - D6-SERVER-START
      - D6-11
      - D6-12
      - D6-13
      - D6-14
      - D6-15
      - D6-16
      - D6-17
      - D6-18
      - D6-STOP-SERVER
      - D6-GATE-01
      - D6-GATE-02
