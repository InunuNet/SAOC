schema: athanor.contract/v1
slug: cms-loop-f3-national-show
goal: >
  Wire app/(marketing)/national-show/page.tsx to the seeded `nationalShow` singleton
  (nationalShowQuery, sanity/queries.ts:30-39) so the fields it already projects
  (title, showDate, location, hero, countdownDate, exhibitorStages) actually drive
  the page instead of being dead JSX literals — the same inert-editing defect F1/F2
  exist to kill elsewhere in this mission. Data-flow wiring only: no visual design
  decisions, no layout restructuring, no new components, no schema changes, no
  invented copy.
created_at: '2026-08-05'
autonomy: high

# ============================================================================
# READ FIRST — F1 DEPENDENCY, NOW CONFIRMED DEPLOYED, GATE ENFORCED IN CODE
# ============================================================================
# A1 and A3 are real round trips against the DEPLOYED /national-show page and depend
# on contracts/cms-loop-f1-cdn-purge.yaml having landed: /national-show is one of F1's
# CMS_ROUTES. UPDATE (2026-08-06): F1 IS NOW CONFIRMED DEPLOYED — a live check during
# this contract's own authoring (see below) showed /national-show's Cache-Control is
# `s-maxage=60, stale-while-revalidate=31535940`, not the legacy one-year value. Do
# not assume otherwise; re-verify at grading time regardless, since deploys can regress.
#
# Both A1 and A3 call `assertF1Deployed()` (contracts/checks/cms-loop-f3-national-show/
# _shared.mjs) as their very first action, BEFORE any mutation — it reads
# /national-show's live Cache-Control (via a read-only import of F1's own
# fetchHeaders/parseCacheControl/MAX_ACCEPTABLE_S_MAXAGE, not a second copy of that
# threshold) and hard-fails immediately if F1's fix is not detected. This is enforced
# in code, not just documented, per team-lead direction: running a sentinel round trip
# before F1 ships would risk the CDN caching sentinel content for up to a year, since
# the dataset cleanup cannot reach an already-cached CDN copy.
#
# ============================================================================
# WHAT WAS VERIFIED LIVE — INCLUDING A REAL END-TO-END RUN, AND A BUG IT FOUND
# ============================================================================
# Because F1 turned out to already be deployed, A1 and A3 (the two checks that MUTATE
# the real nationalShow singleton) WERE executed live for real during this contract's
# authoring, exactly like F6/F1's precedent — not left unverified:
#   - A2, A4, A5 (read-only): all PASS live, confirmed 2026-08-05/06.
#   - A6 (read-only): confirmed live to correctly FAIL pre-implementation (hero is not
#     yet corrected/wired) — see A6 below.
#   - A3 (exhibitorStages round trip): ran for real. Write landed, revalidate
#     succeeded, propagation correctly FAILED (page doesn't render exhibitorStages
#     yet — the honest, expected pre-implementation result), and cleanup was verified
#     via both the dataset and the live page on the FIRST poll attempt. No defects
#     found in this check.
#   - A1 (title/location/countdownDate round trip): ran for real TWICE. The first run
#     surfaced a genuine bug in the check itself, not in production: a single
#     immediate dataset read right after the Studio Publish click and right after the
#     cleanup publish can race ahead of the write actually landing (Sanity's mutation
#     API is not guaranteed synchronous with the instant a UI click resolves). That
#     run's "confirm publish landed" and "confirm cleanup landed" reads both
#     momentarily saw stale data and reported FAIL, even though a follow-up direct
#     dataset read (done immediately, out-of-band, to check for a real incident)
#     confirmed the mutation AND the cleanup had both genuinely, correctly succeeded —
#     production was never left in a bad state, verified via the dataset (exact
#     baseline match) and both live pages (grep for sentinel/2098/2099 strings,
#     zero matches). Fixed by adding `readAllFieldsUntil()`, a short bounded retry
#     (up to 6 attempts / 3s apart) around both dataset-landing checks — this
#     tolerates the race without weakening what's asserted (the predicate must still
#     become true, just not necessarily on the first read). A SEPARATE bug was found
#     and fixed in the same run: the cleanup-propagation check originally required
#     baseline text to REAPPEAR on the live page as part of "cleanup succeeded" — but
#     pre-implementation, baseline title/location text was NEVER rendered on
#     /national-show at all (that's the whole point of this feature), so that
#     condition could never be satisfied regardless of whether cleanup worked,
#     producing a guaranteed false FAIL. Fixed: the safety gate is now "no sentinel
#     content visible on the page" (title/location/countdownDate sentinels all
#     checked) — the only thing that actually matters for not leaking test content to
#     real visitors — with old-content reappearing logged as diagnostic information,
#     not required. Re-ran after both fixes: publish confirmed immediately, propagation
#     correctly FAILED (still not wired — correct), cleanup verified on the first
#     poll attempt. Final production state independently re-checked afterward: dataset
#     exactly matches the original baseline, zero sentinel residue on either page.
#   - Field types/current values (informed A1/A3's design) were ALSO confirmed via
#     read-only Playwright DOM inspection before committing to the Studio-UI approach
#     for title/location/countdownDate; SANITY_API_TOKEN write access was confirmed
#     via a real patch+revert against exhibitorStages before committing to A3's
#     direct-client approach.
# This is the intended process, not a detour: a contract's checks earning trust by
# actually being run, a real bug being found and fixed before hand-off, and the
# recovery being independently verified — rather than shipping an untested check that
# looks plausible on paper.
#
# ============================================================================
# FIELDS WIRED, AND WHY — DATA-FLOW SCOPE ONLY
# ============================================================================
# All six nationalShowQuery fields are addressed:
#   title, location, countdownDate  — plain string/datetime fields, Studio-UI
#     round trip (A1). countdownDate ALSO requires wiring components/show/
#     ShowCountdown.tsx to accept a prop (it currently hardcodes
#     TARGET_MS = new Date('2027-09-18T09:00:00+02:00') at module scope, ~line 5)
#     the same way components/home/ShowBand.tsx ALREADY does correctly
#     (`ShowBand({ countdownDate })`, with a DEFAULT_COUNTDOWN_DATE fallback — mirror
#     that pattern, do not diverge from it).
#   exhibitorStages — portableText field, direct-Sanity-client round trip (A3) rather
#     than Studio-UI automation (see A3's own header for why). Currently EMPTY in the
#     dataset (F4's golden: "GAP... Left unset") — the page's existing fallback
#     pattern (`sanityClasses.length > 0 ? ... : staticClasses`, already used for
#     showClasses/pastShows two lines up) is the correct precedent to follow: render
#     the hardcoded EXHIBITOR_STAGES when exhibitorStages is empty, render the CMS
#     content when present.
#   hero — wired, but with a required PRE-STEP: see "HERO — VISUAL NEUTRALITY
#     REQUIRED" below. Not exercised by A3's temporary-mutation pattern (see A3's own
#     header for why); proven instead by A6, a static post-state check.
#   showDate — NOT wired. See "SCOPE BOUNDARY — NOT WIRED" below; A5 enforces this
#     stays a schema-and-scope decision for Brad, not something @dev works around.
#
# ============================================================================
# EDITORIAL-VS-VISUAL DECISIONS — RULED BY TEAM-LEAD, ENCODE AS GIVEN
# ============================================================================
# Checked contracts/golden/f4-seed-page-singletons/nationalShow.golden.json (the
# record of what was actually seeded) against the literal JSX in
# app/(marketing)/national-show/page.tsx and found three divergences. These were
# reported, not silently reconciled, and team-lead has now ruled on all three.
# Governing principle: wiring must be editorially faithful but visually neutral —
# text is content the client owns; imagery is a visual-design decision reserved for
# the pending Claude Design handoff (CLAUDE.md: "No invented brand assets... Wait for
# Claude Design handoffs").
#
#   1. TITLE — WIRE AS-IS. The seeded title "The 19th South African National Orchid
#      Show" (migrated from ShowBand.tsx) replaces the page's current H1 text "The
#      South African National Orchid Show" (no "19th"). Rationale: one canonical show
#      name beats two variants, and this value is already live on the home page via
#      ShowBand. The nearby hardcoded "Nineteenth Edition" line will read redundantly
#      once wired — that is a COPY question for Brad, not a reason to remove or
#      restructure that line (removal/restructuring is layout, reserved for the
#      design handoff). Do not touch that line.
#   2. VENUE — WIRE AS-IS. The seeded `location` "Cape Town International Convention
#      Centre" replaces the page's hardcoded Venue meta cell "CTICC, Cape Town" (same
#      building). Rationale: the fuller string is more useful to a first-time visitor,
#      and once wired, Brad can shorten it in the Studio in seconds — the whole point
#      of this mission.
#   3. HERO — DO NOT LET WIRING CHANGE THE RENDERED IMAGE. The seeded `hero` asset
#      (orchid-yellow.jpg, migrated from ShowBand.tsx, the SAME file ShowBand.tsx
#      already uses on the home page) is a MIGRATION ARTIFACT, not an approved design
#      choice for this page — the page's hero currently hardcodes a DIFFERENT asset,
#      orchid-dark.jpg. Swapping the visible hero background is a visual-design
#      decision reserved for the pending Claude Design handoff. See "HERO — VISUAL
#      NEUTRALITY REQUIRED" immediately below for the required implementation step
#      and A6 for how this is verified.
#
# ============================================================================
# HERO — VISUAL NEUTRALITY REQUIRED (A6 enforces this)
# ============================================================================
# Required implementation step, to be done as a DOCUMENTED dataset correction (not a
# silent fix, per team-lead): before wiring the `hero` field into the page, update
# nationalShow.hero in the dataset to reference the SAME asset the page currently
# hardcodes — orchid-dark.jpg, confirmed live 2026-08-05 via the Sanity asset API to
# already exist in this dataset as
# `image-894baf3b8a14c1fc68771b3f2efcd9637fc0dfb5-5184x3456-jpg` (no upload needed).
# THEN wire the field normally (with the same present/absent fallback pattern used
# elsewhere on this page). A6 (check-hero-visual-neutrality.mjs) is a static,
# read-only, non-mutating check — safe to run at any time, not gated on F1 — that
# verifies (a) the dataset correction landed (hero references the orchid-dark.jpg
# asset hash, not the originally-seeded orchid-yellow.jpg one) and (b) the deployed
# page renders that same asset hash post-wiring. Confirmed live 2026-08-06 that A6
# correctly FAILS today (dataset still references the original seeded asset,
# pre-correction) — not vacuous.
#
# ============================================================================
# SCOPE BOUNDARY — NOT WIRED, FLAGGED FOR BRAD (enforced by A5)
# ============================================================================
# The brief lists "dates" and "host" among the inert JSX. Checked against the actual
# nationalShow schema (sanity/schemas/documents/nationalShow.ts) — there is no field
# for either:
#   - "18–21 Sep 2027" (a DATE RANGE, page's Dates meta cell) has no schema
#     counterpart — `showDate` is a single datetime, not a range, and it is currently
#     UNSET in the dataset regardless (F4's golden: "GAP"). There is nothing to wire
#     this to without a schema change.
#   - "Western Cape" (page's Host meta cell) has no schema field at all — `location`
#     is the show's single venue string, already claimed by the Venue meta cell (see
#     divergence #2 above).
#   - The CYCLE_YEARS three-edition timeline and the 4-up stats block (18 editions
#     held, 3yr cycle, 10 judging classes, 1,240 entries) have no schema support
#     either and are not mentioned in the brief as needing wiring — left alone.
# A schema change is explicitly out of scope for "wiring data flow only" per the
# brief's scope-caution section, and ties into the still-open National Show
# brand-architecture question already on file (project memory: Brad suspects
# per-edition full-redesign is wrong; wants master brand + rotating host sub-brand,
# pending committee chat) — not a decision this contract or @dev should make
# unilaterally. A5 (check-schema-scope-unchanged.mjs) enforces @dev does not silently
# add fields to route around this gap.
#
# ============================================================================
# COORDINATION
# ============================================================================
# Nothing under contracts/checks/f6-prove-cms-loop/ was modified. This contract's
# _shared.mjs IMPORTS (does not fork) openAuthenticatedDoc/readDatasetField/
# fetchPublicPageContains/callRevalidate/getSanityClient/loadEnvOrFail from that
# directory, the same reuse pattern cms-loop-f2-event-tags already established. All
# new files live under contracts/checks/cms-loop-f3-national-show/, owned by this
# contract only.

assertions:
  phase: 4
  checks:
    - id: A1
      description: >
        THE positive-path, user-visible-outcome assertion (mandatory per dispatch
        brief): edits title, location, AND countdownDate together in the deployed
        Studio (real browser automation), publishes once, calls /api/revalidate, and
        polls the deployed /national-show page for all three sentinel values while
        confirming the OLD values are gone (two-sided, not just presence) — bounded at
        120s / 10s intervals, hard FAIL on timeout, guaranteed baseline-exact cleanup
        verified via both the dataset and the live page. Covers a text field AND the
        countdown date together, satisfying "partial wiring can't pass" (title alone
        wired without location/countdownDate would fail this). GATED: refuses to run
        (hard fail, no mutation) unless F1's short-TTL fix is confirmed live —
        assertF1Deployed() in _shared.mjs. Executed live twice during authoring (see
        "WHAT WAS VERIFIED LIVE" above) — first run surfaced and led to fixing two
        real bugs in this check's own verification logic (a dataset-read race, and an
        impossible-to-satisfy pre-implementation cleanup condition); second run
        confirmed the fixes and correctly FAILED for the honest reason (not wired
        yet), with cleanup verified on the first attempt. Production independently
        re-confirmed clean afterward. Expected to keep FAILing until @dev wires these
        fields.
      command: node contracts/checks/cms-loop-f3-national-show/check-headline-round-trip.mjs

    - id: A2
      description: >
        Regression assertion (mandatory per dispatch brief): the HOME PAGE's
        ShowBand countdown, which already correctly consumes nationalShow.countdownDate
        today, must continue to after F3 touches the shared ShowCountdown component and
        field. Reads whatever the CURRENT countdownDate value is (not hardcoded) and
        confirms it's still embedded in the home page's response. Read-only,
        non-mutating. Verified live: PASSES today (proves this isn't a check that
        would pass regardless — it genuinely reads real data).
      command: node contracts/checks/cms-loop-f3-national-show/check-home-page-regression.mjs

    - id: A3
      description: >
        Round trip for exhibitorStages (portableText), via direct Sanity client
        writes rather than Studio-UI automation (a rich block-editor widget is
        disproportionately fragile to drive for what this needs to prove — see the
        check's own header). hero is deliberately NOT exercised here — see "HERO —
        VISUAL NEUTRALITY REQUIRED" and A6; a temporary swap-and-restore of a real
        visitor-facing image, even with guaranteed cleanup, would contradict the
        visual-neutrality requirement. Sets exhibitorStages from empty to sentinel
        text, revalidates, polls the deployed /national-show page, then clears back to
        empty, verified via both the dataset and the live page. GATED: refuses to run
        unless F1's short-TTL fix is confirmed live (same assertF1Deployed() guard as
        A1). Executed live during authoring: write landed, propagation correctly
        FAILED (not wired yet — the honest, expected result), cleanup verified on the
        first poll attempt. No defects found in this check.
      command: node contracts/checks/cms-loop-f3-national-show/check-exhibitor-stages-round-trip.mjs

    - id: A4
      description: >
        Negative control (mandatory per dispatch brief), same pattern as F6's A2:
        a freshly-generated nonce that was never published anywhere must be reported
        absent from both /national-show and the home page — proves A1/A2/A3/A6's
        substring-match detection is not vacuously true. Read-only, non-mutating.
        Verified live: PASSES today.
      command: node contracts/checks/cms-loop-f3-national-show/check-detects-absence.mjs

    - id: A5
      description: >
        Scope-boundary check enforcing "wiring data flow only": the nationalShow
        schema must still declare exactly its original six fields (title, showDate,
        location, hero, countdownDate, exhibitorStages) — proves @dev did not add a
        new field to route around the documented host/date-range gap (see "SCOPE
        BOUNDARY — NOT WIRED" above), which would be a schema change and a unilateral
        content-model decision, both out of scope. Local file check, no network
        dependency. Verified live: PASSES today.
      command: node contracts/checks/cms-loop-f3-national-show/check-schema-scope-unchanged.mjs

    - id: A6
      description: >
        Visual-neutrality assertion (mandatory per team-lead direction): proves
        wiring `hero` did NOT change what a visitor sees. Verifies (a) the dataset's
        nationalShow.hero references the orchid-dark.jpg asset (the one the page
        hardcoded before wiring — a required, documented dataset correction @dev must
        perform, replacing the originally-seeded orchid-yellow.jpg migration
        artifact) and (b) the deployed /national-show page renders that exact same
        asset (matched by content hash, not the full asset id, so a legitimate
        re-upload with different dimensions/format would still match). Static,
        read-only, non-mutating — not gated on F1 (it performs no mutation, so it
        carries none of A1/A3's CDN-poisoning risk) — but will not PASS until @dev has
        both corrected the dataset and wired the field. Confirmed live 2026-08-06:
        correctly FAILS today (dataset still references the original seeded asset).
      command: node contracts/checks/cms-loop-f3-national-show/check-hero-visual-neutrality.mjs
