runConfig:
  runtime: nodejs22
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 2
env:
  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    value: "26yfbug4"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SANITY_DATASET
    value: "production"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAfJhvCRX7O5OYTH6CN7WqfGO5DDpnss6Y"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "saoc-webapp.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "saoc-webapp"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "saoc-webapp.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1003063203247"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1003063203247:web:77f89e8963900274060b5a"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "saoc-webapp"
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: FIREBASE_ADMIN_CLIENT_EMAIL
    availability:
      - RUNTIME
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: SANITY_REVALIDATE_SECRET
    secret: SANITY_REVALIDATE_SECRET
    availability:
      - RUNTIME
  - variable: SANITY_API_TOKEN
    secret: SANITY_API_TOKEN
    availability:
      - RUNTIME
  # The checkout route builds notify_url/return_url/cancel_url on this at REQUEST time,
  # falling back to https://saoc.co.za — which still resolves to the OLD Joomla site, so
  # without this entry every deployed payment's ITN would be delivered there and the
  # ticket would sit permanently 'reserved'. A public origin, not a secret. RUNTIME only:
  # a BUILD entry would bake the origin into the bundle and defeat the per-environment
  # lookup. If the backend is renamed or a custom domain is cut over, this changes with
  # it — and it must never be saoc.co.za until that domain points at this app.
  - variable: SITE_URL
    value: "https://saoc-prod--saoc-webapp.europe-west4.hosted.app"
    availability:
      - RUNTIME
