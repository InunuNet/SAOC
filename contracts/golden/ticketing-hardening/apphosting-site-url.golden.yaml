# Golden — the SITE_URL entry that must exist in apphosting.yaml
#
# WHY: app/api/tickets/checkout/route.ts resolves the origin at REQUEST time via
# process.env.SITE_URL, falling back to https://saoc.co.za. saoc.co.za still resolves to
# the OLD Joomla site. With SITE_URL absent from apphosting.yaml, every deployed
# checkout would build notify_url = https://saoc.co.za/api/tickets/itn, PayFast would
# deliver the ITN to Joomla, and every deployed payment would sit permanently
# 'reserved'. This is a plain value, NOT a secret — an origin is public.
#
# Availability is RUNTIME only. It must NOT be BUILD: the route deliberately reads it at
# request time so App Hosting can supply it per environment, and a BUILD-time read would
# bake a value into the bundle.
#
# The value below is the App Hosting backend origin currently in use. If the backend is
# renamed or a custom domain is cut over, this value changes with it — and it must never
# be saoc.co.za until that domain actually points at this app.
- variable: SITE_URL
  value: "https://saoc-prod--saoc-webapp.europe-west4.hosted.app"
  availability:
    - RUNTIME
