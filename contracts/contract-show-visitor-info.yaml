    # ================= F6 — show-identity wiring on /national-show =================
    # The backlog P1 this addresses is PARTLY STALE: commit 32f3b0f (2026-08-06) already wired
    # title, location, hero, exhibitorStages and countdownDate, and ShowCountdown already takes
