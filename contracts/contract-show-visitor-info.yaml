    - id: A69
      description: >-
        S4 - the exhibitor-stage fallback is marked as unconfirmed, since it is scaffolding the
        committee has not signed off
      command: >-
        grep -A40 "EXHIBITOR_STAGES.map" "app/(marketing)/national-show/page.tsx" | grep -q "ConfirmationBadge"

    # ---- S3/S5: the checks themselves ----
    - id: A70
      description: >-
        S3 - the shared mutation guard exists and EVERY mutating check goes through it. A check
        that writes outside the lock reopens the interleaving hole for all the others. On
        2026-08-11 two runs interleaved, one captured the other's sentinel as its baseline,
        restored it, and left QA text rendering on a live public page while reporting clean.
      command: >-
        test -f contracts/checks/show-visitor-info/_mutation-guard.mjs &&
        for c in check-cms-round-trip check-seed-idempotent check-marker-fail-closed check-show-identity-sweep; do grep -q "withDatasetLock" "contracts/checks/show-visitor-info/$c.mjs" || { echo "$c does not take the dataset lock"; exit 1; }; grep -q "assertUsableBaseline" "contracts/checks/show-visitor-info/$c.mjs" || { echo "$c does not reject a poisoned baseline"; exit 1; }; grep -q "restoreGuarded" "contracts/checks/show-visitor-info/$c.mjs" || { echo "$c restores without a revision guard"; exit 1; }; done
    - id: A71
      description: >-
        S3 - a sentinel-shaped baseline is a hard refusal, never a value that gets restored, and
        every sentinel this contract writes shares one recognisable shape so that any check can
        detect any other check's residue
      command: >-
        grep -q "PoisonedBaselineError" contracts/checks/show-visitor-info/_mutation-guard.mjs &&
        grep -Eq "SENTINEL_PATTERN\s*=\s*/SVI-" contracts/checks/show-visitor-info/_mutation-guard.mjs &&
        grep -q "ifRevisionID" contracts/checks/show-visitor-info/_mutation-guard.mjs
    - id: A72
      description: >-
        S3 - the two seed/round-trip checks write to DIFFERENT fields, so two assertions in this
        one contract cannot collide with each other even if the lock is bypassed
      command: >-
        grep -Eq "^const FIELD = 'parking'" contracts/checks/show-visitor-info/check-cms-round-trip.mjs &&
        grep -Eq "^const FIELD = 'cloakroom'" contracts/checks/show-visitor-info/check-seed-idempotent.mjs
    - id: A73
      description: >-
        S3 - propagation timeouts have real headroom. Propagation is bounded by the Sanity CDN
        (sanity/lib/fetch.ts sets useCdn:true), not by /api/revalidate; @qa measured 64s, 72s and
        ~96s under load, so the old 180s was ~2x the worst observed, which is a coin flip.
      command: >-
        for c in check-cms-round-trip check-marker-fail-closed check-show-identity-sweep; do grep -q "POLL_TIMEOUT_MS = 240_000" "contracts/checks/show-visitor-info/$c.mjs" || { echo "$c has insufficient propagation headroom"; exit 1; }; done
    - id: A74
      description: >-
        S5 - check-faq-keyboard no longer races hydration. It passed and failed within ten
        minutes with no code change: at domcontentloaded the mid-hydration tree had 22 focusables
        including a search input absent from the settled order, and one run wrapped focus back to
        body without ever reaching a summary. The settled tab count is a stable 12, so raising
        MAX_TABS would have masked it rather than fixed it.
      command: >-
        grep -q "waitUntil: 'networkidle'" contracts/checks/show-visitor-info/check-faq-keyboard.mjs &&
        if grep -q "PATHS.faq}\`, { waitUntil: 'domcontentloaded' }" contracts/checks/show-visitor-info/check-faq-keyboard.mjs; then echo "still tabbing against a mid-hydration tree"; exit 1; fi

