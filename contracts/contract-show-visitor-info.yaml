    # ================= F7 — round 2: the assertions that can actually fail =================
    # Every check below was RED against the tree as it stood after round 2's QA. Pre-fix state
    # for each is recorded in .agent/memory/scratch/visitor-brief-2.md.

    # ---- S2: the confirmation marker must fail closed ----
    - id: A60
      description: >-
        S2 PERTURBATION - with showVisitorInfo.pendingLabel CLEARED in the live dataset, the
        confirmation markers must all still be there. Counted structurally by
        [data-confirmation-badge], an observable derived from neither the dataset nor the copy,
        so no field an editor can empty can reduce the count silently. Also asserts the inverse
        with the labels seeded: every rendered badge shows one of the two DATASET labels, which
        is the "no hardcoded label copy" claim asserted where it is observable. @qa cleared this
        one field and 23 markers vanished across four pages while every status was still pending.
      command: 'node contracts/checks/show-visitor-info/check-marker-fail-closed.mjs'
      # Measured 82s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # MUTATES + polls. Measured 82s. Worst case ~200s + the 240s lock wait.
      # Ceiling = lock wait + runtime (lock wait 420s + 165s measured through contract.py); see LOCK_WAIT_TIMEOUT_MS in _mutation-guard.mjs.
      timeout_seconds: 720
    - id: A62
      description: >-
        S2 - both confirmation label fields are required in the schema. Advisory only (Sanity
        validation does not block an API write), which is why A60 tests the component fallback
        as the load-bearing defence — but it stops the path that actually happened, an editor
        clearing the field in Studio.
      command: >-
        grep -A10 "name: 'pendingLabel'" sanity/schemas/documents/showVisitorInfo.ts | grep -q "Rule.required()" &&
        grep -A10 "name: 'researchLabel'" sanity/schemas/documents/showVisitorInfo.ts | grep -q "Rule.required()"
    - id: A63
      description: >-
        S2 FAST FENCE - ConfirmationBadge's control flow: exactly one `return null`, guarded by
        status === 'confirmed', and no bail-out on an empty label. `if (!label) return null` at
        line 44 is the entire S2 defect and it is what a grep can settle in milliseconds.
      command: >-
        [ "$(grep -c "return null" components/show/ConfirmationBadge.tsx)" -eq 1 ] &&
        grep -Eq "if \(status === 'confirmed'\) return null" components/show/ConfirmationBadge.tsx &&
        grep -q "data-confirmation-badge" components/show/ConfirmationBadge.tsx &&
        grep -q "FALLBACK_PENDING_LABEL" components/show/ConfirmationBadge.tsx &&
        grep -q "FALLBACK_RESEARCH_LABEL" components/show/ConfirmationBadge.tsx &&
        if grep -Eq "if \(!\s*label\s*\) return null" components/show/ConfirmationBadge.tsx; then echo "still bails out on an empty label"; exit 1; fi

    # ---- S1/S4/S6/S7/S8: every show-identity fact, on every surface ----
    - id: A77
      description: >-
        F1/exhibitor-F7 - nationalShow.exhibitorStages is retired COMPLETELY, not half-way. A5
        stopped asserting the field must exist, and a field that is merely dropped from one
        assertion's list while the schema, the query projection and the landing page still carry
        it is the drift this retirement exists to end — Studio would keep offering editors a box
        whose content nothing renders. Deleting the schema line without the read path is equally
        bad: the query would project a field that no longer exists. So all three go together, and
        this asserts all three. RED UNTIL @dev LANDS THE RETIREMENT — that is its purpose; it is
        the acceptance criterion for the task, not a regression.
      command: >-
        if grep -q "exhibitorStages" sanity/schemas/documents/nationalShow.ts; then echo "the schema still declares exhibitorStages"; exit 1; fi; if grep -q "exhibitorStages" sanity/queries.ts; then echo "sanity/queries.ts still projects exhibitorStages"; exit 1; fi; if grep -qE "^[^/]*exhibitorStages" "app/(marketing)/national-show/page.tsx"; then echo "the landing page still reads exhibitorStages"; exit 1; fi
      timeout_seconds: 60
    - id: A76
      description: >-
        META/S3 - the stale-copy defect class cannot be reintroduced. Three consecutive gate runs
        each produced exactly one red — A56, then A41, then A39 — because a rendered check that
        reads its needles from the dataset and fetches ONCE races whatever just wrote. Patching
        only the assertions that happened to fire moves the red to a fourth. This asserts the
        RULE structurally: a check that reads Sanity AND renders pages must hold the dataset lock,
        and if it fetches pages it must do so through settlePage(), which polls until the page
        agrees with the dataset. Three deliberate exemptions: check-reachability asserts link
        structure, which no dataset write can change; check-detects-absence calls the raw
        primitive on purpose, since proving the primitive reports absence is its whole job; and
        the MUTATING checks (identified by restoreGuarded) implement their own bespoke perturbation
        polling, which settlePage's "agree with the dataset" semantics would fight.
      command: >-
        for f in contracts/checks/show-visitor-info/check-*.mjs; do case "$f" in *check-reachability*|*check-detects-absence*) continue;; esac; grep -q "restoreGuarded" "$f" && continue; grep -q "getSanityClient" "$f" || continue; grep -q "fetchOkPage\|chromium" "$f" || continue; grep -q "withDatasetLock" "$f" || { echo "$f reads the dataset and renders pages but takes no dataset lock"; exit 1; }; if grep -q "fetchOkPage(" "$f"; then echo "$f calls fetchOkPage() directly; dataset-sourced rendered checks must fetch through settlePage()"; exit 1; fi; done
      timeout_seconds: 60
    - id: A61
      description: >-
        S1/S4/S6/S7/S8 THE VENUE-CHANGE TEST, SWEPT - the assertion this contract needed and did
        not have. Swaps the WHOLE show identity in the dataset for values the check invents at
        runtime (venue name/city/province/address, both dates, edition, host region) and unsets
        countdownDate, then sweeps home, landing, contact, archive and the three visitor pages:
        every surface must render the new values and NO surface may render any token of the old
        one. Deliberately leaves the legacy nationalShow.location holding the old venue — any
        surface that prefers it over venue.name is caught. Also proves S6: with countdownDate
        unset, nothing may render a fabricated ticking countdown or a stale edition aria-label.
        Restores under a revision guard and verifies the restore on the rendered page.
        AMENDED 2026-08-12 (team-lead rulings, @architect):
          (a) HISTORICAL CARVE-OUT. The landing page's "Past editions" list names each past
              show's own venue, and the 2018 show was legitimately held in the current venue's
              city — a constitutional record (show-identity-surfaces.golden.md row 5) that no
              Studio edit may rewrite, so the city token could never be cleared there. The city
              token is now exempted INSIDE THAT ONE <section> only, cut out structurally rather
              than by phrase window. Venue name, year, ordinal and roman edition are still swept
              across the whole page, and a stale CURRENT city anywhere outside that section
              still fails. The check asserts the section was found and that the excision stays
              under 40% of the page, so the carve-out cannot silently widen into a page-level
              exemption.
          (b) POLL, DO NOT SLEEP. The old fixed 2 x 20s warm window sometimes failed to outlast
              the one stale copy a `revalidate = 60` route serves after a write, making the
              mission's crux assertion pass or fail on timing. Each surface is now polled until
              every NEW token it must render is present, and every assertion — negatives
              included — is made against that proven-fresh response.
        Depends on the same ruling's removal of the edition ordinal from nationalShow.title.
      command: 'node contracts/checks/show-visitor-info/check-show-identity-sweep.mjs'
      # Measured 184s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # MUTATES the whole show identity + polls the CDN twice (propagation gate, then cleanup) + settles seven surfaces + drives Playwright. Measured 184s; @qa measured propagation alone at 64s/72s/96s under load, so the realistic worst case is ~400s, plus the 240s lock wait.
      # Ceiling = lock wait + runtime (lock wait 420s + 248s measured through contract.py, with room for CDN weather); see LOCK_WAIT_TIMEOUT_MS in _mutation-guard.mjs.
      timeout_seconds: 1200
    - id: A64
      description: >-
        S6/S7 - no fabricated fallback date. A hardcoded ISO date in a countdown is an INVENTED
        date presented as a live ticking fact, with no pending marker, the moment an editor
        clears countdownDate. When a show-identity fact is absent, render the absence.
      command: >-
        if grep -nE "20[0-9]{2}-[0-9]{2}-[0-9]{2}" components/show/ShowCountdown.tsx components/home/ShowBand.tsx; then echo "a fabricated fallback date remains"; exit 1; fi
    - id: A65
      description: >-
        S6/S7/S8 - no hardcoded edition ordinal on any show-identity surface. Screen-reader users
        got "Countdown to 19th National Show" from ShowCountdown's aria-label; the home page, the
        utility bar on EVERY page, and both archive pages carried the same stale edition.
      command: >-
        if grep -nE '[0-9]+(st|nd|rd|th) (National|South African|Show)' "app/(marketing)/national-show/page.tsx" "app/(marketing)/national-show/archive/page.tsx" "app/(marketing)/national-show/archive/[year]/page.tsx" components/show/ShowCountdown.tsx components/home/ShowBand.tsx components/home/Hero.tsx components/home/NavCards.tsx components/chrome/UtilityBar.tsx; then echo "a hardcoded edition ordinal remains"; exit 1; fi
    - id: A66
      description: >-
        S7/S8 - A53's shape-based month/year fence, applied to the rest of the surface inventory.
        The home page is the most-seen surface on the site and it advertised the venue, the dates
        and the host region as module constants.
      command: >-
        if grep -nE '(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[^A-Za-z]{0,10}20[0-9]{2}|20[0-9]{2}[^A-Za-z]{0,10}(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*' components/home/ShowBand.tsx components/home/Hero.tsx components/home/NavCards.tsx components/chrome/UtilityBar.tsx "app/(marketing)/national-show/archive/page.tsx" "app/(marketing)/national-show/archive/[year]/page.tsx"; then echo "a month/year literal remains on a show-identity surface"; exit 1; fi
    - id: A67
      description: >-
        S1 - the landing hero venue prefers the structured venue object over the legacy location
        string. One fact, two fields, was the whole of S1: the hero read location while the CTA
        sentence one screen below read venue.city, and @qa's swap rendered both at once.
      command: >-
