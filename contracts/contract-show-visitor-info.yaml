    - id: A51
      description: >-
        F6 - nationalShow gains the three fields that forced the remaining hardcoding (a single
        showDate cannot express a date range, which is why the Dates cell stayed literal)
      command: >-
        for f in showEndDate edition hostRegion; do grep -q "name: '$f'" sanity/schemas/documents/nationalShow.ts || { echo "missing nationalShow field $f"; exit 1; }; done
    - id: A52
      description: F6 - the new show-identity fields are seeded with setIfMissing, never force-set
      command: >-
        grep -q "showEndDate" scripts/seed-show-visitor-info.ts &&
        grep -q "edition" scripts/seed-show-visitor-info.ts &&
        grep -q "hostRegion" scripts/seed-show-visitor-info.ts &&
        if grep -Eq "\.set\(\s*\{[^}]*(edition|showDate|hostRegion)" scripts/seed-show-visitor-info.ts; then exit 1; fi
    - id: A53
      description: >-
        F6/F7 - showDate is no longer an inert field: no month/year date literal survives on the
