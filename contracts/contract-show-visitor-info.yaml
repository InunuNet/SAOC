      command: >-
        if grep -nE '(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[^A-Za-z]{0,10}20[0-9]{2}|20[0-9]{2}[^A-Za-z]{0,10}(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*' "app/(marketing)/national-show/page.tsx"; then echo "a month/year literal remains on the landing page"; exit 1; fi
    - id: A54
      description: >-
        F6/F7 - FAST FENCE ONLY: no venue literal in any show-identity surface file. Round 2
        widens the file set from two to the full inventory in show-identity-surfaces.golden.md.
        This assertion is explicitly NOT the venue-change proof — it passed in round 1 while
        /national-show rendered two different venues in one viewport, because the stale value was
        in Sanity, not in code. A61 is the proof; this just fails faster.
      command: >-
        if grep -Eiq "CTICC|Cape Town International Convention|Lower Long Street" "app/(marketing)/national-show/page.tsx" "app/(marketing)/national-show/archive/page.tsx" "app/(marketing)/national-show/archive/[year]/page.tsx" components/show/ShowCountdown.tsx components/home/ShowBand.tsx components/home/Hero.tsx components/home/NavCards.tsx components/chrome/UtilityBar.tsx; then echo "a venue literal remains"; exit 1; fi
    - id: A55
      description: >-
        F6 - the Sanity value still wins in every landing-page fallback (never 'literal' || sanityValue),
        so a published Studio edit can never be masked by a hardcoded default
      command: >-
        if grep -Eq "'[^']*'\s*(\|\||\?\?)\s*sanityShow" "app/(marketing)/national-show/page.tsx"; then echo "reversed fallback order"; exit 1; fi
    - id: A56
      description: >-
        F6 RENDERED - /national-show actually renders the dataset's title, location, hostRegion,
        edition and show-date years, marks the unconfirmed dates with the pending label, and the
        countdown (read in a real browser after hydration) is driven by the dataset countdownDate
        rather than ShowCountdown's DEFAULT_COUNTDOWN_DATE fallback
      command: 'node contracts/checks/show-visitor-info/check-show-identity-rendered.mjs'
      # Measured 3s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # HTTP plus a Playwright hydration read; cold-compile and cold-browser bound. Raised to
      # 300 because the check now polls the landing page until it has caught up with the
      # dataset (up to 150s) before asserting: it reads its needles from Sanity, so any write
      # to nationalShow races it. @dev caught this as A56 being the only red in an otherwise
      # clean gate run at 02:20 on 2026-08-12, minutes after the title changed.
