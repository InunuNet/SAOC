schema: athanor.contract/v1
slug: show-visitor-info
goal: >-
  Expand the National Show from a single teaser landing page into a visitor-information
  section. F1 builds the content model — a structured venue object on nationalShow, a new
  showVisitorInfo page singleton, a new showFaq document type, and a create-if-absent seed
  script carrying honestly-labelled placeholder content. F2–F4 build
  /national-show/plan-your-visit, /national-show/what-to-expect and /national-show/faq
  entirely from that content. F5 wires the section together so the pages are reachable by
  clicking, adds the venue block to /contact, and makes the /national-show/upcoming redirect
  permanent. Two rules override everything: changing the venue must be a Studio edit and never
  a code change (contracts/golden/show-visitor-info/venue-single-source.golden.md), and every
  unconfirmed value must carry a visible pending marker
  (contracts/golden/show-visitor-info/confirmation-status-model.golden.md).
created_at: '2026-08-11'
autonomy: high

# ---------------------------------------------------------------------------
# READ FIRST — why so many of these assertions are node scripts, not greps
# ---------------------------------------------------------------------------
# Grep-only assertions produced three false greens on this project last session: a field can
# be present in a GROQ query, mentioned in a page file, and still never reach the rendered
# HTML. Source greps below settle only what a grep can actually settle — a schema field
# exists, a seed script contains no `createOrReplace`, no venue literal appears in a new
# component. Every claim of the form "the page shows X" is settled by a real HTTP round trip
# against the dev server at http://localhost:3333 (NOT 3000, and NOT package.json's dev port
# 3002 — override with SVI_BASE_URL). Needles in those checks are read live out of the Sanity
# dataset, never hardcoded in the check, so a check cannot be satisfied by copy frozen into
# JSX that happens to match today's seed data.
#
# FOUR checks MUTATE the dataset (check-cms-round-trip, check-seed-idempotent,
# check-marker-fail-closed, check-show-identity-sweep). All four go through
# contracts/checks/show-visitor-info/_mutation-guard.mjs, and all four write to DIFFERENT
# fields. Every one: refuses to start on a sentinel-shaped baseline, holds an exclusive lock
# for the whole mutate/verify/restore window, restores under an `ifRevisionID` guard, verifies
# the restore in the dataset AND on the rendered page, and exits 2 with a RESIDUE ALERT if it
# cannot — never a bare process.exit() inside a try, which would skip the restore.
# See contracts/golden/show-visitor-info/dataset-mutation-safety.golden.md.
#
# EXIT CODES — this contract's status channel, because contract.py records pass/fail only:
#   0 = passed
#   1 = a real failure. Go and look at the code.
#   2 = RESIDUE ALERT. The dataset may be holding check data that is RENDERING LIVE. Treat as an
#       incident, not a test result.
#   3 = BLOCKED. The check never ran, because another check held the dataset lock. It tested
#       NOTHING and proves nothing either way. Re-run it; do not diagnose it. Added 2026-08-12
#       after a lock collision was reported as an ordinary FAIL and cost the team lead a
#       diagnosis of a non-problem.
#
# ---------------------------------------------------------------------------
# ROUND 2 — why several assertions were REPLACED rather than added to
# ---------------------------------------------------------------------------
# Round 1 scored 57/59 and @qa still returned FAIL, because three assertions passed while the
# rule they existed to enforce was violated. All three shared one defect: the expected value
# came from the same place as the actual value, so they could not fail.
#   A43 read pendingLabel out of the dataset and looked for it in a page that renders
#       pendingLabel from the dataset. Clearing the field emptied the NEEDLE, textContains
#       short-circuited on `target.length > 0`, and 23 vanished markers read as green.
#   A54 grepped source for a venue literal. The stale venue was in SANITY (the legacy
#       `location` field), so the grep was structurally blind to it.
#   A53 forbade the exact string "18-21 Sep 2027". The code said "Sep 18-21 2027".
# The governing rule is now contracts/golden/show-visitor-info/assertion-discrimination.golden.md:
# name the realistic state in which an assertion fails, then produce that state and watch it go
# red. Causal claims ("a Studio edit changes the site") are settled by PERTURBATION — write a
# value the check invents, sweep every surface, restore, verify — never by a source grep. Source
# greps survive only as fast fences that fail in milliseconds before the slow check runs.

features:
  - id: F1
    name: >-
      Content model — nationalShow.venue object, showVisitorInfo singleton, showFaq document
      type, supporting object types, and a create-if-absent seed script
    status: pending
  - id: F2
    name: /national-show/plan-your-visit — getting there, parking, transport, accommodation, attractions, emergency contacts
    status: pending
  - id: F3
    name: /national-show/what-to-expect — hours, admission (cross-linked to /tickets), food, photography, cloakroom, accessibility
    status: pending
  - id: F4
    name: /national-show/faq — categorised, ordered, keyboard-operable disclosure
    status: pending
  - id: F5
    name: Wiring — landing-page and section navigation, search entries, venue block on /contact, permanent upcoming redirect
    status: pending
  - id: F6
    name: >-
      Complete and PROVE the /national-show show-identity wiring — showEndDate/edition/hostRegion
      fields, the remaining hardcoded date, edition and venue literals, and the first
      rendered-level proof that the singleton actually reaches the page
    status: pending
  - id: F7
    name: >-
      Round 2 — close the three HIGH defects @qa proved against the live dataset (dual-sourced
      venue, fail-open confirmation markers, concurrency-unsafe mutating checks), extend
      show-identity single-sourcing to EVERY surface, and replace the non-discriminating
      assertions that let all of it pass
    status: pending

goldens:
  - contracts/golden/show-visitor-info/README.md
  - contracts/golden/show-visitor-info/nationalShow-venue-object.golden.json
  - contracts/golden/show-visitor-info/showVisitorInfo-schema.golden.json
  - contracts/golden/show-visitor-info/showFaq-schema.golden.json
  - contracts/golden/show-visitor-info/confirmation-status-model.golden.md
  - contracts/golden/show-visitor-info/venue-single-source.golden.md
  - contracts/golden/show-visitor-info/page-map.golden.md
  - contracts/golden/show-visitor-info/cticc-research.golden.md
  - contracts/golden/show-visitor-info/seed-show-visitor-info.golden.json
  - contracts/golden/show-visitor-info/show-identity-wiring.golden.md
  - contracts/golden/show-visitor-info/assertion-discrimination.golden.md
  - contracts/golden/show-visitor-info/dataset-mutation-safety.golden.md
  - contracts/golden/show-visitor-info/show-identity-surfaces.golden.md

assertions:
  phase: 4
  checks:
    # ================= F1 — schema =================
    - id: A1
      description: F1 - showVenue object type file exists
      command: 'test -f sanity/schemas/objects/showVenue.ts'
    - id: A2
      description: F1 - showVenue declares every venue-derived field the pages need
      command: >-
        for f in name addressLines city province postalCode latitude longitude mapsUrl mapImage mapImageAlt directionsNote phone; do grep -q "name: '$f'" sanity/schemas/objects/showVenue.ts || { echo "missing showVenue field $f"; exit 1; }; done
    - id: A3
      description: F1 - nationalShow gains a venue field of type showVenue
      command: >-
        grep -q "name: 'venue'" sanity/schemas/documents/nationalShow.ts &&
        grep -q "type: 'showVenue'" sanity/schemas/documents/nationalShow.ts
    - id: A4
      description: >-
        F1 - the legacy nationalShow.location field is kept (contracts/checks/cms-loop-f3-national-show
        mutates it in a live round-trip check) and gains a description pointing editors at the venue object
      command: >-
        grep -q "name: 'location'" sanity/schemas/documents/nationalShow.ts &&
        grep -A4 "name: 'location'" sanity/schemas/documents/nationalShow.ts | grep -qi "venue"
    - id: A5
      description: >-
        F1 - no pre-existing nationalShow field was removed while adding venue. This guards
        against COLLATERAL deletion during F1; it was never meant to prevent a deliberate,
        ruled retirement, and a grep cannot tell the two apart. AMENDED 2026-08-12:
        exhibitorStages dropped from the list so the exhibitor stream's F-7 retirement can
        land (sanity/schemas/documents/showExhibitorStep.ts:13 already records that this type
        retires it as the source of exhibitor-journey content, and the dataset confirms
        count(*[defined(exhibitorStages)]) == 0, so no content is destroyed). A5 keeps its full
        force over the other six fields, and the retirement is not merely PERMITTED but
        VERIFIED by A77 — a removal that stops halfway now fails.
      command: >-
        for f in title showDate location hero countdownDate salesOpen; do grep -q "name: '$f'" sanity/schemas/documents/nationalShow.ts || { echo "field $f was removed"; exit 1; }; done
    - id: A6
      description: F1 - showVisitorInfo page-singleton schema file exists
      command: 'test -f sanity/schemas/documents/showVisitorInfo.ts'
    - id: A7
      description: F1 - showVisitorInfo declares every copy field the three pages render
      command: >-
        for f in pendingLabel researchLabel planTitle planIntro gettingThereIntro airportRoutes parking publicTransport accommodationIntro accommodation attractions emergencyContacts expectTitle expectIntro openingHours admissionNote admissionLinkLabel food photographyPolicy cloakroom accessibility faqTitle faqIntro faqContactNote confirmations; do grep -q "name: '$f'" sanity/schemas/documents/showVisitorInfo.ts || { echo "missing showVisitorInfo field $f"; exit 1; }; done
    - id: A8
      description: F1 - confirmationStatuses object exists and covers all thirteen content blocks with the three-value list
      command: >-
        test -f sanity/schemas/objects/confirmationStatuses.ts &&
        for b in venue dates openingHours admission parking publicTransport accessibility photography cloakroom food accommodation attractions emergencyContacts; do grep -q "$b" sanity/schemas/objects/confirmationStatuses.ts || { echo "missing confirmation block $b"; exit 1; }; done &&
        grep -q "'pending'" sanity/schemas/objects/confirmationStatuses.ts &&
        grep -q "'research'" sanity/schemas/objects/confirmationStatuses.ts &&
        grep -q "'confirmed'" sanity/schemas/objects/confirmationStatuses.ts
    - id: A9
      description: F1 - every confirmation block defaults to pending, so an unset status can never read as confirmed
      command: >-
        grep -Eq "initialValue:\s*'pending'" sanity/schemas/objects/confirmationStatuses.ts &&
        if grep -Eq "initialValue:\s*'confirmed'" sanity/schemas/objects/confirmationStatuses.ts; then exit 1; fi
    - id: A10
      description: F1 - the five supporting object types exist
      command: >-
        for f in travelRoute accommodationOption attraction emergencyContact openingHoursEntry; do test -f "sanity/schemas/objects/$f.ts" || { echo "missing object type $f"; exit 1; }; done
    - id: A11
      description: >-
        F1 - accommodationOption groups by distance band and carries no price, rating or negotiated-rate
        field (SAOC has no arrangement with any property and must not appear to)
      command: >-
        grep -q "name: 'distanceBand'" sanity/schemas/objects/accommodationOption.ts &&
        for b in walking nearby city further; do grep -q "'$b'" sanity/schemas/objects/accommodationOption.ts || { echo "missing distance band $b"; exit 1; }; done &&
        if grep -Eq "name:\s*'(price|rate|rating|stars|showRate)'" sanity/schemas/objects/accommodationOption.ts; then exit 1; fi
    - id: A12
      description: F1 - showFaq document type exists with question, answer, category, order, status and active
      command: >-
        test -f sanity/schemas/documents/showFaq.ts &&
        for f in question answer category order status active; do grep -q "name: '$f'" sanity/schemas/documents/showFaq.ts || { echo "missing showFaq field $f"; exit 1; }; done
    - id: A13
      description: F1 - showFaq covers the four spec-4.17 categories plus general, and defaults to pending
      command: >-
        for c in getting-there tickets accessibility plant-sales general; do grep -q "'$c'" sanity/schemas/documents/showFaq.ts || { echo "missing category $c"; exit 1; }; done &&
        grep -Eq "initialValue:\s*'pending'" sanity/schemas/documents/showFaq.ts
    - id: A14
      description: F1 - every new type is registered in the schema index
      command: >-
        for t in showVisitorInfo showFaq showVenue travelRoute accommodationOption attraction emergencyContact openingHoursEntry confirmationStatuses; do grep -Eq "^[[:space:]]*$t,[[:space:]]*$" sanity/schemas/index.ts || { echo "$t not registered in schemaTypes"; exit 1; }; done
    - id: A15
      description: F1 - showVisitorInfo is a pinned singleton and showFaq is a listed collection in the Studio structure
      command: >-
        grep -q "'showVisitorInfo'" sanity/structure.ts &&
        grep -q "showVisitorInfo:" sanity/structure.ts &&
        grep -q "'showFaq'" sanity/structure.ts
    - id: A16
      description: F1 - GROQ queries exist for the new content, and nationalShow's query projects the venue object
      command: >-
        grep -q "showVisitorInfoQuery" sanity/queries.ts &&
        grep -q "showFaqsQuery" sanity/queries.ts &&
        grep -q "nationalShowVenueQuery" sanity/queries.ts

    # ================= F1 — seeding =================
    - id: A17
      description: F1 - a NEW seed script exists (seed-page-singletons.ts is not extended)
      command: 'test -f scripts/seed-show-visitor-info.ts'
    - id: A18
      description: >-
        F1 - seeding is create-if-absent ONLY. createOrReplace is the scripts/seed-page-singletons.ts
        bug that silently reverts editor changes on every run; it must not appear.
      command: >-
        grep -q "createIfNotExists" scripts/seed-show-visitor-info.ts &&
        if grep -q "createOrReplace" scripts/seed-show-visitor-info.ts; then exit 1; fi
    - id: A19
      description: F1 - nationalShow.venue is patched with setIfMissing, never force-set over an editor's correction
      command: >-
        grep -q "setIfMissing" scripts/seed-show-visitor-info.ts &&
        if grep -Eq "\.set\(\s*\{[^}]*venue" scripts/seed-show-visitor-info.ts; then exit 1; fi
    - id: A20
      description: F1 - the known-hazardous seed-page-singletons.ts is untouched by this feature
      command: >-
        if grep -Eq "showVisitorInfo|showFaq|showVenue" scripts/seed-page-singletons.ts; then exit 1; fi
    - id: A21
      description: F1 - no seeded field is an empty string (a blank field is indistinguishable from a bug)
      command: >-
        if grep -Eq ":\s*''|:\s*\"\"" scripts/seed-show-visitor-info.ts; then exit 1; fi
    - id: A22
      description: >-
        F1 - the seed marks confirmation status on every block and seeds both marker labels, so nothing
        ships as committee-confirmed fact
      command: >-
        grep -q "pendingLabel" scripts/seed-show-visitor-info.ts &&
        grep -q "researchLabel" scripts/seed-show-visitor-info.ts &&
        [ "$(grep -c "'pending'" scripts/seed-show-visitor-info.ts)" -ge 8 ] &&
        if grep -q "'confirmed'" scripts/seed-show-visitor-info.ts; then exit 1; fi
    - id: A23
      description: F1 - portable-text keys in seeded FAQ answers are deterministic, not random (a random key breaks idempotence)
      command: >-
        if grep -Eq "randomUUID|Math\.random|nanoid" scripts/seed-show-visitor-info.ts; then exit 1; fi
    - id: A24
      description: >-
        F1 - re-running the seed changes no document revision, creates no duplicate, and does not revert
        an editor's change (proven against the real dataset, with verified cleanup)
      command: 'node contracts/checks/show-visitor-info/check-seed-idempotent.mjs'
      # Measured 13s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # mutates nationalShow.venue + showVisitorInfo; short, but a mutating check must never be killed mid-window. Covers runtime + the 240s lock wait.
      # Ceiling = lock wait + runtime (lock wait 420s + 13s measured); see LOCK_WAIT_TIMEOUT_MS in _mutation-guard.mjs.
      timeout_seconds: 600

    # ================= F2/F3/F4 — page structure =================
    - id: A25
      description: F2/F3/F4 - the three pages and their route-level loading states exist
      command: >-
        for p in plan-your-visit what-to-expect faq; do test -f "app/(marketing)/national-show/$p/page.tsx" || { echo "missing page $p"; exit 1; }; test -f "app/(marketing)/national-show/$p/loading.tsx" || { echo "missing loading state for $p"; exit 1; }; done
    - id: A26
      description: F2/F3/F4 - all three pages are Server Components and carry the standard 60s revalidate
      command: >-
        for p in plan-your-visit what-to-expect faq; do if head -3 "app/(marketing)/national-show/$p/page.tsx" | grep -q "'use client'"; then echo "$p is a client component"; exit 1; fi; grep -Eq "export const revalidate = 60" "app/(marketing)/national-show/$p/page.tsx" || { echo "$p missing revalidate"; exit 1; }; done
    - id: A27
      description: F2/F3/F4 - the seven new show components exist
      command: >-
        for c in ConfirmationBadge VisitorInfoBlock VenueCard TravelRoutes AccommodationList ShowFaqList ShowSectionNav; do test -f "components/show/$c.tsx" || { echo "missing component $c"; exit 1; }; done
    - id: A28
      description: F2/F3/F4 - every new show component stays under the project's 150-line limit
      command: >-
        for c in ConfirmationBadge VisitorInfoBlock VenueCard TravelRoutes AccommodationList ShowFaqList ShowSectionNav; do lines=$(wc -l < "components/show/$c.tsx"); if [ "$lines" -gt 150 ]; then echo "components/show/$c.tsx exceeds 150 lines ($lines)"; exit 1; fi; done
    - id: A29
      description: >-
        F2/F3/F4 - no new CSS custom properties in the new files (Sage & Paper tokens in app/globals.css only,
        no invented brand assets)
      command: >-
        if grep -rEq -- "--[a-z-]+\s*:" "app/(marketing)/national-show/plan-your-visit" "app/(marketing)/national-show/what-to-expect" "app/(marketing)/national-show/faq" components/show 2>/dev/null; then exit 1; fi
    - id: A30
      description: F2/F3/F4 - no raw hex colour literals in the new files
      command: >-
        if grep -rEq "#[0-9a-fA-F]{3,6}\b" "app/(marketing)/national-show/plan-your-visit" "app/(marketing)/national-show/what-to-expect" "app/(marketing)/national-show/faq" components/show 2>/dev/null; then exit 1; fi
    - id: A31
      description: >-
        THE VENUE-CHANGE TEST (source half) - no venue literal anywhere in the new pages or components.
        If changing the venue would require editing one of these files, the content model is wrong.
      command: >-
        if grep -rEiq "CTICC|Cape Town International Convention|Lower Long Street|Convention Square|Foreshore|Heerengracht|-33\.9|18\.42" "app/(marketing)/national-show/plan-your-visit" "app/(marketing)/national-show/what-to-expect" "app/(marketing)/national-show/faq" components/show 2>/dev/null; then echo "a venue literal is hardcoded in a new file"; exit 1; fi
    - id: A32
      description: >-
        THE VENUE-CHANGE TEST (source half) - the /contact venue block is the same VenueCard component
        reading the same Sanity object, so it cannot drift from the show pages
      command: >-
        grep -q "VenueCard" "app/(marketing)/contact/page.tsx" &&
        if grep -rEiq "CTICC|Cape Town International Convention|Lower Long Street" "app/(marketing)/contact/page.tsx"; then exit 1; fi
    - id: A33
      description: F2 - no paid maps SDK or external maps key is introduced anywhere in the repo's dependencies or new files
      command: >-
        if grep -Eq "\"(@react-google-maps/api|mapbox-gl|react-map-gl|leaflet|@googlemaps/[a-z-]+)\"" package.json; then exit 1; fi &&
        if grep -rEq "maps\.googleapis\.com|api\.mapbox\.com|MAPS_API_KEY" "app/(marketing)/national-show" components/show 2>/dev/null; then exit 1; fi
    - id: A34
      description: F4 - the FAQ disclosure is a native details/summary element, not a hand-rolled JS accordion
      command: >-
        grep -q "<details" components/show/ShowFaqList.tsx &&
        grep -q "<summary" components/show/ShowFaqList.tsx &&
        if head -3 components/show/ShowFaqList.tsx | grep -q "'use client'"; then exit 1; fi &&
        if grep -Eq "useState|onClick" components/show/ShowFaqList.tsx; then exit 1; fi

    # ================= F5 — wiring =================
    - id: A35
      description: F5 - the show landing page links to all three new pages and to the previously-orphaned archive
      command: >-
        for p in plan-your-visit what-to-expect faq archive; do grep -q "/national-show/$p" "app/(marketing)/national-show/page.tsx" || { echo "landing page does not link to $p"; exit 1; }; done
    - id: A36
      description: F5 - the three new pages are offered by site-wide search
      command: >-
        for p in plan-your-visit what-to-expect faq; do grep -q "/national-show/$p" components/chrome/SearchOverlay.tsx || { echo "SearchOverlay missing $p"; exit 1; }; done
    - id: A37
      description: >-
        F5 - the primary header nav is deliberately NOT expanded (a six-item bar stays a six-item bar);
        reachability comes from the landing cards and the section nav instead
      command: >-
        if grep -q "/national-show/plan-your-visit" components/chrome/Header.tsx; then echo "Header NAV was expanded — see page-map.golden.md"; exit 1; fi
    - id: A38
      description: F5 - the /national-show/upcoming stub issues a permanent redirect
      command: >-
        grep -q "permanentRedirect" "app/(marketing)/national-show/upcoming/page.tsx" &&
        if grep -Eq "^import \{ redirect \}|[^t]redirect\(" "app/(marketing)/national-show/upcoming/page.tsx"; then exit 1; fi

    # ================= Rendered behaviour — real HTTP round trips =================
    - id: A39
      description: >-
        RENDERED - all three pages return 200 and actually render every seeded copy field, travel route,
        accommodation entry, attraction, emergency contact and opening-hours row (needles read live from Sanity)
      command: 'node contracts/checks/show-visitor-info/check-pages-render.mjs'
      # Measured 2s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # seven HTTP round trips; a cold Next dev-server route compile dominates and can take tens of seconds per route.
      # Now settles 3 page(s) at up to 90s each before asserting (dataset-sourced
      # needles race every writer); ceiling covers the worst case plus compile headroom.
      timeout_seconds: 420
    - id: A40
      description: >-
        RENDERED - F5 reachability: every new page is reachable by FOLLOWING LINKS from /national-show and
        from the home page, and the section cross-links both ways. A 200 response is not accepted as
        evidence — /national-show/archive returns 200 and is linked from nothing.
      command: 'node contracts/checks/show-visitor-info/check-reachability.mjs'
      # Measured 3s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # follows links across five routes; cold-compile bound, as A39.
      timeout_seconds: 180
    - id: A41
      description: >-
        THE VENUE-CHANGE TEST (rendered half) - the venue name, address lines, city, postal code and map
        link CURRENTLY STORED IN SANITY appear in the rendered HTML of /national-show/plan-your-visit and
        /contact, with no maps SDK and no API key in the markup
      command: 'node contracts/checks/show-visitor-info/check-venue-single-source.mjs'
      # Measured 1s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # two HTTP round trips; cold-compile bound.
      # Now settles 2 page(s) at up to 90s each before asserting (dataset-sourced
      # needles race every writer); ceiling covers the worst case plus compile headroom.
      # Also takes the dataset READ lock (240s wait) so it cannot observe a dataset a
      # mutating check has deliberately invalidated mid-flight.
      timeout_seconds: 420
    - id: A42
      description: >-
        THE VENUE-CHANGE TEST (causal half) - a write to the dataset provably reaches the rendered page
        (two-sided: the new value appears AND the old one disappears), with verified restore of the
        captured baseline. Exit code 2 means residue was left and must be treated as a live incident.
      command: 'node contracts/checks/show-visitor-info/check-cms-round-trip.mjs'
      # Measured 161s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # MUTATES + polls the CDN. Measured 161s: propagation 64-96s, then a polled cleanup verification. Worst case ~350s + the 240s lock wait.
      # Ceiling = lock wait + runtime (lock wait 420s + 240s measured worst case); see LOCK_WAIT_TIMEOUT_MS in _mutation-guard.mjs.
      timeout_seconds: 900
    - id: A43
      description: >-
        RENDERED - every pending block carries the dataset's pendingLabel and every research block
        carries its researchLabel, once per block. REWRITTEN in round 2: the label needles are now
        validated at the boundary (assertUsableNeedle), because the previous version derived its
        needle from the same field it was testing and went green when @qa cleared that field and
        all 23 markers disappeared. The old "ConfirmationBadge hardcodes no label text" grep is
        gone — it forbade the S2 fix; the same claim is now asserted on the rendered page by A60.
      command: 'node contracts/checks/show-visitor-info/check-confirmation-markers.mjs'
      # Measured 2s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # four HTTP round trips; cold-compile bound.
      # Now settles 5 page(s) at up to 90s each before asserting (dataset-sourced
      # needles race every writer); ceiling covers the worst case plus compile headroom.
      timeout_seconds: 600
    - id: A44
      description: >-
        RENDERED - /national-show/what-to-expect links to /tickets and duplicates none of the ticketType
        price figures (Sanity ticketType is the single source, and those prices are still provisional)
      command: 'node contracts/checks/show-visitor-info/check-no-price-duplication.mjs'
      # Measured 2s on 2026-08-12. Without this line contract.py applies its 60s
      # default (execution/contract.py:254) and SIGKILLs the check mid-run.
      # cold-compile bound.
