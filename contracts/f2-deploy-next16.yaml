autonomy: high

features:
  - id: F2
    name: Deploy Next 16 to Firebase App Hosting and verify production
    status: pending

goldens: []

assertions:
  phase: 4
  checks:
    # ---------- A1 — PRIMARY: home page reaches real users hydration-clean ----------
    - id: A1
      description: >-
        The deployed home page (saoc-prod--saoc-webapp.europe-west4.hosted.app/) produces
        zero page errors and zero hydration-mismatch console errors under a throttled load.
        FAILED against the pre-deploy baseline (see header) with React error #418 — must
        flip to PASS once F1 is live. Never skips green on a broken environment; unreachable
        host or browser-launch failure is a hard FAIL (Athanor#1322).
      command: node contracts/checks/f2-deploy-next16/no-hydration-error-deployed.mjs

    # ---------- A2 — PRIMARY: the actual P0 — Studio document pane on prod ----------
    - id: A2
      description: >-
        The deployed /studio opens the F3-pinned homePage singleton document editor (fields
        + Publish control) with zero page errors and without parking on the login screen.
        Exercises the exact crash site (DocumentPaneInner/useResetHistoryParams) that the
        Studio shell alone does not reach. FAILED against the pre-deploy baseline (stock list
        view, no F3 structure) — must flip to PASS once F2+F3 are live. Requires
        SANITY_API_TOKEN (from .env.local or the environment) to authenticate; missing token
        is a hard FAIL, never a skip (Athanor#1322).
      command: node contracts/checks/f2-deploy-next16/studio-document-pane-deployed.mjs

    # ---------- A3-A4 — env var gap closure (config correctness, not deployed-site checks) ----------
    - id: A3
      description: >-
        apphosting.yaml declares SANITY_REVALIDATE_SECRET as a RUNTIME secret, closing the
        gap that leaves app/api/draft/route.ts and app/api/revalidate/route.ts fail-closed
        in prod today.
      command: >-
        grep -A2 "variable: SANITY_REVALIDATE_SECRET" apphosting.yaml | grep -q "secret:
        SANITY_REVALIDATE_SECRET"

    - id: A4
      description: >-
        apphosting.yaml declares SANITY_API_TOKEN as a RUNTIME secret, closing the gap that
        leaves app/api/events/submit/route.ts's public event-submission write client
        fail-closed in prod today.
      command: >-
        grep -A2 "variable: SANITY_API_TOKEN" apphosting.yaml | grep -q "secret:
        SANITY_API_TOKEN"

    # A5/A6 (RESEND_API_KEY / RESEND_FROM_ADDRESS) intentionally NOT included — see goal's
    # "Deliberately deferred" note. No Resend account exists yet, so no Secret Manager value
    # exists to reference; declaring a `secret:` ref to a nonexistent secret would fail the
    # whole App Hosting rollout. Tracked in .agent/memory/project/backlog.md, "Blocked
    # (awaiting Brad)" — a follow-up feature adds this once Brad signs up for Resend.

    # ---------- A7 — build-memory precaution ----------
    - id: A7
      description: >-
        runConfig.memoryMiB raised from 512 to at least 1024 as a preventive measure against
        Turbopack build-memory pressure (flagged as a live, unconfirmed-either-way risk in
        docs/f2-apphosting-next16-compat.md #8).
      command: >-
        grep -qE "memoryMiB: (1[0-9]{3}|[2-9][0-9]{3})" apphosting.yaml

    # ---------- A8 — secondary freshness reinforcement (WEAK — see A10) ----------
    - id: A8
      description: >-
        WEAK EVIDENCE, kept only as a cheap smoke signal — do not treat a passing A8 as
        proof of anything about which commit is live. The deployed home page's ETag
        differing from the pre-deploy baseline ("176ebrtkypf1pnd") was intended as a
        freshness reinforcement, but the etag has since been observed to change
        ("a8e4pxlfw41lfq" -> "1337qsztbrz1lfq") with NO confirmed rollout in between —
        ISR prerender regeneration changes it too, independent of a real redeploy. A10 is
        the actual, decisive build-identity check; A1/A2 remain the real proof of F1/F3
        substance via behaviour, not metadata.
      command: node contracts/checks/f2-deploy-next16/etag-changed-deployed.mjs

    # ---------- A9 — PRIMARY: positive-path secret resolution (the actual defect) ----------
    - id: A9
      description: >-
        On the deployed host, POST /api/revalidate with the CORRECT x-sanity-secret must
        return 200, while a wrong secret and an absent secret must each still return 401 —
        all three conditions checked in one run so weakening the auth guard (e.g. removing
        it) cannot pass this check. Also checks GET /api/draft?secret=<correct>&slug=/
        returns a 3xx redirect (not followed), while wrong/absent secret still return 401.
        This is the assertion the original six missed: every prior check exercised only the
        negative path, so a green gate certified a feature where draft-mode preview and
        Sanity webhook revalidation were completely dead in prod. FAILED against the LIVE
        2026-07-30 baseline (see this contract's header) with 401 for the correct secret on
        both routes — a genuine, currently-reproducible production defect, not a stale
        baseline. Reads the secret via `grep '^SANITY_REVALIDATE_SECRET=' .env.local | cut
        -d= -f2-` (never `node -e "require('dotenv')..."` — the dotenv banner pollutes
        stdout and silently corrupts the header value) and asserts it is exactly 43 chars
        before use; the value itself is never logged or printed. Unreachable host, missing
        secret, or a browser/fetch failure is a hard FAIL, never a SKIP (Athanor#1322).
      command: node contracts/checks/f2-deploy-next16/positive-path-secret-resolution-deployed.mjs

    # ---------- A10 — build-identity discriminator (resolves the df5ee43 contradiction) ----------
    - id: A10
      description: >-
        Proves which commit is ACTUALLY serving 100% of production traffic right now, using
        the control plane as the source of truth instead of rendered-page inference. Cross-
        checks two independent APIs: (1) App Hosting's backend traffic split names exactly
        one build at 100% (a split/canary state is a hard FAIL — partial traffic proves
        nothing about what a given request will see); (2) the underlying Cloud Run
        service's latestReadyRevision and its sole >0%-traffic entry agree with that same
        build. Then reads that build's source.codebase.hash and asserts, via `git
        merge-base --is-ancestor <sha> <hash>`, that it descends from all three of
        604ba3a (F1), ffb4225 (F3), and 84dbf58 (F2/apphosting.yaml). Supersedes ETag (A8,
        demoted to weak) and supersedes trusting a single build-resource inspection in
        isolation, which is exactly what produced the prior session's df5ee43-vs-Studio
        contradiction recorded in .agent/memory/project/backlog.md. Authenticates by
        reusing the Firebase CLI's own cached OAuth token from
        ~/.config/configstore/firebase-tools.json (same mechanism
        docs/f2-secret-runtime-investigation.md already proved works) — an expired/missing
        token, an unreachable API, or a target SHA unknown even after `git fetch origin` is
        a hard FAIL, never a SKIP (Athanor#1322).
      command: node contracts/checks/f2-deploy-next16/build-identity-deployed.mjs
