    # --- F24: approval mints a code ---
    - id: A50
      description: >-
        PROMOTED to phase 4 2026-09-01 (architect pass 3) -- F24 is now implemented; also
        SUPERSEDES A20 (see A20's retirement note). UPDATED 2026-09-01 (architect pass 5,
        team-lead review, post-Codex). The 'approve' action in POST
        /api/admin/vendors/applications/[id]/review generates the code BEFORE any write and
        persists registrationCodeId/registrationCodeNameSlug/registrationCodeIssuedAt/
        registrationCodeExpiresAt in the SAME, single additive ref.update() call as F5's
        existing 3-key decision (never a separate, laggable write -- proving more than A20 ever
        could, since A20's M1 shape used two separate update calls), and -- behaviourally, via a
        real call to sendVendorApprovalConfirmationEmail() -- the approval email renders the
        code digit-grouped ("4 8 2 1"), never as an unbroken 4-digit run.

        THIS ASSERTION WAS GREEN OVER A REAL DEFECT: Codex found that F24 moved the vendor's
        actual redemption dependency (VENDOR_REGISTRATION_TOKEN_SECRET, needed by
        POST /api/vendors/register/verify-code to mint the session cookie) to a DIFFERENT file
        without carrying forward a precondition check -- an approval could commit, the code
        would be emailed, and every redemption attempt would fail forever behind the
        (deliberately) generic 403, with the operator seeing nothing wrong. This is the M1
        dead-end (A20's original concern) reincarnated in a new file, precisely because A50's
        original form asserted "code generated before ref.update()" -- a fact about the OLD
        implementation's SHAPE that happened to still be true, not the actual property ("nothing
        the vendor needs to redeem the credential may be unverified before the application
        leaves pending"). A per-instance patch ("and also check the secret") would have the same
        blind spot the next time a precondition moves file -- which is what just happened once
        already. So this is now EXPRESSED AS A GENERAL, MECHANICALLY-EXTRACTED INVARIANT (A42
        spirit, per the team lead's explicit direction), not a named instance: a second script,
        check-redemption-preconditions-verified-before-approval-commits.mjs, performs static
        analysis of the REAL redemption route (app/api/vendors/register/verify-code/route.ts) to
        extract (a) every `process.env.NAME` reference there guarded by an `if (!x) { ...
        return }` refusal, and (b) every Firestore `.where('field', '==', expr)` in its
        candidate lookup where `expr` is a vendor-input-derived variable, not a constant literal
        -- then asserts the approval route's 'approve' branch references each such env var name,
        and guards-for-truthiness the exact expression it writes for each such match-key field,
        before its commit. This is DATA-driven, not hardcoded to
        VENDOR_REGISTRATION_TOKEN_SECRET/registrationCodeNameSlug by name -- a future
        precondition added to (or moved into) the redemption route, of either shape, is picked
        up automatically. Verified non-vacuous by independently reverting each of @dev's two
        fixes (the secret precheck, and the empty-slug precheck it additionally found while
        fixing the first) and confirming the new script fails on each, with the correct message,
        before restoring.

        STATED LIMITATION, told plainly rather than glossed over (per the team lead's ask):
        this general form only sees preconditions expressed as (a) an env-var refusal guard or
        (b) a vendor-input-derived Firestore `.where()` equality match, BOTH inside the one
        redemption route file this script reads. A precondition enforced a different way --
        inside a transitively-imported helper rather than the route itself, via a non-`.where()`
        Firestore query shape (e.g. `.get()` + in-memory filter), via a third file the
        redemption path calls into, or via infrastructure outside this route entirely (a Cloud
        Scheduler job, a Storage bucket policy) -- would still slip past this check. Widening
        the scan to the redemption route's transitive imports, or to non-`.where()` filter
        shapes, is future work if either pattern is ever used.
