    # --- F30/F31: transactional idempotency, doc-id-as-submission-id ---
    - id: A60
      description: >-
        Behavioural, via the route-runner harness. Two concurrent POST .../initiate calls for
        the SAME vendorSubmissionId (simulated as two overlapping transaction attempts against
        the shared in-memory Firestore fixture) result in exactly ONE vendorStandOrders
        document (id === vendorSubmissionId), never two, and never a duplicate-key/collision
        error surfacing to either caller as an unhandled 500. A second, LATER initiate call
        after the first succeeded but before payment (a legitimate retry/boothSize change)
        overwrites the SAME document's boothSize/amount/standOrderRef rather than creating a
        second document. A third initiate call attempted AFTER the order reaches 'paid'
        (settled via a fixture ITN in between) is refused ("already paid"), and the paid
        document is left completely unmodified (byte-identical snapshot before/after the
        refused call).
        FAILS ON: two documents existing for one vendorSubmissionId, a re-initiate before
        payment creating a second document instead of overwriting, or any field on an
        already-'paid' order changing as a result of a post-payment initiate attempt.
      command: >-
        NODE_OPTIONS="--require $PWD/contracts/harness/route-runner/preload.cjs" npx tsx contracts/checks/vendor-gated-registration-flow-m3/check-initiate-is-transactionally-idempotent.mjs

    # --- F31: settlement -- duplicate notification, cross-gateway, amount tamper ---
    - id: A61
      description: >-
        Behavioural, via the route-runner harness -- the exact "exercise the real transaction
        with two duplicate notifications and a tampered amount" proof the golden's closing
        paragraph on A50's own history calls for. Three fixture scenarios against a single
        'pending' vendorStandOrders doc created via a real F30 initiate call: (1) the SAME
        (valid, correctly-signed) notification delivered TWICE -- first call settles
        (status:'paid', paidAt set, gatewayPaymentId recorded, and
        vendorSubmissions.paymentReceived flips to true in the SAME transaction), second call
        no-ops (200, zero additional writes -- proven by a write-count fixture, not just by
        re-reading the same final state); (2) a correctly-signed notification whose
        grossAmountCents does NOT match Math.round(order.amount * 100) -- refused, order stays
        'pending', vendorSubmissions.paymentReceived stays unset; (3) a correctly-signed
        PayFast-shaped notification delivered to the ROUTE for an order whose stored
        `gateway` is 'ozow' (and the mirrored Ozow-notification-against-a-PayFast-order case)
        -- refused by the cross-gateway guard in both directions, order stays 'pending'.
        FAILS ON: a second identical notification producing a second write of any kind (even a
        no-op field re-set counts as a defeat -- the check must observe zero Firestore write
        calls on the duplicate, not just an unchanged final value), a tampered-amount
        notification settling the order, either direction of the cross-gateway case settling
        the order, or vendorStandOrders and vendorSubmissions ending up in a state where one
        says paid and the other doesn't (partial-write proof, both must move together or
        neither moves).
      command: >-
        NODE_OPTIONS="--require $PWD/contracts/harness/route-runner/preload.cjs" npx tsx contracts/checks/vendor-gated-registration-flow-m3/check-settlement-idempotent-and-guarded.mjs

    # --- F27/F30: token is state-gated, not merely cryptographically valid ---
    - id: A62
      description: >-
        Behavioural, via the route-runner harness. A cryptographically valid, non-expired
        stand-payment token minted while a submission was 'approved' is refused (generic 403,
        matching M1's enumeration-blindness posture -- same message text for every refusal
        reason in this route) when presented to POST .../initiate AFTER the submission's
        status has since changed to anything other than 'approved' (fixture: flip to
        'rejected' between mint and use) -- proving the route re-reads current state on every
        call rather than trusting a state snapshot implied by successful token verification.
        A second scenario: a valid token for a submission whose vendorStandOrders doc is
        ALREADY 'paid' is refused with the "already paid" message, not a generic token-invalid
        message (the two failure classes are allowed to differ from each other, per the
        golden -- only the WITHIN-class messages must stay generic).
        FAILS ON: the initiate route accepting a valid token without re-reading the
        submission's current status, or refusing an against-a-different-application token with
        the SAME message text used for "already paid" (proving the check can tell the two
        code paths apart, not merely that both refuse).
      command: >-
        NODE_OPTIONS="--require $PWD/contracts/harness/route-runner/preload.cjs" npx tsx contracts/checks/vendor-gated-registration-flow-m3/check-token-state-gated-not-snapshot.mjs

