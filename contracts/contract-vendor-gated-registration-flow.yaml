  # ---------------------------------------------------------------------------------------
  # M4 -- ARCHITECTED 2026-08-31/09-01 (architect pass 3). Replaces M1/F3+F7's opaque HMAC
  # link with a human-readable "{BusinessName}-{4 digits}" code (Brad, 2026-08-31), engineered
  # so a 4-digit code is safe by construction: per-application transactional lockout, a
  # secondary per-IP throttle, CSPRNG generation, constant-time comparison, and an
  # enumeration-blind verify response. Full decision record, threshold reasoning, the POPIA
  # finding (the full form does NOT prefill from the application -- verified, not assumed), and
  # the migration decision (replace the vendor-facing mechanism outright; REUSE, don't rewrite,
  # F3's HMAC module as the internal post-verification session artifact):
  # contracts/golden/vendor-gated-registration-flow-m4/README.md.
  # ---------------------------------------------------------------------------------------
  - id: F22
    name: >-
      Core mechanism, no I/O. New lib/vendor-registration-code.ts: normalizeVendorCodeName()
      (deterministic slug -- lowercase, NFD-strip accents, strip every non-alphanumeric
      character; see the golden's normalisation table), generateVendorRegistrationCodeId()
      (zero-argument, node:crypto randomInt(0, 10000), zero-padded to 4 digits -- never
      sequential, never derived from applicationId), VENDOR_REGISTRATION_CODE_LOCK_THRESHOLD =
      5 and VENDOR_REGISTRATION_CODE_DEFAULT_TTL_MS (reuses the same 14-day value as
      VENDOR_REGISTRATION_TOKEN_DEFAULT_TTL_MS), verifyVendorRegistrationCode() (pure function
      over caller-supplied candidates, constant-time code comparison reusing
      constantTimeEqual from lib/recovery-token.ts, returns {ok:true, applicationId} or a
      single {ok:false} shape identical across every failure reason -- no such name slug,
      wrong code, locked, consumed, expired, not-approved), and
      recordFailedVendorRegistrationCodeAttempt() (transactional, same
      db.runTransaction()-wrapped read-check-write shape as
      lib/vendor-registration-token-claim.ts's claimRegistrationToken(), increments
      registrationCodeFailedAttempts and sets registrationCodeLockedAt on crossing the
      threshold, race-safe under concurrent failed attempts). Also extends types/index.ts's
      VendorApplication with registrationCodeId/registrationCodeNameSlug/
      registrationCodeIssuedAt/registrationCodeExpiresAt/registrationCodeConsumedAt/
      registrationCodeFailedAttempts/registrationCodeLockedAt (all optional, additive) --
      registrationTokenIssuedAt/Expires/ConsumedAt stay on the type, deprecated-in-place, not
      removed.
    status: pending
    milestone: M4
    contract: contracts/golden/vendor-gated-registration-flow-m4/README.md
  - id: F23
    name: >-
      Public verify + gate. New pure handler lib/vendor-registration-code-verify-handler.ts,
      handleVendorRegistrationCodeVerification(input, deps) -- same injected-deps shape as
      lib/vendor-registration-handler.ts (F5/M1), so rate-limit-shields-I/O and response-shape
      are provable without a Firestore instance -- called by new route POST
      /api/vendors/register/verify-code: accepts {businessName, codeId} (two structured fields,
      not one parsed string -- see the golden's "Format" section for why), rate-limits by IP
      first (reusing decideRateLimit() via a new vendor-register-code-verify-ip:* key
      namespace, 10/hour -- mirrors lib/vendor-registration-rate-limit.ts's existing pattern, a
      new sibling module/constants, not a mutation of the F5/M1 register-route limiter), runs
      ONE Firestore query by
      registrationCodeNameSlug + status=='approved' regardless of outcome (no query-skipping
      branch -- see "Enumeration blindness"), calls F22's verifyVendorRegistrationCode() against
      every candidate, and on success mints F3's mintVendorRegistrationToken() with a SHORT
      ttlMs override (30 minutes, not the 14-day default) as an internal session artifact,
      delivered via an HttpOnly cookie -- NEVER in the JSON response body (POPIA finding: the
      response body is byte-identical in shape on success ({ok:true}) and failure (the one
      generic error string), never containing any VendorApplication field). On failure, calls
      F22's recordFailedVendorRegistrationCodeAttempt() against every matched candidate.
      app/(marketing)/national-show/vendors/register/page.tsx is rewritten: no longer reads a
      `?token=` search param as its gate (F7/M1's mechanism is retired at the page level, not
      deleted at the module level -- see F22's note); instead renders a two-field code-entry
      form (business name + 4-digit code) that POSTs to verify-code, prefillable from
      `?name=&code=` query params carried by the approval email's convenience link, but always
      requiring an explicit submit through the rate-limited endpoint. POST /api/vendors/register
      (F7/M1's existing route) stops accepting a vendor-typed token/code in its body and instead
      re-verifies the session cookie via F3's verifyVendorRegistrationToken(), unchanged --
      F7's already-proven single-use claim transaction (lib/vendor-registration-token-claim.ts)
      is reused without modification.
    status: pending
    milestone: M4
    contract: contracts/golden/vendor-gated-registration-flow-m4/README.md
  - id: F24
    name: >-
      Approval mints a code, not a token. POST /api/admin/vendors/applications/[id]/review's
      'approve' action (F5/M1) stops calling mintVendorRegistrationToken() at approval time;
      instead generates registrationCodeId (F22's generateVendorRegistrationCodeId()) +
      registrationCodeNameSlug (F22's normalizeVendorCodeName(businessName)), writes them plus
      registrationCodeIssuedAt/registrationCodeExpiresAt in the same additive ref.update()
      patch F5 already uses (mint-before-commit ordering unchanged -- a failed generation still
      leaves the application pending and recoverable, same fail-closed rule as F5's own token
      minting). lib/vendor-approval-confirmation.ts's VendorApprovalConfirmationInput and
      emails/VendorApprovalConfirmation.tsx gain the code, read-aloud formatted (digits
      space- or hyphen-grouped, e.g. "4 8 2 1", never run together), plus the new
      ?name=&code= convenience link -- replacing, not adding alongside, the old token-bearing
      registrationLink prop shape (same optional-prop pattern F6 established, still a single
      prop rename/repurpose, not a new required prop).
    status: pending
    milestone: M4
    contract: contracts/golden/vendor-gated-registration-flow-m4/README.md
  - id: F25
    name: >-
      Admin visibility + reissue. VendorApplicationReviewTable.tsx gains a "Code" column
      (registrationCodeId, or "--" pre-approval) and a locked badge when
      registrationCodeLockedAt is set. New POST
      /api/admin/vendors/applications/[id]/reissue-code, gated identically to the existing
      review route (getAdminSession() -> hasCapability(..., 'review-vendor-applications', ...)),
      available any time status === 'approved' (not conditioned on being locked): mints a fresh
      registrationCodeId, resets registrationCodeFailedAttempts to 0 and
      registrationCodeLockedAt to null, refreshes registrationCodeIssuedAt/
      registrationCodeExpiresAt -- one operator action covers both "vendor is locked out" and
      "vendor lost the email" (see the golden's "Reissue, not unlock"). No separate unlock
      action exists.
    status: pending
    milestone: M4
    contract: contracts/golden/vendor-gated-registration-flow-m4/README.md

goldens:
  - contracts/golden/vendor-gated-registration-flow-f1/README.md
  - contracts/golden/vendor-gated-registration-flow-f1/vendor-application-categories.expected.ts.txt
  - contracts/golden/vendor-gated-registration-flow-f1/vendor-application-review-transitions.expected.ts.txt
  - contracts/golden/vendor-gated-registration-flow-m2/README.md
  - contracts/golden/vendor-gated-registration-flow-m2/vendor-categories-14.expected.ts.txt
  - contracts/golden/vendor-gated-registration-flow-m2/removed-field-ledger.expected.md
  - contracts/golden/vendor-gated-registration-flow-m4/README.md
  - contracts/golden/vendor-gated-registration-flow-m4/vendor-registration-code-name-normalization.expected.md

assertions:
  phase: 4
  checks:
    # --- F1: data model ---
    - id: A1
      description: >-
        VendorApplication/VendorApplicationStatus/VendorApplicationCategory/
        VendorApplicationDraft are defined in types/index.ts, and VendorApplicationDraft
        structurally excludes every system-owned field (status, submittedAt, reviewedBy,
        reviewedAt, registrationTokenIssuedAt, registrationTokenExpiresAt,
        registrationTokenConsumedAt) -- same pattern as the existing VendorSubmissionDraft.
        FAILS ON: any of these types missing, or VendorApplicationDraft's own type body
        containing a 'status' field (would let a submitter smuggle their own status).
      command: >-
        grep -q "VendorApplicationStatus" types/index.ts && grep -q "VendorApplicationCategory" types/index.ts && grep -q "VendorApplicationDraft" types/index.ts && ! sed -n '/interface VendorApplicationDraft/,/^}/p' types/index.ts | grep -q "status:"
    - id: A2
      description: >-
        lib/vendor-applications.ts's VENDOR_APPLICATION_CATEGORIES constant matches the golden
        exactly -- all 14 members, exact order, exact spelling, no 'other' member.
        FAILS ON: any member added, removed, reordered, or misspelled relative to the golden.
      command: >-
        diff <(sed -n '/const VENDOR_APPLICATION_CATEGORIES/,/^\];/p' lib/vendor-applications.ts) <(sed -n '/const VENDOR_APPLICATION_CATEGORIES/,/^\];/p' contracts/golden/vendor-gated-registration-flow-f1/vendor-application-categories.expected.ts.txt)
    - id: A3
      description: >-
        lib/vendor-applications.ts exports VENDOR_APPLICATIONS_COLLECTION = 'vendorApplications'
        (a genuinely new, separate collection -- not a reuse of VENDOR_SUBMISSIONS_COLLECTION),
        and does not import lib/admin-auth.ts or lib/admin-roles.ts (authorization-blind, same
        rule as lib/vendor-submissions.ts).
        FAILS ON: the collection name missing/wrong, or an admin-auth/admin-roles import present.
      command: >-
        grep -q "VENDOR_APPLICATIONS_COLLECTION = 'vendorApplications'" lib/vendor-applications.ts && ! grep -qE "from '@/lib/admin-(auth|roles)'" lib/vendor-applications.ts

    # --- F2: review machine ---
    - id: A4
      description: >-
        lib/vendor-application-review.ts's TRANSITIONS table matches the golden exactly --
        pending maps to {approve: approved, decline: declined} and nothing else.
        FAILS ON: any extra transition, missing transition, or a different next-status.
      command: >-
        diff <(sed -n '/const TRANSITIONS/,/^};/p' lib/vendor-application-review.ts) <(sed -n '/const TRANSITIONS/,/^};/p' contracts/golden/vendor-gated-registration-flow-f1/vendor-application-review-transitions.expected.ts.txt)
    - id: A5
      description: >-
        Behavioral, real execution (mirrors lib/vendor-review.ts's own proof style): every legal
        transition succeeds with an additive-only 3-key patch; every transition from a terminal
        state (approved/declined) is refused; an unknown action is refused.
        FAILS ON: any legal transition refused, any illegal transition allowed, or a patch
        containing keys beyond status/reviewedBy/reviewedAt.
      command: node --import tsx/esm contracts/checks/vendor-gated-registration-flow/check-application-review-transitions.mjs

    # --- F3: token security ---
    - id: A6
      description: >-
        lib/vendor-registration-token.ts imports constantTimeEqual FROM lib/recovery-token.ts
        (reuse, not a redefinition) and is signed by a distinct env var,
        VENDOR_REGISTRATION_TOKEN_SECRET -- never RECOVERY_TOKEN_SECRET.
        FAILS ON: constantTimeEqual redefined locally instead of imported, or
        RECOVERY_TOKEN_SECRET referenced anywhere in this file.
      command: >-
        grep -q "constantTimeEqual" lib/vendor-registration-token.ts && grep -qE "import.*constantTimeEqual.*from ['\"]\./recovery-token['\"]" lib/vendor-registration-token.ts && grep -q "VENDOR_REGISTRATION_TOKEN_SECRET" lib/vendor-registration-token.ts && ! grep -q "RECOVERY_TOKEN_SECRET" lib/vendor-registration-token.ts
    - id: A7
      description: >-
        Behavioral, real crypto (mirrors contracts/checks/ticketing-f6-recovery-token/check-
        forgery-resistance.mjs's method exactly): real-secret round trip succeeds; every
        guessed-secret forgery strategy fails; an expired token is refused with reason
        'expired'; a lib/recovery-token.ts order-recovery token does NOT verify as a vendor
        registration token even under a shared secret (domain separation).
        FAILS ON: any forgery succeeding, expiry not enforced, or cross-domain token reuse
        succeeding.
      command: node --import tsx/esm contracts/checks/vendor-gated-registration-flow/check-registration-token-security.mjs
    - id: A8
      description: >-
        VENDOR_REGISTRATION_TOKEN_SECRET is documented in .env.local.example (so a fresh
        deploy doesn't silently fall back to an undefined secret).
        FAILS ON: the env var absent from .env.local.example.
      command: grep -q "VENDOR_REGISTRATION_TOKEN_SECRET" .env.local.example

    # --- F4: public application route + page ---
    - id: A9
      description: >-
        POST /api/vendors/apply exists, imports buildVendorApplication/
        validateVendorApplicationInput from lib/vendor-applications.ts, and writes with
        status 'pending' -- never accepting a caller-supplied status (VendorApplicationDraft
        structurally forbids it per A1, but the route itself must also never assign anything
        other than the literal 'pending').
        FAILS ON: the route missing, not importing the F1 builder/validator, or status not
        hardcoded to 'pending'.
      command: >-
        test -f app/api/vendors/apply/route.ts && grep -q "buildVendorApplication" app/api/vendors/apply/route.ts && grep -q "'pending'" app/api/vendors/apply/route.ts
    - id: A10
      description: >-
        The public application page exists at app/(marketing)/national-show/vendors/apply/
        page.tsx and its form posts to /api/vendors/apply, collecting vendorCategory as a
        checkbox group sourced from F1's 14-item VENDOR_APPLICATION_CATEGORIES (not the
        unrelated 11-item VENDOR_CATEGORIES).
        FAILS ON: the page missing, posting to a different endpoint, or sourcing options from
        VENDOR_CATEGORIES instead of VENDOR_APPLICATION_CATEGORIES.
      command: >-
        test -f "app/(marketing)/national-show/vendors/apply/page.tsx" && grep -rq "/api/vendors/apply" "app/(marketing)/national-show/vendors/apply" components/vendors && grep -rq "VENDOR_APPLICATION_CATEGORIES\|VendorApplicationCategory" components/vendors

    # --- F5: admin application review ---
    - id: A11
      description: >-
        GET /api/admin/vendors/applications and POST /api/admin/vendors/applications/[id]/
        review both call getAdminSession() THEN hasCapability(..., 'review-vendor-
        applications', ...) with an awaited resolveShowWindowLookup() result -- same gate
        wiring as the existing app/api/admin/vendors/route.ts, no new capability invented.
        FAILS ON: either route missing the gate, gating on a different/new capability string,
        or hasCapability called without a real resolveShowWindowLookup() result.
      command: >-
        grep -q "getAdminSession" app/api/admin/vendors/applications/route.ts && grep -q "'review-vendor-applications'" app/api/admin/vendors/applications/route.ts && grep -q "resolveShowWindowLookup" app/api/admin/vendors/applications/route.ts && grep -q "getAdminSession" "app/api/admin/vendors/applications/[id]/review/route.ts" && grep -q "'review-vendor-applications'" "app/api/admin/vendors/applications/[id]/review/route.ts"
    - id: A12
      description: >-
        REWRITTEN 2026-09-01 (architect pass 3, M4). The original form asserted the M1 token
        mechanism (mintVendorRegistrationToken + a registrationLink prop) -- both went stale as
        DIRECT, EXPECTED collateral of F24 replacing that mechanism outright with a
        human-readable code (see the M4 golden README's "Migration": the vendor-facing
        mechanism is replaced, not run alongside). The property this assertion protects is
        unchanged and still matters: the review-transition decision is delegated to
        decideVendorApplicationTransition (F2), never reimplemented inline, and the approve
        action mints a registration credential (now F22's generateVendorRegistrationCodeId(),
        not F3's mintVendorRegistrationToken) and sends it via
        sendVendorApprovalConfirmationEmail (F6, extended) -- now as registrationCode, not
        merely a registrationLink.
        FAILS ON: the route reimplementing the pending/approved/declined logic itself instead
        of calling decideVendorApplicationTransition, approve not calling
        generateVendorRegistrationCodeId, approve still calling the retired
        mintVendorRegistrationToken, or the email call not passing registrationCode.
      command: >-
        grep -q "decideVendorApplicationTransition" "app/api/admin/vendors/applications/[id]/review/route.ts" && grep -q "generateVendorRegistrationCodeId" "app/api/admin/vendors/applications/[id]/review/route.ts" && grep -q "registrationCode:" "app/api/admin/vendors/applications/[id]/review/route.ts" && ! grep -q "mintVendorRegistrationToken" "app/api/admin/vendors/applications/[id]/review/route.ts"
    - id: A13
      description: >-
        ref.update() is used for both the F2 decision patch and the token-issued-timestamps
        patch -- never a full-document overwrite (ref.set() without merge) that could wipe
        other VendorApplication fields.
        FAILS ON: any ref.set( call in this route not passing { merge: true }.
      command: >-
        ! grep -qE "ref\.set\(" "app/api/admin/vendors/applications/[id]/review/route.ts" || grep -qE "ref\.set\([^)]*\{\s*merge:\s*true" "app/api/admin/vendors/applications/[id]/review/route.ts"

    # --- F6: email extension, regression-safe ---
    - id: A14
      description: >-
        VendorApprovalConfirmationInput (lib/vendor-approval-confirmation.ts) and its email
        component's props (emails/VendorApprovalConfirmation.tsx) both gain an optional
        registrationLink field, and the EXISTING call site
        (app/api/admin/vendors/[id]/review/route.ts) is unchanged -- it still never passes
        registrationLink, proving F5/F6 did not have to touch the already-shipped full-
        registration approval path.
        FAILS ON: registrationLink missing from either the input interface or the component
        props, or the existing review route now passing registrationLink (would mean it was
        edited when the brief says leave it as-is).
      command: >-
        grep -q "registrationLink" lib/vendor-approval-confirmation.ts && grep -q "registrationLink" emails/VendorApprovalConfirmation.tsx && ! grep -q "registrationLink" app/api/admin/vendors/[id]/review/route.ts
    - id: A15
      description: >-
        Regression: the existing vendor-f8-approval-email contract's own typecheck fixture
        still compiles after F6's edit (proves the extension is additive, not a breaking
        signature change to the fields the F8 golden already depends on).
        FAILS ON: any TypeScript error in the existing fixture.
      command: npx tsc --noEmit -p contracts/checks/vendor-f8-approval-email/tsconfig.typecheck.json

    # --- F7: gate on the full registration route ---
    - id: A16
      description: >-
        REWRITTEN 2026-09-01 (architect pass 3, M4). The original form asserted a public
        `?token=` search-param gate and a literal "invalid or has expired" fallback message --
        both retired at the page level by F23 (see the M4 golden README's "Migration"): the
        page no longer reads a vendor-facing token from the URL at all, and the fallback is now
        a real code-entry FORM (VendorRegistrationCodeEntryForm), not a dead-end message. The
        fail-closed property this assertion protects is unchanged and still matters: the page
        reuses F3's verifyVendorRegistrationToken internally (against the session cookie, not a
        search param -- see A49 for the session-only proof) and renders the full
        VendorRegisterForm ONLY inside the success branch, with the code-entry form as the
        default/fallback branch -- refusal, not the gated form, is still what a visitor gets by
        default.
        FAILS ON: the page rendering VendorRegisterForm unconditionally (no gate), not calling
        verifyVendorRegistrationToken at all, or not rendering VendorRegistrationCodeEntryForm
        as the fallback branch.
      command: >-
        grep -q "verifyVendorRegistrationToken" "app/(marketing)/national-show/vendors/register/page.tsx" && grep -q "VendorRegistrationCodeEntryForm" "app/(marketing)/national-show/vendors/register/page.tsx" && grep -q "usable ?" "app/(marketing)/national-show/vendors/register/page.tsx" && grep -q "<VendorRegisterForm" "app/(marketing)/national-show/vendors/register/page.tsx"
    - id: A17
      description: >-
        REWRITTEN 2026-08-31 (architect pass, post-QA/Codex fix); UPDATED 2026-09-01 (architect
        pass 4, team-lead item 2, post-second-Codex-pass-on-M4). The original form of this
        assertion only grepped for the identifiers verifyVendorRegistrationToken /
        registrationTokenConsumedAt being present in app/api/vendors/register/route.ts -- it
        stayed green through a genuine read-then-write race (@qa and Codex both found it
        independently: the old shape read registrationTokenConsumedAt outside a transaction,
        checked it, then wrote it afterwards, so two concurrent POSTs with the same token could
        both pass the check and both write). That is this project's own audited "assertion
        satisfiable by something that isn't the real property" defect class. The fix moved
        single-use enforcement into a dedicated lib/vendor-registration-token-claim.ts
        (claimRegistrationToken), which the route now calls, using a Firestore transaction so
        the claim is atomic. This assertion now depends on the BEHAVIOURAL proof of that
        atomicity (check-single-use-claim-is-atomic.mjs, which drives the real
        claimRegistrationToken() against a version-stamped fake Firestore with real optimistic-
        concurrency semantics, and additionally proves the fake itself is not vacuous by
        confirming a control run of the OLD read-then-write shape produces two winners), plus a
        structural check that the route calls the real module rather than re-implementing the
        check inline. M4 ADDITION: a second Codex pass on the finished M4 fix pass found
        `expectedGeneration` is OPTIONAL on ClaimRegistrationTokenOptions (kept optional only so
        this check's own pre-generation call shapes keep working) and nothing mechanically
        enforced that the one production call site actually supplies it -- exactly this
        mission's recurring "field written under one name/behaviour, silently not read/enforced
        under another" defect class. check-single-use-claim-is-atomic.mjs is strengthened
        (still real execution, same fake) to prove claimRegistrationToken() refuses a mismatched
        registrationCodeGeneration, that an absent field normalises to 0 on BOTH sides of the
        comparison, and that omitting expectedGeneration entirely still means "do not check"
        (back-compat); this assertion's own command additionally source-checks that
        app/api/vendors/register/route.ts's production call site actually passes
        expectedGeneration (not merely that the module is imported). That single-file check is
        deliberately ALSO generalised into its own standing invariant, A54, which scans every
        claimRegistrationToken(...) call site in the tracked source tree (not just this one
        file) -- see A54 for why a per-instance check here was not enough on its own.
        FAILS ON: the route not importing/calling claimRegistrationToken from
        lib/vendor-registration-token-claim.ts, the production call site not passing
        expectedGeneration, re-verifying the token itself without also claiming atomically, or
        check-single-use-claim-is-atomic.mjs failing (including its own control-arm sanity
        check and the new generation-mismatch/absent-field/omitted-option cases).
      command: >-
        grep -q "verifyVendorRegistrationToken" app/api/vendors/register/route.ts && grep -qE "claimRegistrationToken" app/api/vendors/register/route.ts && grep -qE "from ['\"]@/lib/vendor-registration-token-claim['\"]" app/api/vendors/register/route.ts && grep -q "expectedGeneration:" app/api/vendors/register/route.ts && node --import tsx/esm contracts/checks/vendor-gated-registration-flow/check-single-use-claim-is-atomic.mjs

    # --- F8: nav link ---
    - id: A18
      description: >-
        WIDENED 2026-08-31 (architect pass, post-QA/Codex fix). The original form of this
        assertion greped only app/(marketing)/**/*.tsx and stayed green throughout while the
        site-wide nav (components/chrome/nav-config.ts -- a .ts file entirely outside that
        scope) linked straight to the gated /national-show/vendors/register route from the mega
        menu on every page of the site. This is the same weak-assertion class as the old A17:
        the check proved a narrower thing than its own description claimed. Widened to scan
        every reachable-by-a-visitor source location: all of app/(marketing), plus
        components/chrome (site-wide nav/mega-menu) and components/vendors (the vendor UI
        components themselves), plus execution/checks/verify_nav_mega_menu.ts's own fixture of
        expected nav hrefs (the structural nav-shape check @dev also had to fix alongside the
        source file). A real Playwright run (27/27, see @dev's fix-pass report) is currently the
        only END-TO-END behavioural proof that a visitor cannot click through to the gated
        route from anywhere in the live-rendered site; this assertion is the fast structural
        gate, not a replacement for that run.
        FAILS ON: the showcase link not pointing at /national-show/vendors/apply; any file under
        app/(marketing), components/chrome, or components/vendors (other than the apply and
        register pages' own internal/self links) linking directly to
        /national-show/vendors/register; or execution/checks/verify_nav_mega_menu.ts's vendor
        entry not matching /national-show/vendors/apply.
      command: >-
        grep -q "/national-show/vendors/apply" "app/(marketing)/national-show/vendors/page.tsx" && ! grep -rq "/national-show/vendors/register" "app/(marketing)" --include="*.tsx" --exclude-dir=register && ! grep -rq "/national-show/vendors/register" components/chrome components/vendors --include="*.ts" --include="*.tsx" && grep -q "/national-show/vendors/apply" execution/checks/verify_nav_mega_menu.ts && ! grep -q "/national-show/vendors/register" execution/checks/verify_nav_mega_menu.ts

    # --- M1 fix-pass checks folded into the contract (previously orphaned @dev deliverables) ---
    - id: A20
      description: >-
        [RETIRED 2026-09-01, architect pass 3, M4] Was: source-order proof that the F5 approval
        route minted the registration TOKEN (F3, mintVendorRegistrationToken) and read
        VENDOR_REGISTRATION_TOKEN_SECRET before its first ref.update() -- guarding against a
        generation/minting failure leaving an application permanently 'approved' with no
        credential ever issued. That mechanism is retired outright by F24 (see the M4 golden
        README's "Migration"): the route no longer calls mintVendorRegistrationToken at all, so
        this assertion's own grep now fails as direct, expected collateral -- not a regression.
        The underlying property (a failed mint must never leave an application terminally
        approved with no way to issue a credential -- the exact M1 dead-end defect Codex found)
        still matters and is NOT dropped: it is re-proven, for the new code mechanism, by A50
        (check-approval-mints-code-atomically.mjs), which additionally proves something A20
        never could -- that the decision patch and the credential fields land in a SINGLE
        ref.update() call, not two separate writes that could land apart.
      command: >-
        echo "SUPERSEDED: A20 retired 2026-09-01 -- the M1 HMAC-token mint-before-commit ordering it checked is retired outright by F24/M4 (see contracts/golden/vendor-gated-registration-flow-m4/README.md 'Migration'). The same class of defect, for the new registration-code mechanism, is now proven by A50 (contracts/checks/vendor-gated-registration-flow-m4/check-approval-mints-code-atomically.mjs)." >&2; exit 77
    - id: A21
      description: >-
        ADDED 2026-08-31 (architect pass). Folds in @dev's fix-pass check for the approval email
        copy defect (@qa/Codex-found): the application-approval path (registrationLink present)
        was rendering the full-registration heading, the entire "your submitted logistics"
        recap, and -- because powerRequired was a non-nullable boolean -- the literal claim
        "Power required: No" to a vendor who was never asked that question at the application
        stage. Behavioural, real execution: renders BOTH branches (application-approval vs. the
        existing full-registration approval) through the REAL
        sendVendorApprovalConfirmationEmail() with an injected fixture mailer, same technique as
        contracts/checks/vendor-f8-approval-email/check-full-logistics-render.mjs. ENV QUIRK:
        must run under `npx tsx`, not `node --import tsx/esm` -- this file's chained @/lib alias
        imports break under the latter in this environment.
        FAILS ON: the application-approval branch rendering the full-logistics heading/recap, or
        asserting any logistics fact (power/booth/etc.) the vendor was never asked.
      command: >-
        npx tsx contracts/checks/vendor-gated-registration-flow/check-application-approval-email-copy.mjs

    # --- F13: vendor category list correction (PRIORITY 1) ---
    - id: A22
      description: >-
        VENDOR_CATEGORIES in lib/vendor-submissions.ts matches the golden exactly -- 14 members,
        exact order, exact spelling, no 'other' member.
        FAILS ON: any member missing, extra, reordered, or 'other' still present.
      command: >-
        diff <(sed -n '/const VENDOR_CATEGORIES/,/^\];/p' lib/vendor-submissions.ts) <(sed -n '/const VENDOR_CATEGORIES/,/^\];/p' contracts/golden/vendor-gated-registration-flow-m2/vendor-categories-14.expected.ts.txt)
    - id: A23
      description: >-
        The VendorCategory union in types/index.ts is set-identical to VENDOR_CATEGORIES's 14
        values (every literal in the union appears as a quoted string in VENDOR_CATEGORIES and
        vice versa) -- catches the type and the runtime constant drifting apart.
        FAILS ON: 'other' still present in either, or a value present in one but not the other.
      command: >-
        node contracts/checks/vendor-gated-registration-flow-m2/check-category-set-equality.mjs
    - id: A24
      description: >-
        VENDOR_CATEGORIES and VENDOR_APPLICATION_CATEGORIES (lib/vendor-applications.ts) are
        byte-identical in value and order -- the two lists the mission deliberately keeps
        structurally separate must not silently diverge in content.
        FAILS ON: any member differing in spelling, order, or count between the two arrays.
      command: >-
        diff <(sed -n '/const VENDOR_CATEGORIES/,/^\];/p' lib/vendor-submissions.ts | grep "  '") <(sed -n '/const VENDOR_APPLICATION_CATEGORIES/,/^\];/p' lib/vendor-applications.ts | grep "  '")
    - id: A25
      description: >-
        VendorCategoryFieldset.tsx no longer renders an 'Other' vendor-category option or the
        vendorCategoryOther text field.
        FAILS ON: the literal string "'other'" as a VENDOR_CATEGORY_OPTIONS value, or a
        vendorCategoryOther fieldKey reference, still present in the component.
      command: >-
