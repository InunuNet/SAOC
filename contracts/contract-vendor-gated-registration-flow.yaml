        grep -q "verifyVendorRegistrationToken" "app/(marketing)/national-show/vendors/register/page.tsx" && grep -q "VendorRegistrationCodeEntryForm" "app/(marketing)/national-show/vendors/register/page.tsx" && grep -q "usable ?" "app/(marketing)/national-show/vendors/register/page.tsx" && grep -q "<VendorRegisterForm" "app/(marketing)/national-show/vendors/register/page.tsx"
    - id: A17
      description: >-
        REWRITTEN 2026-08-31 (architect pass, post-QA/Codex fix); UPDATED 2026-09-01 (architect
        pass 4, team-lead item 2, post-second-Codex-pass-on-M4). The original form of this
        assertion only grepped for the identifiers verifyVendorRegistrationToken /
        registrationTokenConsumedAt being present in app/api/vendors/register/route.ts -- it
        stayed green through a genuine read-then-write race (@qa and Codex both found it
        independently: the old shape read registrationTokenConsumedAt outside a transaction,
        checked it, then wrote it afterwards, so two concurrent POSTs with the same token could
        both pass the check and both write). That is this project's own audited "assertion
        satisfiable by something that isn't the real property" defect class. The fix moved
        single-use enforcement into a dedicated lib/vendor-registration-token-claim.ts
        (claimRegistrationToken), which the route now calls, using a Firestore transaction so
        the claim is atomic. This assertion now depends on the BEHAVIOURAL proof of that
        atomicity (check-single-use-claim-is-atomic.mjs, which drives the real
        claimRegistrationToken() against a version-stamped fake Firestore with real optimistic-
        concurrency semantics, and additionally proves the fake itself is not vacuous by
        confirming a control run of the OLD read-then-write shape produces two winners), plus a
        structural check that the route calls the real module rather than re-implementing the
        check inline. M4 ADDITION: a second Codex pass on the finished M4 fix pass found
        `expectedGeneration` is OPTIONAL on ClaimRegistrationTokenOptions (kept optional only so
        this check's own pre-generation call shapes keep working) and nothing mechanically
        enforced that the one production call site actually supplies it -- exactly this
        mission's recurring "field written under one name/behaviour, silently not read/enforced
        under another" defect class. check-single-use-claim-is-atomic.mjs is strengthened
        (still real execution, same fake) to prove claimRegistrationToken() refuses a mismatched
        registrationCodeGeneration, that an absent field normalises to 0 on BOTH sides of the
        comparison, and that omitting expectedGeneration entirely still means "do not check"
        (back-compat); this assertion's own command additionally source-checks that
        app/api/vendors/register/route.ts's production call site actually passes
        expectedGeneration (not merely that the module is imported). That single-file check is
        deliberately ALSO generalised into its own standing invariant, A54, which scans every
        claimRegistrationToken(...) call site in the tracked source tree (not just this one
        file) -- see A54 for why a per-instance check here was not enough on its own.
        FAILS ON: the route not importing/calling claimRegistrationToken from
        lib/vendor-registration-token-claim.ts, the production call site not passing
        expectedGeneration, re-verifying the token itself without also claiming atomically, or
        check-single-use-claim-is-atomic.mjs failing (including its own control-arm sanity
        check and the new generation-mismatch/absent-field/omitted-option cases).
      command: >-
        grep -q "verifyVendorRegistrationToken" app/api/vendors/register/route.ts && grep -qE "claimRegistrationToken" app/api/vendors/register/route.ts && grep -qE "from ['\"]@/lib/vendor-registration-token-claim['\"]" app/api/vendors/register/route.ts && grep -q "expectedGeneration:" app/api/vendors/register/route.ts && node --import tsx/esm contracts/checks/vendor-gated-registration-flow/check-single-use-claim-is-atomic.mjs

