schema: athanor.contract/v1
slug: vendor-gated-registration-flow
goal: >-
  Invert the National Show vendor registration flow from "full 90-field form public, review
  after" to "short public application first, committee review, single-use tokenised link to
  the full registration + agreement, then stand payment" (Brad, 2026-08-30; independently
  confirmed by Lee-Ann's 26 Aug voice note: invite-only, no random person applies). Full
  decision record, every judgement call, the two flagged voice-note/written-doc
  contradictions, and what is deliberately out of scope for M1:
  contracts/golden/vendor-gated-registration-flow-f1/README.md. New canonical source doc for
  the full registration form's eventual field-set correction (M2 scope, NOT touched in M1):
  docs/leeann-source/2027-vendor-registration-form_2026-08-26.md (supersedes the 25 Aug
  mirror -- same Drive file, content replaced in place, verified section-by-section).
created_at: '2026-08-31'
autonomy: high

# MILESTONES
#   M1 -- demoable tomorrow morning: short public application, admin approve/decline, single-use
#         tokenised approval email, and the gate closing the full registration form. Every M1
#         feature below has real assertions and is ready for @dev now.
#   M2 -- ARCHITECTED 2026-08-31 (architect pass 2, F13-F21). Correct the full registration
#         form's field set against the 26 Aug source doc. F13 (the vendor category list) is
#         independently shippable ahead of F14-F21 -- ship it alone if the demo runs out of
#         time. Full decision record: contracts/golden/vendor-gated-registration-flow-m2/README.md.
#   M3 -- Stand Booking Payment as its own explicitly-non-ticket payment path; whether
#         lib/vendor-payment.ts needs to change to make that separation more explicit than it
#         is today. NOT contract-designed yet, same reason as M2.

features:
  # ---------------------------------------------------------------------------------------
  # M1 -- demoable now
  # ---------------------------------------------------------------------------------------
  - id: F1
    name: >-
      New vendorApplications data model. types/index.ts: VendorApplication,
      VendorApplicationStatus ('pending'|'approved'|'declined'), VendorApplicationCategory (14
      literal values, see golden), VendorApplicationDraft (submitter-writable subset,
      structurally excludes status/submittedAt/reviewedBy/reviewedAt/registrationToken* --
      mirrors VendorSubmissionDraft's existing pattern). New lib/vendor-applications.ts:
      VENDOR_APPLICATIONS_COLLECTION = 'vendorApplications', VENDOR_APPLICATION_CATEGORIES
      (golden-exact literal list), validateVendorApplicationInput(), buildVendorApplication().
      Does NOT touch VendorSubmission, VENDOR_CATEGORIES, or vendorSubmissions in any way.
    status: pending
    milestone: M1
  - id: F2
    name: >-
      Pure application review status machine. New lib/vendor-application-review.ts,
      decideVendorApplicationTransition(), mirroring lib/vendor-review.ts's injected-time,
      additive-only-patch, closed-machine pattern exactly: pending--approve-->approved,
      pending--decline-->declined, every other (status, action) pair refused.
    status: pending
    milestone: M1
  - id: F3
    name: >-
      Single-use registration token. New lib/vendor-registration-token.ts:
      mintVendorRegistrationToken/verifyVendorRegistrationToken, structurally identical to
      lib/recovery-token.ts's mint/verify shape (applicationId in place of orderId), reusing
      (importing, not redefining) constantTimeEqual from lib/recovery-token.ts, signed with a
      NEW env var VENDOR_REGISTRATION_TOKEN_SECRET (added to .env.local.example following the
      existing one-secret-per-purpose convention -- never reuses RECOVERY_TOKEN_SECRET).
      Default TTL 14 days, exported as a named constant, doc-commented as a provisional
      engineering default exactly like RECOVERY_TOKEN_DEFAULT_TTL_MS's own comment. The token
      itself is never persisted anywhere -- only registrationTokenIssuedAt/
      registrationTokenExpiresAt/registrationTokenConsumedAt timestamps are stored on the
      VendorApplication doc for single-use enforcement (stateless HMAC verification alone is
      replayable until expiry and is NOT single-use by itself).
    status: pending
    milestone: M1
  - id: F4
    name: >-
      Public application surface. New POST /api/vendors/register -> renamed/kept as-is (full
      form route, unchanged in M1); NEW POST /api/vendors/apply builds+validates+writes a
      vendorApplications doc (status 'pending') using F1's buildVendorApplication(), same
      request/response/error-shape conventions as app/api/vendors/register/route.ts. NEW
      app/(marketing)/national-show/vendors/apply/page.tsx + a client form component (reusing
      VendorFormField/VendorCheckboxGroupField -- no new field primitive needed) collecting
      exactly: businessName, tradingName (optional), contactPersonName, contactEmail,
      contactCellPhone, vendorCategory (checkbox group, F1's 14-item closed set), and
      indicativeBoothCount ("indicative number of stands", positive integer). No terms
      acceptance at this stage -- that belongs to the full registration + agreement, not the
      application.
    status: pending
    milestone: M1
  - id: F5
    name: >-
      Admin application review surface. NEW GET /api/admin/vendors/applications (list) and
      POST /api/admin/vendors/applications/[id]/review (action: 'approve'|'decline'), same
      getAdminSession()-then-hasCapability(..., 'review-vendor-applications', ...) gate as the
      existing app/api/admin/vendors/route.ts / .../[id]/review/route.ts -- reuses the SAME
      capability, no lib/admin-roles.ts change. On 'approve': F2's
      decideVendorApplicationTransition() decides the patch, ref.update(patch) (never a full-
      document overwrite), THEN F3's mintVendorRegistrationToken() mints a token scoped to
      this applicationId, registrationTokenIssuedAt/registrationTokenExpiresAt are recorded via
      a second additive patch, THEN F6's extended sendVendorApprovalConfirmationEmail() is
      called with registrationLink set to
      `${SITE_URL}/national-show/vendors/register?token=<token>` and no boothNumber/logistics
      fields. On 'decline': F2's decision only, no email in M1 (a decline notification is a
      reasonable M2 addition, not blocking the demo). NEW
      app/admin/vendors/applications/page.tsx + VendorApplicationReviewTable.tsx (mirrors
      VendorReviewTable.tsx), sitting under the EXISTING app/admin/vendors/layout.tsx
      capability gate (no new layout needed).
    status: pending
    milestone: M1
  - id: F6
    name: >-
      Extend, don't duplicate, the approval email. lib/vendor-approval-confirmation.ts's
      VendorApprovalConfirmationInput and emails/VendorApprovalConfirmation.tsx's props gain
      ONE new optional field, registrationLink?: string | null, rendered as the single-use
      registration link when present. The EXISTING call site
      (app/api/admin/vendors/[id]/review/route.ts, full-VendorSubmission approval) is left
      wired exactly as-is -- unchanged behavior, no registrationLink ever passed there. F5's
      NEW call site passes registrationLink and omits boothNumber/boothType/staffPerDay/
      powerRequired/etc, which the template already renders gracefully via
      BOOTH_NUMBER_PENDING_LABEL/LOGISTICS_NOT_SPECIFIED_LABEL -- no new conditional rendering
      branch that could diverge from the existing, already-tested path.
    status: pending
    milestone: M1
  - id: F7
    name: >-
      Gate the full registration route, fail closed. app/(marketing)/national-show/vendors/
      register/page.tsx becomes a server component reading a `?token=` search param:
      verifies it via F3's verifyVendorRegistrationToken() (signature + not-expired), THEN
      looks up the VendorApplication by the token's applicationId and checks
      status === 'approved' AND registrationTokenConsumedAt is unset. The form
      (VendorRegisterForm) renders ONLY on that exact success path; every other outcome --
      missing token, malformed, bad signature, expired, application not found, wrong status,
      already consumed -- renders one generic "This registration link is invalid or has
      expired." message, never the form and never a distinguishing error. POST
      /api/vendors/register (existing route) additionally requires the same token in its
      request body, RE-verifies it server-side (never trusts the page already checked), and on
      a successful write sets registrationTokenConsumedAt on the linked VendorApplication doc
      in the same handler -- so a second POST with the same token, or a POST past expiry, is
      refused with the same generic message. M1 does not change any field the full form
      collects -- that correction is M2.
    status: pending
    milestone: M1
  - id: F8
    name: >-
      Public nav: the showcase page's "Register as a vendor" link
      (app/(marketing)/national-show/vendors/page.tsx) now points to
      /national-show/vendors/apply, not /national-show/vendors/register. The gated
      /register route is deliberately reachable ONLY via the emailed token link -- never
      linked from any public page, nav, or sitemap.
    status: pending
    milestone: M1
  - id: F12
    name: >-
      RECORDED 2026-08-31 (architect pass, judgment call #3 from the M1 fix-pass brief). POST
      /api/vendors/apply (F4) is a new unauthenticated public write endpoint, and unlike its
      sibling POST /api/vendors/register it ships M1 with NEITHER per-IP rate limiting NOR a
      submitter confirmation email -- @qa and @dev both independently flagged this as reasonable
      for M1 (it is a short 7-field form, not the 31-field registration, and committee review
      gates anything from it reaching the full form) but worth a deliberate follow-up rather
      than silent, undocumented asymmetry between two public vendor-facing POST routes. M2 scope
      -- NOT contract-designed yet, same reason as F9/F10: extend
      lib/vendor-registration-rate-limit.ts's createInMemoryVendorRegistrationRateLimitStore
      pattern (or a dedicated applications-scoped store, TBD in the M2 architect pass) to
      /api/vendors/apply, and add a submitter-facing confirmation email mirroring
      lib/vendor-registration-confirmation.ts's sendVendorRegistrationConfirmationEmail shape --
      "we received your application, the committee will review it" copy, explicitly NOT implying
      approval.
    status: pending
    milestone: M2
    contract: null

  # ---------------------------------------------------------------------------------------
  # M2 -- full-form field-set correction against the 26 Aug source doc. Architected
  # 2026-08-31 (architect pass 2). Supersedes the F9/F10 placeholders. Full decision record,
  # every judgement call, and the two flagged ambiguities:
  # contracts/golden/vendor-gated-registration-flow-m2/README.md. F13 is independently
  # shippable ahead of F14-F21 -- ship it alone if time runs short before the demo.
  # ---------------------------------------------------------------------------------------
  - id: F13
    name: >-
      PRIORITY 1 -- demoable alone if time runs short. Correct the live vendor category list:
      VENDOR_CATEGORIES (lib/vendor-submissions.ts) and the VendorCategory union
      (types/index.ts) replaced (not widened) with the 26 Aug doc's 14-item list, byte-identical
      in value and order to F1's existing VENDOR_APPLICATION_CATEGORIES/VendorApplicationCategory
      (lib/vendor-applications.ts) -- see golden "Reconciling the two category lists".
      VendorCategoryFieldset.tsx renders the new 14 items, drops the 'Other' checkbox option and
      the vendorCategoryOther text field entirely. vendorCategoryOther stays in VendorSubmission
      as an optional, deprecated-in-place field (never rendered, never required) -- see golden
      "Deprecate-in-place, never delete". validateVendorSubmissionInput stops requiring/checking
      vendorCategoryOther. This is a genuine breaking rename of VendorCategory's members (not an
      additive widening) -- justified because the vendorSubmissions collection is pre-launch
      with zero real documents (see golden "Why this one enum may break") -- unlike every other
      M2 change, which is additive-only per the mission's hard constraint.
    status: pending
    milestone: M2
    contract: contracts/golden/vendor-gated-registration-flow-m2/README.md
  - id: F14
    name: >-
      Data model: every NEW field the 26 Aug doc requires, added to VendorSubmission
      (types/index.ts) and lib/vendor-submissions.ts, purely additive (no field removed, no
      existing field's type changed). Online Presence: facebookHandle, instagramHandle,
      tiktokHandle, youtubeHandle, otherSocialMediaHandle (all optional strings; UI label reads
      "TikTok", correcting the source's own "Ticktok" typo -- see golden "The Ticktok typo").
      Booth size tier: boothSize: 'single' | 'double' | 'triple' (new closed union
      VendorBoothSize, required) -- a DIFFERENT concept from the existing boothType (booth
      POSITION: standard-in-row/corner/end-of-row/no-preference), which is unchanged. Repeating
      electricity table: electricalEquipmentRows: VendorElectricalEquipmentRow[] (new interface:
      equipment: string, quantity: number, wattage: string, runningTimePerDay: string).
      Repeating gas table: gasEquipmentRows: VendorGasEquipmentRow[] (new interface:
      equipmentType: string, gasType: string, cylinderSize: string, cylinderCount: number).
      Vehicles: 7 new optional string fields -- carRegistrationNumber, suvBakkieRegistrationNumber,
      panelVanRegistrationNumber, deliveryVanRegistrationNumber, truckRegistrationNumber,
      trailerRegistrationNumber, otherVehicleRegistrationNumber (+ otherVehicleDescription).
      Insurance: publicLiabilityInsurancePolicyNumber, productLiabilityInsurancePolicyNumber
      (both optional strings, alongside the existing M1 hasPublicLiabilityInsurance/
      productLiabilityInsuranceStatus booleans/enum, unchanged). Food certification:
      foodVendorCertifications: VendorFoodCertification[] (new closed union, 6 literal values --
      see golden "Food certification: checklist, not blanket attestation" for the ambiguity and
      the chosen default). Marketing: logoPath/logoUploadedAt (string | null / Date | null,
      mirrors proofOfPaymentPath's shape exactly), productPhoto1Path/2Path/3Path +
      matching UploadedAt fields (three discrete optional fields, not an array -- see golden
      "Why three fields, not an array" for why this is the exactly-3 enforcement mechanism),
      marketingPermission: 'full' | 'listing-only' (new closed union, optional). Signature
      block: signatureFullName: string (optional) -- see golden "The signature block" for why
      Position/Business Name/Date are NOT re-collected as new fields.
    status: pending
    milestone: M2
    contract: contracts/golden/vendor-gated-registration-flow-m2/README.md
  - id: F15
    name: >-
      Deprecate-in-place the fields the 26 Aug doc's shape changes superseded: boothCount,
      electricalLoad, electricalEquipmentList, electricalEquipmentContinuousOperation,
      electricalEquipmentContinuousDetails, gasEquipmentType, gasFuelType, gasCylinderSize,
      gasCylinderCount, vehicleType, vehicleTypeOther, vehicleRegistrations, vehicleHeight,
      vehicleLength, trailerAttached, socialMediaHandle, sellsLivePlants, livePlantTypes,
      livePlantTypesOther, plantsImportedForEvent, importCountryOfOrigin,
      foodPreparationOnSite, foodCookingOnSite. Every one stays in VendorSubmission as-is
      (already optional; zero type change) but is removed from validateVendorSubmissionInput's
      active checks where it previously had any, and is no longer rendered by any fieldset
      component after F16-F19 land -- see golden "Deprecate-in-place, never delete" for the
      full removed-field ledger and why the admin review UI (app/admin/vendors/page.tsx) must
      keep rendering these gracefully if present on a pre-M2 document. New validation added for
      the new F14 fields: bio 150-200 word count enforced server-side (word-count, not
      character-count -- see golden "Word count, not character count"); boothSize is one of the
      3 closed values when present; electricalEquipmentRows/gasEquipmentRows entries validated
      per-row (quantity/cylinderCount positive integers, string fields maxLength-checked); the
      7 vehicle registration fields maxLength-checked individually; foodVendorCertifications
      items are a subset of the 6 closed values.
    status: pending
    milestone: M2
    contract: contracts/golden/vendor-gated-registration-flow-m2/README.md
  - id: F16
    name: >-
      UI: VendorContactFieldset.tsx gains the 5 Online Presence fields (Website already
      present; add Facebook/Instagram/TikTok/YouTube/Other) and absorbs
      VendorEmergencyContactFieldset.tsx's 3 fields inline (no new "Emergency contact" <h2>
      section heading -- the fields render under "Contact & business details", matching the 26
      Aug doc's fold-in). VendorEmergencyContactFieldset.tsx component and its standalone
      import/render in VendorRegisterForm.tsx are deleted -- this is a UI-composition change
      only, emergencyContact* fields in VendorSubmission are untouched (still required, per
      existing type). Entity-type Partnership/Individual and the VAT Vendor/VAT Number split
      are ALREADY correct in current UI (verified live against F1 of vendor-registration-form-
      rebuild) -- no change needed there; golden records this as a verified no-op, not an
      oversight.
    status: pending
    milestone: M2
    contract: contracts/golden/vendor-gated-registration-flow-m2/README.md
  - id: F17
    name: >-
      UI: VendorBoothFieldset.tsx -- replace the boothCount number input with a boothSize radio
      group (3 fixed options, labels verbatim "Single Booth – 2.5m x 3m" / "2 Booths (Double) –
      5m x 3m" / "3 Booths (Triple) – 7m x 3m"). Table/chair section keeps tableCount/chairCount
      inputs but the surrounding copy states charges apply with NO rand figure ("at an
      additional charge per table and per chair -- rate to be confirmed by the Show Organising
      Committee") -- council-blocked, do not invent a figure, see golden "Table/chair rate:
      council-blocked, not provisional". Electricity: replace the single electricalLoad text
      input with a repeating-row editor for electricalEquipmentRows (add/remove row, 4 fields
      per row); wastewaterDrainageRequired/-Details unchanged. Gas: new repeating-row editor for
      gasEquipmentRows (add/remove row, 4 fields per row), rendered only
      isFoodRetailer(state)-gated per golden "Gas equipment gating". Vehicles: replace the
      single vehicleType radio + vehicleRegistrations text input with 7 discrete labeled text
      inputs (Car / SUV-Bakkie / Panel Van / <1 ton Delivery Van / >1 ton Truck / Trailer /
      Other, the last paired with the existing otherVehicleDescription-style free text).
    status: pending
    milestone: M2
    contract: contracts/golden/vendor-gated-registration-flow-m2/README.md
  - id: F18
    name: >-
      UI + upload plumbing: VendorMarketingFieldset.tsx -- bio textarea gets a live word-count
      indicator and client-side 150-200 word validation (mirrors the existing maxLength client
      pattern). New logo upload (single file) and exactly-3 product-photo upload widgets, reusing
      F7's public-upload pattern exactly: new lib/vendor-marketing-upload.ts
      (planMarketingAssetUpload(), MIME allowlist restricted to image types --
      image/jpeg,image/png,image/webp -- size cap mirroring PROOF_OF_PAYMENT_MAX_BYTES's 5MB,
      extension derived solely from validated mimeType, storage paths
      `vendor-marketing/{submissionId}/logo.{ext}` and
      `vendor-marketing/{submissionId}/product-photo-{1,2,3}.{ext}`), new
      lib/vendor-marketing-upload-handler.ts (mirrors lib/vendor-proof-of-payment-handler.ts's
      shape: injected time, rate-limit-first, non-enumerable existence posture, overwrite
      semantics), new PUBLIC POST /api/vendors/[id]/marketing-asset route (unauthenticated,
      rate-limited, mirrors app/api/vendors/[id]/proof-of-payment/route.ts as a thin wrapper).
      Client-side, the 3 product-photo slots are 3 separate upload controls (slot: 1|2|3), not
      an add-many-photos widget -- this IS the exactly-3 enforcement (see golden "Why three
      fields, not an array"). Permission radio: marketingPermission, 2 options, labels verbatim
      from the doc's two sentences.
    status: pending
    milestone: M2
    contract: contracts/golden/vendor-gated-registration-flow-m2/README.md
  - id: F19
    name: >-
      UI: food vendor 6-item certification checklist (VendorCheckboxGroupField, gated
      isFoodRetailer(state), rendered in VendorCategoryFieldset.tsx alongside the existing food-
      retailer-gated fields) for foodVendorCertifications -- labels verbatim: "Mobile
      certificate of acceptability", "Perishable Foodstuff Licence", "Hawker/Informal Trading
      Permit", "Mobile gas certificate of compliance", "Fire safety compliance", "Certificate of
      fitness for vehicles". Insurance: two new text inputs (Public Liability / Product
      Liability policy numbers) added to the existing insurance section, alongside the
      unmodified M1 hasPublicLiabilityInsurance/productLiabilityInsuranceStatus fields.
    status: pending
    milestone: M2
    contract: contracts/golden/vendor-gated-registration-flow-m2/README.md
  - id: F20
    name: >-
      Declaration/T&Cs/signature copy: replace the form's 12-point declaration list with the 26
      Aug doc's 6 points (verbatim); add the full 14-clause prose Terms & Conditions block
      (verbatim, INCLUDING the written 90-day cancellation/no-refund clause under "Cancellation
      and Refunds" -- per the mission's hard constraint, implement what the WRITTEN document
      says even though it conflicts with Lee-Ann's voice-note "2 months," and flag both places:
      inline HTML comment at the clause AND the golden's contradiction ledger); add the
      signature block (Full Name -> new signatureFullName field per F14; Position -> reads
      existing contactPosition; Business Name -> reads existing businessName; Signature -> a
      typed-name affirmation, no canvas/drawn signature -- signatureFullName IS the signature
      field, not a duplicate; Date -> NOT re-collected, displays "submitted on {submittedAt}"
      read-only after submit, never an editable input). Remove any residual "Supporting
      Documentation Checklist" / standalone "Booth Fees & Payment" copy blocks if present in the
      current form (verified: neither exists as a distinct rendered section today per golden
      "What was never actually there" -- likely a no-op, confirm during implementation rather
      than skip).
    status: pending
    milestone: M2
    contract: contracts/golden/vendor-gated-registration-flow-m2/README.md
  - id: F21
    name: >-
      Regression safety net: app/admin/vendors/page.tsx (the submission review UI) renders
      every pre-M2 VendorSubmission document (one with none of F14's new fields and every one
      of F15's deprecated fields populated) without a crash, a blank field-value render, or a
      TypeScript error -- proves the additive-only/deprecate-in-place decision is actually
      deploy-safe, not just asserted in prose. See golden "F21: the regression proof, not just
      the promise" for the two fixture documents (pre-M2 shape, post-M2 shape) this feature's
      assertions render against.
    status: pending
    milestone: M2
    contract: contracts/golden/vendor-gated-registration-flow-m2/README.md

  # ---------------------------------------------------------------------------------------
  # M3 -- Stand Booking Payment as an explicitly non-ticket path. Placeholder only.
  # ---------------------------------------------------------------------------------------
  - id: F11
    name: 'M3 placeholder: Stand Booking Payment (booth fee) as its own explicitly-non-ticket payment path -- reassess whether lib/vendor-payment.ts needs changes to make the separation from the ticket/order model more explicit than the current proof-of-payment/office-confirms flow already provides.'
    status: pending
    milestone: M3
    contract: null

goldens:
  - contracts/golden/vendor-gated-registration-flow-f1/README.md
  - contracts/golden/vendor-gated-registration-flow-f1/vendor-application-categories.expected.ts.txt
  - contracts/golden/vendor-gated-registration-flow-f1/vendor-application-review-transitions.expected.ts.txt
  - contracts/golden/vendor-gated-registration-flow-m2/README.md
  - contracts/golden/vendor-gated-registration-flow-m2/vendor-categories-14.expected.ts.txt
  - contracts/golden/vendor-gated-registration-flow-m2/removed-field-ledger.expected.md

assertions:
  phase: 4
  checks:
    # --- F1: data model ---
    - id: A1
      description: >-
        VendorApplication/VendorApplicationStatus/VendorApplicationCategory/
        VendorApplicationDraft are defined in types/index.ts, and VendorApplicationDraft
        structurally excludes every system-owned field (status, submittedAt, reviewedBy,
        reviewedAt, registrationTokenIssuedAt, registrationTokenExpiresAt,
        registrationTokenConsumedAt) -- same pattern as the existing VendorSubmissionDraft.
        FAILS ON: any of these types missing, or VendorApplicationDraft's own type body
        containing a 'status' field (would let a submitter smuggle their own status).
      command: >-
        grep -q "VendorApplicationStatus" types/index.ts && grep -q "VendorApplicationCategory" types/index.ts && grep -q "VendorApplicationDraft" types/index.ts && ! sed -n '/interface VendorApplicationDraft/,/^}/p' types/index.ts | grep -q "status:"
    - id: A2
      description: >-
        lib/vendor-applications.ts's VENDOR_APPLICATION_CATEGORIES constant matches the golden
        exactly -- all 14 members, exact order, exact spelling, no 'other' member.
        FAILS ON: any member added, removed, reordered, or misspelled relative to the golden.
      command: >-
        diff <(sed -n '/const VENDOR_APPLICATION_CATEGORIES/,/^\];/p' lib/vendor-applications.ts) <(sed -n '/const VENDOR_APPLICATION_CATEGORIES/,/^\];/p' contracts/golden/vendor-gated-registration-flow-f1/vendor-application-categories.expected.ts.txt)
    - id: A3
      description: >-
        lib/vendor-applications.ts exports VENDOR_APPLICATIONS_COLLECTION = 'vendorApplications'
        (a genuinely new, separate collection -- not a reuse of VENDOR_SUBMISSIONS_COLLECTION),
        and does not import lib/admin-auth.ts or lib/admin-roles.ts (authorization-blind, same
        rule as lib/vendor-submissions.ts).
        FAILS ON: the collection name missing/wrong, or an admin-auth/admin-roles import present.
      command: >-
        grep -q "VENDOR_APPLICATIONS_COLLECTION = 'vendorApplications'" lib/vendor-applications.ts && ! grep -qE "from '@/lib/admin-(auth|roles)'" lib/vendor-applications.ts

    # --- F2: review machine ---
    - id: A4
      description: >-
        lib/vendor-application-review.ts's TRANSITIONS table matches the golden exactly --
        pending maps to {approve: approved, decline: declined} and nothing else.
        FAILS ON: any extra transition, missing transition, or a different next-status.
      command: >-
        diff <(sed -n '/const TRANSITIONS/,/^};/p' lib/vendor-application-review.ts) <(sed -n '/const TRANSITIONS/,/^};/p' contracts/golden/vendor-gated-registration-flow-f1/vendor-application-review-transitions.expected.ts.txt)
    - id: A5
      description: >-
        Behavioral, real execution (mirrors lib/vendor-review.ts's own proof style): every legal
        transition succeeds with an additive-only 3-key patch; every transition from a terminal
        state (approved/declined) is refused; an unknown action is refused.
        FAILS ON: any legal transition refused, any illegal transition allowed, or a patch
        containing keys beyond status/reviewedBy/reviewedAt.
      command: node --import tsx/esm contracts/checks/vendor-gated-registration-flow/check-application-review-transitions.mjs

    # --- F3: token security ---
    - id: A6
      description: >-
        lib/vendor-registration-token.ts imports constantTimeEqual FROM lib/recovery-token.ts
        (reuse, not a redefinition) and is signed by a distinct env var,
        VENDOR_REGISTRATION_TOKEN_SECRET -- never RECOVERY_TOKEN_SECRET.
        FAILS ON: constantTimeEqual redefined locally instead of imported, or
        RECOVERY_TOKEN_SECRET referenced anywhere in this file.
      command: >-
        grep -q "constantTimeEqual" lib/vendor-registration-token.ts && grep -qE "import.*constantTimeEqual.*from ['\"]\./recovery-token['\"]" lib/vendor-registration-token.ts && grep -q "VENDOR_REGISTRATION_TOKEN_SECRET" lib/vendor-registration-token.ts && ! grep -q "RECOVERY_TOKEN_SECRET" lib/vendor-registration-token.ts
