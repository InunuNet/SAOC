    # --- F24: approval mints a code ---
    - id: A50
      description: >-
        PROMOTED to phase 4 2026-09-01 (architect pass 3) -- F24 is now implemented; also
        SUPERSEDES A20 (see A20's retirement note). UPDATED 2026-09-01 (architect pass 6,
        team-lead review, post-Codex, post-route-runner-harness). The 'approve' action in POST
        /api/admin/vendors/applications/[id]/review generates the code BEFORE any write and
        persists registrationCodeId/registrationCodeNameSlug/registrationCodeIssuedAt/
        registrationCodeExpiresAt in the SAME, single additive ref.update() call as F5's
        existing 3-key decision (never a separate, laggable write -- proving more than A20 ever
        could, since A20's M1 shape used two separate update calls), and -- behaviourally, via a
        real call to sendVendorApprovalConfirmationEmail() -- the approval email renders the
        code digit-grouped ("4 8 2 1"), never as an unbroken 4-digit run. Proved by
        check-approval-mints-code-atomically.mjs (source-order + real-email-rendering; unchanged
        from pass 5).

        THIS ASSERTION WAS GREEN OVER A REAL DEFECT TWICE, and the second time is why this
        assertion is now written the way it is. First, Codex found that F24 moved the vendor's
        actual redemption dependency (VENDOR_REGISTRATION_TOKEN_SECRET, needed by
        POST /api/vendors/register/verify-code to mint the session cookie) to a DIFFERENT file
        without carrying forward a precondition check -- an approval could commit, the code
        would be emailed, and every redemption attempt would fail forever behind the
        (deliberately) generic 403, with the operator seeing nothing wrong. Pass 5's fix added a
        second, general, DATA-driven static-analysis script
        (check-redemption-preconditions-verified-before-approval-commits.mjs, still on disk,
        still true, still passing) that extracts every env-var refusal guard and every
        vendor-input-derived `.where()` match in the redemption route and asserts the approval
        route mirrors each one. On 2026-09-01 the team lead reported @dev reconstructing the
        original defect and getting a false PASS -- which turned out (re-verified fresh, see
        below) to be @dev having run ONLY check-approval-mints-code-atomically.mjs in isolation,
        not the full chained A50 command; the static-analysis script alone, independently
        re-verified in this pass by reverting the real fix and restoring it, DOES catch this
        exact defect. So the specific false-PASS report was a stale/partial test, not a live gap
        in A50 as written. But the team lead's deeper point stands regardless: a static-analysis
        script has an irreducible STATED LIMITATION (see pass 5's note, retained on disk in the
        script's own header) -- it can only see preconditions shaped as an env-var guard or a
        `.where()` match, inside one named file. A precondition behind a transitive import, a
        non-`.where()` query, a third file, or infrastructure outside the route would still slip
        past it, unlike the defects actually found so far, but exactly the shape of blind spot
        this mission's whole history warns against. The route-runner harness
        (contracts/harness/route-runner/, built by @dev this session) removes that ceiling
        entirely: it runs the REAL route handlers, with only infrastructure faked, so a
        precondition can move to ANY file or ANY enforcement shape and this check still catches
        its absence, because it is asserting on what the route actually DOES to a real
        Application-shaped record and a real subsequent redemption, not on what its source looks
        like. A50 is now chained as BOTH scripts -- the atomicity/email-rendering proof (a
        genuinely different property: write shape and email formatting, which the harness script
        does not re-check) AND a new harness-based behavioural script,
        check-approval-redemption-behavioural.mjs, which:
          (1) sets VENDOR_REGISTRATION_TOKEN_SECRET unset and calls the REAL review route's
              'approve' action -- asserts non-200, application still 'pending', no
              registrationCodeId committed, no email sent;
          (2) seeds a business name that normalises to an empty slug ('太陽 陶芸') and calls the
              REAL review route -- same assertions;
          (3) POSITIVE CONTROL: with the secret set and a normal business name, calls the REAL
              review route, asserts 200/approved/code-committed/one-email-sent, THEN takes the
              EXACT code from the captured email payload and calls the REAL
              POST /api/vendors/register/verify-code route with it, asserting 200 and a session
              cookie actually being set -- proving the credential this approval issues actually
              redeems, not merely that the route claims success. Without this arm, (1) and (2)
              could be satisfied by a route that refuses every approval unconditionally.
        Both static-analysis and harness-based scripts verified non-vacuous by independently
        reverting each of @dev's two real fixes (the secret precheck; the empty-slug precheck)
        in app/api/admin/vendors/applications/[id]/review/route.ts, confirming the FULL chained
        A50 command fails with the correct evidence on each reverted state, then restoring from
        a diffed-clean backup and confirming the full chain passes again.

        check-redemption-preconditions-verified-before-approval-commits.mjs is deliberately KEPT
        in the chain, not retired: it is strictly narrower than the harness script for THIS
        mission's two known defects, but it is a static, always-on structural guard with no
        dependency on the harness's fixture surface staying in sync with the real routes --
        genuine defense in depth, not redundant coverage.
        FAILS ON: the retired mintVendorRegistrationToken still being called, more than one
        ref.update() call site, the code generated after ref.update(), the code fields written
        in a separate call than the decision patch, a generation failure not refusing the whole
        approval, the email rendering the raw unbroken 4-digit string, any env-var refusal guard
        in the redemption route not mirrored by a reference to the same name in the approval
        route's pre-commit approve branch, any vendor-input-derived match-key field in the
        redemption route's lookup whose corresponding written expression in the approval patch
        is not guarded for truthiness before the commit, OR (harness-based) an approval that
        commits/emails a code with the secret unset, an approval that commits/emails a code for
        an empty-slug business name, or a successfully-approved code that the real verify-code
        route refuses to redeem.
      command: >-
        npx tsx contracts/checks/vendor-gated-registration-flow-m4/check-approval-mints-code-atomically.mjs && node contracts/checks/vendor-gated-registration-flow-m4/check-redemption-preconditions-verified-before-approval-commits.mjs && NODE_OPTIONS="--require $PWD/contracts/harness/route-runner/preload.cjs" npx tsx contracts/checks/vendor-gated-registration-flow-m4/check-approval-redemption-behavioural.mjs

