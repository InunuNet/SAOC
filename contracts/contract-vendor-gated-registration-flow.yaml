    - id: A54
      description: >-
        ADDED 2026-09-01 (architect pass 4, team-lead item 2 -- expressed as a general
        invariant, A42-style, per the team lead's explicit suggestion). STANDING regression
        guard, not a one-off instance check: `expectedGeneration` is OPTIONAL on
        ClaimRegistrationTokenOptions (lib/vendor-registration-token-claim.ts) purely so
        check-single-use-claim-is-atomic.mjs's own pre-generation call shapes keep compiling --
        omitting it means "do not check the generation", never "any generation matches". A42
        generalised "every field buildVendorSubmission writes must be validated" by
        programmatically diffing a MANY-fields-vs-one-validator relationship; this assertion's
        relationship is one-function-vs-its-call-sites, currently size 1 (only
        app/api/vendors/register/route.ts calls claimRegistrationToken in production), so
        rather than a diff it scans the tracked .ts/.tsx source tree with `git grep` for every
        `claimRegistrationToken(` call expression (excluding the defining module and this
        mission's own contracts/checks/** fixtures, which deliberately exercise the
        pre-generation/omitted-option shapes as test cases) and asserts EACH ONE supplies
        expectedGeneration -- so a SECOND call site added later, which A17's own hardcoded
        single-file check would be blind to, is caught the same way. Also asserts the scan
        finds at least one real call site, so it cannot pass by finding nothing to check (the
        same vacuous-scan trap A42 itself guards against). Verified non-vacuous by removing
        the production call site's expectedGeneration locally and re-running -- fails with the
        expected message; restored and reruns clean.
        FAILS ON: any claimRegistrationToken(...) call site (present or future) in the tracked
        .ts/.tsx tree, outside the defining module and contracts/checks/**, that does not
        supply expectedGeneration, or the scan finding zero call sites.
      command: >-
        node contracts/checks/vendor-gated-registration-flow-m4/check-every-claim-call-site-supplies-generation.mjs
