  # ---------------------------------------------------------------------------------------
  # M4 -- ARCHITECTED 2026-08-31/09-01 (architect pass 3). Replaces M1/F3+F7's opaque HMAC
  # link with a human-readable "{BusinessName}-{4 digits}" code (Brad, 2026-08-31), engineered
  # so a 4-digit code is safe by construction: per-application transactional lockout, a
  # secondary per-IP throttle, CSPRNG generation, constant-time comparison, and an
  # enumeration-blind verify response. Full decision record, threshold reasoning, the POPIA
  # finding (the full form does NOT prefill from the application -- verified, not assumed), and
  # the migration decision (replace the vendor-facing mechanism outright; REUSE, don't rewrite,
  # F3's HMAC module as the internal post-verification session artifact):
  # contracts/golden/vendor-gated-registration-flow-m4/README.md.
  # ---------------------------------------------------------------------------------------
  - id: F22
    name: >-
      Core mechanism, no I/O. New lib/vendor-registration-code.ts: normalizeVendorCodeName()
      (deterministic slug -- lowercase, NFD-strip accents, strip every non-alphanumeric
      character; see the golden's normalisation table), generateVendorRegistrationCodeId()
      (zero-argument, node:crypto randomInt(0, 10000), zero-padded to 4 digits -- never
      sequential, never derived from applicationId), VENDOR_REGISTRATION_CODE_LOCK_THRESHOLD =
      5 and VENDOR_REGISTRATION_CODE_DEFAULT_TTL_MS (reuses the same 14-day value as
      VENDOR_REGISTRATION_TOKEN_DEFAULT_TTL_MS), verifyVendorRegistrationCode() (pure function
      over caller-supplied candidates, constant-time code comparison reusing
      constantTimeEqual from lib/recovery-token.ts, returns {ok:true, applicationId} or a
      single {ok:false} shape identical across every failure reason -- no such name slug,
      wrong code, locked, consumed, expired, not-approved), and
      recordFailedVendorRegistrationCodeAttempt() (transactional, same
      db.runTransaction()-wrapped read-check-write shape as
      lib/vendor-registration-token-claim.ts's claimRegistrationToken(), increments
      registrationCodeFailedAttempts and sets registrationCodeLockedAt on crossing the
      threshold, race-safe under concurrent failed attempts). Also extends types/index.ts's
      VendorApplication with registrationCodeId/registrationCodeNameSlug/
      registrationCodeIssuedAt/registrationCodeExpiresAt/registrationCodeConsumedAt/
      registrationCodeFailedAttempts/registrationCodeLockedAt (all optional, additive) --
      registrationTokenIssuedAt/Expires/ConsumedAt stay on the type, deprecated-in-place, not
      removed.
    status: pending
    milestone: M4
    contract: contracts/golden/vendor-gated-registration-flow-m4/README.md
  - id: F23
    name: >-
      Public verify + gate. New pure handler lib/vendor-registration-code-verify-handler.ts,
      handleVendorRegistrationCodeVerification(input, deps) -- same injected-deps shape as
      lib/vendor-registration-handler.ts (F5/M1), so rate-limit-shields-I/O and response-shape
      are provable without a Firestore instance -- called by new route POST
      /api/vendors/register/verify-code: accepts {businessName, codeId} (two structured fields,
      not one parsed string -- see the golden's "Format" section for why), rate-limits by IP
      first (reusing decideRateLimit() via a new vendor-register-code-verify-ip:* key
      namespace, 10/hour -- mirrors lib/vendor-registration-rate-limit.ts's existing pattern, a
      new sibling module/constants, not a mutation of the F5/M1 register-route limiter), runs
      ONE Firestore query by
      registrationCodeNameSlug + status=='approved' regardless of outcome (no query-skipping
      branch -- see "Enumeration blindness"), calls F22's verifyVendorRegistrationCode() against
      every candidate, and on success mints F3's mintVendorRegistrationToken() with a SHORT
      ttlMs override (30 minutes, not the 14-day default) as an internal session artifact,
      delivered via an HttpOnly cookie -- NEVER in the JSON response body (POPIA finding: the
      response body is byte-identical in shape on success ({ok:true}) and failure (the one
      generic error string), never containing any VendorApplication field). On failure, calls
      F22's recordFailedVendorRegistrationCodeAttempt() against every matched candidate.
      app/(marketing)/national-show/vendors/register/page.tsx is rewritten: no longer reads a
      `?token=` search param as its gate (F7/M1's mechanism is retired at the page level, not
      deleted at the module level -- see F22's note); instead renders a two-field code-entry
      form (business name + 4-digit code) that POSTs to verify-code, prefillable from
      `?name=&code=` query params carried by the approval email's convenience link, but always
      requiring an explicit submit through the rate-limited endpoint. POST /api/vendors/register
      (F7/M1's existing route) stops accepting a vendor-typed token/code in its body and instead
      re-verifies the session cookie via F3's verifyVendorRegistrationToken(), unchanged --
      F7's already-proven single-use claim transaction (lib/vendor-registration-token-claim.ts)
      is reused without modification.
    status: pending
    milestone: M4
    contract: contracts/golden/vendor-gated-registration-flow-m4/README.md
  - id: F24
    name: >-
      Approval mints a code, not a token. POST /api/admin/vendors/applications/[id]/review's
      'approve' action (F5/M1) stops calling mintVendorRegistrationToken() at approval time;
      instead generates registrationCodeId (F22's generateVendorRegistrationCodeId()) +
      registrationCodeNameSlug (F22's normalizeVendorCodeName(businessName)), writes them plus
      registrationCodeIssuedAt/registrationCodeExpiresAt in the same additive ref.update()
      patch F5 already uses (mint-before-commit ordering unchanged -- a failed generation still
      leaves the application pending and recoverable, same fail-closed rule as F5's own token
      minting). lib/vendor-approval-confirmation.ts's VendorApprovalConfirmationInput and
      emails/VendorApprovalConfirmation.tsx gain the code, read-aloud formatted (digits
      space- or hyphen-grouped, e.g. "4 8 2 1", never run together), plus the new
      ?name=&code= convenience link -- replacing, not adding alongside, the old token-bearing
      registrationLink prop shape (same optional-prop pattern F6 established, still a single
      prop rename/repurpose, not a new required prop).
    status: pending
    milestone: M4
    contract: contracts/golden/vendor-gated-registration-flow-m4/README.md
  - id: F25
    name: >-
      Admin visibility + reissue. VendorApplicationReviewTable.tsx gains a "Code" column
      (registrationCodeId, or "--" pre-approval) and a locked badge when
      registrationCodeLockedAt is set. New POST
      /api/admin/vendors/applications/[id]/reissue-code, gated identically to the existing
      review route (getAdminSession() -> hasCapability(..., 'review-vendor-applications', ...)),
      available any time status === 'approved' (not conditioned on being locked): mints a fresh
      registrationCodeId, resets registrationCodeFailedAttempts to 0 and
      registrationCodeLockedAt to null, refreshes registrationCodeIssuedAt/
      registrationCodeExpiresAt -- one operator action covers both "vendor is locked out" and
      "vendor lost the email" (see the golden's "Reissue, not unlock"). No separate unlock
      action exists.
    status: pending
    milestone: M4
    contract: contracts/golden/vendor-gated-registration-flow-m4/README.md

  # --- M3: Stand Booking Payment (F26-F32). See
  # contracts/golden/vendor-gated-registration-flow-m3/README.md for the full decision record
  # -- the ticket-model-vs-sibling-collection reasoning, why boothSize (1/2/3) needs no
  # separate quantity/cart field, the missing-figure ledger (the 26 Aug doc's "Booth Fees &
  # Payment" section was REMOVED entirely, not merely left with a blank rand figure), and the
  # three open questions flagged to the orchestrator (F7 retirement, tables/chairs billing,
  # refund mechanics).
  - id: F26
    name: >-
      Data model + council-blocked pricing. types/index.ts: new VendorStandBoothSize (1|2|3),
      VendorStandOrderStatus ('pending'|'paid'|'failed'|'cancelled'), VendorStandOrder
      interface (id == vendorSubmissionId, vendorSubmissionId, businessName, contactEmail,
      boothSize, amount, status, gateway, gatewayPaymentId, standOrderRef, createdAt, paidAt,
      failedAt -- see golden "The crux decision" for why this is a NEW sibling collection,
      never a reuse of Order/Ticket/TicketType). New lib/vendor-stand-pricing.ts:
      VENDOR_STAND_BOOTH_SIZES = [1,2,3] as const, VENDOR_STAND_PRICE_ZAR (Record<1|2|3,
      number|null>, every value null -- see golden "The missing-figure problem"; do NOT invent
      a figure, do NOT follow lib/provisional-figures.ts's estimate-and-disclose pattern here,
      there is no estimate to anchor to), resolveVendorStandPrice(boothSize): never throws,
      never guesses, never defaults -- same posture as lib/payments/active-gateway.ts's
      resolveActiveGateway(). Pure, no Firestore import.
    status: pending
    milestone: M3
    contract: contracts/golden/vendor-gated-registration-flow-m3/README.md
  - id: F27
    name: >-
      New trust domain. lib/vendor-stand-payment-token.ts: mintVendorStandPaymentToken()/
      verifyVendorStandPaymentToken(), structurally identical to
      lib/vendor-registration-token.ts (payload key 's' -- vendorSubmissionId -- a THIRD
      distinct key alongside M1's 'a' and the order-recovery token's 'o'; same
      malformed/bad-signature/expired result shape; injected `now`, no internal
      Date.now()/new Date()). New env var VENDOR_STAND_PAYMENT_TOKEN_SECRET, never shared with
      VENDOR_REGISTRATION_TOKEN_SECRET or RECOVERY_TOKEN_SECRET.
      VENDOR_STAND_PAYMENT_TOKEN_DEFAULT_TTL_MS = 30 days. Zero authorization meaning by
      itself -- see golden "Token mechanism" for why this token is deliberately NOT single-use
      (unlike M1's registration token) and every use site re-verifies the linked submission's
      CURRENT status/paid state, never a state snapshot from mint time.
    status: pending
    milestone: M3
    contract: contracts/golden/vendor-gated-registration-flow-m3/README.md
  - id: F28
    name: >-
      Approval mints + emails the payment link; admin resend escape hatch. Extends the EXISTING
      app/api/admin/vendors/[id]/review/route.ts 'approve' action (F6/F8, unchanged
      decideVendorStatusTransition()/3-key patch): after F8's existing
      deliverConfirmationEmailAfterCommit() approval-email step, ADD a second, equally
      non-blocking post-commit step that mints F27's token and sends a NEW email
      (emails/VendorStandPaymentReady.tsx via new lib/vendor-stand-payment-notice.ts) linking
      to /national-show/vendors/payment?token=... . Deliberately NOT fail-closed the way M1's
      application-token mint is -- see golden "Approval triggers the mint" for why gating
      submission approval on this secret would wrongly couple two independent decisions; the
      approval write commits regardless, failure is logged and non-fatal. New POST
      /api/admin/vendors/[id]/resend-payment-link, gated identically to the review route
      (getAdminSession() -> hasCapability(..., 'review-vendor-applications', ...)), callable
      any time the submission is currently 'approved' and its stand order (if any) is not yet
      'paid' -- mints a fresh token, re-sends the email. Same "reissue, not unlock" shape as
      F25 (M4); no separate "view existing link" mechanism.
    status: pending
    milestone: M3
    contract: contracts/golden/vendor-gated-registration-flow-m3/README.md
  - id: F29
    name: >-
      Public payment page. app/(marketing)/national-show/vendors/payment/page.tsx -- token-
      gated (client-side UX check via F27's verify, page does not render the pay control if
      missing/expired/malformed; never authorizing by itself, mirrors M1's register page
      posture exactly). Displays business name, a boothSize selector (3 fixed radio options,
      labels verbatim "Single Booth – 2.5m x 3m" / "2 Booths (Double) – 5m x 3m" / "3 Booths
      (Triple) – 7m x 3m" -- same labels F17/M2 plans for the registration form, but this is
      an INDEPENDENT selection, not read from VendorSubmission.boothSize -- see golden
      "Relationship to M2/F17" for why M3 does not wait for or depend on F17), and the price
      for the currently-selected size (503/"pricing not yet confirmed" state rendered plainly
      if lib/vendor-stand-pricing.ts's price is null for every size). New
      lib/vendor-stand-forfeiture-notice.ts exports ONE constant,
      VENDOR_STAND_FORFEITURE_NOTICE, quoting both operative sentences from
      docs/leeann-source/2027-vendor-registration-form_2026-08-26.md lines 242-243 verbatim
      (the 90-day finalisation + no-refund-within-90-days sentences). The page renders this
      constant, sourced only from the constant (never retyped inline), in a visually distinct
      block that precedes the "Pay Now" control in DOM order -- see golden "The 90-day
      forfeiture notice" for why this is a SECOND, independent placement from F20/M2's
      T&Cs-block copy, not a duplicate of it.
    status: pending
    milestone: M3
    contract: contracts/golden/vendor-gated-registration-flow-m3/README.md
  - id: F30
    name: >-
      POST /api/vendors/stand-payment/initiate, body {token, boothSize}. Steps, in order (see
      golden "Initiate" for the full decision record): verify token (generic 403 on any
      failure, same enumeration-blindness posture as M1) -> re-read vendorSubmissions/{id},
      refuse unless status === 'approved' (re-checked fresh, never trusting mint-time state) ->
      validate boothSize is exactly one of {1,2,3} (reject any other value including a
      numerically-equal string) -> resolveVendorStandPrice(boothSize) (F26), 503 with the
      council-blocked message on 'not-configured' BEFORE any Firestore write or gateway call ->
      resolveActiveGateway() (reused verbatim from lib/payments/active-gateway.ts, same
      adminSettings/activePaymentGateway doc the ticket checkout route already reads), 500 if
      unset -> resolveProvider(gateway).readiness('initiate'), refuse if not ready -> ONE
      Firestore transaction on vendorStandOrders.doc(vendorSubmissionId) (doc id ==
      vendorSubmissionId, see golden "Why the doc id is the submission id"): refuse if it
      already exists with status 'paid'; otherwise .set() the fresh
      boothSize/amount/gateway/standOrderRef('VSO-'+vendorSubmissionId)/status:'pending'/
      createdAt/paidAt:null/failedAt:null (a re-initiate legitimately overwrites a prior
      unpaid attempt) -> provider.initiate({reference: standOrderRef, amountFormatted:
      amount.toFixed(2), itemName, returnUrl, cancelUrl, notifyUrl}), returning the redirect
      fields in the same response shape the ticket checkout route already uses. The request
      body's amount/price (if any) is NEVER read -- amount is ALWAYS F26's server-derived
      value, no exception.
    status: pending
    milestone: M3
    contract: contracts/golden/vendor-gated-registration-flow-m3/README.md
  - id: F31
    name: >-
      Idempotent, cross-gateway-guarded settlement. New lib/vendor-stand-payment-notification.ts
      (mirrors lib/tickets-notification.ts's shape) shared by two thin per-gateway routes,
      app/api/vendors/stand-payment/payfast-itn/route.ts and .../ozow-itn/route.ts (same
      "name exactly one provider, never the other" pattern as app/api/tickets/itn/route.ts
      vs .../ozow-itn/route.ts). provider.verifyNotification() first; invalid signature logs
      and no-ops (200, no state change). Parse vendorSubmissionId out of
      notification.reference by stripping the 'VSO-' prefix; malformed/missing -> log, no-op.
      ONE Firestore transaction touching BOTH vendorStandOrders.doc(vendorSubmissionId) AND
      vendorSubmissions.doc(vendorSubmissionId): missing stand order -> no-op; CROSS-GATEWAY
      GUARD -- refuse (logged, no write) unless order.gateway === provider.id, same reasoning
      as lib/orders.ts's markOrderAndPositionPaidByPaymentId expectedGateway check;
      IDEMPOTENCY -- if order.status !== 'pending' (already settled either way), no-op and
      return success, no second write; AMOUNT GUARD -- refuse (logged, order stays 'pending')
      unless notification.grossAmountCents === Math.round(order.amount * 100), the stored
      server-derived amount is the ONLY comparison basis, the notification's amount is never
      written anywhere; on every check passing, update BOTH vendorStandOrders (status:'paid',
      paidAt, gatewayPaymentId) AND vendorSubmissions (paymentReceived: true) as one atomic
      pair -- both-or-neither, same reasoning as lib/checkout-reservation.ts's
      writeReservationPair. Failure/cancellation notifications follow the identical
      transaction shape, writing status:'failed'/'cancelled' + failedAt, never touching
      vendorSubmissions.paymentReceived.
    status: pending
    milestone: M3
    contract: contracts/golden/vendor-gated-registration-flow-m3/README.md
  - id: F32
    name: >-
      Read-only admin visibility. /admin/vendors submission list/detail gains a stand-payment
      status badge ('Not started' / 'Pending' / 'Paid' / 'Failed'), driven by a Firestore read
      of vendorStandOrders/{id} alongside the existing submission query. NO new admin action
      may write vendorStandOrders.status to 'paid' -- only F31's gateway settlement handler
      may do that; an admin "mark paid" control here would be exactly the
      vendor/operator-can-mark-themselves-paid hole the mission's security condition rules
      out. F7's separate, pre-existing manual paymentReceived toggle (EFT/proof-of-upload
      path) is unaffected and stays exactly as it is -- label both signals distinctly in the
      UI so an operator never conflates "gateway-paid" with "office-confirmed" (see golden
      "Relationship to F7's existing manual payment fields" -- whether F7 should eventually be
      retired is an OPEN QUESTION flagged to the orchestrator, not decided here).
    status: pending
    milestone: M3
    contract: contracts/golden/vendor-gated-registration-flow-m3/README.md

