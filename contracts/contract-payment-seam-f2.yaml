    - id: A15
      description: >-
        @architect ruling on the A1 regression the team lead flagged 2026-08-20 (Codex's
        underpayment fix, `parseAmountToCents`, landed inside app/api/tickets/itn/route.ts with a
        doc comment reading "PayFast always sends amount_gross in that exact shape" -- real
        coupling, not a reworded-comment false positive; A1 was doing its job). RULING: parsing a
        gateway's own decimal-string convention into an integer count of cents is a FORMAT
        TRANSLATION -- the same category of work `mapStatus` already does for the gateway's status
        vocabulary -- and belongs in the adapter. Deciding whether the resulting number is close
        enough to the stored order amount (`AMOUNT_MATCH_TOLERANCE_CENTS`) is a judgement about our
        own money and stays in the route exactly as F1's original `grossAmount` doc comment always
        intended ("the provider never decides whether an amount is acceptable") -- that principle is
        preserved, not weakened, because computing cents is not deciding acceptability, no more than
        `mapStatus` returning `'paid'` decides acceptability. `ProviderNotification` gains a seventh
        field, `grossAmountCents: number | null`, computed by the adapter with the SAME parser
        (moved verbatim, never a `Number(x) * 100` float round-trip), null on anything that is not a
        plain non-negative decimal with at most two fraction digits -- same fail-closed behaviour as
        before. `grossAmount` (the raw string) stays for logging. See
        contracts/golden/payment-seam-f1/interface.golden.md, "`grossAmountCents` -- the seventh
        field, and why", for the full reasoning including why an interface-wide 2dp-format
        guarantee was rejected (it would assert Ozow/Peach match PayFast's wire shape before either
        adapter exists -- the CTICC/18-21-September invented-value defect class). The route's
        rejection branch is UNCHANGED IN SHAPE: it already treated a null parse as unparseable and
        refused; it now reads `notification.grossAmountCents` instead of calling a local parser, so
        the one-cent-underpayment rejection and the `'0.0099'` sub-cent rejection both survive
        unchanged. The `m_payment_id` comment hit at itn/route.ts:227 (found in the same A1 run) is
        RULED SEPARATELY AND DIFFERENTLY: it is cosmetic -- E3 exists because `m_payment_id` is OUR
        Firestore field name, not gateway vocabulary, and that rationale applies equally to a
        comment mentioning it; @dev should reword the comment to reference "the same payment
        reference" instead of the literal identifier, since E3's hard count of exactly 1 is meant
        to bound the CODE occurrence (the object key), not silently double-count an explanatory
        comment. No contract change was needed for that one. OBSERVED FAILING by @architect on
        2026-08-20 against the current unfixed route: exit 1, all three sub-checks fire (local
        parser present, fraction-digit regex present, notification.grossAmountCents never read).
