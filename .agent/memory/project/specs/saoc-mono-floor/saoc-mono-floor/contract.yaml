# Source: NOS Design ruling P2 (final), .tmp/sandbox/queue/split-f3-notes.md. Run from the repo root of the worktree .tmp/sandbox/mono-floor.
# Step 0 for @dev, before any edit: build, then `node .../checks/gate-mono.mjs record-nos` and commit nos-baseline.json (goldens/spec.md section 3).
# A6-A8 need the A5 build and none may run with BETA_PASSWORD_WALL_OFF set.
schema: athanor.contract/v1
slug: saoc-mono-floor
goal: Every SAOC mono label renders at 12px or larger with tracking and case unchanged, and NOS mono sizes are unchanged.
created_at: '2026-10-24'
autonomy: high
exclusions:
  - item: 'admin exclusion from the floor'
    reason: 'Decision D4: one site-wide rule; admin labels reach 12px too. Admin is outside the probe.'
  - item: 'mono label line-height and wrapping at 390'
    reason: 'Not in the ruling; reviewed by eye by NOS Design.'
features:
  - id: F1
    name: SAOC mono type tokens, the hard-coded scanner pill and one floor rule for Tailwind literals raised to 12px
    status: pending
goldens:
  - .agent/memory/project/specs/saoc-mono-floor/goldens/spec.md
  - .agent/memory/project/specs/saoc-mono-floor/goldens/checks.sha256
assertions:
  phase: 4
  checks:
    - id: A1
      description: frozen goldens and check scripts are unmodified since the architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/saoc-mono-floor/goldens/checks.sha256
    - id: A2
      description: static - mono tokens at least 12px, tracking and case intact, the global floor rule covers every sub-12px font-mono literal in source, no NOS file changed, NOS baseline committed
      command: node .agent/memory/project/specs/saoc-mono-floor/checks/check-static.mjs
    - id: A3
      description: diff limited to app/globals.css, e2e specs, docs, the baseline and this spec
      command: node .agent/memory/project/specs/saoc-mono-floor/checks/check-diff-scope.mjs
    - id: A4
      description: typescript compiles
      command: pnpm exec tsc --noEmit
    - id: A5
      description: production build passes (Sanity ids from apphosting.yaml, local site URLs, wall-off flag unset)
      command: bash .agent/memory/project/specs/saoc-mono-floor/checks/build.sh
    - id: A6
      description: computed font-size of every SAOC mono-face element is at least 12px on eleven SAOC routes at 1280 and 390
      command: node .agent/memory/project/specs/saoc-mono-floor/checks/gate-mono.mjs saoc
    - id: A7
      description: NOS non-regression - mono-role element size, tracking and case unchanged against the pristine baseline on three NOS routes at 1280 and 390
      command: node .agent/memory/project/specs/saoc-mono-floor/checks/gate-mono.mjs nos
    - id: A8
      description: lint is clean
      command: pnpm exec eslint app components lib e2e
    - id: A9
      description: CI's full e2e step is green
      command: bash scripts/ci-e2e.sh pnpm test:e2e
