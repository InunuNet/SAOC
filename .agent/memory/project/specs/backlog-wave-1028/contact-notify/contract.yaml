schema: athanor.contract/v1
slug: contact-notify
goal: Every stored contact submission notifies the admin allowlist, and any email failure is recorded on the submission and logged without secrets or message content.
created_at: '2026-10-28'
autonomy: high
features:
  - id: F1
    name: Contact submission admin notice reports its outcome and delivery status is recorded on the doc
    status: pending
goldens:
  - .agent/memory/project/specs/backlog-wave-1028/contact-notify/goldens/spec.md
  - .agent/memory/project/specs/backlog-wave-1028/contact-notify/goldens/proof-on-main.md
assertions:
  phase: 4
  checks:
    - id: A1
      description: Notice goes to exactly the ADMIN_EMAIL_ALLOWLIST recipients (normalised), never the submitter, and reports sent / no_recipients
      command: pnpm exec tsx contracts/checks/contact-notify/check.mts recipients
    - id: A2
      description: A Resend failure (visitor, admin, both, or the status write) never throws, other send still runs, status is recorded on the doc
      command: pnpm exec tsx contracts/checks/contact-notify/check.mts failure
    - id: A3
      description: No undefined own property in the built doc (emailDelivery nulls) or any recorded status; status recorded exactly once
      command: pnpm exec tsx contracts/checks/contact-notify/check.mts noundefined
    - id: A4
      description: Failure logs carry operation and exceptionType only; no secret, address, name or message body; route has no raw error logging
      command: pnpm exec tsx contracts/checks/contact-notify/check.mts logs
    - id: A5
      description: Visitor acknowledgement behaviour unchanged (subject, recipient, NOS variant) and each email sent exactly once
      command: pnpm exec tsx contracts/checks/contact-notify/check.mts visitor
    - id: A6
      description: Route wiring, delivery strictly after the write, 201 retained, recipients via the allowlist helper, delivery module pure
      command: pnpm exec tsx contracts/checks/contact-notify/check.mts wiring
