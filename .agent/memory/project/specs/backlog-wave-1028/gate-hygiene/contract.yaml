schema: athanor.contract/v1
slug: gate-hygiene
goal: Repair the stale SAOC sitemap golden, make isUpcoming() free of Date statics, and add an HTTP-level test that checkout refuses a day-selection position with no chosenDay.
created_at: '2026-10-28'
autonomy: high

features:
  - id: F1
    name: Sitemap checks green on main and proven to fail on a broken sitemap (test data only)
    status: pending
  - id: F2
    name: isUpcoming() uses no Date statics, results unchanged (product change in lib/sast-date.ts only)
    status: pending
  - id: F3
    name: Mocked-request test that POST /api/tickets/checkout rejects requiresDaySelection with no chosenDay (test only)
    status: pending

goldens:
  - .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/goldens/sitemap-golden-fix.patch
  - .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/goldens/sast-isupcoming-table.json
  - .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/goldens/proof-on-main.md

assertions:
  phase: 4
  checks:
    - id: A1
      description: F1 golden lists /memorandum-of-incorporation and no longer /constitution (fails on main, stale golden)
      command: grep -q '"/memorandum-of-incorporation"' contracts/golden/saoc-seo-polish/sitemap-expected.json
    - id: A2
      description: F1 saoc-seo-polish sitemap check passes (fails on main)
      command: pnpm exec tsx contracts/checks/saoc-seo-polish/check-sitemap-routes.mts
    - id: A3
      description: F1 audit-fixes NOS sitemap check still passes (already green on main; regression guard)
      command: pnpm exec tsx contracts/checks/audit-fixes-2026-10-25/check-sitemap-routes.mts
    - id: A4
      description: F1 both sitemap checks pass unmutated and fail on eleven deliberately broken sitemaps (extra route in each list, plus dropped wiring in app/sitemap.ts caught by the built-sitemap check) (fails on main at the baseline)
      command: pnpm exec tsx .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/checks/check-sitemap-mutations.mts
    - id: A14
      description: F1 the BUILT sitemap (real default export of app/sitemap.ts, both hosts, mocked Sanity/Firestore) matches the golden SAOC statics, the manifest-derived NOS routes and /contact
      command: pnpm exec tsx .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/checks/check-built-sitemap.mts
    - id: A5
      description: F2 isUpcoming has no Date.parse/UTC/now and 21 table rows match under real and statics-less Date (fails on main)
      command: pnpm exec tsx .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/checks/check-isupcoming-no-date-statics.mts
    - id: A6
      description: F3 checkout route returns the F5 400 for a day-selection type with no chosenDay, 4xx for null, no Firestore write, no outbound payment call (regression guard; passes on main, A7 proves it can fail)
      command: pnpm exec tsx .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/checks/check-checkout-day-null.mts
    - id: A7
      description: F3 mutation proof, A6 fails on four route mutants (guard disabled, flag derived from one slug, every type day-required, guard checks only the first line item)
      command: pnpm exec tsx .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/checks/check-checkout-day-mutation.mts
    - id: A8
      description: Scope guard, the only product file changed under app, lib, components or sanity is lib/sast-date.ts (vacuous on main, guards the dev diff)
      command: "! git diff --name-only origin/main -- app lib components sanity | grep -qv '^lib/sast-date.ts$'"
    - id: A9
      description: Checks left no mutation behind, route and sitemap sources equal origin/main
      command: git diff --quiet origin/main -- app/api/tickets/checkout/route.ts app/sitemap.ts lib/saoc-sitemap-routes.ts lib/nos-sitemap-routes.ts
    - id: A10
      description: Codex adversarial QA scoped to the actual change (lib/sast-date.ts and the sitemap golden JSON); pre-existing behaviour in unchanged files is out of scope
      type: codex_qa
      target: >-
        Review ONLY the product diff of git diff origin/main...HEAD on feat/gate-hygiene, which is lib/sast-date.ts
        (isUpcoming no longer calls Date statics) and contracts/golden/saoc-seo-polish/sitemap-expected.json
        (/constitution became /memorandum-of-incorporation). Judge two things only: is the isUpcoming change
        behaviour-preserving for string inputs, and would the checks in
        .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/checks/ fail if either of THOSE two changes were
        reverted or broken. Pre-existing behaviour in unchanged files (route.ts, app/sitemap.ts, lib/*sitemap-routes.ts) and
        check-strength gaps on that unchanged code are out of scope; do not report them. Numeric `date` inputs are out of
        scope (typed string).
      required: true
    - id: A11
      description: browser_deployed_check on beta /events, declared for the triad linter but non-required. It cannot pass while the beta Basic Auth wall is up, because its live re-check (execution/browser_deployed_check.sh:188) sends no auth and gets 401 (HARNESS defect, backlog.md 2026-10-07 entry "browser_deployed_check.sh's own independent live re-check cannot pass for ANY page"). A13 is the real post-deploy proof.
      type: browser_deployed_check
      target: .agent/memory/scratch/gate-hygiene-browser-manifest.json
      required: false
    - id: A12
      description: gws inbox check is not applicable (no email path is touched); declared non-required only to satisfy the triad coverage linter, expected to skip
      type: gws_inbox_check
      target: .agent/memory/scratch/gate-hygiene-gws-manifest.json
      required: false
    - id: A13
      description: RUN AFTER DEPLOY from the project root (needs .env.local, which a worktree lacks, so it is inconclusive/exit 2 inside the gate), non-required, not a pre-deploy gate assertion. Plain check (not the browser_deployed_check kind, see A11) that beta /events returns 200 and lists at least one upcoming event; reads BETA_BASIC_AUTH_USER/PASSWORD inside the script, never printed. Exit 77 (contract.py skip) if credentials are absent; the gate then needs --allow-skips.
      command: node --env-file-if-exists=.env.local .agent/memory/project/specs/backlog-wave-1028/gate-hygiene/checks/check-deployed-events-upcoming.mjs
      required: false
