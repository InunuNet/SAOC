schema: athanor.contract/v1
slug: saoc-dc-f1c-headings-heroes
goal: One h2 role and one inner-hero height per width on the SAOC host.
created_at: '2026-10-28'
autonomy: high

features:
  - id: F1
    name: SA-6 h2 role, Title role, inner PageHero height
    status: pending

goldens:
  - .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/h2-roles.md
  - .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/hero-heights.md
  - .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/proof-on-main.md

assertions:
  phase: 4
  checks:
    - id: A1
      description: "Every main h2 is the H2 role (serif 300, clamp(32,29+0.762vw,44), lh 1.15) or the Title role (serif 400, 20-22) at 390, 1440, 2056 (fails on main, 150 violations)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-h2-roles.mjs"
    - id: A2
      description: "Inner PageHero locked at 480 +-4 at 1440 and 2056 and at 768 (all 8 routes, /about included), copy padding identical across routes (NOS Design confirmed; passes on main, a lock, not a red check; 1024 and 1280 moved to report-only A8)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-heights.mjs"
    - id: A3
      description: "Codex adversarial QA of the whole diff against the goldens and proof-on-main"
      type: codex_qa
      target: >-
        Adversarially review git diff origin/main...HEAD against the goldens in .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/. Find an input, width or route where the claimed fix does not hold and the checks still pass.
      required: true
    - id: A4
      description: "browser_deployed_check on beta /about, declared for the triad linter but non-required. It cannot pass while the beta Basic Auth wall is up (execution/browser_deployed_check.sh live re-check sends no auth, HARNESS defect, backlog.md 2026-10-07). The authenticated post-deploy shell assertion is the real proof."
      type: browser_deployed_check
      target: .agent/memory/scratch/saoc-dc-f1c-browser-manifest.json
      required: false
    - id: A5
      description: "gws inbox check, no email path is touched; declared non-required to satisfy the triad coverage linter, expected to skip"
      type: gws_inbox_check
      target: .agent/memory/scratch/saoc-dc-f1c-gws-manifest.json
      required: false
    - id: A6
      phase: 5
      description: "RUN AFTER DEPLOY (phase 5, not part of the phase 4 gate). H2 roles including Home and Events list on the deployed site. Plain shell check (not the browser_deployed_check kind, see above); reads BETA_BASIC_AUTH_USER/PASSWORD inside the scripts, never printed."
      command: "DC_BASE_URL=https://beta.saoc.co.za node --env-file-if-exists=.env.local .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-h2-roles.mjs"
    - id: A7
      description: "Mobile (<768) anatomy: every photo band uses one aspect-ratio (2/1) and every route's copy block one padding (40px) at 390 and 600. Guard, passes on main (PageHero already uses aspect-[2/1] and py-10); there is no equal-height gate below 768"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-mobile-anatomy.mjs"
    - id: A8
      description: "LOCK (NOS Design, amended): all 8 non-exempt routes 480 +-4 at 1024 and 1280, /about included. 1024 accepted by eye with the 14ch facts band, so no CASE B and no allowance. Fails on main (/about 496 at 1024, 545 at 1280)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-heights-report.mjs"
    - id: A9
      description: "/about facts (NOS Design option b): dt max-width exactly 14ch at 1024-1279 ONLY, 18ch at 768 and from 1280, balanced wrap, <=3 lines; gap 24, dd nowrap and >=24px at 768/1024/1280; at 1024 and 1280 also one row (dd tops +-1) and no overflow; copy column stays 48% and scrim 44%/52%/0.8 (fails on main: facts wrap, gap 40, dt 26ch)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-facts-row.mjs"
    - id: A10
      description: "Weight band on every SAOC hero dd: serif 300 at >=32px, 400 at 24-31.99px, at 390/768/1024/1280/1440/2056 (fails on main: dd is 300 at every size, 24-29px at 390-1024)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-dd-weight.mjs"
    - id: A11
      description: "The .hero-facts levers are global: the selector is styled only in app/globals.css on the SAOC host, never per route (guard, passes on main)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-facts-global.mjs"
    - id: A12
      phase: 5
      description: "RUN AFTER DEPLOY (phase 5; events need live Sanity, so locally this prints KNOWN GAP). /events/[slug] facts (factsAlign=start) at 1024/1200/1280/1440/2056: no word breaks mid-word (1 client rect per word in every dd and dt), overflow-wrap normal, cell min-width min-content, dd balanced <=3 lines, no overflow, dt.left = dd.left +-1, a wrapped row starts at h1.left +-1, gap 24 below 1280, dd weight 400 below 32px. Route: the 19th national show event, else the first event. Fails on beta/main (Western Cape breaks Wester/n, overflow-wrap anywhere)"
      command: "DC_BASE_URL=https://beta.saoc.co.za node --env-file-if-exists=.env.local .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-event-facts.mjs"
    - id: A13
      description: "SAOC /404: a parchment gap of at least 64px between the band's bottom and the footer's top at 390, 1440 and 2056 (fails on main: gap 0, the band runs into the dark footer)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-404-footer-gap.mjs"
