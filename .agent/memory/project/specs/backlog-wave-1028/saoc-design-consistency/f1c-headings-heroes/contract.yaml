schema: athanor.contract/v1
slug: saoc-dc-f1c-headings-heroes
goal: One h2 role and one inner-hero height per width on the SAOC host.
created_at: '2026-10-28'
autonomy: high

features:
  - id: F1
    name: SA-6 h2 role, Title role, inner PageHero height
    status: pending

goldens:
  - .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/h2-roles.md
  - .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/hero-heights.md
  - .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/event-facts-404.md
  - .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/proof-on-main.md

assertions:
  phase: 4
  checks:
    - id: A0
      description: "Check integrity (runs first): every check script and lib under checks/ matches its pinned sha256 in goldens/checks.sha256, so a check cannot be edited to exit 0 while the gate stays green. Any other assertion's result is void when this is red"
      command: "shasum -a 256 -c .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/checks.sha256"
    - id: A1
      description: "Every main h2 is the H2 role (serif 300, clamp(32,29+0.762vw,44), lh 1.15) or the Title role (serif 400, 20-22) at 390, 1440, 2056 (fails on main, 150 violations)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-h2-roles.mjs"
    - id: A2
      description: "Hero bands (NOS Design HM-8 ruling, final): at 768 all 8 routes 480 +-4 (unchanged, copy padding identical). At 1440 and 2056 the 480 +-4 lock applies ONLY to the photographic heroes (/about, /judging, /sponsors); typographic heroes (/members, /memorandum-of-incorporation, /privacy, /terms, /refunds, /events/submit, first /societies/[slug], /404) size to content: band = copy block + 2 x clamp(64px, 6vw, 96px) +-2. Also h1.left one axis (+-1) across photographic heroes, typographic h1 on the breadcrumb left (+-1)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-heights.mjs"
    - id: A3
      description: "Codex adversarial QA of the whole diff against the goldens and proof-on-main"
      type: codex_qa
      target: >-
        Adversarially review git diff origin/main...HEAD against ONLY these goldens: .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/h2-roles.md, .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/hero-heights.md, .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/event-facts-404.md, and the F1c section of proof-on-main.md (the other features' goldens in that directory are out of scope). Focus rings belong to F1a; nav to F1b; arrow glyphs and fonts to F1e. Do not fail F1c on another feature's golden. Find an input, width or route where the claimed fix does not hold and the checks still pass.
      required: true
    - id: A4
      phase: 5
      description: "PHASE 5 (manifest is written by the post-deploy BrowserAgent/gws run, so it cannot exist at the phase 4 gate). browser_deployed_check on beta /about, declared for the triad linter but non-required. It cannot pass while the beta Basic Auth wall is up (execution/browser_deployed_check.sh live re-check sends no auth, HARNESS defect, backlog.md 2026-10-07). The authenticated post-deploy shell assertion is the real proof."
      type: browser_deployed_check
      target: .agent/memory/scratch/saoc-dc-f1c-browser-manifest.json
      required: false
    - id: A5
      phase: 5
      description: "PHASE 5 (manifest is written by the post-deploy BrowserAgent/gws run, so it cannot exist at the phase 4 gate). gws inbox check, no email path is touched; declared non-required to satisfy the triad coverage linter, expected to skip"
      type: gws_inbox_check
      target: .agent/memory/scratch/saoc-dc-f1c-gws-manifest.json
      required: false
    - id: A6
      phase: 5
      description: "RUN AFTER DEPLOY (phase 5, not part of the phase 4 gate). H2 roles including Home and Events list on the deployed site. Plain shell check (not the browser_deployed_check kind, see above); reads BETA_BASIC_AUTH_USER/PASSWORD inside the scripts, never printed."
      command: "DC_BASE_URL=https://beta.saoc.co.za node --env-file-if-exists=.env.local .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-h2-roles.mjs"
    - id: A7
      description: "Mobile (<768) anatomy: every photo band uses one aspect-ratio (2/1) and every route's copy block one padding (40px) at 390 and 600. Guard, passes on main (PageHero already uses aspect-[2/1] and py-10); there is no equal-height gate below 768"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-mobile-anatomy.mjs"
    - id: A8
      description: "Same HM-8 hero-band gate as A2 at 1024 and 1280 (photographic 480 +-4, /about included; typographic = copy + 2 x clamp(64px, 6vw, 96px) +-2; h1/breadcrumb axes). 1024 accepted by eye with the 14ch facts band"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-heights-report.mjs"
    - id: A9
      description: "/about facts: dt max-width exactly 14ch at 1024-1279 ONLY, 18ch at 768 and from 1280, balanced wrap, <=3 lines; gap 24, dd nowrap and >=24px at 768/1024/1280; at 1024 and 1280 also one row (dd tops +-1) and no overflow; copy column stays 48%. Scrim (NOS Design HM-5 ruling, final): the copy scrim is the eased ramp alpha 0@34 .06@38 .16@42 .32@45 .52@48 .70@50.5 .80@52 (%), peak <=.8, left 0-39% alpha <=.1, and NO scrim below 768 (390 and 600 display none)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-facts-row.mjs"
    - id: A10
      description: "Weight band on every SAOC hero dd: serif 300 at >=32px, 400 at 24-31.99px, at 390/768/1024/1280/1440/2056 (fails on main: dd is 300 at every size, 24-29px at 390-1024)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-dd-weight.mjs"
    - id: A11
      description: "The .hero-facts levers are global: the selector is styled only in app/globals.css on the SAOC host, never per route (guard, passes on main)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-facts-global.mjs"
    - id: A12
      phase: 5
      description: "RUN AFTER DEPLOY (phase 5; events need live Sanity, so locally it FAILS: zero event facts rendered is never a pass). /events/[slug] facts (factsAlign=start, NOS Design ruling 3: START-aligned, not centred by default, HM-7) at 1024/1200/1280/1440/2056: every cell dt.left = dd.left +-1 and the first cell left = h1.left +-1; the row is flex-wrap and a wrapped row starts at h1.left +-1; wrap only at spaces (1 client rect per word in every dd and dt), dd white-space not nowrap (nowrap is the centred variant), overflow-wrap normal, cell min-width min-content, dd <=3 lines, no overflow, gap 24 below 1280, dd weight 300 at >=32px and 400 at 24-31.99px. Route: the 19th national show event, else the first event. Dropping overflow-wrap anywhere, min-width 0 and the >=1024 nowrap is ratified. Local gap: no fixture renders an event, so the start variant was proved on /about with data-facts-align switched to start (same rules)"
      command: "DC_BASE_URL=https://beta.saoc.co.za node --env-file-if-exists=.env.local .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-event-facts.mjs"
    - id: A13
      description: "SAOC /404: a parchment gap of at least 64px between the band's bottom and the footer's top at 390, 1440 and 2056 (fails on main: gap 0, the band runs into the dark footer)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-404-footer-gap.mjs"

    - id: A14
      description: "/about tablet band (NOS Design ruling (a), final), prod build with fixtures at 769/880/960/1023: /about facts take <=2 rows, no mid-word break, no overflow; /about hero <=520; the other 7 routes 480 +-4. The 480 +-4 lock at 768/1024/1280/1440/2056 stays with A2/A8. Measured on F1c dev 271aacfc: /about 480/488/504/516, others 480, 2 rows max"
      command: "DC_PROD=1 node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-about-tablet-band.mjs"

    - id: A15
      description: "Scrim contrast (NOS Design HM-5 ruling, final): with the copy hidden, the worst pixel under every hero text box on /about, /judging, /sponsors at 768/1024/1280/1440/2056 contrasts with the text colour >=4.5:1, or >=3:1 for text boxes >=30px tall. Text on its own fill (buttons, the eyebrow pill) is measured against that fill and skipped"
      command: "DC_PROD=1 node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-hero-scrim-contrast.mjs"
      timeout_seconds: 1500

    - id: A16
      description: "LG-RF holds on the legal pages (NOS Design, comms.md 2026-10-25/26/27, ruling 2026-10-28), /privacy /terms /refunds at 390/1440/2056: no eyebrow, no max-w-[720px] in main, draft notice has no box border and a transparent fill; index = h2 (links are the h2 list in order, counts 11/19/9); every h2 margin-top 56 and 56 +-1 below the prose above. The draft notice on /refunds and /members is 15px with a 1px solid rule below (one shared DraftNotice). /judging, /members and /404 keep their eyebrows (not asserted)"
      command: "DC_PROD=1 node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-legal-lg-rf.mjs"
      timeout_seconds: 1500
