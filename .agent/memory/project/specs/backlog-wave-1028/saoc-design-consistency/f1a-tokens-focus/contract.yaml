schema: athanor.contract/v1
slug: saoc-dc-f1a-tokens-focus
goal: SAOC base defines the three status tokens, one focus ring, 24px breadcrumb targets and a legible newsletter field, using existing tokens only.
created_at: '2026-10-28'
autonomy: high

features:
  - id: F1
    name: Status tokens, error-summary style, focus ring, breadcrumb targets, newsletter contrast
    status: pending

goldens:
  - .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/status-tokens.md
  - .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/proof-on-main.md

assertions:
  phase: 4
  checks:
    - id: A1
      description: "Status tokens --status-error #8f2834, --status-success #2f5d3a, --status-warning #7a5a12 resolve on the SAOC base (fails on main, all empty)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-status-tokens.mjs"
    - id: A2
      description: "EVERY alert (role=alert or aria-live=assertive, enumerated under app/ and components/, NOS chrome excluded) is classified: listed in goldens/alert-classes.json as (b) field-level or (c) notice with a reason, otherwise it is an (a) error summary: border-2 status-error, aria-hidden icon, status-error text, no tint. New alerts default to (a); a stale classification entry fails (fails on main and on any alert missing its border)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-error-summary-static.mjs"
    - id: A3
      description: "Breadcrumb links are >=24x24 at 390 and 1440 on six interior routes (fails on main, Home is 37x19)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-breadcrumb-targets.mjs"
    - id: A4
      description: "One focus ring (2px solid, offset 3px, >=3:1 on its ground) on the header logo, Menu, Join (header and open 390 drawer) and footer links, matching the hero CTA ring; PLUS a static enumeration of every className under app/ and components/ (NOS-host-only code excluded) carrying focus ring-*, ring-offset-* or focus outline-none: each must be the one ring or be listed in goldens/focus-classes.json with a reason, and a stale entry fails (fails on main and on 894de972)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-focus-ring.mjs && node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-focus-classes-static.mjs"
    - id: A5
      description: "Footer newsletter placeholder >=4.5:1 and field border >=3:1 (fails on main, 3.00 and 1.85)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-newsletter-contrast.mjs"
    - id: A6
      description: "Scope guard: no new hex colour literal added under components/ or app/ outside globals.css token definitions for the three status values (fails if the dev invents a colour)"
      command: "node .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-no-new-colours.mjs"
    - id: A7
      description: "Codex adversarial QA of the whole diff against the goldens and proof-on-main"
      type: codex_qa
      target: >-
        Adversarially review git diff origin/main...HEAD against the goldens in .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/goldens/. Find an input, width or route where the claimed fix does not hold and the checks still pass.
      required: true
    - id: A8
      phase: 5
      description: "PHASE 5 (manifest is written by the post-deploy BrowserAgent/gws run, so it cannot exist at the phase 4 gate). browser_deployed_check on beta /about, declared for the triad linter but non-required. It cannot pass while the beta Basic Auth wall is up (execution/browser_deployed_check.sh live re-check sends no auth, HARNESS defect, backlog.md 2026-10-07). The authenticated post-deploy shell assertion is the real proof."
      type: browser_deployed_check
      target: .agent/memory/scratch/saoc-dc-f1a-browser-manifest.json
      required: false
    - id: A9
      phase: 5
      description: "PHASE 5 (manifest is written by the post-deploy BrowserAgent/gws run, so it cannot exist at the phase 4 gate). gws inbox check, no email path is touched; declared non-required to satisfy the triad coverage linter, expected to skip"
      type: gws_inbox_check
      target: .agent/memory/scratch/saoc-dc-f1a-gws-manifest.json
      required: false
    - id: A10
      phase: 5
      description: "RUN AFTER DEPLOY (phase 5, not part of the phase 4 gate). Status tokens and the Home hero CTA ring on the deployed SAOC host. Plain shell check (not the browser_deployed_check kind, see above); reads BETA_BASIC_AUTH_USER/PASSWORD inside the scripts, never printed."
      command: "DC_BASE_URL=https://beta.saoc.co.za node --env-file-if-exists=.env.local .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-status-tokens.mjs"
    - id: A11
      phase: 5
      description: "RUN AFTER DEPLOY (phase 5, not part of the phase 4 gate). Focus ring on deployed Home and About. Plain shell check (not the browser_deployed_check kind, see above); reads BETA_BASIC_AUTH_USER/PASSWORD inside the scripts, never printed."
      command: "DC_BASE_URL=https://beta.saoc.co.za node --env-file-if-exists=.env.local .agent/memory/project/specs/backlog-wave-1028/saoc-design-consistency/checks/check-focus-ring.mjs"
