      description: scripts/seed-ticketing.ts itself is byte-unchanged by this feature — the new product's creation needs no new seeding code, only F2's data change
      command: git diff --quiet HEAD -- scripts/seed-ticketing.ts

    - id: A14
      description: scripts/migrate-conference-workshop-tickets.ts exports a pure buildMigrationPatches() keyed by Sanity _id, built from lib/provisional-figures.ts's live exports — both the dry-run and --apply paths call this same function, so they cannot diverge
      command: node contracts/checks/conference-workshop-tickets-f3/check-migration-plan-export-shape.mjs

    - id: A15
      description: buildMigrationPatches() patches every one of the seven pre-existing documents F1/F2 changed, with ticketType-saoc-symposium/ticketType-wosa-conference's patch explicitly setting price 2000, capacity 80, earlyBirdCutoff null, and no tranche-named key
      command: node contracts/checks/conference-workshop-tickets-f3/check-migration-patches-all-slugs.mjs

    - id: A16
      description: 'GAP FOUND by a read-only Sanity query on the live dataset (2026-10-07): buildMigrationPatches() sets active:false on every one of the four RETIRED_CONFERENCE_SLUGS documents, with the four target _ids computed FROM the RETIRED_CONFERENCE_SLUGS constant (not a hand-typed duplicate list) — this is the gap this correction fixes'
      command: node contracts/checks/conference-workshop-tickets-f3/check-migration-retires-conference-slugs.mjs

    - id: A17
