      description: this feature's diff does NOT touch poolConfigByType/planPooledCapacity construction — proves shared-pool enforcement needed zero code change, only Sanity data classification
      command: "! git diff HEAD -- app/api/tickets/checkout/route.ts | grep -qE \"^[+-].*poolConfigByType\\s*=|^[+-].*planPooledCapacity\\(\""

    - id: A24
      description: a day-visitor-shaped ticket purchase for an excluded day (2027-09-23) is rejected end to end against a real dry-run of the updated validation logic
