      description: the script never deletes a document
      command: "! grep -qE \"\\.delete\\(\" scripts/migrate-conference-workshop-tickets.ts"

    - id: A19
      description: the script creates zero conferencePresenter or workshopSession documents
      command: "! grep -qE \"conferencePresenter|workshopSession\" scripts/migrate-conference-workshop-tickets.ts"

    - id: A20
      description: the script makes no change to field-trip and imports nothing from lib/vendor-stand-pricing.ts
      command: "! grep -qE \"field-trip|vendor-stand-pricing\" scripts/migrate-conference-workshop-tickets.ts"

