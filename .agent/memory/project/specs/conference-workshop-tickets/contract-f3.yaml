schema: athanor.contract/v1
slug: conference-workshop-tickets
goal: >
  Sanity schema (one new additive field, excludedDays) + correct-polarity migration +
  checkout-route enforcement wiring, covering F1's conference/workshop figures and F2's
  admission/evening-product reconciliation (REVISED for Brad's message 6: shared 500-ticket
  early-bird pool across weekend-pass-early-bird + early-bird, no date cutoff; Thursday
  excluded from Day Pass days). Add conferencePresenter + workshopSession document types
  (carried forward, unaffected by message 6). Write
  scripts/migrate-conference-workshop-tickets.ts with correct flag-before-client polarity
  (default dry-run, --apply the only mutating path) — patching (never creating) the seven
  pre-existing ticketType documents F1/F2 change values on. weekend-pass-early-bird is
  deliberately NOT created by this script — scripts/seed-ticketing.ts's existing, unmodified
  createIfNotExists loop over ADMISSION_PRODUCTS creates it with zero new code, once F2
  ships. Wire app/api/tickets/checkout/route.ts with one small additive excludedDays
  read-and-check alongside the existing isValidChosenDay() call (route.ts:645-662) — and
  prove the shared-pool enforcement needs ZERO code change there, since
  poolConfigByType/planPooledCapacity already read capacityPool/headcountPerUnit
  generically from every ticketType's own Sanity document.
created_at: '2026-10-07'
autonomy: high
features:
  - id: F3
    name: Sanity schema (excludedDays) + migration + checkout-route pool/day-exclusion enforcement wiring
    status: pending
goldens:
  - .agent/memory/project/specs/conference-workshop-tickets/goldens/f2-sanity-schema-migration.golden.md
assertions:
  phase: 4
  checks:
    - id: A1
      description: ticketType schema carries the new excludedDays field
      command: grep -q "excludedDays" sanity/schemas/documents/ticketType.ts

    - id: A2
      description: ticketType schema already has capacityPool/headcountPerUnit (confirms reuse, not re-add) — this feature's diff does not touch either field's schema definition
      command: "! git diff HEAD -- sanity/schemas/documents/ticketType.ts | grep -qE \"^\\+.*capacityPool|^\\+.*headcountPerUnit\""

    - id: A3
      description: earlyBirdTrancheSize is NOT present in the ticketType schema — it was dropped before ever being added (F1's message-6 revision)
      command: "! grep -q \"earlyBirdTrancheSize\" sanity/schemas/documents/ticketType.ts"

    - id: A4
      description: conferencePresenter document schema file exists
      command: test -f sanity/schemas/documents/conferencePresenter.ts

    - id: A5
      description: workshopSession document schema file exists
      command: test -f sanity/schemas/documents/workshopSession.ts

    - id: A6
      description: both new document types are registered in the schema index
      command: grep -q "conferencePresenter" sanity/schemas/index.ts

    - id: A7
      description: both new document types are registered in the schema index
      command: grep -q "workshopSession" sanity/schemas/index.ts

    - id: A8
      description: conferencePresenter's provenance field has no initialValue
      command: node contracts/checks/conference-workshop-tickets-f3/check-provenance-no-initial-value.mjs sanity/schemas/documents/conferencePresenter.ts

    - id: A9
      description: workshopSession's provenance field has no initialValue
      command: node contracts/checks/conference-workshop-tickets-f3/check-provenance-no-initial-value.mjs sanity/schemas/documents/workshopSession.ts

    - id: A10
      description: migration script exists and checks --apply before any createClient construction
      command: "test \"$(grep -n \"argv.includes('--apply')\" scripts/migrate-conference-workshop-tickets.ts | head -1 | cut -d: -f1)\" -lt \"$(grep -n \"createClient(\" scripts/migrate-conference-workshop-tickets.ts | head -1 | cut -d: -f1)\""

    - id: A11
      description: dry run (no --apply) needs zero Sanity env vars and exits 0
      command: env -u SANITY_API_TOKEN -u NEXT_PUBLIC_SANITY_PROJECT_ID -u NEXT_PUBLIC_SANITY_DATASET node --import tsx/esm scripts/migrate-conference-workshop-tickets.ts

    - id: A12
      description: the migration script never mentions weekend-pass-early-bird — its creation is deliberately left to the unmodified seed-ticketing.ts, not special-cased here
      command: "! grep -q \"weekend-pass-early-bird\" scripts/migrate-conference-workshop-tickets.ts"

