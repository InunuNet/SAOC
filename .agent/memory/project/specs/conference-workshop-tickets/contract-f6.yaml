schema: athanor.contract/v1
slug: conference-workshop-tickets
goal: >
  Ticket/presenter/workshop view-model layer + server-side loaders + inert placeholder
  wiring into existing pages, per Brad's re-scope (2026-10-07, relayed by team-lead): this
  mission builds payment/ticket data engineering only; the separate NOS design peer
  session (saoc-nos-design-f1) owns ALL visual/UI design. Defines pure TypeScript
  interfaces (TicketCardState with a pinned precedence order, ScarcityLine,
  TicketCardViewModel [scarcity + days], PresenterCardViewModel,
  WorkshopSessionViewModel) and LOW_STOCK_THRESHOLD_PERCENT (10), plus three server-side
  loader functions (loadTicketCardViewModel, loadPresenterViewModels,
  loadWorkshopSessionViewModels) reusing F1's computeEarlyBirdRemaining and F4's new
  getPoolRemaining()/capacity-pool mechanisms — zero new capacity or counting
  computation. REVISED for team-lead's third-pass correction (2026-10-07): the live "N
  left" counters are confirmed in scope for EVERY in-scope product (VIP 200, Cocktails
  200, Symposium 80, WOSA 80, workshop 10, shared EB pool 500, Day Pass per-day 1000 x3,
  Weekend Pass's own 300-estimate) — NOT a flagged/optional idea, since Brad has
  confirmed he wants them and the NOS design peer is designing cards that show them.
  REVISED AGAIN per the design peer's own request (relayed by team-lead, same day): Day
  Pass is one card with a Fri/Sat/Sun selector, so per-day scarcity is an ordered `days`
  array on TicketCardViewModel (`Array<{day, state, remaining, total}> | null`), not a
  bare Record — each day needs its OWN TicketCardState (Saturday can be soldOut while
  Friday is available, which a single ScarcityLine can't express) and array order fixes
  Fri/Sat/Sun order without relying on key-insertion order. day-visitor/early-bird get
  `days` (true independent Friday/Saturday/Sunday counts); early-bird additionally gets
  its own unqualified shared-pool `scarcity` simultaneously (two independent ceilings,
  two readings). Wires each loader into its page
  as one additive server call whose result is passed as a prop; the existing JSX output
  stays byte-for-byte unchanged. Zero JSX, zero styling, zero visual component — that is
  F7, blocked on the NOS design handoff. Carries the mission's comms.md handoff (to
  saoc-nos-design-f1) and docs obligations, since this feature's output is exactly what
  that design peer renders against. Declares codex_qa + browser_deployed_check. REVISED
  2026-10-07 (team-lead, triad-linter fix): gws_inbox_check IS declared too (A28) — this
  feature changed lib/data/tickets.ts's firebase-admin import, and that file sits on the
  real checkout-to-ITN-to-email path (app/api/tickets/checkout/route.ts and
  lib/data/pool-remaining.ts both import it), not only inside this feature's own
  check-script harness. A real post-deploy purchase settling to `paid` with a delivered
  confirmation email is a genuine regression proof for that import change, not box-ticking
  — the prior "no purchase/email path is touched here; that's F4's" framing undersold this
  feature's actual reach into that path.
created_at: '2026-10-07'
autonomy: high
