        pool siblings, `scarcity.remaining` and `earlyBirdRemaining` were the SAME pool
        count, and resolveTicketCardState''s generic `remaining <= 0 -> soldOut` rule fires
        before its `earlyBirdRemaining <= 0 -> earlyBirdSoldOut` rule, so the generic rule
        always won. Also asserts (per team-lead''s explicit instruction) that
        scarcity.remaining/total still report the real pool count (e.g. 0 of 500) even
        when state resolution takes the early-bird branch — the displayed count is never
        hidden just because the state resolver nulls its own internal input at the
        exhaustion boundary. Third case, added per team-lead''s "if near-exhaustion should
        read ''low'', pin that too": ticket-card.ts''s own resolveTicketCardState doc
        comment (rule #4) says a pool product above zero but at/below the 10% low-stock
        threshold resolves ''low''; the golden does not say otherwise, so this is pinned as
        a regression guard, not left untested. Driven via loadTicketCardViewModel''s
