# Sources: Codi FINAL rulings relayed by the lead (2026-10-17), nos-v4 goldens. No new copy.
schema: athanor.contract/v1
slug: nos-critique-r8
goal: >-
  Make every R11 disclosure chip (exhibitors, what-to-expect, both plan-your-visit groups) one line at 360-700px content width in .tmp/sandbox/critique-r8: inclusive <=700 rule (0.06em, 10px) everywhere, 0.02em at 375-419px, 0 tracking at <=374px, never below 12px, no bare max-[700px] left.
  Exit criterion (Brad via the lead; design-cb's rulings are final): this feature loops build, critique, fix until impeccable scores >= 39/40 with
  P0/P1/P2 = 0 AND design-cb PASSes. The lead runs that loop and relays the PASS; the gate below stays mechanical.
created_at: '2026-10-17'
autonomy: high
exclusions:
  - item: 'every file but ShowStatusLine.tsx, VisitDisclosure.tsx'
    reason: 'Enforced by A2 (stacked footprint, goldens/f1..f1-footprint.json).'
features:
  - id: F1
    name: R11 disclosure chip on one line at narrow widths
    status: pending
goldens:
  - .agent/memory/project/specs/nos-critique-r8/goldens/f1-spec.md
  - .agent/memory/project/specs/nos-critique-r8/goldens/f1-footprint.json
  - .agent/memory/project/specs/nos-critique-r8/goldens/checks-f1.sha256
assertions:
  phase: 4
  checks:
    - id: A1
      description: f1 check scripts and goldens are unmodified since @architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/nos-critique-r8/goldens/checks-f1.sha256
    - id: A2
      description: Footprint (stacked branch) - f1..f1 paths and docs/nos-critique-r8.md only; nothing off limits
      command: node .agent/memory/project/specs/nos-critique-r8/checks/f1-footprint.mjs
    - id: A3
      description: Static S1-S6 - inclusive [@media(max-width:700px)] and 419 and 374 steps in both components, no bare max-[700px] under the NOS trees, no chip below 12px, copy unchanged, StatusMarker shortOnNarrow with a 359 display switch from its own constant, docs exist
