      description: Rendered on next start 3010-3019 (public) - chip is one line and one line tall at 320, 359, 360, 374, 375, 390, 419, 420 and 700 content width on all three routes, painting exactly one label (the short tag To be confirmed at <=359, the full label from 360) with exactly one label string exposed to assistive tech (sr-only counts) and a full group/note aria-label, with 0 tracking at <=374, 0.02em at 375-419, 0.06em to 700, 10px padding, >=12px
      command: node .agent/memory/project/specs/nos-critique-r8/checks/f1-rendered.mjs
    - id: A7
      description: Fixture - StatusMarker with shortOnNarrow paints the full label at 360 and the short tag at 359 (F18b model - width media utilities, one string exposed to assistive tech at each) for a pending marker only; research, opted-out, identical-label and confirmed markers are unchanged (props only, run under tsx)
      command: node .agent/memory/project/specs/nos-critique-r8/checks/f1-fixture.mjs
