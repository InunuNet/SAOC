created_at: '2026-10-25'
autonomy: high
exclusions:
  - item: 'every file outside goldens/footprint.json and this spec dir'
    reason: 'Enforced by A2. Home page and EventsStrip are deliberately untouched: the shared upcomingEventsQuery fix restores the show there (ev-spec.md section 1).'
  - item: 'Sanity content writes (eventsPage document, societyEvent date fix)'
    reason: 'Code-side fix only. eventsPage.intro stays empty until Lee-Ann supplies copy; the date-only values are handled in the query, not patched live.'
  - item: 'calendar-subscribe label'
    reason: 'COPY GAP: no source. EVENTS_CALENDAR_SUBSCRIBE_LABEL stays null and the button does not render until Brad or Lee-Ann approves a label (A3, A9 E6).'
features:
  - id: F1
    name: /events redesign (EV-1..EV-6) plus date-only National Show query fix
    status: pending
goldens:
  - .agent/memory/project/specs/events-redesign/goldens/ev-spec.md
