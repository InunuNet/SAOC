# Sources: NOS Design ruling EV-1..EV-6 FINAL (nos-design-ruling-ev.md, relayed 2026-10-24); audit P0-1 (.tmp/sandbox/audit/site-audit-2026-10-25.md);
# golden design/design_handoff_saoc/src/pages-show-events-contact.jsx (event-row); docs/rules/no-invention.md.
schema: athanor.contract/v1
slug: events-redesign
goal: >-
