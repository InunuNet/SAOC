schema: athanor.contract/v1
slug: vendor-flow-fixes
goal: Let a vendor who left before uploading all 3 product photos return to the upload step
  through a signed, single-purpose resume link in their registration-received email, with an
  admin re-issue for vendors who never received or lost it, without reopening the single-use
  registration code.
created_at: '2026-10-14'
autonomy: high
features:
  - id: F2
    name: Vendor photo-resume link (token, resume page, email link, admin re-issue)
    status: pending
goldens:
  - .agent/memory/project/specs/vendor-flow-fixes/goldens/f2/f2-vendor-photo-resume.golden.md
  - .agent/memory/project/specs/vendor-flow-fixes/goldens/f2/resume-state-matrix.json
  - .agent/memory/project/specs/vendor-flow-fixes/goldens/f2/copy-strings.json
  - .agent/memory/project/specs/vendor-flow-fixes/goldens/f2/live-progress-matrix.json
assertions:
  phase: 4
  checks:
    # All checks are static or pure-unit with injected fakes: none touches Firestore, Sanity,
    # Storage or the network (backlog note: contract checks must not mutate live content).
    - id: A1
      description: Token module and link builder - 30-day default expiry, exclusive expiry,
        round trip, scoped to one submission id, payload keys exactly u,e,n (no PII), not
        single-use, nonce-distinct, tamper/extended-expiry/wrong-secret/uppercase-hex refused,
        malformed shapes refused, stand-payment-shaped and registration-shaped tokens refused,
        and a bare-HMAC {u,e,n} token under the SHARED secret refused (real HMAC domain
        separation); modules pure (no firebase/process.env/clock/logging).
      command: node contracts/checks/vendor-photo-resume/check-token-and-link.mjs
    - id: A2
      description: Resume gate against the 16-case golden matrix - bad/expired/forged/other-domain
        tokens and unset secret never reach the loader; a valid token loads only its own id;
        rejected and missing submissions collapse to invalid; missing-slot rule matches the
        admin table; resolved state is a closed shape that never leaks PII or storage paths;
        gate is read-only and loadable without the Next alias.
      command: node contracts/checks/vendor-photo-resume/check-resume-gate.mjs
    - id: A3
      description: Static wiring - resume page is force-dynamic, noIndex, takes only `token`,
        takes the upload id from verified state, renders no registration form, no logo, no PII,
        no writes; admin route authenticates before any read, reuses
        review-vendor-applications, mints fresh, returns photoUrl, refuses rejected and 3/3,
        sends no email and writes nothing; admin button gated on !uploadsComplete; handler
        passes writeResult.id; confirmation sender mints the link, keeps its no-logging
        guarantee; email prop optional; route registries updated (listed:false,
        indexable:false); no new secret; single-use gate and upload API byte-identical to base
        77e50788. Gate must run on the fix branch (based on 77e50788), not on a diverged branch.
      command: node contracts/checks/vendor-photo-resume/check-static-wiring.mjs
    - id: A4
      description: Every new user-facing string in copy-strings.json is present verbatim in its
        assigned file, and the new page and admin control contain no promotional wording.
        Cannot prove no other string was added; diff review covers that.
      command: node contracts/checks/vendor-photo-resume/check-copy-strings.mjs
    - id: A6
      description: Live count and completion (amendment, defect on beta c11b51bd - page read
        "0 of 3 ... not complete" after 3 successful uploads until reload). Pure progress module
        against the golden matrix - seeded with the server count, each onUploaded slot adds one,
        reaches 3 / complete on the third upload, no double counting of slots already counted
        server-side, idempotent, logo ignored, never above 3, addUploadedSlot returns a new Set.
        Behavioural at unit level; the in-browser update itself is proven by the deployed-site
        browser check, not here (no unit runner or DOM in this repo, and uploads on a live
        submission would mutate live data).
      command: node contracts/checks/vendor-photo-resume/check-live-progress.mjs
    - id: A5
      description: Type check passes with the new modules, page, route and component in the tree
        (catches server/client import mistakes and prop-shape drift the static greps cannot).
      command: node_modules/.bin/tsc --noEmit
      timeout_seconds: 600
