schema: athanor.contract/v1
slug: nos-critique-r3
goal: >-
  Close NOS ruling R44 A5 in nos-critique-r3: symposium 'Presenters (N)' jump link under the hero (count derived from data, nothing rendered when empty, scroll-margin-top clearing the 74/62px sticky header) and the presenter grid 2-up from 768px.
created_at: '2026-10-16'
autonomy: high
exclusions:
