# Sources (no-invention): docs/rules/no-invention.md; v4 golden nos-v4/plan-your-visit.html; Codi P3 H8. No new copy: the short label is the existing Sanity contact value.
schema: athanor.contract/v1
slug: nos-critique-r7
goal: >-
  Build the plan-your-visit disclosure grouping to v4 golden l.575-616 (Codi FINAL) in .tmp/sandbox/critique-r7, in both modes: Getting there becomes ONE role=group
  disclosure (aria-label "Details to be confirmed by the show committee") with one full chip first and three h3 items (Parking, Public transport, Where to stay) with their
  CMS bodies, no per-item cards; the venue aside sits between; the emergency block is one disclosure with one full chip, the tel numbers, the on-site label with the
  short "To be confirmed" tag (16px / 600 / ink-500) and the committee foot. Page totals 2 full chips and 1 short tag. No new strings beyond the golden aria-labels.
  Exit criterion (Brad via the lead; design-cb's rulings are final): this feature loops build, critique, fix until impeccable scores >= 39/40 with
  P0/P1/P2 = 0 AND design-cb PASSes. The lead runs that loop and relays the PASS; the gate below stays mechanical.
created_at: '2026-10-17'
autonomy: high
exclusions:
  - item: 'the venue-name P2 (Sanity CMS text), every other route and component'
    reason: 'In a team vote / out of scope. Enforced by A2 (goldens/f1-footprint.json).'
features:
  - id: F1
    name: Plan-your-visit chip variants aligned to the v4 golden
    status: pending
goldens:
  - .agent/memory/project/specs/nos-critique-r7/goldens/f1-spec.md
  - .agent/memory/project/specs/nos-critique-r7/goldens/f1-baseline.json
  - .agent/memory/project/specs/nos-critique-r7/goldens/f1-footprint.json
  - .agent/memory/project/specs/nos-critique-r7/goldens/checks-f1.sha256
  - .agent/memory/project/specs/nos-critique-r7/goldens/f3-footprint.json
assertions:
  phase: 4
  checks:
    - id: A1
      description: f1 check scripts and goldens are unmodified since @architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/nos-critique-r7/goldens/checks-f1.sha256
    - id: A2
      description: Footprint (stacked branch) - f1 may change plan-your-visit/page.tsx, VisitorInfoBlock.tsx, a new components/show/VisitDisclosure.tsx and docs/nos-critique-r7.md, and the stacked F2/F3 nos-theme.css
      command: node .agent/memory/project/specs/nos-critique-r7/checks/f1-footprint.mjs
    - id: A3
      description: Static S1-S6 - no env reading, golden cited, only the two golden aria-labels added as copy, CMS sentences never typed, role=group and tel links present, VisitorInfoBlock copy intact, docs cite H8
      command: node .agent/memory/project/specs/nos-critique-r7/checks/f1-static.mjs
    - id: A4
      description: TypeScript compiles and ESLint is clean with zero warnings on the NOS component and route trees
      command: sh -c 'pnpm --dir .tmp/sandbox/critique-r7 type-check && pnpm --dir .tmp/sandbox/critique-r7 exec eslint --max-warnings 0 components/nos components/show "app/(marketing)/national-show"'
    - id: A5
      description: Production build passes (input for A6)
      command: pnpm --dir .tmp/sandbox/critique-r7 build
    - id: A6
      description: Rendered on next start 3010-3019 at 390 and 1280 in preview and public - 2 full chips plus 1 short tag; one Getting-there group (chip first, h3s in order, no item cards); DOM order group, venue aside, emergency group; emergency group with tel targets 44px, short tag 16/600/#6a6780 and the committee foot; at 390 and exactly 700 each chip is one line with 0.06em tracking, 10px inline padding and a 16px surface padding, and While you are here (when present) sits between the venue aside and the emergency group as an h2, plain when confirmed or in one gold disclosure with one chip otherwise, with a clean heading outline; what-to-expect unchanged
      command: node .agent/memory/project/specs/nos-critique-r7/checks/f1-rendered.mjs
    - id: A7
      description: Fixture - VisitGettingThere and VisitAttractions driven by props split by status across six cases (all confirmed, mixed, all pending, all research, confirmed plus research, unset) confirmed items are plain, unconfirmed in ONE group with one chip, pending beats research, golden order inside each part, no production switch
      command: node .agent/memory/project/specs/nos-critique-r7/checks/f1-fixture.mjs
