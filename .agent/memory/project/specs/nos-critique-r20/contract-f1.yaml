# Sources: Codi's FINAL review of the NOS footer "Stay in touch" sign-up, relayed by the lead 2026-10-19; architect measurements on BASE 7fb251a1, re-pinned from a4807791 after r19 merged (goldens/f1-spec.md).
schema: athanor.contract/v1
slug: nos-critique-r20
goal: >-
  In the NOS footer "Stay in touch" sign-up, raise only the input border alpha from .36 to .55 (WCAG 1.4.11), give the input
  name=email and autocomplete=email (WCAG 1.3.5), and replace its aria-label with a visible "Email address" label in the footer's
  label role (.nf-head), keeping the input and button side by side at 390, with no new strings, tokens or colours.
created_at: '2026-10-20'
autonomy: high
exclusions:
  - item: 'every file outside goldens/f1-footprint.json, f2-footprint.json, f3-footprint.json, f4-footprint.json, docs/nos-critique-r20.md and this spec dir'
    reason: 'Enforced by A2. F1 adds no string (FOOTER_BULLETIN.emailLabel already holds "Email address"); the footer grid is F3.'
features:
  - id: F1
    name: NOS footer sign-up - input border alpha .55, name/autocomplete email, visible nf-head label replacing the aria-label
    status: pending
goldens:
  - .agent/memory/project/specs/nos-critique-r20/goldens/f1-spec.md
  - .agent/memory/project/specs/nos-critique-r20/goldens/f1-edits.json
  - .agent/memory/project/specs/nos-critique-r20/goldens/f1-footprint.json
  - .agent/memory/project/specs/nos-critique-r20/goldens/checks-f1.sha256
assertions:
  phase: 4
  checks:
    - id: A1
      description: f1 check scripts and goldens are unmodified since @architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/nos-critique-r20/goldens/checks-f1.sha256
    - id: A2
      description: Footprint - the r20 branch differs from origin/main 7fb251a1 only in the four r20 footprints, docs/nos-critique-r20.md and the spec dir, and HEAD descends from it
      command: node .agent/memory/project/specs/nos-critique-r20/checks/footprint.mjs
    - id: A3
      description: Static - one nf-head label for nf-email between the blurb and the form, the input with id/type/name/autoComplete/placeholder/required and no aria-label, the input rule with alpha 0.55 and no 0.36 left, the label display:block rule block, no new copy, docs F1
      command: node .agent/memory/project/specs/nos-critique-r20/checks/f1-static.mjs
    - id: A4
      description: Rendered (public + preview, 1280/390, three NOS routes) - border rgba(210, 203, 232, 0.55) 1px solid at >= 3:1 on the footer, name/autocomplete email, one visible nf-head label naming the input, 6px above it, side by side at 1280 and 390 (r20 F5 item 1)
      command: node .agent/memory/project/specs/nos-critique-r20/checks/f1-rendered.mjs
