schema: athanor.contract/v1
slug: verification-triad-gate
goal: >
  Wire execution/verify_triad_coverage.py into the real gate path so a
  UI/workflow contract cannot reach a green gate without declaring all three
  verification-triad kinds (codex_qa, browser_deployed_check,
  gws_inbox_check) -- closing the gap F1 left open (the linter existed but
  nothing forced any contract to run it). Per
  .agent/memory/scratch/research-f2-triad-gate-wiring.md: all four real gate
  entry points (execution/skills/quick_gate.sh, execution/gate_sweep.py,
  execution/improvement_loop.sh, execution/mission.py cmd_gate) converge on
  one subprocess call, `python3 execution/contract.py gate ...` -- so the
  ONLY placement that covers all four is inside execution/contract.py's own
  gate_cmd()/_gate_dispatch(), never quick_gate.sh alone. This feature also
  fixes the phases_raw/phases false-negative in verify_triad_coverage.py
  (iter_assertions_with_shape() reads contract.get("phases_raw"), a key that
  only exists after contract.py's own normalize_contract() runs -- an
  author-written contract in the raw `phases: {...}` dict shape is
  currently invisible to the standalone linter and silently reported
  EXEMPT).

  Five architect decisions (binding on @dev's implementation):

  1. FAIL-CLOSED on a triad-linter infrastructure error (verify_triad_
     coverage.py missing, or exits any code outside its documented 0/1/2
     contract) -- deliberately the OPPOSITE of the dataset-residue guard's
     fail-open precedent (execution/contract.py:745-761). Justification: the
     residue guard's dependency is a live external network service (Sanity)
     shared across every concurrent gate, where transient blips are common
     and blocking unrelated work on one is a real availability cost.
     verify_triad_coverage.py has zero external dependencies -- pure local
     file read + regex, no subprocess of its own, no network -- so a
     broken/missing linter is a real code regression, not noise, and this
     mission's own headline defect (browser_deployed_check.sh:156 returning
     PASS when curl was missing, F1) is exactly a check silently degrading
     to "proceed" when its tool was unavailable. A cap isn't a threat and
     silence isn't protection: failing open here would let that same defect
     recur one layer up, in the mechanism built specifically to prevent it.
     New exit code TRIAD_PREFLIGHT_ERROR_EXIT_CODE = 7, distinct from 0/1/2
     and from the residue guard's 4/5, with a loud, actionable stderr
     message naming the exact linter invocation and its exit code (never a
     silent block, never a silent pass).

  2. PREFLIGHT ORDERING: the triad preflight runs inside gate_cmd(), after
     _preflight_residue_guard() and before _gate_dispatch(contract, args) --
     i.e. before any assertion phase executes, unconditionally, regardless
     of --phase (all/max/N) or whether --run-checks was passed. It needs no
     assertion RESULTS, only the contract file's declared shape, so there is
     no reason to gate it behind --run-checks. New exit code
     TRIAD_ENFORCEMENT_EXIT_CODE = 6 for "confirmed UI/workflow contract,
     missing one or more triad kinds, not grandfathered" -- distinct from
     TRIAD_PREFLIGHT_ERROR_EXIT_CODE (7) so a caller can always tell
     "confirmed noncompliant" apart from "linter itself broke".

  3. BASELINE RE-ARM ON EDIT: a contract listed in execution/triad-baseline-
     exempt.txt (plain repo-relative path per line, `#`-comments and blanks
     ignored -- the exact shape already staged from a prior architect pass,
     reused as-is per the F2 research's explicit recommendation, NOT a
     second format) is grandfathered only as of the content whose sha256 is
     pinned in a companion file, execution/triad-baseline-exempt.sha256
     (default; overridable via TRIAD_BASELINE_HASH_FILE), one
     `<sha256>  <repo-relative-path>` line per baselined path, generated by
     @dev alongside triad-baseline-exempt.txt in the same commit. At gate
     time, contract.py re-derives the live sha256 of a baselined contract
     file; if it matches the pinned hash, the grandfather holds (preflight
     does not block); if it does NOT match (the contract was edited since
     baselining), enforcement RE-ARMS for that path -- the edit forfeits the
     grandfather, it does not carry it forward automatically. Rationale: a
     bare path-list grandfather that survives arbitrary future edits would
     let someone materially change a UI contract's behaviour while keeping
     it permanently exempt from the mission's headline requirement -- a
     right (the exemption) is not a practice that outlives the state it was
     granted for. A baseline entry with a path but no matching hash-pin
     entry (or vice versa) is a build-time inconsistency, not silently
     tolerated -- see A3.

  4. NEITHER BASELINED NOR UI/WORKFLOW: verify_triad_coverage.py's own
     EXEMPT classification (non-UI, exit 0) is never subject to the
     baseline mechanism at all -- the baseline only exists to grandfather
     the FAIL case (UI/workflow, missing kinds). The preflight only consults
     the baseline/hash-pin files when the linter itself reports exit 1; an
     EXEMPT or PASS result proceeds silently, exactly as today, with zero
     added noise for the ~69/101 contracts that already pass or don't need
     to.

  5. template/execution/ SCOPE: the parallel Athanor-scaffold copies of
     contract.py, quick_gate.sh, and improvement_loop.sh under template/
     do NOT inherit this fix as part of F2 -- template/ is this project's
     seed copy of the upstream harness, not a second production gate path
     for SAOC's own contracts. Per project memory
     (feedback_harness_issues_pr_upstream / project_harness_issues_pr_upstream),
     this is explicitly an upstream-PR item for InunuNet/Athanor, not a
     silently-dropped requirement and not something to duplicate locally --
     @maintainer must log it to backlog.md as a follow-up PR at mission
     close-out, and this contract requires that log entry to exist (A9).

created_at: '2026-09-06'
autonomy: high
features:
  - id: F2
    name: Wire verify_triad_coverage.py into the real gate path (contract.py gate_cmd)
    status: pending
goldens:
  - .agent/memory/project/specs/verification-triad-gate/goldens/fixtures/f2_baseline_expected_subset.txt
  - .agent/memory/project/specs/verification-triad-gate/goldens/fixtures/f2_fixture_noncompliant_ui.yaml
  - .agent/memory/project/specs/verification-triad-gate/goldens/fixtures/f2_fixture_phases_dict_compliant.yaml
  - .agent/memory/project/specs/verification-triad-gate/goldens/fixtures/f2_fixture_phases_dict_missing_gws.yaml
  - .agent/memory/project/specs/verification-triad-gate/goldens/fixtures/f2_fixture_phases_dict_synthesized_kind_compliant.yaml
  - .agent/memory/project/specs/verification-triad-gate/goldens/fixtures/f2_fixture_list_toplevel_kind_masquerade.yaml
  - .agent/memory/project/specs/verification-triad-gate/goldens/fixtures/f2_fixture_mixed_shape_masquerade.yaml
  - .agent/memory/project/specs/verification-triad-gate/goldens/fixtures/f2_fixture_empty_list_phases_dict_compliant.yaml
  - .agent/memory/project/specs/verification-triad-gate/goldens/fixtures/f2_broken_linter_stub.sh
assertions:
  phase: 4
  checks:
    - id: A1
      description: >
        RED today, GREEN once @dev wires the preflight: contract.py must
        reference verify_triad_coverage.py somewhere in its gate path (the
        actual wiring; A5/A7 prove it fires correctly, this just proves the
        reference exists at all).
      command: grep -q "verify_triad_coverage.py" execution/contract.py
      required: true

    - id: A2
      description: >
        execution/triad-baseline-exempt.txt exists and is a superset of both
        the committed golden floor (32 paths, captured 2026-09-06) and
        today's live failing set from a fresh subprocess run of the linter
        against every contracts/*.yaml file -- shipping the preflight cannot
        redden the existing suite. Re-derives live, does not just trust the
        baseline file's own contents.
      command: python3 execution/checks/verify_f2_baseline_completeness.py
      required: true

    - id: A3
      description: >
        execution/triad-baseline-exempt.sha256 exists, has exactly the same
        path-set as triad-baseline-exempt.txt (no missing pin, no orphan
        pin), and every recorded hash matches sha256(current file content)
        right now -- proves decision 3's re-arm-on-edit mechanism has a
        real, non-stale pin to compare against, not just a file that exists.
      command: python3 execution/checks/verify_f2_baseline_hash_consistency.py
      required: true

    - id: A4
      description: >
        The phases_raw/phases false-negative is fixed: a UI/workflow
        contract authored entirely in the raw `phases: {...}` dict shape
        (no top-level assertions: key) is correctly classified PASS/FAIL by
        message text, not silently reported EXEMPT. Asserts on the linter's
        own stdout message text (not just exit code), per this project's
        audited "assertion satisfiable by shape, not truth" defect class --
        EXEMPT and PASS both exit 0, only the message distinguishes the
        false negative from the real fix.
      command: python3 execution/checks/verify_f2_phases_dict_classification.py
      required: true

    - id: A5
      description: >
        End-to-end, via real `python3 execution/contract.py gate` subprocess
        calls (not linter-only unit checks): (1) a noncompliant UI contract
        NOT in any baseline is hard-blocked with exit
        TRIAD_ENFORCEMENT_EXIT_CODE (6); (2) the same contract IS blocked
        with the same exit code again if it's listed in a baseline whose
        pinned hash no longer matches the file's current content (edited
        since baselining -- decision 3's re-arm); (3) the same contract is
        NOT blocked by the triad preflight when baselined with a hash that
        DOES match current content (grandfather holds, gate proceeds to run
        its own trivially-true assertion and passes). Proves real gate
        behaviour, not just linter classification. Scenario 2 asserts the
        SPECIFIC expected exit code (0, not merely "!= 6") plus positive
        evidence scraped from contract.py's own grandfather-path message
        that the triad preflight actually ran, found the contract
        noncompliant, and chose to grandfather it -- "exit != 6" alone is
        vacuous, since it is equally satisfied by an unrelated earlier
        preflight (e.g. the dataset-residue guard) blocking first and the
        triad preflight never running at all, which is exactly what
        happened in this mission before the dataset was cleaned up.
      command: bash execution/checks/verify_f2_gate_enforcement.sh
      required: true

    - id: A6
      description: >
        Decision 1 (fail-closed): when verify_triad_coverage.py is replaced
        (via the test-only TRIAD_LINTER_SCRIPT_OVERRIDE env var, mirroring
        CONTRACT_GATE_RESIDUE_FIXTURE's existing pattern) by a stub that
        exits an out-of-contract code, or points at a path that doesn't
        exist at all, `contract.py gate` blocks with
        TRIAD_PREFLIGHT_ERROR_EXIT_CODE (7) in both cases -- never a silent
        exit 0 pass, and never conflated with TRIAD_ENFORCEMENT_EXIT_CODE
        (6)'s "confirmed noncompliant" meaning.
      command: bash execution/checks/verify_f2_triad_failclosed.sh
      required: true

    - id: A7
      description: >
        Decision 2 (ordering): the triad preflight call sits inside
        gate_cmd()'s body strictly after the _preflight_residue_guard() call
        and strictly before _gate_dispatch(contract, args) -- the only
        placement common to all four real gate entry points per the F2
        research. Checked structurally against contract.py's own source,
        not by line-number guesswork.
      command: python3 execution/checks/verify_f2_preflight_ordering.py
      required: true

    - id: A8
      description: >
        The two new exit-code constants exist with exactly the values this
        contract's decisions depend on, and are distinct from each other and
        from the pre-existing RESIDUE_EXIT_CODE (4) / RESIDUE_SCAN_ERROR_EXIT_CODE
        (5) -- so no caller can ever conflate "confirmed triad-noncompliant"
        with "triad linter infra error" with "dataset residue".
      command: grep -qE "TRIAD_ENFORCEMENT_EXIT_CODE[[:space:]]*=[[:space:]]*6" execution/contract.py && grep -qE "TRIAD_PREFLIGHT_ERROR_EXIT_CODE[[:space:]]*=[[:space:]]*7" execution/contract.py
      required: true

    - id: A9
      description: >
        Decision 5 (template/ scope) is not silently dropped: the
        env-var override names this feature introduces
        (TRIAD_BASELINE_HASH_FILE, TRIAD_LINTER_SCRIPT_OVERRIDE) are present
        in contract.py, AND a comment in contract.py explicitly names
        template/execution as out of scope for this feature so the next
        reader isn't left to rediscover it, AND backlog.md records the
        upstream-PR follow-up per project convention
        (feedback_harness_issues_pr_upstream).
      command: grep -q "TRIAD_BASELINE_HASH_FILE" execution/contract.py && grep -q "TRIAD_LINTER_SCRIPT_OVERRIDE" execution/contract.py && grep -qi "template/execution" execution/contract.py && grep -qi "verify_triad_coverage\|triad" .agent/memory/project/backlog.md
      required: true

    - id: A10
      description: >
        The Codex GPT-5.5 mandatory pass on this feature's implementation
        found that verify_triad_coverage.py's assertion_kind() cannot
        distinguish a raw `phases: {...}` dict-shape item from a plain
        `assertions:` LIST-shape item -- both set from_checks_shape=False --
        so it either misses top-level `kind` for BOTH shapes (false
        negative: blocks a genuinely compliant phases-dict contract whose
        triad kinds are declared only via top-level `kind` with no nested
        `verify:`, exactly the shape contract.py's own normalize_contract()
        synthesizes verify.kind from for phases-dict items -- see
        execution/contract.py:118-122) or, if fixed too broadly, credits
        top-level `kind` for BOTH shapes (false positive: lets a plain-list
        item's decorative top-level `kind` masquerade as triad coverage
        contract.py never actually executes it as). The shape signal must
        become tri-state (checks-dict / plain-list / phases-dict) so
        top-level `kind` is credited for the phases-dict shape ONLY, and
        ONLY under contract.py's exact synthesis condition (item's `verify`
        field absent or a bare string -- never when a nested `verify:` dict
        is already present). Proves BOTH directions via the linter's own
        message text, not exit code alone: a phases-dict contract declaring
        all three triad kinds solely via top-level `kind` (no nested
        `verify:`) must report PASS; a plain-`assertions:`-list item
        carrying a top-level `kind: browser_deployed_check` with no
        matching `verify.kind` must still report FAIL naming
        browser_deployed_check, never PASS and never EXEMPT.
      command: python3 execution/checks/verify_f2_synthesized_kind_classification.py
      required: true

    - id: A11
      description: >
        Regression found by the Codex GPT-5.5 pass on @dev's tri-state fix
        (confirmed and reproduced by @lead) and introduced BY F2 itself,
        in the dangerous direction: execution/contract.py:131-132 folds
        phase-derived assertions into the assertions list it actually
        executes ONLY when `not c.get("assertions")` (top-level
        `assertions` missing or falsy, including an explicit empty list).
        When a truthy top-level `assertions:` IS present, every `phases:`
        entry is computed and then discarded -- never executed by the real
        gate. Before F2, the linter read a nonexistent `phases_raw` key so
        this hole could not occur; F2's fix to the phases blind spot made
        iter_assertions_with_shape() yield the `phases:` branch as a
        separate, unconditional `if`, crediting triad kinds declared only
        in `phases:` even when contract.py discards them -- a contract can
        carry one bare, uncovered shell check in `assertions:` plus a fully
        triad-compliant but entirely decorative `phases:` dict and still
        earn a green "PASS", the exact "green gate blessing verification
        that never ran" failure this mission exists to eliminate. The fix
        must credit `phases:` entries only under contract.py's exact
        condition, mirrored precisely (not approximated) -- including the
        edge case that an explicit `assertions: []` is falsy too, so a
        contract pairing it with a populated `phases:` dict must still PASS
        via the phases branch, not regress to the pre-A4/A10 blind spot.
        Asserts on the linter's own message text, not exit code alone, per
        this project's audited "assertion satisfiable by shape, not truth"
        defect class -- EXEMPT and PASS both exit 0, and a naive fix could
        flip FAIL to PASS (or vice versa on the empty-list edge case)
        without actually mirroring contract.py's condition.
      command: python3 execution/checks/verify_f2_mixed_shape_masquerade.py
      required: true

    - id: A12
      description: >
        Regression found by the third Codex GPT-5.5 pass, reproduced by
        @lead: decision 1's fail-closed promise covers the triad-linter
        SUBPROCESS (A6) but not the BASELINE-LOADING step of the same
        preflight. _load_triad_baseline_paths() and
        _load_triad_baseline_hashes() (execution/contract.py, called from
        _triad_contract_is_grandfathered()) call Path.read_text() with no
        try/except at all. Pointing TRIAD_BASELINE_FILE or
        TRIAD_BASELINE_HASH_FILE at a path that cannot be read as UTF-8 text
        (a directory, or a file containing invalid UTF-8 bytes) crashes with
        an uncaught IsADirectoryError/UnicodeDecodeError and a raw Python
        traceback, exiting 1 -- never reaching
        TRIAD_PREFLIGHT_ERROR_EXIT_CODE (7), which A8 keeps distinct from
        every other exit code specifically so a caller can always tell
        "confirmed triad-noncompliant" (6) apart from "preflight
        infrastructure error" (7) apart from an unrelated crash (bare 1).
        Not a bypass (1 still blocks), but it violates this feature's own
        documented exit-code contract and leaves A6's fail-closed guarantee
        covering only the linter-subprocess half of the preflight, not the
        baseline-file-read half. The fix must wrap baseline/hash loading
        (the call to _triad_contract_is_grandfathered(), or the two loader
        functions individually) so any OSError/UnicodeDecodeError there
        exits TRIAD_PREFLIGHT_ERROR_EXIT_CODE (7) with a loud, actionable
        stderr message naming the failing baseline/hash file -- mirroring
        the existing linter-subprocess error message's shape, never a raw
        traceback. Asserts on exit code AND absence of a raw traceback in
        the output, across three real, deterministic shapes: (1)
        TRIAD_BASELINE_FILE pointing at a directory (reached
        unconditionally, no baseline-listing needed); (2)
        TRIAD_BASELINE_HASH_FILE pointing at a directory WITH the contract's
        own path listed in TRIAD_BASELINE_FILE (hash-loading is only
        reached when the contract is actually listed -- an unlisted
        contract never touches the hash file at all); (3) TRIAD_BASELINE_FILE
        containing invalid UTF-8 bytes. Chmod-based permission-denied
        fixtures are deliberately excluded (unreliable when the gate runs
        as the file owner, and chmod 777 / broad rm -rf are denied by this
        project's autonomy hooks), as is a malformed hash-pin line (already
        silently skipped by existing code, not a defect).
      command: bash execution/checks/verify_f2_baseline_loading_failclosed.sh
      required: true
