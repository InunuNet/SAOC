# Sources: lead ruling FINAL 2026-10-18 (r15 F1, vote 2/3, consistent with F24 vote 1C), architect measurement on ab7c549c (goldens/f1-spec.md).
# Rendered checks build what they need: PUBLIC and PREVIEW are two production builds (checks/_server.mjs ensureBuild; ports 3010-3019, never 3013).
schema: athanor.contract/v1
slug: nos-critique-r15
goal: >-
  On the PUBLIC build, withhold the unsourced per-society estimates (the card and facts figures with their "estimated" tags, the /societies caption,
  the generic fallback prose with its "General description" marker, and the society-page CTA's unsourced "21 affiliated societies" body) via withholdPlaceholderProse(),
  with the beta preview byte-unchanged.
created_at: '2026-10-18'
autonomy: high
exclusions:
  - item: 'every file outside goldens/f1-footprint.json + f2-footprint.json + f3-footprint.json, docs/nos-critique-r15.md and this spec dir'
    reason: 'Enforced by A2 (shared r15 branch guard). SocietyCard, SocietyFacts, SocietiesClient, SocietiesFallback and lib/data/show-pages.ts stay byte-identical (A3 S4).'
features:
  - id: F1
    name: Public build withholds the unsourced per-society estimates, caption, marker and generic prose
    status: pending
goldens:
  - .agent/memory/project/specs/nos-critique-r15/goldens/f1-spec.md
  - .agent/memory/project/specs/nos-critique-r15/goldens/f1-withhold.json
  - .agent/memory/project/specs/nos-critique-r15/goldens/f1-baseline.json
  - .agent/memory/project/specs/nos-critique-r15/goldens/f1-footprint.json
  - .agent/memory/project/specs/nos-critique-r15/goldens/nonreg-baseline.json
  - .agent/memory/project/specs/nos-critique-r15/goldens/checks-f1.sha256
assertions:
  phase: 4
  checks:
    - id: A1
      description: f1 check scripts and goldens are unmodified since @architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/nos-critique-r15/goldens/checks-f1.sha256
    - id: A2
      description: Footprint - the r15 branch differs from origin/main 0fdffebb only in the union of the r15 footprints, docs/nos-critique-r15.md and the spec dir, HEAD descends from it
      command: node .agent/memory/project/specs/nos-critique-r15/checks/footprint.mjs
    - id: A3
      description: Static - pure lib/data/society-withhold.ts, both societies pages pass server-withheld data to their renderers, SocietyAbout takes withhold, the slug CTA body is withheld (no marked), client components and CTASection untouched, no new copy, docs record F1
      command: node .agent/memory/project/specs/nos-critique-r15/checks/f1-static.mjs
    - id: A4
      description: Unit - withholdSocietyEstimates returns the same object when not withholding and nulls only flagged estimates (U1-U7)
      command: node --no-warnings .agent/memory/project/specs/nos-critique-r15/checks/f1-unit.mjs
    - id: A5
      description: Rendered at 1280/390 - public /societies and 3 society pages show no estimate, caption, marker, generic prose or CTA count and ship none in the payload, cards and grid intact, CTA keeps heading and buttons, no orphan section or overflow; preview byte-unchanged
      command: node .agent/memory/project/specs/nos-critique-r15/checks/f1-rendered.mjs
    - id: A6
      description: Non-regression (public) - 13 SAOC and 2 NOS routes keep geometry and screenshot at 1280/390 with only the F3 targets masked, no overflow
      command: node .agent/memory/project/specs/nos-critique-r15/checks/nonreg.mjs
