schema: athanor.contract/v1
slug: nos-landing-leeann-1109
goal: NOS home and footer carry the landing-page changes Brad cleared on 2026-11-09 (heading, figures removed, exhibit band links-only and renamed, venue name, full-colour vertical footer logos), with the Sanity venue patch staged dry-run.
created_at: '2026-11-09'
autonomy: high

features:
  - id: F1
    name: NOS landing + footer changes per goldens/expected.md
