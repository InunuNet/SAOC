schema: athanor.contract/v1
slug: nos-ticket-day-stub
goal: >-
  The tickets hero fan and the hub Day Pass card show the product's own stub (no numeral, no caption) until the buyer picks a day:
  no default day, a picked day drives the stub and the checkout link, and Buy with no day stays enabled but shows "Choose a day" in
  the existing required-field error pattern at the picker, moves focus there and sets aria-invalid; the server still refuses a
  requiresDaySelection position with no chosenDay. No new copy, tokens or colours; no names change.
created_at: '2026-10-22'
autonomy: high
exclusions:
  - item: 'every file outside goldens/f1-footprint.json, docs/nos-ticket-day-stub.md and this spec dir'
    reason: 'Enforced by A2 and A3 (S5). The checkout form, the checkout page summaryDay default and the server path stay as at BASE.'
  - item: 'the checkout screen default day (TicketPurchaseForm.startDay, page summaryDay = showDays[0])'
    reason: 'Not in the ruling (TicketCard and the hub Buy only): DECISION NEEDED in goldens/f1-spec.md; pinned by A3 S5 and A8.'
  - item: 'product names (VIP Ticket vs VIP Opening)'
    reason: 'Copy decision for Brad/Lee-Ann (Codi P2, not actioned).'
features:
  - id: F1
    name: Ticket day stub - fan and Day Pass card use the product's own stub until a day is chosen, no default day, required-field error on Buy, server guard test
    status: pending
