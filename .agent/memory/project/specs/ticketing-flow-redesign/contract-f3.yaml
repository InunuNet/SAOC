schema: athanor.contract/v1
slug: ticketing-flow-redesign
goal: >-
  Give Day Visitor a per-day quantity picker on its dedicated buy screen (F2) — the buyer picks
  how many tickets for EACH show day in one screen (e.g. 2 for Thursday, 1 for Saturday), instead
  of the current one-row-per-unit "assign a day to ticket #1, #2, ..." flow. Wire format posted to
  the checkout route is unchanged; this feature only changes how the client builds the lineItems
  array on this one screen. Conferences/Workshops' generic multi-type CartDayPicker flow is
  unchanged. Depends on F2 (renders inside F2's dedicated /tickets/day-visitor screen). Full
  design rationale: contracts/golden/ticketing-flow-redesign-f3/README.md.
created_at: '2026-08-24'
autonomy: high

# SCOPE: this feature touches exactly these files —
#   NEW  components/tickets/DayQuantityPicker.tsx — one row per show day, own quantity stepper —
#        README §2, golden day-quantity-picker.golden.md
#   EDIT lib/cart.ts — new pure expandDayQuantitiesToLineItems() export — README §5, golden
#        day-quantity-picker.golden.md
#   EDIT components/tickets/useTicketCart.ts — quantitiesByDay state, updateDayQuantity setter,
#        submit-time expansion via expandDayQuantitiesToLineItems() when useDayQuantityPicker —
#        README §5, golden day-quantity-picker.golden.md
#   EDIT components/tickets/TicketPurchaseForm.tsx — renders DayQuantityPicker XOR CartDayPicker
#        by the derived useDayQuantityPicker condition; hides TicketTypeCard's own stepper for
#        that branch — README §3, golden day-quantity-picker.golden.md
#   EDIT components/tickets/TicketTypeCard.tsx — optional hideQuantityStepper prop (mode="buy"
#        only) — README §3, golden day-quantity-picker.golden.md
#
# Explicitly UNCHANGED (README §1, §3-4, §6): app/api/tickets/checkout/route.ts (per-line-item
# chosenDay validation already works against any correctly-shaped array),
# components/tickets/CartDayPicker.tsx (generic multi-type day-picker, still used by
# Conferences/Workshops carts), CartAttendeeFields.tsx, chosenDayByType/updateChosenDay state,
# per-day capacity enforcement (still whole-show, per F4/F5 scope notes).

features:
  - id: F3
    name: >-
      Day Visitor per-day quantity picker — pick ticket counts per show day in one screen, on top
      of F2's dedicated buy screen.
    status: pending

goldens:
  - .agent/memory/project/specs/ticketing-flow-redesign/goldens/README.md
  - contracts/golden/ticketing-flow-redesign-f3/README.md
  - contracts/golden/ticketing-flow-redesign-f3/day-quantity-picker.golden.md

assertions:
  phase: 4
  checks:
    - id: A1
      description: >-
        expandDayQuantitiesToLineItems() exists and matches the golden truth table (empty map,
        zero-quantity day, mixed multi-day quantities all expand to the right line items).
      command: npx tsx contracts/checks/ticketing-flow-redesign-f3/check-expand-day-quantities.mjs

    - id: A2
      description: The new per-day quantity picker component exists.
      command: test -f components/tickets/DayQuantityPicker.tsx

    - id: A3
      description: >-
        DayQuantityPicker derives every day from its showDays prop — no literal calendar date
        anywhere in the file (same rule CartDayPicker already follows).
      command: >-
        ! grep -qE "202[0-9]-[0-9]{2}-[0-9]{2}" components/tickets/DayQuantityPicker.tsx

    - id: A4
      description: >-
        TicketPurchaseForm picks between DayQuantityPicker and the existing CartDayPicker via the
        derived single-type-and-requiresDaySelection condition, not a caller-supplied prop, and
        still imports/renders CartDayPicker for the multi-type case (Conferences/Workshops path
        preserved).
      command: >-
        grep -qE "ticketTypes\.length === 1 && ticketTypes\[0\]\.requiresDaySelection" components/tickets/TicketPurchaseForm.tsx &&
        grep -q "DayQuantityPicker" components/tickets/TicketPurchaseForm.tsx &&
        grep -q "CartDayPicker" components/tickets/TicketPurchaseForm.tsx

    - id: A5
      description: >-
        CartDayPicker.tsx itself is untouched by this feature (Conferences/Workshops' generic
        multi-type day-picker is not modified or deleted).
      command: test -f components/tickets/CartDayPicker.tsx

    - id: A6
      description: >-
        useTicketCart exposes quantitiesByDay state and an updateDayQuantity setter, and still
        exposes the pre-existing chosenDayByType/updateChosenDay pair unchanged (both models
        coexist, per README §3).
      command: >-
        grep -q "quantitiesByDay" components/tickets/useTicketCart.ts &&
        grep -q "updateDayQuantity" components/tickets/useTicketCart.ts &&
        grep -q "chosenDayByType" components/tickets/useTicketCart.ts

    - id: A7
      description: TypeScript compiles cleanly after the cart/component changes.
      command: npx tsc --noEmit -p tsconfig.json

    - id: A8
      description: >-
        MANUAL, visual-only (per this project's coding.md — automated checks above already prove
        the expansion math, the derived-condition wiring, and that CartDayPicker/checkout are
        untouched). A human or browser agent must load /tickets/day-visitor and confirm: each show
        day renders its OWN quantity stepper on one screen (not a single total quantity followed
        by N separate day-assignment rows), and the displayed total/estimated price updates
        correctly as day-quantities change.
      kind: agent_review
