schema: athanor.contract/v1
slug: ticketing-flow-redesign
goal: >-
  Give Day Visitor a per-day quantity picker on its dedicated buy screen (F2) — the buyer picks
  how many tickets for EACH show day in one screen (e.g. 2 for Thursday, 1 for Saturday), instead
  of the current one-row-per-unit "assign a day to ticket #1, #2, ..." flow. Wire format posted to
  the checkout route is unchanged; this feature only changes how the client builds the lineItems
  array on this one screen. Conferences/Workshops' generic multi-type CartDayPicker flow is
  unchanged. Depends on F2 (renders inside F2's dedicated /tickets/day-visitor screen). Full
  design rationale: contracts/golden/ticketing-flow-redesign-f3/README.md.
created_at: '2026-08-24'
autonomy: high

# SCOPE: this feature touches exactly these files —
#   NEW  components/tickets/DayQuantityPicker.tsx — one row per show day, own quantity stepper —
#        README §2, golden day-quantity-picker.golden.md
#   EDIT lib/cart.ts — REMOVE expandDayQuantitiesToLineItems (flat-array shape); ADD
#        AttendeesByDay type + updateAttendeesByDay(), flattenAttendeesByDay(),
#        locateFlatAttendeeIndex(), updateAttendeeFieldByFlatIndex(),
#        expandAttendeesByDayToLineItems() pure exports — README §5.1, golden
#        day-quantity-picker.golden.md §1
#   EDIT components/tickets/useTicketCart.ts — takes a new showDays param; attendeesByDay state
#        (source of truth, replaces quantitiesByDay as tracked state — quantitiesByDay is now a
#        DERIVED read), updateDayQuantity/updateAttendeeField route through the new lib/cart.ts
#        per-day helpers, submit-time expansion via expandAttendeesByDayToLineItems() when
#        useDayQuantityPicker — README §5.1, golden day-quantity-picker.golden.md §2
#   EDIT components/tickets/TicketPurchaseForm.tsx — renders DayQuantityPicker XOR CartDayPicker
#        by the derived useDayQuantityPicker condition; hides TicketTypeCard's own stepper for
#        that branch; passes showDays into useTicketCart() — README §3, §5.1, golden
#        day-quantity-picker.golden.md §2-3
#   EDIT components/tickets/TicketTypeCard.tsx — optional hideQuantityStepper prop (mode="buy"
#        only) — README §3, golden day-quantity-picker.golden.md
#
# Explicitly UNCHANGED (README §1, §3-4, §6): app/api/tickets/checkout/route.ts (per-line-item
# chosenDay validation already works against any correctly-shaped array),
# components/tickets/CartDayPicker.tsx (generic multi-type day-picker, still used by
# Conferences/Workshops carts), CartAttendeeFields.tsx (same onAttendeeChange(slug, index, field,
# value) signature; useTicketCart routes internally, the component itself is untouched),
# chosenDayByType/updateChosenDay state, per-day capacity enforcement (still whole-show, per
# F4/F5 scope notes).
#
# CORRECTION (2026-08-24, README §5.1): QA's re-verification found a second real bug distinct
# from the first correction (identity-collapsing) — attendee identities got zipped to the WRONG
# day whenever a buyer edited an earlier day's quantity AFTER already entering a later day's
# quantity (interaction-ordered quantitiesByDay + tail-append attendeesByType vs. showDays-ordered
# flatten at submit time). Fixed by tracking attendee rows per-day (attendeesByDay) instead of a
# flat array + a separately-tracked quantity map. See A10 below.

features:
  - id: F3
    name: >-
      Day Visitor per-day quantity picker — pick ticket counts per show day in one screen, on top
      of F2's dedicated buy screen.
    status: pending

goldens:
  - .agent/memory/project/specs/ticketing-flow-redesign/goldens/README.md
  - contracts/golden/ticketing-flow-redesign-f3/README.md
  - contracts/golden/ticketing-flow-redesign-f3/day-quantity-picker.golden.md

assertions:
  phase: 4
  checks:
    - id: A1
      description: >-
        expandAttendeesByDayToLineItems() exists and matches the golden truth table (golden §1):
        empty map, a day entry with an empty array, mixed multi-day quantities each carrying
        their OWN distinct attendee row's identity, and output order following the showDays
        argument rather than the attendeesByDay object's own key-insertion order. The old flat
        expandDayQuantitiesToLineItems({ attendees, quantitiesByDay }) export must be GONE — its
        flat-array input shape is what made the A10 bug possible to write.
      command: npx tsx contracts/checks/ticketing-flow-redesign-f3/check-expand-day-quantities.mjs

    - id: A9
      description: >-
        useTicketCart's day-quantity-picker submit branch passes attendeesByDay/showDays directly
        into expandAttendeesByDayToLineItems — never a single row, never row 0 only. Guards against
        both the original identity-collapsing regression (README §5 "Correction") and a reversion
        to the flat attendees/quantitiesByDay shape the second correction (§5.1) removed.
      command: >-
        grep -qE "attendeesByDay(,|\s*:\s*attendeesByDay)" components/tickets/useTicketCart.ts &&
        ! grep -qE "attendeesByType\[slug\]\?\.\[0\]" components/tickets/useTicketCart.ts &&
        ! grep -q "expandDayQuantitiesToLineItems" components/tickets/useTicketCart.ts &&
        ! grep -q "expandDayQuantitiesToLineItems" lib/cart.ts

    - id: A2
      description: The new per-day quantity picker component exists.
      command: test -f components/tickets/DayQuantityPicker.tsx

    - id: A3
      description: >-
        DayQuantityPicker derives every day from its showDays prop — no literal calendar date
        anywhere in the file (same rule CartDayPicker already follows).
      command: >-
        ! grep -qE "202[0-9]-[0-9]{2}-[0-9]{2}" components/tickets/DayQuantityPicker.tsx

    - id: A4
      description: >-
        TicketPurchaseForm picks between DayQuantityPicker and the existing CartDayPicker via the
        derived single-type-and-requiresDaySelection condition, not a caller-supplied prop, and
        still imports/renders CartDayPicker for the multi-type case (Conferences/Workshops path
        preserved).
      command: >-
        grep -qE "ticketTypes\.length === 1 && ticketTypes\[0\]\.requiresDaySelection" components/tickets/TicketPurchaseForm.tsx &&
        grep -q "DayQuantityPicker" components/tickets/TicketPurchaseForm.tsx &&
        grep -q "CartDayPicker" components/tickets/TicketPurchaseForm.tsx

    - id: A5
      description: >-
        CartDayPicker.tsx itself is untouched by this feature (Conferences/Workshops' generic
        multi-type day-picker is not modified or deleted).
      command: test -f components/tickets/CartDayPicker.tsx

    - id: A6
      description: >-
        useTicketCart still exposes a quantitiesByDay read (now DERIVED from attendeesByDay,
        README §5.1 — not independently tracked state) and an updateDayQuantity setter, still
        exposes the pre-existing chosenDayByType/updateChosenDay pair unchanged (both models
        coexist, per README §3), and takes attendeesByDay as its per-day source of truth.
      command: >-
        grep -q "quantitiesByDay" components/tickets/useTicketCart.ts &&
        grep -q "updateDayQuantity" components/tickets/useTicketCart.ts &&
        grep -q "chosenDayByType" components/tickets/useTicketCart.ts &&
        grep -q "attendeesByDay" components/tickets/useTicketCart.ts

    - id: A7
      description: TypeScript compiles cleanly after the cart/component changes.
      command: npx tsc --noEmit -p tsconfig.json

    - id: A10
      description: >-
        BEHAVIORAL regression check for the interleaved-edit attendee/day mixup QA found on
        re-verification (README §5.1): drives the REAL exported state-update primitives
        (updateAttendeesByDay, updateAttendeeFieldByFlatIndex, expandAttendeesByDayToLineItems)
        through an interleaved sequence — 1 Monday ticket filled in, then 1 Wednesday ticket
        filled in, then Monday bumped to 2 and the new row filled in — an ordinary "add one more"
        revisit AFTER a later day was already entered. Asserts the resulting line items keep
        every named attendee zipped to the day the buyer actually meant
        (Alice->Mon, Bob->Wed, Carla->Mon), not the interaction/tail-append order the old flat
        quantitiesByDay + attendeesByType design produced (Alice->Mon, Bob->Mon, Carla->Wed —
        confirmed by re-running this exact sequence against the pre-fix code's logic). This is a
        behavioral test through the real state-transition functions, not a static grep and not a
        hand-built map.
      command: npx tsx contracts/checks/ticketing-flow-redesign-f3/check-interleaved-day-edit.mjs

    - id: A8
      description: >-
        MANUAL, visual-only (per this project's coding.md — automated checks above already prove
        the expansion math, the derived-condition wiring, and that CartDayPicker/checkout are
        untouched). A human or browser agent must load /tickets/day-visitor and confirm: each show
        day renders its OWN quantity stepper on one screen (not a single total quantity followed
        by N separate day-assignment rows), and the displayed total/estimated price updates
        correctly as day-quantities change.
      kind: agent_review
