goal: /events/submit offers a Host society select by name instead of a CMS id field, and the page and form sit on the /contact pattern at 44px.
created_at: '2026-10-25'
autonomy: high

features:
  - id: F6
    name: submit event - host society select and /contact pattern
    status: pending

goldens:
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/README.md
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/f6-submit-event.md
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f1.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f2.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f3.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f4.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f5.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f6.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f7.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f8.json

assertions:
  phase: 4
  checks:
    - id: A1
      description: SubmitEventForm takes a societies prop and renders a Host society select with id values and name text and no CMS wording, the page body is PageHero plus the form, and the env-gated fixture route exists with its flag in no deploy file (RED on baseline, 12 findings)
      command: node contracts/checks/polish-wave-2026-10-25/f6-submit-static.mjs
    - id: A2
      description: production build passes
      command: NEXT_PUBLIC_SANITY_PROJECT_ID=26yfbug4 NEXT_PUBLIC_SANITY_DATASET=production NEXT_PUBLIC_SAOC_SITE_URL=http://localhost:3002 NEXT_PUBLIC_NOS_SITE_URL=http://nos.localhost:3002 pnpm build
      timeout_seconds: 900
    - id: A3
      description: via the fixture route at 390@3, 768, 1280 and 1440@2 the page matches /contact (Crimson Pro 300 h1, hero, labels), every control is at least 44px, the select is id-valued and name-sorted, the submit is --accent at 44px, and the route is 404 without the flag (RED on baseline, route absent)
      command: node contracts/checks/polish-wave-2026-10-25/f6-submit-rendered.mjs
      timeout_seconds: 600
    - id: A4
      description: wave scope guard - every changed file is on a feature allow-list (goldens/scope/*.json) or under this mission's spec and check trees
      command: node contracts/checks/polish-wave-2026-10-25/scope.mjs
    - id: A5
      description: typecheck is clean
      command: pnpm exec tsc --noEmit
      timeout_seconds: 600
    - id: A6
      description: lint reports no errors
      command: pnpm lint
      timeout_seconds: 600
    - id: A7
      description: the feature doc exists and names the fixture route
      command: grep -q "events-fixtures" docs/polish-wave-f6-submit-event.md
