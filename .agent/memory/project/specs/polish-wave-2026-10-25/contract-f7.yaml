      description: "globals.css reserves the scrollbar gutter (RED on baseline). Triad coverage for F7, recorded here because the contract classifies exempt - Codex QA PASS (gpt-6-sol, full wave + F6 delta, execution/codex_qa.sh); browser layer is the orchestrator's post-deploy check on beta.saoc.co.za; gws inbox layer N/A, F7 sends no email."
      command: node contracts/checks/polish-wave-2026-10-25/f7-gutter-static.mjs
    - id: A2
      description: production build passes
      command: NEXT_PUBLIC_SANITY_PROJECT_ID=26yfbug4 NEXT_PUBLIC_SANITY_DATASET=production NEXT_PUBLIC_SAOC_SITE_URL=http://localhost:3002 NEXT_PUBLIC_NOS_SITE_URL=http://nos.localhost:3002 pnpm build
      timeout_seconds: 900
    - id: A3
      description: at 390@3, 768, 1280 and 1440@2 society email, phone, website, Facebook and Instagram links, the home Full calendar link, the contact info@ link and the societies search input are at least 44px with unchanged size, colour and underline, and both hosts report scrollbar-gutter stable (RED on baseline, every item)
      command: node contracts/checks/polish-wave-2026-10-25/f7-targets-rendered.mjs
      timeout_seconds: 900
    - id: A4
      description: wave scope guard - every changed file is on a feature allow-list (goldens/scope/*.json) or under this mission's spec and check trees
      command: node contracts/checks/polish-wave-2026-10-25/scope.mjs
    - id: A5
      description: typecheck is clean
      command: pnpm exec tsc --noEmit
      timeout_seconds: 600
    - id: A6
      description: lint reports no errors
      command: pnpm lint
      timeout_seconds: 600
    - id: A7
      description: the feature doc exists
      command: grep -q "TG-1" docs/polish-wave-f7-targets.md
