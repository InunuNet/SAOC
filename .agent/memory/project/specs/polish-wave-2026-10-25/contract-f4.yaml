schema: athanor.contract/v1
slug: polish-wave-2026-10-25
goal: Four visitor-facing duplications and a stale log-in prompt are removed without adding any copy.
created_at: '2026-10-25'
autonomy: high

features:
  - id: F4
    name: removals only - log-in clause, duplicate programme H2, sponsors eyebrow, sponsor card alignment
    status: pending

goldens:
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/README.md
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/f4-removals.md
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f1.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f2.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f3.json
  - .agent/memory/project/specs/polish-wave-2026-10-25/goldens/scope/f4.json

assertions:
  phase: 4
  checks:
    - id: A1
      description: the judges paragraph is exactly the pinned two sentences, TicketSection gains hideHeading with an aria-label, only programme passes it, the sponsors eyebrow is gone and the card body is left-aligned with a centred heading (RED on baseline, 11 findings)
      command: node contracts/checks/polish-wave-2026-10-25/f4-removals-static.mjs
    - id: A2
      description: production build passes
      command: NEXT_PUBLIC_SANITY_PROJECT_ID=26yfbug4 NEXT_PUBLIC_SANITY_DATASET=production NEXT_PUBLIC_SAOC_SITE_URL=http://localhost:3002 NEXT_PUBLIC_NOS_SITE_URL=http://nos.localhost:3002 pnpm build
      timeout_seconds: 900
    - id: A3
      description: at 390@3, 768, 1280 and 1440@2 /judging has no log-in clause, /programme has one h1 and no duplicate h2 yet keeps its aria-labelled section, /sponsors has no Our sponsors element, and none of the three overflows (RED on baseline)
      command: node contracts/checks/polish-wave-2026-10-25/f4-removals-rendered.mjs
      timeout_seconds: 600
    - id: A4
      description: wave scope guard - every changed file is on a feature allow-list (goldens/scope/*.json) or under this mission's spec and check trees
      command: node contracts/checks/polish-wave-2026-10-25/scope.mjs
    - id: A5
      description: typecheck is clean
      command: pnpm exec tsc --noEmit
      timeout_seconds: 600
    - id: A6
      description: lint reports no errors
      command: pnpm lint
      timeout_seconds: 600
    - id: A7
      description: the feature doc exists and records the copy gap
      command: grep -q "COPY GAP" docs/polish-wave-f4-removals.md
