# Sources: design lead Codi's r45 ruling, .tmp/sandbox/queue/r45-ruling.md:31 ("P3 later (queued): checkout picker drops the "997 left" counts the hub card shows
# - show them in both."), verbatim in goldens/spec.md. Visual: the hub card's own cell (components/tickets/keepsake/TicketCard.tsx, nos-structure.css:1947-1960);
# no checkout-specific design exists in design/design_handoff_saoc/, branding/National Show 2027/ or the NOS v4 spec. Rendered check: run from the worktree with
# NODE_OPTIONS='--require ../r19-chrome/use-chrome.cjs' (the Chrome shim).
schema: athanor.contract/v1
slug: nos-checkout-left-counts
goal: >-
  The Day Pass checkout day picker (/tickets/<slug>) shows each day's remaining count exactly as the hub's Day Pass card does: same server source
  (loadTicketCardViewModels, cards.day), same provisional rule (!withholdPlaceholderProse()), same cell markup, format string and CSS, from one shared
  DayCount component. Other products show no count. Amendment 1 (Codi): a sold-out day is a native disabled, is-out option exactly as on the hub. r45 behaviour (no default day, required-day alert, aria-invalid, focus) is untouched. No new copy,
  style or data source.
created_at: '2026-10-22'
autonomy: high
exclusions:
  - item: 'every file outside goldens/footprint.json, docs/nos-checkout-left-counts.md and this spec dir (enforced by A2)'
    reason: 'Codi queued the counts and, in amendment 1, disabling sold-out days (match the hub at every width; no checkout-only variant). Nothing else.'
features:
  - id: F1
    name: Per-day "N left" counts on the checkout day picker from the hub's own source and one shared DayCount (r45 P3)
    status: pending
goldens:
  - .agent/memory/project/specs/nos-checkout-left-counts/goldens/spec.md
  - .agent/memory/project/specs/nos-checkout-left-counts/goldens/edits.json
  - .agent/memory/project/specs/nos-checkout-left-counts/goldens/footprint.json
  - .agent/memory/project/specs/nos-checkout-left-counts/goldens/checks.sha256
assertions:
  phase: 4
  checks:
    - id: A1
      description: Check scripts and goldens are unmodified since @architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/nos-checkout-left-counts/goldens/checks.sha256
    - id: A2
      description: Footprint - the branch differs from its merge-base with origin/main only in the four footprint files, docs/nos-checkout-left-counts.md and the spec dir, and HEAD descends from 62dd9f63
      command: node .agent/memory/project/specs/nos-checkout-left-counts/checks/footprint.mjs
    - id: A3
      description: Static - the count format, nk-of/nk-left and the unconfirmed note are defined once in DayCount and used by the hub card and the checkout form, the page reads the hub loader (cards.day, hub showProvisional) for the Day Pass only with no second data source, the form fetches nothing and keeps every r45 line, no CSS or copy added, docs
      command: node .agent/memory/project/specs/nos-checkout-left-counts/checks/static.mjs
    - id: A4
      description: Lint clean on the five TS/TSX files
      command: pnpm exec eslint "app/(marketing)/tickets/[slug]/page.tsx" components/tickets/TicketPurchaseForm.tsx components/tickets/keepsake/TicketCard.tsx components/tickets/keepsake/DayCount.tsx components/tickets/useTicketCart.ts
    - id: A5
      description: Type-check clean
      command: pnpm exec tsc --noEmit
    - id: A6
      description: Rendered (public and preview builds, 1280/390, live data) - each shared day option carries the hub's own count cell ("N left"/"N of T", Few left, unconfirmed note) described by its radio; r45 behaviour holds; axe clean in initial, error and chosen states; no overflow; Weekend Pass and VIP checkouts show no count; the hub cells keep their shape
      command: node .agent/memory/project/specs/nos-checkout-left-counts/checks/rendered.mjs
    - id: A7
      description: Rendered, sold-out harness (amendments 1 and 2, Codi; a sold-out ?day= is ignored on load and a 409 race renders the server text in the day group TicketFieldAlert with focus and refreshed tile; public build, 1280/390, a day forced sold out in flight on the hub and the checkout) - the sold-out day is a native disabled, unchecked, is-out option reading Sold out with the hub's own muted style, cannot be chosen by click, arrow keys or Tab, r45's no-day alert focuses the first enabled day, the existing server error still renders for an enabled and for a linked sold-out day, axe clean, no overflow
      command: node .agent/memory/project/specs/nos-checkout-left-counts/checks/soldout.mjs
