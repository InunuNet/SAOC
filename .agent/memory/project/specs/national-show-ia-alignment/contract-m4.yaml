        mapping 1-4 to complete Tailwind class names. THE n=13 HOLE IS CLOSED: Codi's tie-break
        is NOT "minimise orphans", which would leave a lone card in a partial row - the defect
        was never "one card in a row", it was DEAD CELLS BESIDE A LONE CARD. When no c in 4..3
        avoids the orphan, keep the content ceiling and let the FINAL CARD SPAN the remainder,
        so n=13 gives columns 4 and finalCardSpans 4: three full rows plus one full-width card,
        no dead cells. The search floor is 3, never 2 - see D88.
      type: shell
      command: grep -q '^G1 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D86
      description: >-
        NEVER A PARTIAL ROW. Browser-measured: wherever a rendered grid's last row holds fewer
        items than there are columns, the final item's computed column span equals the number of
        tracks remaining in that row, so it fills the row and no dead cells sit beside it. This
        is the prohibition that ships with the tie-break, and without it resolveGridLayout can
        return finalCardSpans correctly while the JSX ignores the value - the same
        computed-then-discarded failure D68 and D70 exist in pairs to catch.
      type: shell
      command: grep -q '^G4 PASS$' .tmp/sandbox/nos-ia/m4-notice-results.txt

    - id: D87
      description: >-
        NEVER CENTRE THE LONE CARD. Browser-measured: a spanning final card's rendered left edge
        equals its grid's content-box left edge, and it carries no centring - no auto inline
        margins, no justify-self center. A lone centred card in a four-column grid is the
        accidental-looking version of the very defect the span rule removes, and it would pass
        D86 because a centred card can still span the remainder.
      type: shell
      command: grep -q '^G5 PASS$' .tmp/sandbox/nos-ia/m4-notice-results.txt

