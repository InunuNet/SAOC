        distinction is the point: an unasserted case reads as a gap in the gate, an exempt one is
        a recorded decision. Codi's reasoning, recorded so it is not re-derived: a two-column
        grid reads as a list more than a grid, one empty cell beside a trailing card is mild, and
        dropping a tablet to a single column is worse than tolerating it. At c = 1 it cannot
        arise. Asserted statically on the helper - its orphan search floor is 3 and it never
        rejects a candidate below that - so a future edit that quietly extends the rule to two
        columns, or quietly stops applying it at three, fails here.
      type: shell
      command: grep -q '^G6 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

