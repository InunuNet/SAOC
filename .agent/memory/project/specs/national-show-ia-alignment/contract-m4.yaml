        resolveNotice returns the draft notice for council-draft, and suppression still requires
        council-supplied AND a resolving sourcePath. The fourth value widens what notifies, never
        what suppresses - the fail-loud table gains a row and loses none.
      type: shell
      command: grep -q '^CD2 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D36
      description: >-
        council-draft carries the same seed-write protection as council-supplied - never created,
        updated, patched or deleted by the seed, checked before any hash. They are still her
        words; being unfinished does not make them ours to overwrite.
      type: shell
      command: grep -q '^CD3 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D37
      description: >-
        showPageSettings.draftLabel and draftNotice are required, and the hardcoded fallbacks
        match the golden verbatim, so a missing settings document cannot suppress the draft
        notice - the same fail-loud property the other two notices already have.
      type: shell
      command: grep -q '^CD4 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D38
      description: >-
        17-faq's Q1 answer is present as council-draft - her words restored verbatim, sourcePath
        naming the recovered document, rendering with the draft notice. M3 deleted the unfinished
        fragment because with three values there was no honest way to publish it; F20 creates
        that way, so the deletion is reversed rather than left standing. This is also the one
        assertion proving the fourth value was actually used for the case that motivated it,
        rather than shipped and left unexercised - a dropped fragment stays dropped by inertia,
        because nothing surfaces it and the page looks finished without it.
      type: shell
      command: grep -q '^CD5 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    # -----------------------------------------------------------------------
    # Local render, BEFORE push. Brad's process rule, 2026-09-10: prove local
    # render, not that a file exists. goldens/m4/local-render.golden.md.
    # -----------------------------------------------------------------------

    - id: D76
      description: >-
        All 17 listed routes return HTTP 200 on localhost. test -f page.tsx proves a file
        exists; it does not prove the route resolves.
      type: shell
      command: grep -q '^L1 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D77
      description: >-
        Each of the 17 renders its OWN h1, matching its manifest label or seed title. This is
        what separates a rendered page from an error boundary - a Next error boundary returns
        200 with no page h1, and a 200-only check goes green on a broken site.
      type: shell
      command: grep -q '^L2 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D78
      description: >-
        None of the 17 responses contains an error-overlay marker - nextjs-portal,
        __next_error__, "Application error", "Unhandled Runtime Error", "Internal Server Error".
      type: shell
      command: grep -q '^L3 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D79
      description: >-
        ZERO console.error and zero pageerror events across the 17 loads, collected in a real
        browser context rather than from the HTML. Catches the page that renders and then throws.
      type: shell
      command: grep -q '^L4 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D80
      description: >-
        /national-show/upcoming returns 404. A 3xx FAILS. The ruling was "delete the route, no
        redirect" - the site is early alpha, there are no bookmarks to preserve, and a redirect
        left in place satisfies "the page is gone" while leaving exactly the artefact the ruling
        removes.
      type: shell
      command: grep -q '^L5 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D81
      description: >-
        /national-show/plant-exhibition, /plant-sales, /judging-and-awards and /contact each
        return 404. A 200 here means someone built a page the ruling forbade.
      type: shell
      command: grep -q '^L6 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D82
      description: >-
        Every one of the 17 renders ShowSectionNav, and every internal href on each page resolves
        to a route that does not 404 - CRAWLED, not read from source. A link that renders is a
        link a visitor can click, and a source-level check misses a href built at runtime.
      type: shell
      command: grep -q '^L7 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D83
      description: >-
        The four unlisted sub-routes return a non-5xx status. They are the saoc-eb lane's and may
