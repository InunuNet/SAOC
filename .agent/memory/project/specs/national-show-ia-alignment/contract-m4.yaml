schema: athanor.contract/v1
slug: national-show-ia-alignment
goal: >-
  Build the National Show subsection to Brad's approved 17-page tree - six routes created, the
  hub restructured into four IA groups, five existing routes reconciled, /upcoming deleted with
  no redirect, four orphaned seeds retired explicitly rather than left to rot, every page
  reachable by clicking from both surfaces this lane owns, every page rendering on localhost
  before anything is pushed, every non-Council block carrying R11's chip-sentence-rail
  disclosure, every listing grid deriving its column count from the rendered item count, and a
  route manifest the main-site lane can build its header from without reading our code.
created_at: '2026-09-10'
autonomy: high

# ---------------------------------------------------------------------------
# REVISION 2 - 2026-09-10. Retargeted from the superseded sixteen-new-page tree
# to Brad's approved 17-page tree. What changed, and what was dropped, is stated
# in goldens/m4/route-manifest.golden.md and summarised in the architect's report.
#
# REVISION 3 - 2026-09-10, after merge 42437ed2 brought origin/main in.
# /national-show/about ALREADY EXISTS, is deployed, and is guarded by ANOTHER
# MISSION'S live contract (specs/site-content-alignment/contract-f3.yaml, A2/A4/
# A11/A12). It is RECONCILE, never CREATE. The create list is SIX.
# Two collisions that merge exposed, both resolved here rather than left to @dev:
#   1. site-content-alignment A11/A12 require LITERAL `href: '/national-show/about'`
#      object entries in ShowSectionNav.tsx AND the hub page.tsx. Revision 2's
#      "render the hub from the manifest" would have deleted both and broken a
#      green contract on another mission. Resolved by D53.
#   2. Seed 02-about-the-national-show.json is an INCOMPLETE EXTRACTION - it holds
#      ~1,372 chars of a 2,587-char source that the deployed page renders in full.
#      Repointing /about onto loadShowPage would have DELETED roughly half of
#      Lee-Ann's About copy from a live page. Resolved by D65 and D69.
#
# Authoritative on the tree: goldens/m4/route-manifest.golden.md.
# .agent/memory/project/rules.md lines 82-100 still carry the OLD 16-page version
# and disagrees with this contract - flagged for correction, not encoded.
# ---------------------------------------------------------------------------

features:
  - id: F12
    name: >-
      Route scaffolding and navigation - the SIX new routes (programme, symposium, wosa,
      sa-exhibitors, international-guests, sponsors), the hub restructured into four IA groups,
      /upcoming deleted with NO redirect, every listed route reachable by clicking from BOTH
      surfaces this lane owns (the hub's groups and ShowSectionNav), plus the /societies link
      that is all spec entry 14 gets. Site chrome is off-limits - components/chrome/ belongs to
      the saoc-eb lane and no assertion may depend on a header entry existing
    status: pending
  - id: F13
    name: >-
      Reconcile the five existing reconcilable routes without moving any of them - about,
      what-to-expect, plan-your-visit, faq, workshops - plus the /national-show landing page,
      which is a subsection landing page and never a home page. /about is DEPLOYED and guarded
      by another mission's live contract: M4 repairs its incomplete seed and does NOT repoint
      the route
    status: pending
  - id: F14
    name: >-
      Real empty listings - /sa-exhibitors and /international-guests over vendorNursery,
      /sponsors over a NEW showSponsor type with its own data scope. Zero invented nurseries
      and zero invented sponsors: an invented entity is an invented commercial relationship
      with a real business
    status: pending
  - id: F16
    name: >-
      Unify the placeholder mechanism - showVisitorInfo and showFaq onto the shared Provenance
      type, migration BEFORE the schema tightens
    status: pending
  - id: F17
    name: >-
      R11's disclosure made measurably noticeable - chip, one sentence, and a dashed 2px rail
      down the full height of the block it governs; warning tokens for AI-generated, muted for
      researched-but-unconfirmed, never error/red; the --status-muted-on-dark token declared;
      N1-N15 measured on composited pixels
    status: pending
  - id: F20
    name: >-
      The fourth provenance value, council-draft - the council's words, not yet finished, and
      notified. Closes the conflation of "whose words these are" with "whether they are
      finished", which let an unfilled FAQ template render as finished copy with no notice
    status: pending
  - id: F21
    name: >-
      Retire the four orphaned seeds explicitly and close M1's open content-linkage defect -
      the two sections whose body is our prose but is labelled council-supplied. The linkage
      threshold is never loosened; the content was wrong, not the check
    status: pending
  - id: F22
    name: >-
      R13's grid orphan rule, with the column count DERIVED from the rendered item count at
      runtime and never a hardcoded column class
    status: pending
  - id: F23
    name: >-
      Local render proof - every one of the 17 routes rendering on localhost, and every deleted
      or never-create slug returning 404, BEFORE anything is pushed
    status: pending
  - id: F15
    name: >-
      Deployed verification - the triad against the live origin, last
    status: pending

goldens:
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m1/page-contract.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m3/wosa-content-boundary.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/route-manifest.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/route-manifest-schema.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/hub-groups.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/retired-seeds.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/grid-orphan-rule.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/local-render.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/r11-disclosure.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/notice-visibility.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/seed-write-narrowing.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/visitor-info-unification.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/council-draft-provenance.golden.md
  - .agent/memory/project/specs/national-show-ia-alignment/goldens/m4/verifier-contract.golden.md

assertions:
  phase: 4
  checks:

    # -----------------------------------------------------------------------
    # Drivers. Three, each writing every id on every run and exiting 2 - never
    # 1 - if the harness itself broke or an id went unwritten.
    # -----------------------------------------------------------------------

    - id: D0_DRIVER
      description: >-
        Run the M4 static verifier - routes, reachability, route manifest, hub groups, sponsors
        scope, empty listings, retired seeds, content linkage, seed-write narrowing,
        visitor-info unification, the grid function. Exit 0 all passed, 1 a check failed, 2 the
        harness broke.
      type: shell
      timeout_seconds: 900
      command: node_modules/.bin/tsx scripts/checks/verify-show-page-m4.ts

    - id: D0_NOTICE_DRIVER
      description: >-
        Run the Playwright disclosure verifier - N1-N15 and G3b measured on composited pixels at
        390 and 1280 against its own dev server. A computed style can be correct while the
        rendered result is not, which is why nothing here reads the stylesheet.
      type: shell
      timeout_seconds: 900
      command: node_modules/.bin/tsx scripts/checks/verify-nos-m4-notice.ts

    - id: D0_LOCAL_DRIVER
      description: >-
        Run the local-render verifier - L1-L8, every route fetched and rendered on localhost
        BEFORE anything is pushed. Brad's process rule: prove local render, not that a file
        exists.
      type: shell
      timeout_seconds: 900
      command: node_modules/.bin/tsx scripts/checks/verify-nos-m4-local-render.ts

    - id: D94
      description: >-
        NO VERIFIER USES CLAUDE-IN-CHROME. The three drivers reference playwright and never
        mcp__claude-in-chrome or chrome-devtools. .claude/rules/shell-paths.md forbids it in
        this project: it raises an interactive permission prompt for browser-window creation and
        tab access, which stalls an unattended gate - and an assertion that stops on a permission
        modal is theatre, not verification. Playwright is installed and headless. Every
        browser-measured check in this contract (N1-N15, G3b, G4, G5, S1-S4) depends on this.
      type: shell
      command: test -z "$(grep -rl 'claude-in-chrome\|chrome-devtools' scripts/checks 2>/dev/null)" -a -n "$(grep -rl playwright scripts/checks 2>/dev/null)"

    - id: D0_NOT_IN_HARNESS
      description: >-
        None of the three verifiers was written into execution/checks/, which the next template
        update deletes, silently removing this gate.
      type: shell
      command: test ! -e execution/checks/verify-show-page-m4.ts -a ! -e execution/checks/verify-nos-m4-notice.ts -a ! -e execution/checks/verify-nos-m4-local-render.ts

    # -----------------------------------------------------------------------
    # Routes and reachability. goldens/m4/route-manifest.golden.md.
    # -----------------------------------------------------------------------

    - id: D1
      description: >-
        The approved tree exists - every CREATE and RECONCILE route has a page.tsx, every
        non-retired seed's pageKey maps to exactly one route, and the counts hold: 17 listed,
        SIX created (programme, symposium, wosa, sa-exhibitors, international-guests,
        sponsors), FIVE reconciled (about, what-to-expect, plan-your-visit, faq, workshops),
        1 hub restructured, 5 untouchable. /about is reconciled and NOT created - it came in
        with 9fa4067e, is deployed, and creating a second one would overwrite live work.
      type: shell
      command: grep -q '^R1 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D2
      description: >-
        The five untouchable routes are unmodified - tickets, conferences, exhibitors, vendors,
        archive. REVISION 2 DROPPED revision 1's cross-link carve-out for conferences and
        exhibitors: the approved tree makes them link TARGETS reached from the hub and
        ShowSectionNav, so nothing needs to change inside them, and a carve-out nobody needs is
        a hole nobody is watching.
      type: shell
      command: grep -q '^R2 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D3
      description: >-
        EVERY LISTED ROUTE IS REACHABLE BY CLICKING, FROM BOTH SURFACES WE OWN - the
        /national-show hub's four group sections AND components/show/ShowSectionNav.tsx's
        SECTION_LINKS. components/chrome/nav-config.ts is NOT consulted and must not be: site
        chrome belongs to the saoc-eb lane. No assertion may depend on a header entry existing -
        the approved design handoff specifies a flat six-item nav with no dropdown, so a header
        entry may not exist at all. Tightened from revision 1's "at least one surface": with no
        dropdown these two surfaces are the ENTIRE navigation for the subsection, and a page on
        only one of them is one edit from unreachable. The property is unchanged -
        /national-show/archive returned 200 for months with nothing linking to it, and a 200
        nothing links to has not been delivered.
      type: shell
      command: grep -q '^R3 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D4
      description: >-
        A link to /societies exists on one of the two surfaces we own. All spec entry 14 gets,
        per Lee-Ann's own instruction that the directory stays in the SAOC section. Not placed
        in site chrome, which is the other lane's.
      type: shell
      command: grep -q '^R4 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D5
      description: >-
        No colour, font-family, border-radius or box-shadow literal under
        app/(marketing)/national-show/. The NOS identity is inherited from the layout's
        .nos-theme scope and never re-declared. Verified clean at M1 baseline, so this is a
        regression guard, not an aspiration.
      type: shell
      command: grep -q '^R5 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D6
      description: >-
        loadShowPage returning null produces a 404, not an empty page. An empty page reads as a
        finished page with nothing to say - the silent failure this mission exists to prevent.
      type: shell
      command: grep -q '^R6 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    # SWEEP RESULT, stated rather than left to be inferred. Every one of M4's
    # assertions was re-read against one question: if it claims something about a
    # ROUTE, does it look at rendered output or at a path? Three claimed a route
    # property from a path - D42's route half, D45 and D52 - and all three are
    # rewritten below as rendered-output snapshots (S1-S3). The rest are not route
    # claims and a path or source check is the correct instrument for them:
    #   D42 (file half), D28  - FILE OWNERSHIP. "we did not edit their source" is a
    #                           claim about files, and a path diff proves it exactly.
    #   D5, D51, D63, D64, D68 - SOURCE-LEVEL properties (no colour literal, which
    #                           query is imported, the linkage threshold, no hardcoded
    #                           column class). The thing asserted IS the source text.
    #   D43                   - has a live half already: L5 requires a 404 and fails a 3xx.
    #   D68                   - paired with D70, its rendered half, by the same argument.
    #   D69                   - deliberately mirrors another mission's own grep form so the
    #                           two contracts cannot disagree; S1 covers /about's output.
    # ------------------------------------------------------------------------

    - id: D42
      description: >-
        FILE OWNERSHIP - nothing modified under components/chrome/ or next.config.ts. NARROWED
        at revision 4: this now covers only files whose ownership is the property, never routes.
        Every route that used to be listed here moved to S1's rendered-output snapshots, because
        a path check on page.tsx passes while a shared component underneath changes what the
        route renders - satisfiable without the property it claims to prove, which is this
        repo's audited defect class. components/show/** is NO LONGER LISTED: the other lane
        handed it over, all of it renders under /national-show, and splitting it by route would
        be a fiction. Base ref is the PR base, not HEAD - delivery is nos-site -> PR -> review,
        never a direct merge to main, and a HEAD baseline reports clean whatever was committed.
      type: shell
      command: test -z "$(git diff --name-only "${M4_BASE_REF:-origin/main}" -- 'components/chrome' 'next.config.ts')"

    - id: D89
      description: >-
        S1 - THE UNTOUCHABLE ROUTES' RENDERED OUTPUT IS UNCHANGED, snapshot-compared against a
        pre-M4 baseline. Covers /national-show/tickets, /conferences, /exhibitors, /vendors and
        its three sub-routes, /archive and /archive/[year], plus site-level /sponsors, /judging,
        /contact, /societies, /media-kit and /about. THIS REPLACES the path checks that used to
        stand for them. The other lane's constraint is IDENTITY, NOT OWNERSHIP - cross-cutting
        change to the components these routes render is expected and allowed; what may not
        change is what a visitor sees. Normalised output is DOM text plus link hrefs plus
        heading structure, with time-dependent content (countdowns, relative dates) normalised
        away; the driver FAILS LOUD rather than passing if a route's output normalises to empty,
        because a snapshot of nothing matches everything.
      type: shell
      command: grep -q '^S1 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D90
      description: >-
        S2 - IDENTITY, STATED POSITIVELY. /national-show/exhibitors still renders the grower
        entry guide - its entryProcess, fees, classes, judging, eligibility, display, sales,
        practicalities and permits sections - at its own unchanged slug, and renders NO
        nursery-directory fields. S1 proves the output did not change; S2 proves it is still the
        RIGHT page, which is the property the rename/repoint prohibition actually protects. A
        snapshot alone would pass if someone repointed the route and regenerated the baseline.
      type: shell
      command: grep -q '^S2 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D91
      description: >-
        S3 - THE BASELINE WAS CAPTURED BEFORE M4, NOT REGENERATED FROM THE CURRENT TREE. Each
        snapshot file's git blob is unchanged since the mission base ref. Without this, S1
        compares the tree against a copy of itself taken after the change - exactly the trap
        site-content-alignment's A10 names in its own description, and the reason that check
        reuses an F2 baseline rather than a fresh self-comparison. An unpinned baseline makes
        S1 and S2 both unconditionally green.
      type: shell
      command: grep -q '^S3 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D92
      description: >-
        THE ONE CONFLICT THIS CREATES, NAMED SO @dev CANNOT SILENTLY PICK A SIDE. D68 now sweeps
        components/show/**, so a shared component's hardcoded grid becomes derived - and if
        resolveGridLayout returns a different column count than that component currently renders
        on an untouchable route, S1 goes red. That is a real R13 fix colliding with a real
        identity guarantee. RULING: THE SNAPSHOT WINS. The other lane ruled rendered output, R13
        is ours, and a unilateral change to their page is exactly what the identity constraint
        forbids. @dev escalates to the lead rather than regenerating the baseline or exempting
        the component. This assertion pins that no baseline was regenerated to resolve such a
        collision quietly.
      type: shell
      command: grep -q '^S4 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    - id: D43
      description: >-
        /national-show/upcoming is GONE and NO REDIRECT replaces it. The directory does not
        exist and no source file references the path. Brad's ruling was "delete the route, no
        redirect" - the site is early alpha, there are no bookmarks to preserve, and a 308 left
        in place satisfies "the page is gone" while leaving exactly the artefact the ruling
        removes. The live half of this is L5, which requires a 404 and FAILS on a 3xx.
      type: shell
      command: test ! -e 'app/(marketing)/national-show/upcoming' -a -z "$(grep -rl 'national-show/upcoming' app components lib --include='*.ts' --include='*.tsx' 2>/dev/null)"

    # -----------------------------------------------------------------------
    # The route manifest - the artifact the saoc-eb lane builds its header from
    # without reading our code. goldens/m4/route-manifest-schema.golden.md.
    # -----------------------------------------------------------------------

    - id: D41
      description: >-
        The route manifest exists at its contracted path, so the consuming lane can find it
        without asking.
      type: shell
      command: test -f content/national-show-routes.json

    - id: D40
      description: >-
        The manifest lists EXACTLY the routes that exist under app/(marketing)/national-show/ -
        21 rows, 17 listed and 4 unlisted - cross-checked in BOTH directions against the
        page.tsx files on disk AND against the golden's tables, with every required field
        present on every row including explicit nulls, every non-null pageKey resolving to a
        real non-retired seed, and no retired pageKey appearing anywhere. The saoc-eb lane wires
        its header from this file without reading our code, so a manifest that has drifted is
        worse than none - they build from it and never find out. One-directional checking
        catches a dead link but not a silently dropped page.
      type: shell
      command: grep -q '^RM1 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D44
      description: >-
        AUTHORISED BY THE OTHER LANE. app/sitemap.ts derives its /national-show/* block FROM
        content/national-show-routes.json - every indexable:true row appears in the sitemap
        output and every indexable:false row does not, checked both ways. SCOPED TO THE
        /national-show/* BLOCK ONLY: the SAOC static routes and the Sanity society/event blocks
        are untouched, they belong to the other lane, and they are not what drifts. This is not
        hypothetical drift - that file TODAY lists /national-show/upcoming, a route M4 deletes,
        and omits what-to-expect, plan-your-visit, faq, workshops, exhibitors, vendors and
        tickets entirely.
      type: shell
      command: grep -q '^RM2 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D93
      description: >-
        THE DERIVATION IS REAL, NOT DECORATIVE - the derived /national-show/* block emits NO
        upcoming row, and the SAOC static and Sanity society/event blocks are byte-unchanged.
        The upcoming row needs no separate deletion: deriving from the manifest means a route
        that is not in the manifest stops existing in the sitemap. So a derived block that
        STILL emits upcoming proves the derivation is fake - a hand-kept list wearing a
        generated one's clothes - and that is the single cheapest way to tell the two apart.
      type: shell
      command: grep -q '^RM3 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    # -----------------------------------------------------------------------
    # /national-show/exhibitors is the GROWER ENTRY GUIDE. /sa-exhibitors is the
    # PUBLIC NURSERY DIRECTORY. Different audiences, different data sources, both
    # correct. The Drive filename "1.1 SA Exhibitors" points the wrong way and
    # this confusion has already been made once in this mission and corrected once.
    # -----------------------------------------------------------------------

    - id: D45
      description: >-
        REWRITTEN AT REVISION 4 - was a path diff on app/(marketing)/national-show/exhibitors/,
        which is precisely the pattern this milestone's own sweep found defective. The
        constraint on this route is IDENTITY, NOT OWNERSHIP: do not rename it, do not repoint
        it, do not turn it into the nursery directory - while cross-cutting change to the
        components it renders is expected. The real property is that its rendered output does
        not change, proved by S1 (D89) and its identity by S2 (D90). This id now asserts only
        the part a path check can honestly carry: the route still exists at its own slug and
        was not renamed away.
      type: shell
      command: test -f 'app/(marketing)/national-show/exhibitors/page.tsx'

    - id: D46
      description: >-
        The two manifest rows STATE the distinction in a field that carries it - exhibitors'
        purpose contains "entry", sa-exhibitors' purpose contains "directory", both are
        non-empty and unequal, and seed 04-south-african-exhibitors resolves to sa-exhibitors and
        to no other row. D45 alone would pass if a future session pointed sa-exhibitors at
        showExhibitorInfo; D46 alone would pass if someone edited the entry guide while leaving
        the labels correct. Both, or the confusion recurs.
      type: shell
      command: grep -q '^X2 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    # -----------------------------------------------------------------------
    # The hub, restructured into four IA groups. goldens/m4/hub-groups.golden.md.
    # With a flat six-item header and no dropdown, the hub IS the subsection's
    # primary navigation - which is why its structure is a golden.
    # -----------------------------------------------------------------------

    - id: D47
      description: >-
        Four groups - visit, programme, exhibit-trade, the-show - with exact ids, exact labels
        and this order; all 16 child pages present, each in exactly one group, link text equal
        to its manifest label. REVISED at revision 3: the hub keeps LITERAL href object entries
        rather than rendering from the manifest, because another mission's live contract greps
        for one of those literals. The anti-drift property is not dropped, it moves to gate time
        - D53 asserts the literals and the manifest agree exactly, in both directions.
      type: shell
      command: grep -q '^H1 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D53
      description: >-
        THE HUB AND ShowSectionNav KEEP LITERAL href OBJECT ENTRIES, AND THOSE LITERALS EQUAL
        THE MANIFEST EXACTLY. Revision 2 said the hub should render FROM the manifest so there
        is never a second hand-kept list. The merge showed that would break a GREEN CONTRACT ON
        ANOTHER MISSION: specs/site-content-alignment/contract-f3.yaml A11 and A12 grep for a
        literal `href: '/national-show/about'` object entry in components/show/ShowSectionNav.tsx
        and in app/(marketing)/national-show/page.tsx respectively, and their own descriptions
        say the array literal is where the real link data lives. Generating the lists at runtime
        deletes both literals. So the literals STAY, and the anti-drift property moves from
        runtime to GATE TIME: this check parses both arrays and asserts their href sets equal
        the manifest's listed slugs exactly, in both directions. Same guarantee, no cross-mission
        breakage.
      type: shell
      command: grep -q '^NAV1 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D69
      description: >-
        /national-show/about IS NOT REPOINTED and site-content-alignment F3's assertions still
        pass - its three canary phrases still appear under the route directory, and the outbound
        wildorchids.co.za link is still there. The page is deployed, correct, and carries
        Lee-Ann's copy verbatim from docs/leeann-source/about-national-show_2026-09-09.md. M4
        reconciles it by REPAIRING ITS SEED (D65), never by rewriting a live page onto a data
        path - which would be a change with no benefit to this milestone and real risk to
        another mission's green gate.
      type: shell
      command: python3 -c "import json,subprocess; d=json.load(open('.agent/memory/project/specs/site-content-alignment/goldens/fixtures/f3-canary-phrases.json'))['about']; missing=[p for p in d['phrases'] if subprocess.run(['grep','-rq',p,d['routeDir']]).returncode!=0]; assert not missing, missing" && grep -rq -- "wildorchids.co.za" 'app/(marketing)/national-show/about/'

    - id: D65
      description: >-
        NO council-supplied SEED SECTION SILENTLY OMITS SOURCE CONTENT THE LIVE ROUTE ALREADY
        RENDERS. Found while re-reading the merged tree: seed 02-about-the-national-show.json
        holds ~1,372 characters of a 2,587-character source document, while the deployed /about
        page renders the whole thing - the vendors-and-sponsors paragraph and the closing
        paragraph are in BOTH source files and on the page, and absent from the seed. Repointing
        /about onto loadShowPage would therefore have DELETED ROUGHLY HALF OF LEE-ANN'S ABOUT
        COPY FROM A LIVE PAGE, and every existing check would have stayed green: the linkage
        check is ONE-DIRECTIONAL - it proves what IS in the body occurs in the source, never
        that what is in the source made it into the body. This closes that direction. The
        resolution is to COMPLETE THE SEED from the source, never to trim the page to match it.
      type: shell
      command: grep -q '^CL5 PASS$' .tmp/sandbox/nos-ia/m4-results.txt

    - id: D48
      description: >-
        Each group is a real landmark - a section element with an accessible name matching its
        heading, and the heading ahead of its links in document order. A group that is only a
        styled div is invisible to a screen-reader user navigating by heading, and on this
