      type: shell
      command: grep -q '^L8 PASS$' .tmp/sandbox/nos-ia/m4-local-results.txt

    # -----------------------------------------------------------------------
    # Preservation.
    # -----------------------------------------------------------------------

    - id: D28
      description: ticketType and the gated vendor subsystem are untouched.
      type: shell
      command: test -z "$(git diff --name-only HEAD -- sanity/schemas/documents/ticketType.ts app/api/vendors)"

    - id: D29
      description: The project still typechecks.
      type: shell
      timeout_seconds: 900
      command: node_modules/.bin/tsc --noEmit -p tsconfig.json

    # -----------------------------------------------------------------------
    # The verification triad. M4 builds seven real pages, restructures the hub and
    # deletes a route on a deployed origin - this is the milestone the triad exists
    # for, and it must never be added to any exemption baseline. codex_qa and
    # browser_deployed_check read `target:` and ignore `command:`; D33 guards that.
    #
    # gws_inbox_check IS DELIBERATELY ABSENT THIS REVISION - see D32.
    # -----------------------------------------------------------------------

    - id: D30
      description: >-
        Codex cross-model adversarial review of the M4 diff. On M1 this assertion found a broken
        core guarantee that the commissioned verifier, @qa and the team lead all missed.
      type: codex_qa
      timeout_seconds: 600
      target: >-
        Adversarially review the current git diff for real bugs, security issues and correctness
        risks - not style. Pay particular attention to guards satisfiable by something other than
        the real property they claim to check; to any write path that can overwrite content a
        human edited; to accessibility affordances present in the DOM but not perceivable; to any
        listing that could render an entity name not present in
        content/show-pages/_name-allowlist.json; and to any grid column count that is hardcoded
        rather than derived from the rendered item count. Cite exact file:line, state the
        concrete failure scenario, and rate confidence. If nothing real is wrong, say so plainly
        instead of inventing findings.

    - id: D31
      description: >-
        BrowserAgent drove the deployed National Show pages against the live origin and recorded
        a manifest - origin, path tested, screenshot, commit sha equal to HEAD, and an http
        status the wrapper re-fetches live. Seven new pages plus a restructured hub is exactly
        what this check is for. Distinct from D76-D83, which run on localhost BEFORE push: a
        deployed check that fails has already cost a push, and a local check cannot see an
        env or build difference on the host.
      type: browser_deployed_check
      timeout_seconds: 300
      target: .agent/memory/scratch/m4-browser-manifest.json

    - id: D32
      description: >-
        THE gws_inbox_check HAS NO SUBJECT UNDER THE APPROVED TREE, AND THAT IS ESCALATED RATHER
        THAN FAKED. Revision 1 satisfied it through spec entry 18's contact page - a
        POPIA-consented form reusing /api/contact to Resend, so a test submission produced a real
        email gws could verify. Brad's approved tree DELETES that page. No route M4 owns wires a
        form that sends mail; /national-show/vendors/apply does, and it is the saoc-eb lane's,
        untouchable, and not in this diff. Pointing the manifest at the site-level /contact form
        would verify the OTHER LANE'S code and prove nothing about M4 - which the revision 1
        golden already ruled out in its own words. So this assertion proves we ESCALATED: a
        blocker naming this exact question is recorded in needs-human.md for the lead to rule on
        - either M4 is exempt from gws_inbox_check because it wires no mail path, or a mail path
        is in scope and the approved tree needs one, which is a structural decision and not an
        architect's to make.
      type: shell
      command: grep -q 'M4 gws_inbox_check has no subject' .agent/memory/project/needs-human.md

    - id: D33
      description: >-
        Every triad check in this contract carries a non-empty target. All the triad kinds read
        `target:` and ignore `command:`, so they fail the same silent way - the regression that
        made M1's A39 review nothing while reading as fully populated.
      type: shell
      command: python3 scripts/checks/verify-codex-target-present.py .agent/memory/project/specs/national-show-ia-alignment/contract-m4.yaml
