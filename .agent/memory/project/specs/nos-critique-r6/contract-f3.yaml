schema: athanor.contract/v1
slug: nos-critique-r6
goal: >-
  Close R82 on /national-show/vendors/apply: keep the intro line, drop every (required) suffix (required inputs keep required + aria-required) and label the one optional field exactly "Trading name (if different, optional)", labels at
  Karla 14px/500 full ink through ONE class .nos-form-label in nos-theme.css (reused by F18b), autocomplete tokens and stands
  inputmode in place, POST payload unchanged. Source: lead saoc-2b 2026-10-17 (R80/R63/R82/SEO lane), relaying Brad; backlog.md:1928.
  Exit criterion (Brad via the lead; design-cb's rulings are final): this feature loops build, critique, fix until impeccable scores >= 39/40 with
  P0/P1/P2 = 0 AND design-cb PASSes. The lead runs that loop and relays the PASS; the gate below stays mechanical.
created_at: '2026-10-17'
