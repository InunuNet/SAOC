      description: Load rule - Playwright runs one suite at a time with a single worker, and the next start server is stopped by PID in the check's finally block. Rendered at 390 and 1280 - no (required), no ") (", the exact tradingName label, required inputs with required + aria-required, every label/legend nos-form-label at Karla 14px/500 in full ink, autocomplete and stands inputmode, the POST body equals goldens/vendor-apply-payload.json for two cases, no overflow
      command: node .agent/memory/project/specs/nos-critique-r6/checks/check-rendered-f3.mjs
