      command: sh -c 'pnpm --dir .tmp/sandbox/critique-r6 type-check && pnpm --dir .tmp/sandbox/critique-r6 exec eslint --max-warnings 0 components/vendors/VendorApplyForm.tsx components/vendors/VendorFormField.tsx components/vendors/VendorCheckboxGroupField.tsx'
