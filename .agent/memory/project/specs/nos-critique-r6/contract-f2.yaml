      command: sh -c 'pnpm --dir .tmp/sandbox/critique-r6 type-check && pnpm --dir .tmp/sandbox/critique-r6 exec eslint --max-warnings 0 "app/(marketing)/national-show/not-found.tsx" "app/(marketing)/national-show/[...slug]/page.tsx"'
