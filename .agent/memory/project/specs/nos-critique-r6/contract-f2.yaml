      description: Load rule - Playwright runs one suite at a time with a single worker, and the next start server is stopped by PID in the check's finally block. Rendered at 390 and 1280 - unknown /national-show routes return HTTP 404 and noindex with footer#nf and .nos-theme, exactly one h1, three ordered recovery links (stacked full width at 48px with a 12px gap below 480), no overflow; a valid archive year stays 200 and an invalid one is the NOS 404; /zz-no-such-page stays the SAOC 404; /national-show/faq still 200
      command: node .agent/memory/project/specs/nos-critique-r6/checks/check-rendered-f2.mjs
