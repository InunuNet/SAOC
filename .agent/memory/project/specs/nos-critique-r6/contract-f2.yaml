    - id: A1
      description: QA check scripts and goldens (bloom marginals, payload, allowlist) are unmodified since @architect wrote them; BASE is 47cf7f1b
      command: shasum -a 256 -c .agent/memory/project/specs/nos-critique-r6/goldens/checks.sha256
    - id: A2
      description: Footprint guard through f2 - only the files this and the earlier stacked features are cleared to touch, never F18/F19 surfaces, tickets, globals.css, chrome, ShowContentState
      command: node .agent/memory/project/specs/nos-critique-r6/checks/check-footprint.mjs --through=2
