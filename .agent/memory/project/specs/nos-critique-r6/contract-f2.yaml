      description: Static - catch-all calls notFound(), not-found.tsx carries the SAOC root eyebrow, h1 and sentence one verbatim, no SAOC society links, three nav-config links in the order Tickets (primary), National Show, Plan your visit, one h1, no hex colours, root not-found unchanged, docs cite R63
      command: node .agent/memory/project/specs/nos-critique-r6/checks/check-static-f2.mjs
