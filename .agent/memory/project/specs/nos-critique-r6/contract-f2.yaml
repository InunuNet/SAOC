schema: athanor.contract/v1
slug: nos-critique-r6
goal: >-
  Close R63 in .tmp/sandbox/critique-r6 (base 47cf7f1b): an unknown /national-show/x route returns 404 inside the NOS chrome
  (catch-all page calling notFound() plus a national-show/not-found.tsx), with the SAOC root not-found copy reused verbatim and
  recovery links National Show, Tickets and Plan your visit using nav-config labels. Source: lead saoc-2b 2026-10-17 (R80/R63/R82/SEO lane), relaying Brad; backlog.md:1928.
  Exit criterion (Brad via the lead; design-cb's rulings are final): this feature loops build, critique, fix until impeccable scores >= 39/40 with
  P0/P1/P2 = 0 AND design-cb PASSes. The lead runs that loop and relays the PASS; the gate below stays mechanical.
created_at: '2026-10-17'
