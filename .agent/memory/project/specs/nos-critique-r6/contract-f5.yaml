schema: athanor.contract/v1
slug: nos-critique-r6
goal: >-
  Close R80 #1: below 768px the hub hero and the four photo inner heroes lead with the photograph (220-300px, aim 300, object-position
  measured from the image), then h1, lede and CTAs with Tickets ending at y<=828 at 390x844, then countdown and facts; 768 and
  up unchanged. Source: lead saoc-2b 2026-10-17 (R80/R63/R82/SEO lane), relaying Brad; backlog.md:1928.
  Exit criterion (Brad via the lead; design-cb's rulings are final): this feature loops build, critique, fix until impeccable scores >= 39/40 with
  P0/P1/P2 = 0 AND design-cb PASSes. The lead runs that loop and relays the PASS; the gate below stays mechanical.
created_at: '2026-10-17'
autonomy: high
exclusions:
  - item: 'F18/F19 surfaces: national-show/tickets, /tickets/*, checkout and return pages, the workshops and conferences catalogues, lib/data/show-facts.ts'
    reason: Owned by the lead's F18/F19; enforced by A2.
  - item: 'globals.css, Header, Footer, NosSkipLink, ShowContentState, SAOC non-NOS pages, app/api'
    reason: Off limits per the lead; enforced by A2.
features:
  - id: F5
    name: R80 #1 hub and inner photo heroes stack photograph-first below 768px
    status: pending
goldens:
  - .agent/memory/project/specs/nos-critique-r6/goldens/spec-f2-f5.md
  - .agent/memory/project/specs/nos-critique-r6/goldens/bloom-marginals.json
  - .agent/memory/project/specs/nos-critique-r6/goldens/measure-bloom.py
  - .agent/memory/project/specs/nos-critique-r6/goldens/checks.sha256
assertions:
  phase: 4
  checks:
    - id: A1
      description: QA check scripts and goldens (bloom marginals, payload, allowlist) are unmodified since @architect wrote them; BASE is 47cf7f1b
      command: shasum -a 256 -c .agent/memory/project/specs/nos-critique-r6/goldens/checks.sha256
    - id: A2
      description: Footprint guard through f5 - only the files this and the earlier stacked features are cleared to touch, never F18/F19 surfaces, tickets, globals.css, chrome, ShowContentState
      command: node .agent/memory/project/specs/nos-critique-r6/checks/check-footprint.mjs --through=5
    - id: A3
      description: Static - a max-width 767px block puts both hero media rules first with a fixed 220-300px height and aspect-ratio auto, the 1023px stacking rules survive, measured objectPosition for the four inner photos in hero-photos.ts, NosHero applies it, hub data and JSON-LD lines intact, docs cite R80
      command: node .agent/memory/project/specs/nos-critique-r6/checks/check-static-f5.mjs
    - id: A4
      description: TypeScript compiles and ESLint is clean with zero warnings on the files this feature edits
      command: sh -c 'pnpm --dir .tmp/sandbox/critique-r6 type-check && pnpm --dir .tmp/sandbox/critique-r6 exec eslint --max-warnings 0 components/nos/NosHero.tsx components/nos/hero-photos.ts "app/(marketing)/national-show/page.tsx"'
    - id: A5
      description: Production build passes (input for A6)
      command: pnpm --dir .tmp/sandbox/critique-r6 build
    - id: A6
      description: Load rule - Playwright runs one suite at a time with a single worker, and the next start server is stopped by PID in the check's finally block. Rendered at 390x844, 768 and 1280 - photograph above the h1 at 220-300px on the hub and four photo heroes, Tickets ends at y<=828 (16px clear of the fold), countdown then facts after it, bloom crop within 3 points of the best crop (goldens/bloom-marginals.json), 768 order 2 and 4/3 and the 1280 hub media absolute unchanged, the hero image is fetchpriority high, not lazy, preloaded and the LCP element at 390 and 1280, every hero lede 18px/1.5 with max-width 60ch below 768 and BASE values at 768 and 1280, the vendors/apply first field on screen one, shots of hub/about/vendors-apply saved, no overflow
      command: node .agent/memory/project/specs/nos-critique-r6/checks/check-rendered-f5.mjs
