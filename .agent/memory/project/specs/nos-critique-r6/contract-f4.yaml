schema: athanor.contract/v1
slug: nos-critique-r6
goal: >-
  Add FAQPage JSON-LD on /national-show/faq from the entries the page presents as confirmed answers, and one BreadcrumbList on
  every /national-show/* page through a single layout-mounted component. Event offers (ZAR, resolveEffectivePrice, availability,
  only while sales are open) already exist on the hub and are not touched; validFrom is not added (no source field). The R61 font-preload split and the hero LCP assertion are out of f4 (lead ruling 2026-10-17: fonts are a post-launch item because they change SAOC head output; LCP moves to f5). No f4b. Source: lead saoc-2b 2026-10-17 (R80/R63/R82/SEO lane), relaying Brad; backlog.md:1928.
  Exit criterion (Brad via the lead; design-cb's rulings are final): this feature loops build, critique, fix until impeccable scores >= 39/40 with
  P0/P1/P2 = 0 AND design-cb PASSes. The lead runs that loop and relays the PASS; the gate below stays mechanical.
