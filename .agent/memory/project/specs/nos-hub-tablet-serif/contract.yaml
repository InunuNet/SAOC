# PR after #76 (nos-pagehero): H-a hub tablet order and LT-1 light display serifs. Sources: NOS Design rulings H-a (P2) and LT-1 (P2), quoted in spec.md.
# Base: this PR branches from the merged #76 head. Run from the repo root of the implementation worktree, after #76 is on origin/main.
# A9 builds production; A10, A11 and A16 run `next start` on that build (ports NOS_HUB_SERIF_PORT, default 3081, +1, +2 and +3; A10 also +7 for public mode) and read the live Sanity data
# the build reads (NEXT_PUBLIC_SANITY_PROJECT_ID=26yfbug4, dataset production, the scripts/ci-e2e.sh env). SITE_PUBLIC_LAUNCH and BETA_PASSWORD_WALL_OFF are never set (A6).
# A21 needs the main baseline first (capture-main-baseline.sh builds a git archive of origin/main under .tmp/sandbox/hub-main-baseline on fixture replay, port +9, and captures the header strips).
# A1 pins the checks and goldens: @dev implements against them and may not edit them.
# HB-3 (hub photo sizes at 390) is the one tsx edit: components/nos/NosHero.tsx, built on #76's version of that file (A17, A16).
# LT-1 fold decision: ONE global css change in app/(nos)/national-show/nos-theme.css (plus one line in nos-structure.css), no tsx edit. See spec.md section 3.
# 768 CUT 2026-10-27 per NOS Design ruling (a), 'H-a 768 cut: (a), single-row header from 768' (root comms.md, block after the H-a cap ruling): at 768 the NOS header wrapped to two rows (a breakpoint off-by-one, max-width 779px), putting the hero top at y155 against y97 at 820 and the facts bottom at 1058/1063 against the 1008 limit. The cut applies the existing 820 header from 768 up and changes nothing else (no spacing or padding change; the 2/1 band, its crop and the <768 header untouched). Encoded as A20 (static, exactly two lines move 779px to 767px), A21 (one-row header at 768/779/780/1023 against the 820 values, unchanged band/crop/spacing, 767 and 390 header strips pixel-identical to a main baseline) and A22 (P1 countdown, the label never renders without its value), with A10 unchanged and now expected green at 768.
# FIXTURE REPLAY ONLY (lead's rule for this change): every build, server and baseline runs with SANITY_FIXTURE_MODE=replay, SANITY_FIXTURE_DIR a sandbox copy of the tracked nos-content-standard capture, K_SERVICE unset and the Sanity API blocked (block-sanity-net.cjs); servers are killed by the exact child PID in a pidfile, never pkill. KNOWN-PENDING fixture misses are labelled by the PR that closes each (values.json fixture.knownMisses) and are counted and reported, any other miss fails the gate. The date-keyed societyEvent `$todayStart` query is closed by fix/fixture-stable-clock (_clock.json pins today, lib/sast-date.ts defaults to fixtureNow()); the early-bird, weekend-pass-early-bird and other ticketType slugs by sanity-fixture-refresh PR #128 (merges after #127). REMOVABLE, NOT PERMANENT: after both merge to main, delete the knownMisses entries so the allowance is zero (HUB_SERIF_FIXTURE_STRICT=1 proves it first).
# DATE-KEYED SOCIETYEVENT MISS (closed by fix/fixture-stable-clock, head 22f51cc8 at the time of writing): its key changes every SAST day, so checks/gen-today-stub.mjs re-keys the captured date-keyed entries for today with the fixture layer's own key function into the sandbox copy only (wx, tracked dir never written, skipped under HUB_SERIF_FIXTURE_STRICT=1). Removable when that PR merges.
# A20 matches the breakpoint text itself (media="(max-width: 779px)" to 767px), not the <source> form, because #117 put the attribute on its own line; the rule stays exactly one line removed and one added per chrome file and no 779px left. The A21 and A24 baseline is main as the branch last merged it: the merge-base of HEAD and origin/main, derived by capture-main-baseline.sh at run time (it was pinned to e9edbe4a, which went stale after the merge of 48d74378).
# BUILD-TIME STUBS (closed by sanity-fixture-refresh PR #128, queued after #127; the lead's ruling): the tracked capture lacks the two generateStaticParams slug-list queries (keys 9f3a3d24 society and 58f9cc95 societyEvent) that fail the build, so both are fixture.knownMisses and the gate supplies tolerated empty-array stubs (goldens/fixture-stubs) overlaid onto the sandbox copy only, after the rsync, never into the tracked fixture dir. HUB_SERIF_FIXTURE_STRICT=1 skips them and fails on them. REMOVABLE with the other #128 entries: after #128 merges the dev merges origin/main and deletes goldens/fixture-stubs, the stubs entry and every knownMisses entry closed by #128.
# UNKNOWN-SLUG PROBES: the gates' not-found probe slugs (sweep-routes.json, /tickets/zz-not-a-ticket-slug) can never be in a recording, so checks/gen-today-stub.mjs writes a null result for them (keyed from every captured ticketType by-slug entry, sandbox copy only, wx). This is gate-owned and NOT removed by any refresh. The header strip (A21) ends at floor(header bottom), the last fractional row being part hero photo (HB-3 serves a different variant at 390). A14 runs through checks/run-e2e.sh on replay.
# A10 GUARDS THE FOLD with 3px spare at 768 (facts bottom 1005 against the 1008 limit after the 768 cut). Any future breach goes back to NOS Design and is never trimmed silently.
# COUNTDOWN STACKING BELOW 768 (NOS Design option A, B rejected): with the ch floors the block is 273.6 and 319.7 + 48 + 273.6 = 641.3 exceeds the 639px row at 767, so below 768 the countdown deterministically stacks under the CTA group (A24 asserts it at 700 and 767, both modes, worst-case and live strings, so it cannot silently flip). ACCEPTED DIFFERENCE (NOS Design, confirmed): below 768 the countdown ALWAYS stacks under the CTA group, with no narrower sliver and no CSS change; main is digit-dependent in 640-767 (measured on main 48d74378: with narrow digits it sits beside the CTAs from 640, with the ruled worst case 888 it stacks up to 671, with wide digits it stacks at every width, and with live strings it flips from tick to tick). Parity below 768 is taken at 390 and 640 only, and at 640 both builds are given the widest string (000/00/00/00) so main stacks deterministically; the 700 parity viewport is removed for good (main fits beside the CTAs there on narrow digits).  NOS Design's GO is conditional on the final-form re-run reproducing exactly: block 273.6 (297.6 from 1024), slack 14.8 at 768, facts 1005 against 1008 at 768, no wrap at 1024-1279, no overflow at 320-390 on / and /tickets; values.json countdownFit.final pins them (+-0.5 on widths and slack, facts not above 1005.5 and the 1008 limit) and any number that moves goes back to NOS Design.
# COUNTDOWN WRAP 2026-10-27 per NOS Design ruling (a)+(b), 'H-a countdown wrap' (root comms.md; (c), a separate line for the countdown, is rejected). Cause, measured by the dev: .nos-hero-row is 640 wide, the CTA group 319.7, the gap 48, the countdown 273.4-276.5, so 641.1 against 640 is a knife edge (the same on main e9edbe4a) and a ticking value can reflow the layout. (a) everywhere: tabular-nums on .nos-figure, and where the face has no tnum, a ch min-width per unit (3ch days, 2ch the others) so the width never changes between ticks. WHICH BRANCH IS MEASURED, NOT GUESSED: checks/measure-tnum.mjs compares the digit advances of app/fonts/fraunces/Fraunces-latin-normal.woff2 (the NOS face) with tnum off and on at the countdown's own settings; on this tree the spread is 8.86px both ways, so Fraunces has no tnum and the branch is ch-min-width (evidence/tnum-branch.json; 0 is the widest digit at 25.08px so n ch bounds n digits). nos-theme.css already declares tabular-nums on .nos-figure.font-serif; it stays. (b) at 768-1023 only: .nos-hero-row column-gap 32 (the gap shorthand is forbidden there, the row gap stays 48, which A21 keeps asserting); 48 from 1024, 48 at 767 and below. Files that own it, exactly: app/(nos)/national-show/nos-theme.css (the .nos-figure.font-serif rule near line 424 and the .nos-hero-row rule near line 612) and, only if a hook is genuinely needed, components/show/ShowCountdown.tsx; both were already inside A4. .nos-figure is used by one component, ShowCountdown, which renders on three pages: / (hub), /tickets and /tickets/<slug>; all three are in the A24 parity check. A23 is the static css verdict; A24 is the browser gate (NOS Design countdown gap, revised: component-level unit gap 16 below 1024 and 24 from 1024 on / and /tickets, label box growth accepted at 1024 and up, no wrap at 1024/1100/1279, no overflow at 320/360/390, ticks stable on both pages; /tickets/<slug> does not render the countdown so it has no parity leg and is checked to stay that way; NOS Design additions: figure text-align center with its centre on the label's centre over the ticks, and the countdown bottom equal to the CTA bottom within 1px; gaps, worst-case 888/88 and widest-digit injection at 768, 820 and 1023 in both modes with slack >= 8 and the first-screen rule, 60 ticks at 768, parity with main at 390/640/767 and 1024 up on all three pages). A10 additionally fails any measurement taken without a hydrated, shown countdown. Same row is read as beside the CTA group and vertically overlapping it, not top equal to top (align-items is flex-end so the tops differ whenever the heights do); both tops are printed. The dev sends the 768 and 820 worst-case shots (evidence/hub-countdown-worst-case-*) to NOS Design for the GO.
# A21 390@3 PIXEL DIFF, pinned to its cause (NOS Design GO conditional): the 2300 differing pixels were the last 3 device rows (y441-443, full width, max channel delta 6/255) of a strip cut at ceil(header bottom). The header's own bottom border is rows 438-440, so those rows are BELOW the header element, in the hero photo (HB-3 serves a different photo variant at 390). The strip is now cropped to floor(header bottom), the rows inside the header element, with no tolerance (0 differing pixels): 767@2 and 390@3 both 0. The gate records the header bottom and the strip height beside each strip, and if a difference is ever left inside the header it writes evidence/header-<viewport>-diff.png (changed pixels magenta) with the bounding box and fails, loosening nothing.
# UNKNOWN-SLUG STUB is TEST-ONLY and PERMANENT (not closedBy #128 or any PR) and skipped under HUB_SERIF_FIXTURE_STRICT=1. A14 runs through checks/run-e2e.sh in two invocations: the full CI e2e command on replay minus sanity-fetch-fixture-miss.spec.ts "with the fixture off", then that spec alone with SANITY_FIXTURE_MODE unset and the Sanity API blocked (no server, no request); the runner refuses to start if SANITY_FIXTURE_MODE is exported as anything but replay and proves afterwards that run 1 was on replay and neither run made a Sanity API request.
# A10 AMENDED 2026-10-27 per NOS Design ruling (c), 'H-a cap ruling' (root comms.md, last block, 2026-10-27): the fixed 1100px hero cap is retired and replaced by a first-screen gate (last hero facts row, and the primary CTA if below it, bottom <= viewport height - 16, header included) at 768x1024, 820x1180 and 1023x1366, all @2, in preview and public mode, with a labelled shot per viewport and mode. The hub facts row (dl.nos-hero-facts, Dates and Venue, app/(nos)/national-show/page.tsx:156) is REQUIRED in both modes and the CTA is never a stand-in, so an absent or short row fails the gate (the first A10 run passed hollow on a wrong selector). If 768 fails the gate also writes an element-by-element hero height breakdown (evidence/hub-breakdown-<mode>-768.json) for NOS Design to compare with the spec's 902; the dev cuts nothing. The 2/1 band, its crop and the other H-a geometry assertions are unchanged. A10 is no longer pending.
# GATE AMENDMENT 2026-10-27 (architect): A11/A12 witness size now read from main's computed .doc-h2 (content standard, #106: 39px at 1280), weight 300 kept; the sweep uses a fresh browser context per route so /vsp's redirect cannot abort the 404 routes' goto.
# KNOWN-PENDING, deliberately unchanged: A19 fails only for ticketType slugs weekend-pass-early-bird and early-bird, which have no replay fixtures (the sanity-fixture-refresh PR adds them).
# e2e coverage (A14): e2e/nav-property1-http-gate.spec.ts keeps the hard-404 negative test (TK-404) AND restores the soft-404 detector test against a stub http server started inside the spec (127.0.0.1, ephemeral port; answers 200 plain HTML for every path except /tickets/does-not-exist-fixture-only-soft404, which answers 200 with <meta name="robots" content="noindex"/>), running the checker with --base-url and --nos-base-url both on the stub and the existing tickets-soft-404 fixture nav; expects exit 1, the path and "soft-404" in the output. No product route returns the bare noindex signal after TK-404 (the remaining noindex pages emit "noindex, nofollow", which the detector's exact signal does not match), so the stub is the only product-code-free option.
