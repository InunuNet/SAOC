goal: At 768-1023 the NOS hub hero leads with its photograph as a 2/1 band and then the copy (about 1000px tall, served width at least box x DPR), and every NOS display-serif heading computed at 32px or more renders at weight 300 while serif headings under 32px stay at 400, proven by a sweep of every NOS route at 1280 and 390.
