# Sources: Codi's ruling on r57 owner question O4 (NOS design lead, final authority), verbatim in goldens/spec.md. Stacked on fix/nos-faq-r57 (PR #42, 6c170c4e).
# The rule is data-driven: a row is sourced when it is wired (r57) or its Sanity status is 'confirmed'. No new copy. Sanity is READ only.
# Rendered checks: one mode per call, ports 3010-3019 minus 3002, 3013, 3016.
schema: athanor.contract/v1
slug: nos-faq-public-r57b
goal: >-
  /national-show/faq in a public build shows only rows with a sourced answer (wired, or Sanity status confirmed), draws no section left empty, lists only those rows in the
  FAQPage JSON-LD, and says once, with the existing R11 line, that other answers are pending; a preview build is unchanged.
created_at: '2026-10-22'
autonomy: high
exclusions:
  - item: 'every file outside goldens/footprint.json, docs/nos-faq-public-r57b.md and this spec dir (enforced by A2)'
    reason: 'Codi ruled on the public FAQ only. what-to-expect, ShowFaqList, the CSS and Sanity prose are untouched; Sanity is never written.'
features:
  - id: F1
    name: Public FAQ - hide rows without a sourced answer and empty sections, one existing gap line (r57b)
    status: pending
goldens:
  - .agent/memory/project/specs/nos-faq-public-r57b/goldens/spec.md
  - .agent/memory/project/specs/nos-faq-public-r57b/goldens/edits.json
  - .agent/memory/project/specs/nos-faq-public-r57b/goldens/footprint.json
  - .agent/memory/project/specs/nos-faq-public-r57b/goldens/render-baseline.json
  - .agent/memory/project/specs/nos-faq-public-r57b/goldens/reference-trial.patch
  - .agent/memory/project/specs/nos-faq-public-r57b/goldens/checks.sha256
assertions:
  phase: 4
  checks:
    - id: A1
      description: Check scripts and goldens are unmodified since @architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/nos-faq-public-r57b/goldens/checks.sha256
    - id: A2
      description: Footprint - the branch differs from 6c170c4e only in faq/page.tsx, docs/nos-faq-public-r57b.md and the spec dir
      command: node .agent/memory/project/specs/nos-faq-public-r57b/checks/footprint.mjs
    - id: A3
      description: Static - data-driven sourced rule, one existing ShowStatusLine, JSON-LD from the shown rows, no invention, no Sanity write, docs
      command: node .agent/memory/project/specs/nos-faq-public-r57b/checks/static.mjs
    - id: A4
      description: Prettier - faq/page.tsx gets no dirtier than at 6c170c4e
      command: node .agent/memory/project/specs/nos-faq-public-r57b/checks/prettier.mjs
    - id: A5
      description: Lint clean on the touched file
      command: pnpm exec eslint "app/(marketing)/national-show/faq/page.tsx"
    - id: A6
      description: Type-check clean
      command: pnpm exec tsc --noEmit
    - id: A7
      description: Rendered public build (1280/390) - only sourced rows, no empty section, chips and JSON-LD match, one existing page-level line, axe no worse
      command: NOS_FAQ_MODES=public node .agent/memory/project/specs/nos-faq-public-r57b/checks/rendered.mjs
    - id: A8
      description: Rendered preview build (1280/390) - identical to 6c170c4e (every row, per-row markers, page-level line, JSON-LD)
      command: NOS_FAQ_MODES=preview node .agent/memory/project/specs/nos-faq-public-r57b/checks/rendered.mjs
