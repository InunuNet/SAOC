# Gate environment (read before running `contract.py gate`):
#   - NEXT_PUBLIC_APP_CHECK_RECAPTCHA_SITE_KEY and APP_CHECK_ENFORCE_CHECKOUT must be UNSET. A14
#     builds the flag-off bundle with `env -u`; A25 scans it. The Auth SDK's own recaptcha script
#     URL in the admin-login chunk is expected and is not an App Check marker.
#   - Run `pnpm install` first (A21 imports the real ITN handlers; the pdf/qr packages must exist).
#   - Triad (A28, A29) uses the real defaults from docs/verification-triad-gate.md:
#     BROWSER_CHECK_MAX_AGE_SECONDS=14400, GWS_CHECK_MAX_AGE_SECONDS=14400, GWS_CHECK_LIVE_RECHECK=1,
#     BROWSER_CHECK_DEPLOYED_ORIGIN=https://beta.saoc.co.za. Both are required:false and expected to
#     skip until a post-deploy manifest exists; no email path is added by F3 so there is no inbox to check.
schema: athanor.contract/v1
slug: sec-abuse-controls
goal: Checkout, the public forms and the payment webhooks are protected by a durable cross-instance limiter, bounded seat holds and a capped webhook body, without breaking any legitimate purchase or notification.
created_at: '2026-10-29'
autonomy: high

features:
  - id: F3
    name: abuse controls (SEC-02 checkout seat-hold abuse, SEC-15 durable limiter, SEC-17 webhook body cap)
    status: pending

goldens:
  - .agent/memory/project/specs/sec-abuse-controls/goldens/abuse-limiter.golden.ts
  - .agent/memory/project/specs/sec-abuse-controls/goldens/seat-holds.golden.ts
  - .agent/memory/project/specs/sec-abuse-controls/goldens/app-check.golden.ts
  - .agent/memory/project/specs/sec-abuse-controls/goldens/app-check-client.golden.ts
  - .agent/memory/project/specs/sec-abuse-controls/goldens/itn-no-appcheck.golden.ts
  - .agent/memory/project/specs/sec-abuse-controls/goldens/checkout-holds.golden.ts
  - .agent/memory/project/specs/sec-abuse-controls/goldens/webhook-body.golden.ts
  - .agent/memory/project/specs/sec-abuse-controls/goldens/reservation-actor.golden.ts
  - .agent/memory/project/specs/sec-abuse-controls/goldens/buyer-email.golden.ts
  - .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py
  - .agent/memory/project/specs/sec-abuse-controls/goldens/run_mutations.py

assertions:
  phase: 4
  checks:
    - id: A1
      description: limiter semantics - Nth allowed, N+1 denied without a write, exact Retry-After, sliding window, cross-instance shared count, weights, hashed key and TTL field, fail closed, IPv6 /64 actor key
      command: pnpm exec tsx .agent/memory/project/specs/sec-abuse-controls/goldens/abuse-limiter.golden.ts
    - id: A2
      description: checkout hold budget - frozen limit values, live-only seat counting, cap boundaries, legitimate carts never refused
      command: pnpm exec tsx .agent/memory/project/specs/sec-abuse-controls/goldens/checkout-holds.golden.ts
    - id: A3
      description: webhook body cap - declared length refused unread, chunked stream cut and cancelled at the cap, lying Content-Length, worst-case notification fits
      command: pnpm exec tsx .agent/memory/project/specs/sec-abuse-controls/goldens/webhook-body.golden.ts
    - id: A4
      description: reservation docs carry clientKey and buyerKey on the order and every position, null (never undefined) when absent
      command: pnpm exec tsx .agent/memory/project/specs/sec-abuse-controls/goldens/reservation-actor.golden.ts
    - id: A5
      description: checkout wiring - per-IP limit, then App Check, both before request.json, per-buyer limit before any Sanity or gateway work, hold budget inside the reservation transaction after the replay branch, actor stamp passed to the builder
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py checkout-order
    - id: A6
      description: contact, newsletter, ticket status, ticket pdf and checkout no longer use the per-instance limiter and call the durable one
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py no-memory-limiter
    - id: A7
      description: both notification handlers read the body through the capped reader before verification, return 413, and no longer call request.text
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py webhook-order
    - id: A8
      description: the limiter imports firebase-admin lazily
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py limiter-lazy
    - id: A9
      description: firestore.indexes.json declares the TTL policy on abuseLimits.expireAt
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py ttl-policy
    - id: A10
      description: the diff touches no SAOC-lane file (vendor, events, sponsors, admin, sanity are hand-offs)
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py lanes
    - id: A11
      description: reconcile route and library, orders, payment adapters, proxy, ticket constants (30 minute hold, 20 line items), pool and admission availability readers and apphosting.yaml are unchanged
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py unchanged
    - id: A12
      description: typecheck
      command: pnpm exec tsc --noEmit
    - id: A13
      description: eslint on the touched trees
      command: pnpm exec eslint lib components/tickets app/api/tickets app/api/contact app/api/newsletter
    - id: A14
      description: production build
      command: env -u NEXT_PUBLIC_APP_CHECK_RECAPTCHA_SITE_KEY pnpm build
      timeout_seconds: 900
    - id: A15
      description: mutation proof - 42 mutations across limiter, budget, webhook cap, actor stamp, App Check, client gate, forwarded-header trust and wiring are each killed by a check above, files restored byte for byte
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/run_mutations.py
      timeout_seconds: 900
    - id: A16
      description: seat-hold expiry is self-enforcing at read time - 31 stranded expired reservations hold nothing, paid and gateway-Pending seats still hold, no scheduler involved
      command: pnpm exec tsx .agent/memory/project/specs/sec-abuse-controls/goldens/seat-holds.golden.ts
    - id: A17
      description: the capacity ledger and the hold budget share one expiry rule (lib/seat-holds.ts), pure and independent of the reconcile job
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py seat-ledger
    - id: A18
      description: F3 neither reads nor alters Ozow sandbox test mode
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py sandbox-independent
    - id: A19
      description: App Check server logic - flag off is a no-op that never calls the verifier, flag on refuses missing, invalid, expired, replayed and backend-error cases, any set non-off value enforces
      command: pnpm exec tsx .agent/memory/project/specs/sec-abuse-controls/goldens/app-check.golden.ts
    - id: A20
      description: App Check client - with no site key nothing is loaded and no network call is made, with a key a fresh limited-use token is fetched per call and every failure yields null
      command: pnpm exec tsx .agent/memory/project/specs/sec-abuse-controls/goldens/app-check-client.golden.ts
    - id: A21
      description: with App Check enforced, a tokenless ticket and vendor-stand payment notification still reaches verification and is acknowledged
      command: pnpm exec tsx .agent/memory/project/specs/sec-abuse-controls/goldens/itn-no-appcheck.golden.ts
    - id: A22
      description: App Check is referenced only by the checkout route, its two libs and the cart hook - never by the ITN handlers, reconcile, revalidate or proxy; the server verifier uses consume true and a lazy import
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py appcheck-scope
    - id: A23
      description: client gate - firebase/app-check is only ever a dynamic import behind the site-key gate, the token is fetched fresh before each checkout fetch
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py client-gated
    - id: A24
      description: client address comes only from the trusted forwarded hop through clientActorKey, never the leftmost entry
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py xff-trusted-hop
    - id: A25
      description: the flag-off production build ships no reCAPTCHA or App Check client code
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py bundle-flag-off
    - id: A26
      description: no active ticket type, capacity pool or fixture reuses a retired slug that still has live phantom holds (adult, exhibitor)
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py retired-slugs
    - id: A33
      description: buyer identity is one canonical form - plus tags stripped, gmail dots and googlemail folded, other mailboxes distinct, idempotent, never throws
      command: pnpm exec tsx .agent/memory/project/specs/sec-abuse-controls/goldens/buyer-email.golden.ts
    - id: A34
      description: the checkout request limit and the held-seat buyerKey stamp both use normalizeBuyerEmail, one variable, no bare trim/lowercase
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py buyer-normalised
    - id: A35
      description: clientActorKey uses the new two-hop-minimum helper while the shared clientIpFromForwardedFor is left unchanged for its other callers
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py client-ip-helper
    - id: A27
      description: cross-model adversarial review of the diff
      type: codex_qa
      target: .agent/memory/project/specs/sec-abuse-controls/codex-qa-prompt.md
      timeout_seconds: 1500
    - id: A28
      description: Triad browser check is post-deploy only (sandbox purchase with the App Check flag on, tokenless POST refused); declared non-required, expected to skip until a manifest exists
      type: browser_deployed_check
      target: .agent/memory/scratch/sec-abuse-controls-browser-manifest.json
      required: false
    - id: A29
      description: Triad gws inbox check is not applicable (F3 adds no email path); declared non-required for the coverage linter, expected to skip
      type: gws_inbox_check
      target: .agent/memory/scratch/sec-abuse-controls-gws-manifest.json
      required: false
    - id: A30
      description: flag-off inlining - next.config.ts inlines the site key as ?? '' with no other change, useTicketCart gates its dynamic import of lib/app-check-client behind the same build-time key, no static import of it anywhere
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py flag-off-inlining
    - id: A31
      description: newsletter subscribe and unsubscribe are still rate limited, now by the durable limiter before any body read or store access, with the existing constants and 429 copy (replaces the proof removed from the handler checks)
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py newsletter-limited
    - id: A32
      description: the two footer-newsletter handler checks the dev edited are frozen at the architect-reviewed hashes
      command: python3 .agent/memory/project/specs/sec-abuse-controls/goldens/check_wiring.py newsletter-checks-reviewed
