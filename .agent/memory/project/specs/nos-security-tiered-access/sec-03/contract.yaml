schema: athanor.contract/v1
slug: sec-03-signup-gate
goal: A Firebase user who signs in with Google (or self-registers) can no longer reach the events/submit write path, and client-SDK signup on saoc-webapp is disabled by an idempotent, read-back-verified script.
created_at: '2026-10-29'
autonomy: medium
features:
  - id: F1
    name: events/submit route and page use the shared admin gate (lib/admin-auth.ts), refusal copy reuses existing strings
    status: pending
  - id: F2
    name: scripts/auth-disable-signup.ts sets client.permissions.disabledUserSignup, dry-run by default, read-back verified, never prints the config body
    status: pending
  - id: F3
    name: docs/admin-access.md records the new control and the corrected GCIP note; operator applies the script (production config change, not run by @dev)
    status: pending
goldens:
  - .agent/memory/project/specs/nos-security-tiered-access/sec-03/goldens/sec-03-decisions.golden.md
  - .agent/memory/project/specs/nos-security-tiered-access/sec-03/goldens/route-auth-matrix.golden.json
  - .agent/memory/project/specs/nos-security-tiered-access/sec-03/goldens/config-open.json
  - .agent/memory/project/specs/nos-security-tiered-access/sec-03/goldens/config-closed.json
assertions:
  phase: 4
  checks:
    - id: A1
      description: route authorises through the shared admin gate
      command: grep -q "isAdminToken(" app/api/events/submit/route.ts
    - id: A2
      description: route still verifies the ID token with checkRevoked=true (this is what rejects deleted, disabled and revoked users)
      command: grep -q "verifyIdToken(token, true)" app/api/events/submit/route.ts
    - id: A3
      description: reason-revealing refusal body removed from the route
      command: sh -c '! grep -q "Email not verified" app/api/events/submit/route.ts'
    - id: A4
      description: submit page uses getAdminSession and no longer calls verifySessionCookie itself
      command: sh -c 'grep -q "getAdminSession" "app/(marketing)/events/submit/page.tsx" && ! grep -q "verifySessionCookie" "app/(marketing)/events/submit/page.tsx"'
    - id: A5
      description: emulator-backed route matrix (no-token, garbage, unverified, verified-non-admin, claim-unverified, not-allowlisted, deleted, disabled, revoked, admin) matches the golden
      command: bash contracts/checks/sec-03-signup-gate/check-route-matrix.sh
    - id: A6
      description: security-hardening check follows the route onto the shared gate
      command: grep -q "isAdminToken" contracts/checks/security-hardening/check.mts
    - id: A7
      description: offline dry-run against the open-signup fixture reports it would set the flag
      command: sh -c 'pnpm exec tsx scripts/auth-disable-signup.ts --config-fixture .agent/memory/project/specs/nos-security-tiered-access/sec-03/goldens/config-open.json | grep -q "WOULD SET"'
    - id: A8
      description: offline dry-run against the closed fixture is a no-op (idempotent)
      command: sh -c 'pnpm exec tsx scripts/auth-disable-signup.ts --config-fixture .agent/memory/project/specs/nos-security-tiered-access/sec-03/goldens/config-closed.json | grep -q "ALREADY"'
    - id: A9
      description: the script never echoes the config body (sentinel signerKey in the fixture must not appear in stdout or stderr)
      command: sh -c 'pnpm exec tsx scripts/auth-disable-signup.ts --config-fixture .agent/memory/project/specs/nos-security-tiered-access/sec-03/goldens/config-open.json 2>&1 | grep -q -E "SENTINEL" && exit 1; exit 0'
    - id: A10
      description: --apply combined with --config-fixture is refused (a fixture can never reach a PATCH)
      command: sh -c '! pnpm exec tsx scripts/auth-disable-signup.ts --apply --config-fixture .agent/memory/project/specs/nos-security-tiered-access/sec-03/goldens/config-open.json >/dev/null 2>&1'
    - id: A11
      description: PATCH is masked to the single leaf so disabledUserDeletion and signIn.hashConfig are never written
      command: grep -q "updateMask=client.permissions.disabledUserSignup" scripts/auth-disable-signup.ts
    - id: A12
      description: admin-grant.ts still provisions through the Admin SDK (the path disabledUserSignup does not block)
      command: grep -q "createUser" scripts/admin-grant.ts
    - id: A13
      description: docs record the control
      command: grep -q "disabledUserSignup" docs/admin-access.md
    - id: A14
      description: LIVE, READ-ONLY (GET only, no write). Reads back saoc-webapp signup-disabled state and exits 0 only if true. Stays RED until the operator runs --apply.
      command: pnpm exec tsx scripts/auth-disable-signup.ts --verify
