schema: athanor.contract/v1
slug: launch-weekend
goal: The SAOC main header no longer shows the standalone dark "Tickets" CTA button (it has no context on SAOC pages); Tickets stays reachable through the National Show menu and the NOS header is unchanged.
created_at: '2026-10-16'
autonomy: high
features:
  - id: F13
    name: Remove the Tickets CTA button from the SAOC header
    status: pending
# GATE: cwd = the implementation worktree (based on origin/main). BASE_URL = a production build of that worktree started on its own port (default 3613)
# with SITE_PUBLIC_LAUNCH=true and BETA_BASIC_AUTH_USER/PASSWORD empty: `pnpm build` then `pnpm exec next start -p 3613`. Do not run `pnpm build` while that server runs.
# Scope: components/chrome/Header.tsx and the now-unused TICKETS_CTA export in components/chrome/nav-config.ts. components/nos-chrome/, the mega-menu Tickets panel and THE SHOW column are untouched.
assertions:
  phase: 4
  checks:
    - id: F13-A1
      description: Runtime on /, /about and /societies at 390, 1024, 1280 and 1920 - no visible "Tickets" link in the SAOC header bar, no horizontal overflow (also with the menu open), the National Show menu (desktop) or mobile menu still exposes a Tickets link to /national-show/tickets; the NOS header on /national-show keeps its Tickets CTA, and has no overflow
      command: node contracts/checks/launch-weekend/f13/check-f13.mjs
    - id: F13-A2
      description: Type check passes
      command: pnpm type-check
    - id: F13-A3
      description: Lint passes on the changed files
      command: pnpm exec eslint components/chrome/Header.tsx components/chrome/nav-config.ts
