schema: athanor.contract/v1
slug: launch-weekend
goal: The home page NavCards and ShowBand are redesigned within the approved handoff grammar - cards lift, brass-border and underline on hover and keyboard focus at 150ms, the ShowBand photo bleeds flush left with a filled full-width segmented countdown and a ruled primary/secondary/tertiary CTA hierarchy (Book tickets leads) - with no copy change beyond Book tickets casing and every other home section byte-identical.
created_at: '2026-10-16'
autonomy: high
features:
  - id: F14
    name: Home NavCards hover/focus craft and ShowBand layout and CTA hierarchy (design pass)
    status: pending
# GATE: cwd = the implementation worktree (branch from origin/main with the spec branch spec/lw-f14 merged in, so goldens/f14 and contracts/checks/launch-weekend/f14 exist).
# BASE_URL = a production build of that worktree on port 3614 (`pnpm build && pnpm exec next start -p 3614`), env from .env.local (the beta basic-auth wall fails closed without creds; _lib.mjs sends them). Stop by exact PID (lsof -ti tcp:3614 -sTCP:LISTEN). Do not rebuild while it runs.
# BASE_REF defaults to origin/main for the scope check. other-sections.json / copy.json were captured from e9f7d4f9; re-capture with capture-golden.mjs (against a clean origin/main build) only if origin/main legitimately changes another home section.
# Rulings R1-R11 in f14-spec.md are architect decisions for the lead to confirm: R1 hover shadow, R2 Book tickets as the primary, R4 one-column cards below 560px, R7 secondary border alpha .45. A reversal is a tokens.json plus spec edit, not a contract rewrite.
# All checks were run red against untouched origin/main (hooks absent; g-others green) and green against a throwaway reference build.
goldens:
  - .agent/memory/project/specs/launch-weekend/goldens/f14/f14-spec.md
  - .agent/memory/project/specs/launch-weekend/goldens/f14/tokens.json
  - .agent/memory/project/specs/launch-weekend/goldens/f14/copy.json
  - .agent/memory/project/specs/launch-weekend/goldens/f14/other-sections.json
assertions:
  phase: 4
  checks:
    - id: F14-A1
      description: Computed rest, hover, focus-visible (real keyboard Tab) and active styles of the four cards and three CTAs at 1280 - effective translateY -4 (card), image scale 1.03, arrow +4px, brass border, ruled shadow, brass title underline, 2px focus outline, CTA lift 1px and colour steps, every transition-duration exactly 150ms
      command: node contracts/checks/launch-weekend/f14/check-b-states.mjs
    - id: F14-A2
      description: prefers-reduced-motion reduce - no transform on hover or focus for card, image, arrow or any CTA, while border, underline, background and outline state changes survive
      command: node contracts/checks/launch-weekend/f14/check-c-reduced-motion.mjs
    - id: F14-A3
      description: One link per card (the card is the anchor, no nested interactives, no overriding aria-label), exactly 4 anchors in the section, ruled CTA order/hrefs/names, every card and CTA target at least 44x44 at 390, 1280 and 1920
      command: node contracts/checks/launch-weekend/f14/check-d-structure.mjs
    - id: F14-A4
      description: No horizontal overflow at 390, 1280, 1920; card grid (1 col at 390, 4 equal at 1280/1920); type scale (title 24/600, prose 16/24.8, meta >=11, badge 10.5, facts 11/16, countdown 42/34 and 11, tabular figures); ShowBand geometry (photo flush left at x=0, 1fr/1.1fr split, band 620-760 tall, 64-240 right gutter, content vertically centred, facts and countdown span the content block, four equal cells filling the box, stacked 3:2 photo, full-width primary below 560)
      command: node contracts/checks/launch-weekend/f14/check-e-geometry.mjs
    - id: F14-A5
      description: Contrast - all text in both sections at least 4.5:1 (3:1 large), CTA hover text at least 4.5:1, focus outlines, primary fill, secondary border and tertiary underline at least 3:1
      command: node contracts/checks/launch-weekend/f14/check-f-contrast.mjs
    - id: F14-A6
      description: Every other home section (hero, mission, events, yearbook, partners, non-section nodes) is byte-identical to the origin/main golden
      command: node contracts/checks/launch-weekend/f14/check-g-others.mjs
    - id: F14-A7
      description: Scope and no-invention - only NavCards.tsx, ShowBand.tsx and an additive F14 globals.css block change; added lines hold no hex colour, unruled rgba, font family, animation, duration other than 150, scale above 1.03 or stock shadow
      command: node contracts/checks/launch-weekend/f14/check-h-scope.mjs
    - id: F14-A8
      description: No copy change - NavCards text identical, ShowBand text identical as a multiset except Book Tickets to Book tickets, placeholder figures still present
      command: node contracts/checks/launch-weekend/f14/check-i-copy.mjs
    - id: F14-A9
      description: Lint passes
      command: pnpm lint
    - id: F14-A10
      description: Type check passes
      command: pnpm type-check
    - id: F14-A11
      description: Production build passes
      command: pnpm build
