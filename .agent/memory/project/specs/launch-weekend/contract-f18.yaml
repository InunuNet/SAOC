schema: athanor.contract/v1
slug: launch-weekend
goal: One shared long-form template on /about, /what-to-expect, /vendors and /sa-exhibitors, a public holding state (no TBC gap blocks, no builder-brief ledes, TBC notes beta-only) on the empty show pages, a tidied FAQ, exhibitors key dates and archive card (F18a), and the Brad-approved v13 keepsake ticket system on the ticket hub, programme and workshop sessions with the checkout screen, NOS chrome and the retired /tickets redirect (F18b), with checkout, reservation and the ITN behaviourally unchanged.
created_at: '2026-10-16'
autonomy: high
features:
- id: F18a
  name: 'Long-form template (R75), holding state (R76), ledes (R76b), FAQ, exhibitors duplicates, sponsors guard, archive card (R77 #2, #3, #6, R78), Explore index off the hub (R74 #2), check hygiene'
  status: pending
- id: F18b
  name: 'Approved v13 keepsake ticket system, goes to beta first - view-model data layer, TicketCard / PoolBanner / TicketFan, hub sections with #programme as the 3 v13 ticket cards, section sub-ledes, R30 Day Pass line and ticket close band, compact #exhibit / #trade row, conferences keepsake cards with R54 links, R59 WOSA Buy link, vote-2 checkout screen, NOS chrome on /tickets/*, bare /tickets redirect, R84 motion (A21-A24, A27-A32); starts after A1-A7 are green'
  status: pending
- id: F18c
  name: 'Workshop sessions after the F18b audit passes - brochure tiles, presenters, #sessions and session cards, /national-show/workshops on them (A33, A34)'
  status: pending
# SPEC: goldens/f18/f18-spec.md (read it first; sections 3 and 4 are the contract of hooks and props the checks drive).
# GATE: cwd = the implementation worktree (branch from main 63f3e74d with spec/lw-f18 merged in, so goldens/f18 and contracts/checks/launch-weekend/f18 exist). Export F18_BASE_REF=63f3e74d (A10 and A11 refuse to run without it).
# BASE_URL = a PUBLIC production build of that worktree on port 3672: `SITE_PUBLIC_LAUNCH=true pnpm run build && SITE_PUBLIC_LAUNCH=true pnpm exec next start -p 3672` (never raw next build: the image variants must exist; a fresh worktree can fail once on a Google Fonts flake, re-run). Stop by exact PID (lsof -ti tcp:3672 -sTCP:LISTEN). Do not rebuild while it runs. Ports 3670-3679 only.
# Runtime checks read the CMS READ-ONLY. Live content decides which routes hold, so A4, A5, A24, A27 and A28 (render level) are the deterministic proof; A1-A3, A6, A7, A29 prove the build.
# The spec branch already amends check-f3-imagery, F17 check-h and F17 check-f-sponsors and rebases check-labels-static (goldens/f18/supersession.json). The dev must not edit any check or golden.
# Run the F12/F17/F3 regression chain (A12) against the F18 build. A red there caused by an intended F18 change goes to the lead as an amendment candidate, never edited by the dev.
# R74 #2 (lead addition): the hub drops NosShowIndex. F17 check-d-hub, F17 check-m-index and F12 check-a-static are amended and F12 check-c-hub-index is retired in this spec branch (supersession.json).
# PIVOT 2026-10-17 (lead): F18b is the approved v13 keepsake ticket system (goldens/f18b). It REPLACES the F16 dual-price rows, the F17 captions and the catalogue rows; the F16 hub checks (a-copy, b-index, c-rows, d-render, f-cards) are retired; the hub mobile hero (R80) and NOS not-found (R63) are dropped. A21-A24 stay (chrome, checkout screen), A27-A30 are new. F7 check-d-ticket-form and check-f3-imagery are amended in supersession.json; check-f3-tickets pins the old fan and is NOT edited (spec section 9).
# A11 is red until the dev runs the impeccable critique loop and writes f18-critique-log.md (each pass against v13-tickets.html); AFTER_DIR defaults to .tmp/sandbox/lw-f18/after (capture-shots.mjs fills it for the page routes at 390/1280 and the ticket routes at 390/701/960/1280/1920).
# 2026-10-17 additions (lead): R30 hub 'Day Pass from' line and ticket close band, R54, R59 (A31); R84 motion exception (A32); design-cb audit checklist goldens/f18b/F18B-AUDIT-CHECKLIST.md is an input for @qa and Codex; critique bar impeccable >= 39/40 plus design-cb audit PASS; UtilityBar and NosHeader are site-77's (A10 forbids).
# 2026-10-17 design-cb SIGN-OFF rulings folded in: #exhibit/#trade compact row kept; hint exactly 'Choose at least one ticket'; stub photo reuse as a distinct role; CMS names win; no waitlist; F18b to beta first with #programme as 3 v13 ticket cards and F18c (A33, A34) later; check-f3-tickets rebased onto v13; A11 gate floor 36/40 (aim 39). A21 exempts app/api/; section sub-ledes are part of v13; A10 exempts the keepsake paths for R84 motion with probes.
