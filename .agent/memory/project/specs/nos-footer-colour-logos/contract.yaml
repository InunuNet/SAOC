schema: athanor.contract/v1
slug: nos-footer-colour-logos
goal: The NOS footer shows the supplied full-colour reversed NOS lockup and the supplied colour-on-dark SAOC lockup as ladder-served images (COUNCIL-1 C2), and every rendered NOS text node is Fraunces or Karla (C4 and TYPE-11).
created_at: '2026-10-28'
autonomy: high

# SEQUENCING (binding): implement ONLY after feat/nos-type-tokens has merged to main. A5 fails on purpose if it has not (TYPE-11 is its
# .nf --font-sans declaration; this feature adds no code for it). BROWSER GATES: A9 and A10 need `bash checks/build.sh` first and run
# `next start` in Sanity replay; they were not runnable in the architect worktree (no dependencies), so @dev shows them red on a
# pre-change build first.
features:
  - id: F1
    name: "NOS footer: full-colour reversed lockup + colour-on-dark SAOC credit on the LG-1 ladder; family census"
    status: pending

goldens:
  - .agent/memory/project/specs/nos-footer-colour-logos/goldens/values.json
  - .agent/memory/project/specs/nos-footer-colour-logos/goldens/prototype-footer.diff
  - .agent/memory/project/specs/nos-footer-colour-logos/goldens/codex-qa-prompt.md
  - .agent/memory/project/specs/nos-footer-colour-logos/goldens/checks.sha256

assertions:
  phase: 4
  checks:
    - id: A1
      description: "LOCKUP_SRC pin, credit source pin, alt, test id, two getImageProps with sizes, 3272x2876 constants"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/check-static.mjs pins
    - id: A2
      description: "both public/images sources are byte-identical to their media-kit masters"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/check-static.mjs copies
    - id: A3
      description: "both sources are the pinned size, 8-bit RGBA PNG"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/check-static.mjs dims
    - id: A4
      description: "zero OfficialMonoLockup, official-mono, SaocLockup, Lora, JetBrains or Manrope in the NOS footer source and chrome css"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/check-static.mjs banned
    - id: A5
      description: "prerequisite: nos-type-tokens landed, .nf sets --font-sans to the Karla token (TYPE-11 CSS route)"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/check-static.mjs prereq
    - id: A6
      description: "the reversed-gold copy is removed and unreferenced"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/check-static.mjs retired
    - id: A7
      description: "no SAOC-lane file in the diff (components/newsletter, app/layout.tsx, components/sponsors, sponsors page, components/chrome) and nothing outside the allowed list"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/check-diff-scope.mjs
    - id: A8
      description: "bite proof without a build: census walk flags Manrope and live Lora/JetBrains text, served-px rule flags a 640 candidate at 248 x 3x"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/selftest.mjs
    - id: A9
      description: "served px >= box x DPR for both marks at 1440 and 390 at 1x/2x/3x, ladder variant of the pinned file, boxes 248 and 206 +/-4, credit alt and link name (needs build.sh, Sanity replay)"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/gate-logos.mjs
    - id: A10
      description: "family census: first family of every rendered text node on /, /faq and /tickets (NOS host, 390 and 1440) is Fraunces or Karla (needs build.sh, Sanity replay)"
      command: node .agent/memory/project/specs/nos-footer-colour-logos/checks/census-fonts.mjs
    - id: A11
      description: "gate screenshots exist at both viewports for the by-eye check"
      command: test -s .tmp/sandbox/nos-footer-colour-logos-gate/nos-footer-1440x1.png && test -s .tmp/sandbox/nos-footer-colour-logos-gate/nos-footer-1440x3.png && test -s .tmp/sandbox/nos-footer-colour-logos-gate/nos-footer-390x1.png && test -s .tmp/sandbox/nos-footer-colour-logos-gate/nos-footer-390x3.png
    - id: A12
      description: "SAOC-lane component files are unchanged against the branch point"
      command: git diff --quiet origin/main -- components/newsletter components/chrome components/sponsors app/layout.tsx
    - id: A13
      description: "existing footer render gate (column gaps, heading lines, row pitch, WOSA once, brand ink) still passes on both sites"
      command: SANITY_FIXTURE_MODE=replay SANITY_FIXTURE_DIR=$PWD/.agent/memory/project/specs/nos-content-standard/fixtures/sanity node scripts/checks/footer-render-check.mjs
    - id: A14
      description: "type check passes"
      command: pnpm type-check
    - id: A15
      description: "lint passes"
      command: pnpm lint
    - id: A16
      description: "production build passes (Sanity replay, no live traffic)"
      command: bash .agent/memory/project/specs/nos-footer-colour-logos/checks/build.sh
    - id: A17
      description: "feature doc written"
      command: grep -q "NOS-2027-logo-full-colour-reversed-vertical" docs/nos-footer-colour-logos.md
    - id: A18
      description: "feature doc records the TYPE-11 cause and the type-tokens sequencing"
      command: grep -q "font-sans" docs/nos-footer-colour-logos.md
    - id: A22
      description: "the architect's checks and golden values are unchanged (sha256 pin; @dev never edits the gates it is judged by)"
      command: shasum -a 256 -c .agent/memory/project/specs/nos-footer-colour-logos/goldens/checks.sha256
    - id: A19
      description: "Codex adversarial review of the whole diff"
      type: codex_qa
      target: .agent/memory/project/specs/nos-footer-colour-logos/goldens/codex-qa-prompt.md
      timeout_seconds: 1300
      required: true
    - id: A20
      description: "BrowserAgent on beta shows both footer marks and Karla footer text at 1440 and 390 after merge (NOS Design also checks by eye)"
      type: browser_deployed_check
      target: .agent/memory/scratch/nos-footer-colour-logos-browser-manifest.json
      required: false
    - id: A21
      description: "gws inbox check is not applicable (no email is sent); declared non-required for the triad coverage linter, expected to skip"
      type: gws_inbox_check
      target: .agent/memory/scratch/nos-footer-colour-logos-gws-manifest.json
      required: false
