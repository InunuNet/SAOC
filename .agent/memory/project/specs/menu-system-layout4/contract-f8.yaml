    - id: A20
      description: >
        PROPERTY (F8a, closes f8-lead-logo.json's `domLoadVerificationRequirement`
        -- binding on A1-A3 since 2026-09-19, recorded as outstanding until now):
        the rendered logo <img> actually loaded and decoded a real image, not
        merely that a syntactically correct element with the right src exists
        in markup. Asserts, on the live element after load, BOTH
        `complete === true` AND `naturalWidth > 0` -- `complete` alone can be
        true on a failed/errored load in some browsers, and `naturalWidth`
        alone can transiently read 0 while a real image is still in flight, so
        neither is sufficient alone; both together is the standard "did this
        image genuinely decode" check and avoids a race that would make a
        single-property version flaky (a flaky assertion gets disabled, which
        is worse than no assertion). Also asserts a floor of
        `naturalWidth >= 200` -- NOT the source master's 3272px, and NOT any
        specific next/image srcset-derivative width. Per
        .agent/memory/scratch/research-menu-system-layout4-f8-asset-provenance.md
        finding 5, next/image with a fixed width={200} height={176} and no
        `sizes` prop serves an optimizer-resized derivative through
        /_next/image, generating only 1x/2x srcset candidates -- but the exact
        pixel width Next.js snaps those candidates to (which imageSizes/
        deviceSizes breakpoint) was explicitly NOT independently confirmed in
        that research pass and must not be asserted as fact. What IS certain
        without relying on that uncited detail: a "fixed-size image" 1x/2x
        srcset by definition targets widths at or above the requested CSS
        width, so naturalWidth >= 200 (this golden's own render.widthPx) is a
        floor grounded in the render spec itself, not in an assumed breakpoint
        table -- do not raise this to 400 (2x) or 3272 (master) without first
        independently confirming, against a live Playwright run's actual
        measured naturalWidth, which srcset candidate the test browser
        actually loads (device pixel ratio dependent).
        WHAT THE FLOOR ITSELF CATCHES (added 2026-09-21 -- see the declined
        Codex finding below for why this was missing before and why that
        omission is very likely what made the floor read as redundant): the
        `>= 200` check is NOT redundant with `naturalWidth > 0` -- it exists
        for the "decoded, but the wrong image" class, distinct from "failed
        to decode". @qa's adversarial pass (scratch spec
        .tmp/sandbox/f8-a20-qa/a20-break-test.spec.ts, this session) proved
        this is not hypothetical: a genuinely valid, fully decodable 10x10
        PNG swapped in at the expected src measures `complete: true,
        naturalWidth: 10` -- it clears `naturalWidth > 0` cleanly and is
        caught ONLY by the `>= 200` floor. A placeholder/favicon-swap class
        of defect (small, valid, correctly-decoding image at the right path)
        would pass every other assertion in this file and this test's own
        `complete && naturalWidth > 0` check; only the floor catches it.
        DECLINED CODEX FINDING (2026-09-21, third Codex pass on this spec
        file): Codex flagged this floor as "not a valid proof of a
        correctly decoded, rendered 200px-wide image... CSS can upscale a
        smaller legitimate source... this extra floor can cause false
        regressions," reading it as redundant with the preceding
        `complete && naturalWidth > 0` check. Declined by the team lead, on
        the record, for three reasons: (1) it refutes a stronger claim than
        A20 makes -- A20 never claims to prove a "correctly rendered 200px
        source," only that a real image decoded, above a floor; (2) the
        redundancy claim is empirically false per @qa's 10x10 PNG
        measurement above -- the floor catches a real case `> 0` alone does
        not; (3) Codex's own justification argues the other way -- "CSS can
        upscale a smaller legitimate source" describes exactly the
        visibly-degraded-source defect the floor exists to catch, not a
        reason to remove it. On Codex's "false regressions" concern:
        naturalWidth can only read below 200 if the rendered width actually
        drops below 200, which contradicts this golden's own render.widthPx
        -- that would be a deliberate contract change, and this assertion
        SHOULD fail until the contract and A20's floor are updated together;
        failing on a silent spec change is the assertion working, not a
        false regression. This declination is recorded here, not silently
        dropped, so a future reader does not re-litigate it or quietly
        delete the floor without seeing why it survived review.
        CONVERGENCE NOTE: across three Codex passes on this spec file the
        findings went 3 real -> 1 real -> 1 declined -- read as convergence,
        not as license to keep running passes until one comes back clean. No
        fourth pass was run to chase an unqualified PASS verdict; this
        file's Codex verdict stands as FAIL with this one finding declined
        on record, the same treatment given to the declined
        check-logo-source-resolution.mjs findings earlier this session (see
        f8-lead-logo.json `acceptedLimitations`). An honest FAIL-with-
        declination is the accurate state to record.
        WHAT THIS CLOSES THAT A12 CANNOT (A12 is a gate-time, pre-DOM IHDR
        header read on the file at rest; this is a post-render, real-browser
        decode of the live element -- neither substitutes for the other, see
        f8-lead-logo.json `domLoadVerificationRequirement
        .relationshipToA12_notASubstitute`): (1) wrong-directory placement --
        a file present but at any path other than
        public/images/nos-2027-logo-full-colour-vertical.png passes neither
        A10 nor A12 today, but the <img> at the WRONG src simply 404s and
        naturalWidth stays 0, which this assertion catches; (2) a mis-cased
        filename on a case-sensitive host (Firebase App Hosting/Linux) that
        slipped past caseSensitivityRuling's local-machine check for any
        reason -- belt-and-suspenders against the same case class in
        production, where A12 never runs; (3) a truncated or otherwise
        corrupt file that happens to pass A12's structural IHDR-width-only
        read (A12 never inflates IDAT, per f8-lead-logo.json
        `acceptedLimitations.declaredWidthForgery`) -- a truncated/corrupt
        file fails real browser decode and naturalWidth reads 0 even when
        A12 reported a plausible declared width; (4) the declaredWidthForgery
        class @qa demonstrated directly -- a forged IHDR width would still
        decode to its REAL (different, smaller) dimensions in a real browser,
        so naturalWidth would disagree with the declared width even though
        A12's raw header read cannot see the disagreement.
      command: >-
        npx playwright test e2e/mega-menu-f8-logo-and-tickets-rail.spec.ts -g
        "logo image actually loaded and decoded"
      required: true
