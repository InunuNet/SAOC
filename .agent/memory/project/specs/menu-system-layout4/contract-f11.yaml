assertions:
  phase: 4
  checks:
    - id: A1
      description: >
        PROPERTY 1a: f1-pending-nos-routes.json is now empty (written directly
        by @architect as a golden — see the goldens list; not left to @dev).
        Both the filesystem-signal checker and the manifest-has-pages checker
        must pass cleanly against the now-empty list at HEAD. CONFIRMED LIVE
        during contract authoring: `node .../check-pending-routes-still-pending.mjs`
        -> "CURRENTLY EXEMPT: 0 route(s) (0 stale)" / "PASS: all 0 exempt
        route(s) are still genuinely pending" / exit 0; `node
        .../check-manifest-routes-have-pages.mjs --ref HEAD` -> 17/17 PASS,
        exit 0. Nothing left for @dev to do for this half of property 1 — this
        assertion re-proves it stays true.
      command: >-
        node contracts/checks/menu-system-layout4-shared/check-pending-routes-still-pending.mjs
        | grep -qE "CURRENTLY EXEMPT: 0 route"
        && node contracts/checks/menu-system-layout4-shared/check-manifest-routes-have-pages.mjs --ref HEAD
      required: true

    - id: A2
      description: >
        FIX SPEC (exact, no judgment call left to @dev), PROPERTY 1b: in
        contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs,
        replace line 147
        (`if (item.featureRail) hrefs.push(item.featureRail.ctaHref);`) with:
          if (item.featureRail) {
            for (const dest of item.featureRail.destinations) hrefs.push(dest.href);
          }
        Also fix the two comments that describe the stale shape: line 39
        ("including lead.leadHref, lead.theShow's links, and
        featureRail.ctaHref, not") -> replace "featureRail.ctaHref" with
        "each of featureRail.destinations[].href"; line 129 ("featureRail.ctaHref.
        Property 1 covers all 17 manifest routes, not just the") -> same
        replacement. Also fix the hardcoded "17" in the SKIP-path log message
        (lines 161-169, specifically "${17 - pendingRoutes.length} of 17
        hrefs, not all 17.") -- this number was already wrong before this fix
        (the real NAV href count is 25 per contract-f9.yaml's re-baselined
        golden, not 17: the manifest's 17 listed routes plus 8 more site-wide
        top-level links/lead/rail hrefs), and hardcoding a wrong number here is
        the identical "docstring overstates what the code actually proves"
        defect class flagged in A8 below for a different checker. Replace with
        wording that does not hardcode a total, e.g. "it has measured only the
        non-exempt subset of NAV hrefs, not all of them." Do not change
        anything else in this file -- A16 checks the diff stays scoped.
      command: >-
        test -f contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs
      required: true

    - id: A3
      description: >
        REGRESSION GUARD (mirrors contract-f9.yaml's A3 for the sibling
        checker): the stale F7 field read is fully gone.
      command: >-
        ! grep -q "ctaHref" contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs
      required: true

    - id: A4
      description: >
        PROPERTY (mirrors contract-f9.yaml's A4): the checker now actually
        walks the F8 destinations array.
      command: >-
        grep -q "featureRail.destinations" contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs
      required: true

    - id: A5
      description: >
        FIX SPEC, PROPERTY 1c: add a `--nav-file <path>` TEST-ONLY escape
        hatch to check-nav-links-200-gated-by-exemptions.mjs's parseArgs()
        (lines 77-93), mirroring check-manifest-routes-have-pages.mjs's own
        `--manifest-file` pattern (same file family, same documented
        TEST-ONLY convention -- see that file's own usage comment,
        lines 48-56). Exact shape:
          let navFile = null;
          ...
          } else if (arg === '--nav-file') {
            navFile = argv[++i];
            if (!navFile) usageError('--nav-file requires a value');
          } else {
        ...and return `{ baseUrl, pendingRoutesPath, navFile }`. In main()
        (currently line 183), replace:
          const { NAV } = await import(path.join(REPO_ROOT, 'components/chrome/nav-config.ts'));
        with:
          const navModulePath = navFile
            ? path.resolve(process.cwd(), navFile)
            : path.join(REPO_ROOT, 'components/chrome/nav-config.ts');
          const { NAV } = await import(navModulePath);
        Add a header-comment usage line documenting `--nav-file` as TEST-ONLY,
        never for a real gate run, exactly matching
        check-manifest-routes-have-pages.mjs's own disclaimer wording ("Never
        use ... for a real gate run -- it exists for
        goldens/fixtures/f1-negative-fixtures/ only").
      command: >-
        grep -q -- "--nav-file" contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs
      required: true

    - id: A2b
      description: >
        FIX SPEC (exact, no judgment call left to @dev), PROPERTY 1
        AMENDMENT: check-nav-links-200-gated-by-exemptions.mjs's real-HTTP
        loop (confirmed at lines 204-216 of the pre-fix file) only ever
        checks `status === 200` -- blind to the soft-404 documented in the
        goal section's "1b. AMENDMENT" note above. Replace the loop body:

          const failures = [];
          for (const href of hrefs) {
            let status;
            try {
              const res = await fetch(`${baseUrl}${href}`, { redirect: 'manual' });
              status = res.status;
            } catch (err) {
              status = `unreachable (${err.message})`;
            }
            const ok = status === 200;
            console.log(`${ok ? 'PASS' : 'FAIL'} ${href}: ${status}`);
            if (!ok) failures.push(`${href} (${status})`);
          }

        with:

          const SOFT_404_SIGNAL = '<meta name="robots" content="noindex"';
          const failures = [];
          for (const href of hrefs) {
            let status;
            let softNotFound = false;
            try {
              const res = await fetch(`${baseUrl}${href}`, { redirect: 'manual' });
              status = res.status;
              const body = await res.text();
              softNotFound = body.includes(SOFT_404_SIGNAL);
            } catch (err) {
              status = `unreachable (${err.message})`;
            }
            const ok = status === 200 && !softNotFound;
            const reason = softNotFound ? `${status} but soft-404 (noindex)` : status;
            console.log(`${ok ? 'PASS' : 'FAIL'} ${href}: ${reason}`);
            if (!ok) failures.push(`${href} (${reason})`);
          }

        Do NOT check for the not-found page's copy ("This orchid has left
        the bench" or any substring of it) -- the goal section's "1b.
        AMENDMENT" note documents why that string is unusable (present in
        the RSC flight payload of every page, not only 404s). The signal is
        the exact literal `<meta name="robots" content="noindex"` substring
        only. Also update the file's own header usage comment (currently
        lines 64-67, "Exit 1 = list empty but at least one href did not
        return 200 (named)") to read "Exit 1 = list empty but at least one
        href did not return 200, OR returned 200 with a soft-404 signal
        (noindex meta tag) -- both named." Do not change anything else in
        this file -- A16 still checks this feature's overall diff stays
        scoped to test-infrastructure/gate files, and A3/A4 continue to
        guard the destinations-loop fix from A2/A5 unrelated to this change.
      command: >-
        grep -q "SOFT_404_SIGNAL" contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs
        && grep -q "noindex" contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs
        && ! grep -qi "left the bench" contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs
      required: true

    - id: A2c
      description: >
        FIX SPEC (exact, no judgment call left to @dev), CORRECTING A2B'S OWN
        BUG: @dev already applied A2b verbatim (confirmed live at
        check-nav-links-200-gated-by-exemptions.mjs:205-222 today), and A2b's
        own spec has a real defect this amendment closes. Empirically
        confirmed live on https://beta.saoc.co.za, discovered while building
        A6e/A9b below: `/national-show/does-not-exist-fixture-only-404` (a
        GENUINE hard 404 -- no dynamic segment in that route, real 404
        status) ALSO returns a body containing
        `<meta name="robots" content="noindex"/>` -- Next 16 emits this meta
        tag on EVERY not-found-boundary render, real 404 or soft-404 alike
        (same source citation as the goal section's "1b. AMENDMENT" note).
        A2b's `softNotFound = body.includes(SOFT_404_SIGNAL)` is computed
        unconditionally, so on a genuine 404 it evaluates true, and
        `reason = softNotFound ? ... 'soft-404' ... : status` then mislabels
        a real hard 404 as `"404 but soft-404 (noindex)"` -- wrong, and it
        would make A6e's proof-of-status-branch assertion (below) either
        fail correctly-for-the-wrong-reason or require weakening, neither
        acceptable. Fix: gate softNotFound on status === 200 so the
        "soft-404" label is reserved for the one case it actually means --
        200 with the not-found boundary's signal -- never applied to any
        other status. Replace line 214 exactly:
          softNotFound = body.includes(SOFT_404_SIGNAL);
        with:
          softNotFound = status === 200 && body.includes(SOFT_404_SIGNAL);
        No other line in the loop changes -- `ok`'s formula (line 218) is
        already correct as-is (`status === 200 && !softNotFound`) and does
        not need to change, since softNotFound can now only be true when
        status is already 200.
      command: >-
        grep -q "softNotFound = status === 200 && body.includes(SOFT_404_SIGNAL)" contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs
      required: true

    - id: A6
      description: >
        NEW GOLDEN (written directly by @architect, not left to @dev):
        e2e/nav-property1-http-gate.spec.ts -- a Playwright wrapper that
        subprocess-invokes the fixed checker against a REAL, Playwright
        webServer-managed dev server (playwright.config.ts's own dynamic-port
        BASE_URL), never an ambient port -- this is exactly the gap
        contract-f6.yaml's A4 left open ("Re-proving the empty-list branch's
        numbers properly requires a server whose tree is named -- e.g.
        Playwright's own webServer-managed dev server ... rather than an
        ambient port -- left for whoever next runs this gate for real"). Exact
        file content @dev must create verbatim:

          // e2e/nav-property1-http-gate.spec.ts
          // Mission menu-system-layout4 M3/F11 -- wraps
          // check-nav-links-200-gated-by-exemptions.mjs as a subprocess so its
          // real-HTTP-check branch runs against a NAMED server
          // (playwright.config.ts's own webServer-managed dynamic-port dev
          // server, injected via Playwright's `baseURL` fixture) rather than an
          // ambient port -- closing the gap contract-f6.yaml's A4 left open.
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';

          import { expect, test } from '@playwright/test';

          const CHECKER = path.resolve(
            __dirname,
            '../contracts/checks/menu-system-layout4-shared/check-nav-links-200-gated-by-exemptions.mjs',
          );
          const EMPTY_PENDING = path.resolve(
            __dirname,
            '../.agent/memory/project/specs/menu-system-layout4/goldens/fixtures/pending-routes-empty-fixture.json',
          );
          const TICKET_RAIL_404_FIXTURE = path.resolve(
            __dirname,
            '../.agent/memory/project/specs/menu-system-layout4/goldens/fixtures/f1-negative-fixtures/nav-config-ticket-rail-404.mjs',
          );
          const TICKETS_SOFT_404_FIXTURE = path.resolve(
            __dirname,
            '../.agent/memory/project/specs/menu-system-layout4/goldens/fixtures/f1-negative-fixtures/nav-config-tickets-soft-404.mjs',
          );

          function runChecker(baseUrl: string, extraArgs: string[]) {
            try {
              const stdout = execFileSync(
                'node',
                [CHECKER, '--base-url', baseUrl, '--pending-routes', EMPTY_PENDING, ...extraArgs],
                { encoding: 'utf8' },
              );
              return { code: 0, output: stdout };
            } catch (err) {
              const e = err as { status?: number; stdout?: string; stderr?: string };
              return { code: e.status ?? 1, output: `${e.stdout ?? ''}${e.stderr ?? ''}` };
            }
          }

          test.describe('property 1 HTTP gate (real webServer-managed dev server)', () => {
            test('real NAV: all hrefs return 200', async ({ baseURL }) => {
              expect(baseURL, 'playwright.config.ts must provide baseURL').toBeTruthy();
              const { code, output } = runChecker(baseURL!, []);
              expect(code, output).toBe(0);
            });

            test('negative fixture: a broken ticket-rail href fails the gate', async ({ baseURL }) => {
              expect(baseURL, 'playwright.config.ts must provide baseURL').toBeTruthy();
              const { code, output } = runChecker(baseURL!, ['--nav-file', TICKET_RAIL_404_FIXTURE]);
              expect(code).toBe(1);
              expect(output).toContain('/national-show/does-not-exist-fixture-only-404');
              expect(output.toLowerCase()).not.toContain('soft-404');
            });

            test('negative fixture: a soft-404 (200 + noindex) ticket-rail href fails the gate', async ({
              baseURL,
            }) => {
              expect(baseURL, 'playwright.config.ts must provide baseURL').toBeTruthy();
              const { code, output } = runChecker(baseURL!, ['--nav-file', TICKETS_SOFT_404_FIXTURE]);
              expect(code).toBe(1);
              expect(output).toContain('/tickets/does-not-exist-fixture-only-soft404');
              expect(output.toLowerCase()).toContain('soft-404');
            });
          });

        PROPERTY closed by the first test: property 1 (all real NAV hrefs
        return 200, and none of them soft-404 once A2b lands) is measured for
        real, against a named server, with zero skips. Because this test runs
        the FIXED checker (post-A2b) against the REAL NAV export, it is also
        the POSITIVE CONTROL the goal section's "1b. AMENDMENT" note promises:
        every one of the 25 real hrefs in goldens/f1-nav-hrefs.json is walked
        through the same noindex check on every green run of this test, not
        merely asserted clean once at contract-authoring time. That one-time
        authoring-time sweep already ran live, for the record: all 25 real
        hrefs, on BOTH localhost:3002 and https://beta.saoc.co.za, returned
        200 with no noindex meta tag present (raw curl evidence, not
        re-derived here). PROPERTY closed by the second test: the checker's
        HTTP branch is not passable-by-construction for a HARD 404 -- a
        genuinely broken href in the exact shape @dev's A2/A5 fix reads
        (featureRail.destinations[].href) makes it fail and name the href,
        proving A2's fix actually wires the destinations loop into a real
        fetch(), not just into a comment. CORRECTED per A6e/nav-config-
        ticket-rail-404.mjs's own corrected header comment: this fixture's
        injected href is now /national-show/does-not-exist-fixture-only-404
        (a genuine, router-level 404 with no dynamic segment), not the
        original /tickets/... path, which Codex GPT-5.5 and @qa both
        independently found actually soft-404s like every other
        app/(marketing)/tickets/[slug] path -- so it never exercised the
        `status !== 200` branch at all pre-fix. The added
        `.not.toContain('soft-404')` assertion is the proof this test can
        only pass via the status branch, per A2c's fix to the checker's own
