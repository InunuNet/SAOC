schema: athanor.contract/v1
slug: menu-system-layout4
goal: >
  M3/F11 — close every real gap @analyst's property-by-property audit
  (.agent/memory/project/scratch/research-menu-m3-gate.md) found against the
  mission's own seven gate properties (mission section 6), now that all six NOS
  routes have landed on this branch (rebased onto origin/main 736db97d;
  check-manifest-routes-have-pages.mjs --ref HEAD confirms 17/17 PASS, and the
  NOS lane confirmed all six return 200 on beta.saoc.co.za). This is the LAST
  feature before the M3 gate runs and the branch goes to PR — it does not touch
  components/chrome/MegaMenu.tsx, MobileMenu.tsx, Header.tsx, or nav-config.ts
  at all (A16 enforces this); every fix here is test-infrastructure, gate
  bookkeeping, or documentation-accuracy.

  SEVEN GAPS CLOSED, ONE PER PROPERTY:

  1. f1-pending-nos-routes.json was stale (listed all six landed routes as
     still pending), so property 1's dedicated gate checker
     (check-nav-links-200-gated-by-exemptions.mjs) exited 3 (SKIP), correctly
     UNMEASURED rather than falsely green, but blocking real measurement. This
     feature empties the fixture (already done directly by @architect as a
     golden — see goldens list) and fixes a LATENT bug the emptying exposes:
     check-nav-links-200-gated-by-exemptions.mjs:147 still reads the retired F7
     shape `item.featureRail.ctaHref` (contract-f9.yaml fixed the identical bug
     in the sibling checker check-nav-hrefs-golden.mjs, but this "shared"
     checker was never touched). Net effect before the fix: `undefined` is
     pushed into the href list and the two ticket-rail secondary destinations
     are never HTTP-checked. NOTE, confirmed live during contract authoring:
     e2e/nav-links-200.spec.ts and e2e/mobile-nav-reaches-every-section.spec.ts
     do NOT share this bug — both read the already-correct, F9-fixed
     e2e/utils/collect-nav-hrefs.ts, which already walks `destinations[]`
     (collect-nav-hrefs.ts:45-49). Only the standalone
     check-nav-links-200-gated-by-exemptions.mjs (a third, independent href
     collector) has the stale read. Fixing it, plus adding a `--nav-file`
     TEST-ONLY escape hatch (mirroring check-manifest-routes-have-pages.mjs's
     own `--manifest-file` pattern) so a negative fixture can prove the HTTP
     branch actually fails a broken href, closes this gap for real.

  1b. AMENDMENT (post-authoring, same feature): the checker's HTTP branch as
     originally specified above (`status === 200`) is BLIND to a real,
     already-present soft-404: app/(marketing)/tickets/[slug]/page.tsx calls
     notFound() (line 91) after Next 16's streaming SSR has already committed
     HTTP 200 to the wire (loading.tsx streams before notFound() resolves
     deep in the tree, so the status code can never retroactively become
     404). Verified LIVE, both locally (localhost:3002) and on
     https://beta.saoc.co.za, against /tickets/does-not-exist-xyz and the new
     fixture-only path used below: HTTP 200, no <h1>, and the response body
     DOES contain `<meta name="robots" content="noindex"/>` -- confirmed as a
     Next-16-guaranteed, framework-level behaviour, not an SAOC convention:
     the doc comment on notFound() in
     node_modules/next/dist/client/components/not-found.js states it inserts
     exactly this meta tag, and
     node_modules/next/dist/client/components/http-access-fallback/error-boundary.js's
     HTTPAccessFallbackErrorBoundary.render() unconditionally wraps the
     not-found render in it regardless of what status code already shipped.
     Grepping the SAOC codebase itself (app/, lib/, components/) for
     "noindex" returns zero matches -- nothing here sets this tag by hand, so
     its presence is a reliable, framework-guaranteed signal for "the
     not-found boundary rendered," never an SAOC-authored false positive.
     NOTE the discriminator this rules out: the not-found page's own copy
     ("This orchid has left the bench") is NOT usable as a signal -- it
     appears in the RSC flight payload of every page on the site (confirmed
     by grep against real, non-404 page responses), not only actual 404s.
     `<meta name="robots" content="noindex"` does not share that false-
     positive risk: empirically swept against all 25 real NAV hrefs (the
     full golden list in goldens/f1-nav-hrefs.json), on BOTH localhost:3002
     and https://beta.saoc.co.za, zero of the 25 carry it -- see A6's amended
     description for the exact sweep. A2b below is the exact fix spec; the
     new negative fixture
     goldens/fixtures/f1-negative-fixtures/nav-config-tickets-soft-404.mjs
     and A6's extended spec plus A6d prove the checker's soft-404 branch
     actually fires, without touching nav-config-ticket-rail-404.mjs (the
     existing hard-404 negative fixture, unchanged, still proving the
     original status-code branch). Fixing the underlying soft-404 rendering
     bug itself (e.g. app/(marketing)/tickets/[slug]/loading.tsx or a
     dynamicParams change) is explicitly OUT OF SCOPE for this feature -- A16
     still enforces zero production chrome-code changes, and this soft-404
     is in a route this mission does not own; it is recorded separately by
     the orchestrator, not fixed here. This contract only makes the gate
     capable of detecting it.

  2. Property 2 (`/national-show` reachable) already passes for real — no
     action needed; A7 below re-confirms it live rather than silently dropping
     it from this contract's coverage.

  3. check-no-nos-palette-mixing.mjs's header comment overstates its own scope
     — it reads as if it guards against any NOS token entering SAOC chrome, but
     it only ever scans the four component files passed on argv, never
     app/globals.css, which now legitimately carries `--nos-*` custom
     properties as F8's ruled, provenanced exception
     (goldens/f8-tickets-rail.json's `scopeBoundary` field). A8 narrows the
     docstring to name exactly what it scans and cites the ruled exception —
     no scan-scope change, no behaviour change.

  4. e2e/nav-keyboard-operable.spec.ts proves Enter/Space/Escape/focus-restore/
     tab-order-into-panel/one real focus-ring, but only checks the FIRST
     focusable leaf for a visible focus ring, and never asserts the panel isn't
     a focus trap. A9/A10 close both.

  5. e2e/no-horizontal-overflow.spec.ts never opens the mobile drawer before
     measuring — it only ever loads `/` collapsed. Mission section 6 property 5
     explicitly asks for "390px drawer... no horizontal scroll," which this
     spec has never actually measured. A11/A12 add a dedicated drawer-open
     measurement.

  6. Property 6 (descriptors sourced) already passes 16/16 for real — no action
     needed; A13 re-confirms it live.

  7. Two sub-gaps: (a) execution/contract.py's `kind: shell` treats exit 77 as
     skip, while every shared checker in this mission (built against
     contracts/checks/_shared/run_contract_suite.mjs's convention) exits 3 for
     skip — a genuinely-skipping checker run through
     `python3 execution/mission.py gate --milestone M3` (which subprocesses
     `execution/contract.py gate <contract> --phase all --run-checks` per
     feature — confirmed by reading execution/mission.py:1206-1210, the
     authoritative runner for this mission) would read as a plain FAIL, not
     SKIP. execution/ is HARNESS-owned per .agent/update-manifest.yaml (the
     whole `execution/` path is marked HARNESS) — this feature does NOT edit
     it. Instead every new assertion below that can hit the 3-exit-code SKIP
     path wraps the invocation so exit 3 is explicitly remapped to exit 77 in
     the assertion's own shell command (A14 proves the remap itself works).
     The systemic fix — either standardising the exit code across
     run_contract_suite.mjs and every existing checker, or teaching
     contract.py to recognise 3 as well as 77 — is out of this feature's scope
     (it would touch checkers this contract doesn't own, plus the
     HARNESS-owned contract.py) and is recorded in
     .agent/memory/project/backlog.md as an Athanor upstream item, not patched
     here. (b) the mission frontmatter never advanced past M2/F4 even though
     F6-F10 are real, committed, landed contracts. A15 corrects the
     bookkeeping and re-validates the mission file.

  TRIAD (.claude/rules/workflow.md, docs/verification-triad-gate.md): A17
  declares codex_qa, A18 declares browser_deployed_check against
  https://beta.saoc.co.za covering the header flyout and the 390px drawer.
  gws_inbox_check is deliberately NOT declared — this feature sends no email
  and touches no email-adjacent code, exactly the precedent already on record
  in execution/triad-baseline-exempt.txt for
  .agent/memory/project/specs/nos-design-system/contract.yaml and its
  contract-m7.yaml/contract-m8.yaml siblings ("no email surface in this
  mission" — codex_qa and browser_deployed_check declared for real,
  gws_inbox_check grandfathered). This feature does NOT itself add an entry to
  execution/triad-baseline-exempt.{txt,sha256} (execution/ is HARNESS-owned,
  out of scope per this brief) — if verify_triad_coverage.py's `app/`-substring
  classifier ever flags this specific contract file as UI/workflow (today it
  will not: no assertion command/cmd/target string below contains the literal
  substring `app/` — confirmed by grep against this file before authoring
  finished), the automatic gate preflight would hard-block on the missing
  gws_inbox_check kind until either a baseline entry is added by whoever owns
  that harness-owned file, or a real gws_inbox_check assertion is declared.
  Flagged here as a known constraint, not resolved, consistent with this
  feature's rule against editing execution/.
