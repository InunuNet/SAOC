schema: athanor.contract/v1
slug: menu-system-layout4
goal: >
  Restructure components/chrome/nav-config.ts (F1) and repoint the one dead nav target
  (F5) so that all 17 listed:true National Show routes from content/national-show-routes.json
  (origin/nos-site) live inside ONE National Show mega -- lead block, three group columns
  (Visit/Programme/Exhibit & Trade), a folded-in "The Show" group, and a Tickets feature rail
  -- per Brad's approved Layout 4. Seven top-level items plus the Contact button. Layout
  approval only: every copy string traces to the manifest, ruling R1-R4, or Brad's own words
  in the mission file -- nothing invented. This contract covers F1 and F5 (milestone M1, no
  rendering change); F2/F3/F4 (milestone M2, chrome rendering) get their own contract files
  building on this one's goldens.
created_at: '2026-09-10'
autonomy: high
features:
  - id: F1
    name: >-
      components/chrome/nav-config.ts restructure -- seven top-level items plus Contact;
      all 17 listed Show routes into one National Show mega in manifest groups and order;
      additive NavItem type changes for lead block, group headings, per-leaf descriptors
      and feature rail; descriptors are trimmed manifest purpose strings, never free text
    status: pending
  - id: F5
    name: >-
      Dead nav target -- /national-show/exhibitors/international becomes
      /national-show/international-guests per the manifest (WOSA entry needs no change, R3)
    status: pending
goldens:
  - .agent/memory/project/specs/menu-system-layout4/goldens/f1-nav-config-target.json
  - .agent/memory/project/specs/menu-system-layout4/goldens/f1-nav-hrefs.json
  - .agent/memory/project/specs/menu-system-layout4/goldens/f1-gaps.json
  - .agent/memory/project/specs/menu-system-layout4/goldens/fixtures/f1-pending-nos-routes.json
  - .agent/memory/project/specs/menu-system-layout4/goldens/fixtures/f1-negative-fixtures/nav-config-tickets-back-in-top-row.mjs
  - .agent/memory/project/specs/menu-system-layout4/goldens/fixtures/f1-negative-fixtures/nav-config-missing-sponsors-href.mjs
  - .agent/memory/project/specs/menu-system-layout4/goldens/fixtures/f1-negative-fixtures/nav-config-invented-descriptor.mjs
  - .agent/memory/project/specs/menu-system-layout4/goldens/fixtures/f1-negative-fixtures/nav-config-dead-link-not-fixed.mjs
  - .agent/memory/project/specs/menu-system-layout4/goldens/fixtures/nos-palette-mixing-fixture.tsx
  - contracts/checks/menu-system-layout4-f1/check-nav-hrefs-golden.mjs
  - contracts/checks/menu-system-layout4-f1/check-nav-top-level-golden.mjs
  - contracts/checks/menu-system-layout4-f1/check-descriptor-provenance.mjs
  - contracts/checks/menu-system-layout4-f1/check-dead-link-fixed.mjs
  - contracts/checks/menu-system-layout4-shared/check-no-nos-palette-mixing.mjs
assertions:
  phase: 4
  checks:
    - id: A1
      description: >
        PROPERTY: top-level NAV shape is exactly the seven approved items, in order, with
        approved labels/hrefs/types (mission section 3 F1; source list itself is the Dev
        Status sheet's Pages tab per mission section 5). NEGATIVE FIXTURE: goldens/fixtures/
        f1-negative-fixtures/nav-config-tickets-back-in-top-row.mjs re-adds Tickets as an
        8th top-level link -- run the same checker against it
        (`node contracts/checks/menu-system-layout4-f1/check-nav-top-level-golden.mjs
        .agent/memory/project/specs/menu-system-layout4/goldens/fixtures/f1-negative-fixtures/nav-config-tickets-back-in-top-row.mjs`)
        and confirm it exits 1 before trusting a green run against the real file.
      command: >-
        node contracts/checks/menu-system-layout4-f1/check-nav-top-level-golden.mjs
      required: true

    - id: A2
      description: >
        PROPERTY 2 (mission section 6): /national-show is reachable from the header -- the
        specific defect Brad reported live. Also PROPERTY: every one of the manifest's 17
        listed:true routes is a NAV href, and no href from the pre-Layout-4 shape (the old
        standalone /tickets, the old dead /national-show/exhibitors/international) survives.
        NEGATIVE FIXTURE: nav-config-missing-sponsors-href.mjs drops the Show Sponsors leaf
        entirely -- confirm `node contracts/checks/menu-system-layout4-f1/
        check-nav-hrefs-golden.mjs <that fixture>` exits 1.
      command: >-
        node contracts/checks/menu-system-layout4-f1/check-nav-hrefs-golden.mjs
      required: true

    - id: A3
      description: >
        PROPERTY 6 (mission section 6): every descriptor string in nav-config.ts is a
        trimmed prefix of its manifest row's own `purpose` field -- never free text. This
        is the back door through which invention enters a menu; it must be mechanically
        checked, not eyeballed. Reads content/national-show-routes.json from the working
        tree first, then `git show origin/nos-site:content/national-show-routes.json` as a
        fallback, per contracts/checks/menu-system-layout4-f1/check-descriptor-provenance.mjs's
        own SKIPPED-not-PASS handling if neither is reachable (property 7). NEGATIVE
        FIXTURE: nav-config-invented-descriptor.mjs gives the FAQ leaf the descriptor
        "Everything you need to know before you visit!" (not a prefix of the manifest's
        "The questions visitors ask us most.") -- confirm the checker exits 1 against it.
      command: >-
        node contracts/checks/menu-system-layout4-f1/check-descriptor-provenance.mjs
      required: true

    - id: A4
      description: >
        F5: the dead nav target is fixed. /national-show/exhibitors/international no longer
        appears anywhere in components/chrome/nav-config.ts, and
        /national-show/international-guests does, inside the exhibit-trade group (manifest
        order 2). NEGATIVE FIXTURE: nav-config-dead-link-not-fixed.mjs keeps the old href --
        confirm the checker exits 1 against it.
      command: >-
        node contracts/checks/menu-system-layout4-f1/check-dead-link-fixed.mjs
      required: true

    - id: A5
      description: >
        SAOC/NOS palette never mixes (mission section 5): no hex literal in
        components/chrome/{nav-config.ts,Header.tsx,MegaMenu.tsx,MobileMenu.tsx} that is
        absent from design/design_handoff_saoc/colors_and_type.css's palette, and
        specifically none of NOS's own redeclared values (confirmed distinct: NOS's
        --primary is #211a57 in app/(marketing)/national-show/nos-theme.css on
        origin/nos-site, vs SAOC's #384138) appear in SAOC chrome. NEGATIVE FIXTURE:
        goldens/fixtures/nos-palette-mixing-fixture.tsx contains a literal #211a57 -- confirm
        `node contracts/checks/menu-system-layout4-shared/check-no-nos-palette-mixing.mjs
        <that fixture>` exits 1. F1 touches no visual literals itself (nav-config.ts is pure
        data), so this assertion is here as a standing guard the F2/F3/F4 contracts also
        run against the real chrome files once they add markup.
      command: >-
        node contracts/checks/menu-system-layout4-shared/check-no-nos-palette-mixing.mjs
        components/chrome/nav-config.ts
      required: true

    - id: A6
      description: >
        NavItem/NavLeaf/NavColumn type changes are additive, not a rewrite of the existing
        `link`/`mega` discriminated union shape that Header.tsx and MobileMenu.tsx switch
        on. `quiet` (still read by both, landed 5981d31b) is untouched.
      command: >-
        grep -qE "type NavItem\s*=" components/chrome/nav-config.ts &&
        grep -qE "type:\s*'link'" components/chrome/nav-config.ts &&
        grep -qE "type:\s*'mega'" components/chrome/nav-config.ts &&
        grep -q "quiet?" components/chrome/nav-config.ts
      required: true

    - id: A7
      description: >
        PROPERTY 7 (mission section 6): a TypeScript build of the changed file is real
        evidence the additive type changes actually type-check against Header.tsx/
        MobileMenu.tsx's existing consumption of NAV, not just that nav-config.ts parses in
        isolation.
      command: >-
        npx tsc --noEmit -p tsconfig.json
      required: true

    - id: A8
      description: >
        PROPERTY 1 partial (mission section 6) -- placeholder, expected MISSING today.
        e2e/nav-links-200.spec.ts must be updated by @dev to import the new NAV shape and
        read goldens/fixtures/f1-pending-nos-routes.json (not the stale, superseded
        ticketing-complete/goldens/fixtures/f6-pending-nos-routes.json) for its skip list.
        This assertion references that update directly; until @dev lands it, the spec file
        still imports the old fixture and this FAILS honestly rather than passing on a stale
        skip list -- see run_contract_suite.mjs's missing-vs-fail classification for how an
        entirely absent script (not this case) would instead render MISSING.
      command: >-
        grep -q "f1-pending-nos-routes.json" e2e/nav-links-200.spec.ts
      required: true

    - id: A9
      description: >
        Same as A8 for the mobile reachability spec (property 5, mission section 6) --
        e2e/mobile-nav-reaches-every-section.spec.ts must be rewritten for the single
        National Show mega (today it hardcodes three separate Visit/Programme/Exhibit
        groups, which F1 removes) and read the same pending-routes fixture.
      command: >-
        grep -q "f1-pending-nos-routes.json" e2e/mobile-nav-reaches-every-section.spec.ts
      required: true
