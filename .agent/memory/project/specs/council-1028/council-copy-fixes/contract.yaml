schema: athanor.contract/v1
slug: council-copy-fixes
goal: Apply exactly the ten code-string corrections from the council correction sheets of 2026-10-27 to the NOS and vendor-form sources, change no other string, and keep every gate that pins the old wording green.
created_at: '2026-10-28'
autonomy: high

features:
  - id: F1
    name: Council copy fixes, code strings only (typos and the reviewer's own wording; Sanity items already applied)
    status: pending

goldens:
  - .agent/memory/project/specs/council-1028/council-copy-fixes/goldens/copy-map.json
  - .agent/memory/project/specs/council-1028/council-copy-fixes/goldens/council-overrides-shape.json
  - .agent/memory/project/specs/council-1028/council-copy-fixes/goldens/sanity-exceptions.json
  - .agent/memory/project/specs/council-1028/council-copy-fixes/goldens/README.md

assertions:
  phase: 4
  checks:
    - id: A1
      description: "Source strings: in each of the 8 source files every before-string is absent and every after-string is present the mapped number of times (C06 twice: the S3 array and THEME_LEAD). Fails on main (22 problems)"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/check-copy-static.mjs"
    - id: A2
      description: "Rendered server HTML: each corrected string is in the page its route serves (NOS routes /faq /exhibitors / /what-to-expect requested with the nos host; every description, og:description and twitter:description of the exhibitors page carries the corrected sentence) and no before-string renders in visible text, any attribute value (aria-label, alt, title, content) or script payload (JSON-LD, RSC flight data); the three vendor-form strings are checked in the server-rendered VendorRegisterForm (the live route is behind a vendor code). Serves a production build (next start, fixture replay; never next dev, which deleted .next/BUILD_ID and starved A7-A9), building first through nos-content-standard build.sh when .next/BUILD_ID is missing or older than the tracked sources, with the apphosting.yaml Sanity ids and SHOW_PLACEHOLDER_PREVIEW set inside the check"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/check-copy-rendered.mjs"
      timeout_seconds: 1500
    - id: A3
      description: "No stale pin: no tracked file outside the frozen/historical list still carries a before-string or a pinSubs fragment (route-table keepTypo, f6 baseline, f18 longform-copy, vendor structural grep, nos-content-standard spec.md). Two paths are allowlisted by name with a stated reason (council-overrides.json, sanity-exceptions.json); A6 rejects any \\u00xx obfuscation in the overrides so the allowlist is the only way past. Fails on main"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/check-no-stale-strings.mjs"
    - id: A4
      description: "No other string changes: every changed line against origin/main in a source or pin file is exactly a copy-map substitution, pairwise; the nos-content-standard gate scripts (_lib.mjs, gate-standard.mjs, gate-verbatim.mjs) must normalise back to origin/main byte-for-byte once the override plumbing is removed (a deleted assertion or removed route fails; the _lib override block is pinned to goldens/lib-override-block.txt); only docs/, the text pins and the council spec dir may otherwise change"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/check-diff-scope.mjs"
    - id: A5
      description: "Everything holding Lee-Ann's words or a record of them is byte-identical to origin/main: every copy-map frozenHistorical path (Drive copies and mirrors, content/drive-recovered, docs/leeann-source, docs/handover, the historical goldens, the Sanity fixtures, seed-show-faq.ts) except the council spec dir and docs/vendor-form-copy-20261007.md (the gates apply the overrides at read time)"
      command: "bash .agent/memory/project/specs/council-1028/council-copy-fixes/checks/check-frozen-untouched.sh"
    - id: A6
      description: "Council overrides exist, are valid JSON of schema council.overrides/v1, carry a substitution for every copy-map entry plus both pinSubs, and _lib.mjs applies them"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/check-overrides.mjs"
    - id: A7
      description: "Existing pin: the NOS content standard gate (its WE-G1 and EX-G1 checks used to pin 'takes please' and 'who’s subscriptions') passes against the corrected site, only when its failure set EQUALS exactly the five PRE-EXISTING D7 scroller-vs-97px-header lines at 768 (/plan-your-visit /faq /privacy /terms /refunds), identical on origin/main 63146ec5: a subset, a sixth failure, an unparsable failure or fewer widths/routes visited all fail. Uses the production build A2 made"
      command: "execution/heartbeat_wrap.sh node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/gate-standard-known-defect.mjs"
      timeout_seconds: 3000
    - id: A8
      description: "Existing pin: every NOS route with a Drive source renders it word for word (whitespace normalised) once the council overrides are applied to the frozen text"
      command: "execution/heartbeat_wrap.sh node .agent/memory/project/specs/nos-content-standard/checks/gate-verbatim.mjs"
      timeout_seconds: 3000
    - id: A9
      description: "Existing pin: the nos-critique-r12 f6 baseline carries the corrected wording and differs from origin/main only by the council substitutions. f6-rendered.mjs itself is dead on origin/main (it requests /national-show/* on the default host, which the NOS split retired: next start never answers 200), so it is not run; backlog item to retire or rewrite it"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/check-f6-baseline-copy.mjs"
      timeout_seconds: 1500
    - id: A10
      description: "Existing pin: vendor-form-copy-20261007 structural check (line 65 pinned 'a clean and safe booths') passes against the corrected form"
      command: "bash .agent/memory/project/specs/vendor-form-copy-20261007/checks/check-f1-structural.sh"
    - id: A11
      description: "docs/vendor-form-copy-20261007.md records the council correction (it still said the heading renders with the source misspelling)"
      command: "grep -q 'council' docs/vendor-form-copy-20261007.md"
    - id: A12
      description: "docs/council-copy-fixes-1028.md exists and names every copy-map id C01..C10 and C02b"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/check-doc.mjs"
    - id: A17
      description: "Sanity-vs-Drive exception list: the 9 FAQ rows the lead already applied in Sanity (q15, q16, q26, q51, q29, q4, q7, q8, q40) are each listed once with the council sheet of 2026-10-27, each 'from' is unique in the frozen Drive FAQ mirror, and council-overrides.json carries them under sanityExceptions gated by _lib.mjs on the Sanity fixture's capturedAt (dormant against today's 2026-10-26 fixture, active after any re-record or NOS_STD_FIXTURE=live) so nos-content-standard gates never go red on these rows. The Tygerberg liaison row has no comparing check and is recorded only"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/check-sanity-exceptions.mjs"
    - id: A18
      description: "Self-test of the A7 wrapper with stub gates: all five known lines pass, a clean run passes, a subset fails, a sixth failure fails, fewer widths or routes fail, an unparsable failure fails"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/test-known-defect.mjs"
    - id: A19
      description: "Proof for the A4 plumbing check: the real files pass, a deleted assertion line, a removed route, a weakened comparison, a tampered override block, a deleted unrelated line and an edited gate-verbatim all fail"
      command: "node .agent/memory/project/specs/council-1028/council-copy-fixes/checks/test-plumbing.mjs"
    - id: A13
      description: "Lint is clean"
      command: "pnpm exec eslint app components lib e2e"
      timeout_seconds: 900
    - id: A14
      description: "Codex adversarial QA of the whole diff against copy-map.json"
      type: codex_qa
      target: "Adversarially review git diff origin/main...HEAD against .agent/memory/project/specs/council-1028/council-copy-fixes/goldens/copy-map.json. Try to pass A1-A4 while a string outside the map changed, a before-string survives in a place only a browser shows (a title, a meta tag, an aria-label, the THEME_LEAD duplicate), a frozen Drive copy was edited instead of overridden, or a gate was weakened rather than taught the overrides (a deleted assertion, a widened tolerance, a skipped route). OUT OF SCOPE: Sanity content, the waste-label scope change, the terms clause, anything about the show name, every class C and D row of the council sheet."
      required: true
    - id: A15
      phase: 5
      description: "PHASE 5 (manifest is written by the post-deploy BrowserAgent run). browser_deployed_check on beta NOS /what-to-expect, declared for the triad linter, non-required"
      type: browser_deployed_check
      target: .agent/memory/scratch/council-copy-fixes-browser-manifest.json
      required: false
    - id: A16
      phase: 5
      description: "PHASE 5. gws inbox check, no email path is touched; declared non-required to satisfy the triad coverage linter, expected to skip"
      type: gws_inbox_check
      target: .agent/memory/scratch/council-copy-fixes-gws-manifest.json
      required: false
