      description: "PHASE 5. gws inbox check; the newsletter button is restyled but no email path changes. Declared non-required for the triad linter, expected to skip"
      type: gws_inbox_check
      target: .agent/memory/scratch/council-design-1-gws-manifest.json
      required: false
