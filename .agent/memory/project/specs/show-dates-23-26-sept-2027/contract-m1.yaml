      command: >-
        grep -q "SAOC -> FLEET.*2026-10-06.*23-26 Sept" comms.md

    - id: A31
      description: >-
        FULL-TREE RESIDUE SCAN -- no stray '2027-09-16'..'2027-09-19' or '2027-06-18' literal
        survives anywhere in checked-in source or docs outside the documented, individually
        justified exclusions (see goldens/m1-golden.md "Residue scan" for the full allowlist and
        the reasoning behind each exclusion -- this is not a blanket exemption, every excluded
        path was classified by what it actually asserts). AMENDED 2026-10-06 (QA finding, see
        .agent/memory/scratch/qa-report-show-dates-f1-f2.md §2): (1) --include globs are now
        quoted -- unquoted, zsh glob-expands them before grep sees them, which can empty the
        captured output and make `test -z` falsely report PASS regardless of real residue; bash
        (the real gate shell, execution/contract.py) was not affected by this specific bug, but
        quoting removes the shell-dependence entirely. (2) allowlist extended for legitimate
