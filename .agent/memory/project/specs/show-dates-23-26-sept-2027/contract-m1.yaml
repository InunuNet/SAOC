        golden's classification (e) -- Brad's approved handoff, off-limits to edit, see
        docs/rules/no-invention.md and project memory project_design_folders_brad_active).
        AMENDMENT 2 2026-10-06 (dev's F3 run FAILed
        A31 under bash, 6 genuine allowlist gaps, none current-fact residue -- see
        .agent/memory/scratch/dev-result-show-dates-f3.md and golden's Residue scan amendment #2):
        Plans/valiant-squishing-thimble.md (whole file -- pre-existing staged plan narrating the
        PRIOR 18-21->16-19 purge trigger, the only matching line in the only matching file in
        Plans/), plus five content-matched excludes for historical sentences dev correctly
        refused to edit: check-vip-fix-scope-containment.mjs's "90-day cutoff ('2027-06-18')"
        comment (sibling of the already-allowlisted check files, missed because its exact wording
        differs), seed-show-visitor-info.golden.json's and nationalShow.golden.json's
        `datesAreNotConfirmed`/`note` fields quoting the PRIOR mission's Lee-Ann confirmation
        (2027-09-16 to 2027-09-19 -- correct history, a second AMENDED-AGAIN clause already
        covers the current dates separately), docs/show-visitor-info.md:110's description of the
        unrelated, now-deleted DEFAULT_COUNTDOWN_DATE='2027-09-18' anti-pattern (different
        placeholder, different reason, not this mission's date to move), and
        lib/provisional-figures.ts:78's continuation line of the existing allowlisted comment
        (the allowlisted substring "second hand-typed copy of '2027-06-18'" sits on the comment's
        PREVIOUS source line due to line-wrapping, so grep's per-line match never saw it --
        pre-existing allowlist bug, not introduced by this mission).
      command: >-
        test -z "$(grep -rnE '2027-09-1[6-9]|2027-06-18' --include='*.ts' --include='*.tsx' --include='*.md' --include='*.mjs' --include='*.json' --include='*.sh' . 2>/dev/null | grep -v node_modules | grep -v .claude/worktrees | grep -v '^./\.agent/memory/project/' | grep -v '^./\.agent/memory/scratch/' | grep -v '^./\.tmp/' | grep -v '^./docs/f3-show-dates-purge-16-19-sept-2027.md:' | grep -v '^./docs/payment-seam.md:' | grep -v '^./docs/f1-ticketing-conferences.md:' | grep -v '^./docs/f4-admission-products.md:' | grep -v '^./docs/f5-day-selection-attendees.md:' | grep -v '^./docs/ticketing-complete-f1.md:' | grep -v '^./docs/ticketing-complete-f2-open-decisions.md:' | grep -v '^./docs/ticketing-complete-f8.md:' | grep -v '^./docs/ticketing-complete-f8-morning-review.md:' | grep -v '^./docs/f1-ticketing-pricing-migration.md:' | grep -v '^./docs/b4-national-show.md:' | grep -v '^./README.md:' | grep -v '^./docs/nos-design-system.md:' | grep -v '^./e2e/mega-menu-f8-logo-and-tickets-rail.spec.ts:' | grep -v '^./contracts/checks/ticketing-f4-admission-products/' | grep -v '^./contracts/checks/ticketing-flow-redesign-f3/' | grep -v '^./contracts/golden/ticketing-flow-redesign-f3/' | grep -v '^./contracts/checks/cms-loop-f3-national-show/' | grep -v '^./contracts/cms-loop-f3-national-show.yaml:' | grep -v '^./contracts/golden/dataset-residue-guard/' | grep -v '^./contracts/checks/vendor-gated-registration-flow/check-application-approval-email-copy.mjs:' | grep -v '^./\.scratch-render/render-email.mjs:' | grep -v '^./contracts/golden/f5-event-slugs/' | grep -v '^./contracts/golden/venue-never-changed-copy-fix-f1/' | grep -v '^./contracts/checks/ticketing-f5-day-attendees/' | grep -v '^./contracts/golden/ticketing-f5-day-attendees/' | grep -v '^./contracts/checks/ticketing-complete-f8/verify-walkthrough-figures.mjs:' | grep -v '^./contracts/golden/show-visitor-info/show-identity-surfaces.golden.md:' | grep -v '^./contracts/golden/show-visitor-info/show-identity-wiring.golden.md:' | grep -v 'countdownDate is 2027-09-18T09:00:00' | grep -v "second hand-typed copy of '2027-06-18'" | grep -v "hardcoded '2027-06-18'" | grep -v '^./design/design_handoff_saoc/README.md:' | grep -v '^./scripts/fix-show-dates-2027.ts:' | grep -v '^./scripts/fix-visitor-info-dates-confirmed.ts:' | grep -v '^./Plans/valiant-squishing-thimble.md:' | grep -v "90-day cutoff ('2027-06-18')" | grep -v "confirmed the dates (Lee-Ann, 2027-09-16 to 2027-09-19)" | grep -v "the show committee confirmed the real dates (Lee-Ann, 2027-09-16 to 2027-09-19)" | grep -v "DEFAULT_COUNTDOWN_DATE = '2027-09-18T09:00:00+02:00'" | grep -v 'The literal show start below is the same confirmed instant used as ground')"
