        are explicitly left untouched -- confirms the past-tense decision record was not
        rewritten. README.md's changelog line is likewise untouched.
      command: >-
        grep -q "2027-06-18" docs/ticketing-complete-f1.md &&
        grep -q "2027-06-18" docs/ticketing-complete-f2-open-decisions.md &&
        grep -q "2027-06-18" docs/ticketing-complete-f8.md &&
        grep -q "2027-09-16" docs/b4-national-show.md &&
        grep -q "16–19 September 2027" docs/f3-show-dates-purge-16-19-sept-2027.md &&
