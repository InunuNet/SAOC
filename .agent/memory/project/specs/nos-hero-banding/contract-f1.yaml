# Sources: Codi's FINAL ruling on the home hero banding (rHB), relayed by the lead saoc-82 2026-10-22 with Codi's re-ruling; Brad: "There is
# banding in the hero image looks shit." Architect measurements on BASE 1a7479f1 (goldens/f1-spec.md, goldens/f1-calibration.json).
schema: athanor.contract/v1
slug: nos-hero-banding
goal: >-
  Remove the banding in the home hero's bottom third: the hero slide Image requests q=88 (and only it), the static fallback drops
  orchid-yellow and gets a q88 smartSubsample variant set, the veil tails ease out on Codi's exact stops (<768 derived proportionally),
  the pull ends on MissionBlock's --parchment so there is no seam, and dots, labels and autoplay follow the slide data (3 once the lead
  removes yellow in Sanity), with no new copy, tokens or colours.
created_at: '2026-10-22'
autonomy: high
exclusions:
  - item: 'every file outside goldens/f1-footprint.json, docs/nos-hero-banding.md and this spec dir'
    reason: 'Enforced by A2. Yellow leaves the live rotation in Sanity (the lead, after rHB is live), never in code; public/images/orchid-yellow.jpg stays; no 2560 variant.'
  - item: 'the asset id a620a97f in shipped code'
    reason: 'Enforced by A3 (S7). Only the test-only checks/hero-filter.cjs preload names it.'
features:
  - id: F1
    name: Home hero banding - q88 hero Image and fallback variants, yellow out of the fallback, eased veil tails, parchment pull with no seam, slide-count-driven dots/labels/autoplay
    status: pending
goldens:
  - .agent/memory/project/specs/nos-hero-banding/goldens/f1-spec.md
  - .agent/memory/project/specs/nos-hero-banding/goldens/f1-edits.json
  - .agent/memory/project/specs/nos-hero-banding/goldens/f1-footprint.json
  - .agent/memory/project/specs/nos-hero-banding/goldens/f1-thresholds.json
  - .agent/memory/project/specs/nos-hero-banding/goldens/f1-calibration.json
  - .agent/memory/project/specs/nos-hero-banding/goldens/nonreg-baseline.json
  - .agent/memory/project/specs/nos-hero-banding/goldens/checks-f1.sha256
assertions:
  phase: 4
  checks:
    - id: A1
      description: rHB check scripts and goldens are unmodified since @architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/nos-hero-banding/goldens/checks-f1.sha256
    - id: A2
      description: Footprint - the branch differs from origin/main 1a7479f1 only in goldens/f1-footprint.json, docs/nos-hero-banding.md and the spec dir, and HEAD descends from it
      command: node .agent/memory/project/specs/nos-hero-banding/checks/footprint.mjs
    - id: A3
      description: Static - exact BASE-numbered edits in the five files, one quality={88} (hero Image) and no other quality prop, exact scrim stops ending on --parchment with the diagonal unchanged, yellow out of the fallback with the comment, HERO_SOURCES equals the fallback list, no new copy/tokens/colours, no asset id in code, MissionBlock still bg-parchment, docs
      command: node .agent/memory/project/specs/nos-hero-banding/checks/f1-static.mjs
    - id: A4
      description: Variants and loader - the build's generator writes a -q88 smartSubsample webp set for violet/pink/dark byte-equal to sharp, every plain variant stays q75 byte-equal, no other -q88 set; the loader maps quality 88 to it and sends q=88 to Sanity
      command: node .agent/memory/project/specs/nos-hero-banding/checks/f1-variants.mjs
    - id: A5
      description: Rendered (public + preview builds on live Sanity with the test-only yellow filter; 1440/1920 x DPR 1/2; every slide) - q=88 delivery, band step <= 6 levels and source >= 1.0 bpp in the bottom third, no seam into Our purpose, copy >= 4.5:1, 3 slides/dots/labels and autoplay 1-2-3-1
      command: node .agent/memory/project/specs/nos-hero-banding/checks/f1-rendered.mjs
    - id: A6
      description: Non-regression - 17 SAOC/NOS routes at 1280/390 in both builds keep BASE geometry and screenshot blocks (home hero masked), no horizontal overflow
      command: node .agent/memory/project/specs/nos-hero-banding/checks/nonreg.mjs
