    # ---------------------------------------------------------------------
    - id: TRIAD-01
      description: >-
        Codex GPT-5.5 adversarial review of the M8 diff — CTO-ruling triad
        requirement. Already run for this branch on 2026-09-08 via
        execution/codex_qa.sh over the combined M7+M8 tracked-file diff (65,022
        tokens, exit 0, PASS, zero findings); evidence at
        .agent/evidence/nos-design/codex/codex-qa-m7m8-2026-09-08.log. The prompt
        below scopes the review to this milestone's files. Real, not decorative:
        the gate invokes codex live on every --run-checks run. timeout_seconds
        matches codex_qa.sh's own 600s default so contract.py's 200s supervisory
        default cannot kill a legitimate open-ended review.
      type: codex_qa
