schema: athanor.contract/v1
feature: M1
slug: nos-design-system
name: >-
  M1 NOS foundations — scoped token layer (F1), primitive components (F2), and
  composite blocks (F3) for the National Orchid Show 2027 design system
created_at: '2026-09-07T00:00:00.000000+00:00'

assertions:
  # ---- F1: scoped token layer never touches SAOC-global surfaces ----
  - id: F1-01
    description: app/globals.css is byte-identical to origin/main (no global token edits)
    verify:
      kind: shell
      cmd: "git diff --quiet origin/main -- app/globals.css"

  - id: F1-02
    description: components/chrome/ is byte-identical to origin/main (chrome untouched)
    verify:
      kind: shell
      cmd: "git diff --quiet origin/main -- components/chrome/"

  - id: F1-03
    description: app/layout.tsx is byte-identical to origin/main (root layout untouched)
    verify:
      kind: shell
      cmd: "git diff --quiet origin/main -- app/layout.tsx"

  - id: F1-04
    description: national-show/layout.tsx exists
    verify:
      kind: file_exists
      path: "app/(marketing)/national-show/layout.tsx"

  - id: F1-05
    description: national-show/layout.tsx wraps children in the nos-theme scope element
    verify:
      kind: shell
      cmd: "grep -q 'nos-theme' 'app/(marketing)/national-show/layout.tsx'"

  - id: F1-06
    description: the NOS token stylesheet declares no :root selector
    verify:
      kind: shell
      cmd: "! grep -Eq '^:root' 'app/(marketing)/national-show/nos-theme.css'"

  - id: F1-07
    description: the NOS token stylesheet declares no @theme block
    verify:
      kind: shell
      cmd: "! grep -q '@theme' 'app/(marketing)/national-show/nos-theme.css'"

  - id: F1-08
    description: >-
      the NOS token stylesheet does not introduce status-colour semantic names
      (this project's :root has none to remap — guardrail 1; a future status
      colour must never route through the NOS scope)
    verify:
      kind: shell
      cmd: "! grep -Eiq -- '--(color-)?(success|warning|error|danger)' 'app/(marketing)/national-show/nos-theme.css'"

  - id: F1-09
    description: Cormorant Garamond and Jost are loaded via next/font/google
    verify:
      kind: shell
      cmd: "grep -q \"from 'next/font/google'\" 'app/(marketing)/national-show/layout.tsx' && grep -q 'Cormorant_Garamond' 'app/(marketing)/national-show/layout.tsx' && grep -q 'Jost' 'app/(marketing)/national-show/layout.tsx'"

  - id: F1-10
    description: the loaded fonts are bound to CSS variables (next/font `variable:` option), not applied as bare classNames only
    verify:
      kind: shell
      cmd: "grep -q 'variable:' 'app/(marketing)/national-show/layout.tsx'"

  - id: F1-11
    description: the retired circular badge logo is never referenced by new NOS code
    verify:
      kind: shell
      cmd: "! grep -rqi 'circular.*badge\\|badge.*logo' 'app/(marketing)/national-show/' 'components/nos/' 2>/dev/null; test $? -le 1"

  - id: F1-12
    description: the vendored emblem asset exists under public/images/nos/ and is an SVG (true vector, per D3)
    verify:
      kind: shell
      cmd: "ls public/images/nos/*.svg 2>/dev/null | grep -qi 'graminifolia\\|emblem'"

  - id: F1-13
    description: the vendored emblem SVG has no embedded <metadata> block (C2PA blob stripped per D3)
    verify:
      kind: shell
      cmd: "! grep -l '<metadata' public/images/nos/*.svg 2>/dev/null | grep -qi 'graminifolia\\|emblem'"

  # ---- F2/F3: primitives and composites render only through the F1 scope ----
  - id: F2-01
    description: NOS primitive components directory exists with at least Button, Badge, Card, SectionHeading, Logo, EmblemBadge
    verify:
      kind: shell
      cmd: "for f in Button Badge Card SectionHeading Logo EmblemBadge; do find components/nos -iname \"$f.tsx\" | grep -q . || exit 1; done"

  - id: F2-02
    description: no uppercase form-label transform is introduced (guardrail 4 — no text-transform on labels)
    verify:
      kind: shell
      cmd: "! grep -rEq 'text-transform:\\s*uppercase' components/nos/ 2>/dev/null || ! grep -rlq '<label' components/nos/ 2>/dev/null | xargs -r grep -lq 'uppercase'"

  - id: F3-01
    description: NosHero composite exists and applies a scrim over full-bleed photography
    verify:
      kind: shell
      cmd: "find components/nos -iname 'NosHero.tsx' | xargs grep -lqi 'scrim\\|gradient' "

  - id: F3-02
    description: NosHero only references the five rights-cleared production photographs (guardrail D5 — never the uncleared Ormerod set)
    verify:
      kind: shell
      cmd: "! find components/nos -iname 'NosHero.tsx' -exec grep -Eq 'ormerod' {} \\;"

  # ---- Cross-cutting: no fabricated content, whitespace-bug-safe rendered-copy checks ----
  - id: X-01
    description: >-
      new NOS files under app/(marketing)/national-show and components/nos do not
      hardcode invented people/venue/contact details (spot check: no @example
      emails, no placeholder phone patterns) outside of data-placeholder markers
      (hard rule — no fabricated content)
    verify:
      kind: shell
      cmd: "! grep -rEo '[A-Za-z0-9._%+-]+@(example|test)\\.[a-z]+' 'app/(marketing)/national-show/' components/nos/ 2>/dev/null | grep -q ."

  - id: X-02
    description: >-
      data-placeholder attribute count in national-show routes is non-decreasing
      versus origin/main (credible filler must stay marked, never silently
      promoted to real content nor silently dropped)
    verify:
      kind: shell
      cmd: "test $(git show origin/main -- 'app/(marketing)/national-show' | grep -o 'data-placeholder' | wc -l) -le $(grep -ro 'data-placeholder' 'app/(marketing)/national-show/' 2>/dev/null | wc -l)"

  - id: X-03
    description: >-
      rendered-copy checks (if any assert on visible text) must run against
      served HTML, never raw source — grep JSX source files directly for wording
      never proves a whitespace-bug-safe render
    verify:
      kind: agent_review
      note: >-
        Not mechanically checkable — this is a review discipline, not a
        property of any single file. QA must confirm any copy-wording
        assertion in later M1/M2 contracts curls localhost:3002 and inspects
        the served HTML/text, not app source. Kept as agent_review because the
        thing being verified is "did the reviewer test the right artifact",
        which has no file-based signature.

  # ---- Gate ----
  - id: GATE-01
    description: every /national-show route returns 200; /national-show/upcoming returns 308 by design
    verify:
      kind: shell
      cmd: "for r in national-show national-show/plan-your-visit national-show/what-to-expect national-show/faq national-show/archive national-show/exhibitors national-show/tickets national-show/vendors national-show/vendors/apply; do code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/$r); [ \"$code\" = \"200\" ] || exit 1; done; code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/national-show/upcoming); [ \"$code\" = \"308\" ]"

  - id: GATE-02
    description: production build exits 0
    verify:
      kind: shell
      cmd: "pnpm build"

  - id: GATE-03
    description: no `any` type in new NOS files
    verify:
      kind: shell
      cmd: "! grep -rnE ':\\s*any\\b|<any>|as any\\b' 'app/(marketing)/national-show/' components/nos/ 2>/dev/null | grep -q ."

  - id: GATE-04
    description: no unexplained type assertion (`as X`, excluding `as const`) without an adjacent explanatory comment in new NOS files
    verify:
      kind: shell
      cmd: "! grep -rnE '\\bas [A-Z][A-Za-z0-9_<>]*\\b' 'app/(marketing)/national-show/' components/nos/ 2>/dev/null | grep -v '//' | grep -q ."

  - id: GATE-05
    description: TypeScript strict-mode build passes
    verify:
      kind: shell
      cmd: 'pnpm tsc --noEmit 2>&1 | grep -c "error TS" | grep -q "^0$"'

phases:
  - id: 1
    assertions:
      - F1-01
      - F1-02
      - F1-03
      - F1-04
      - F1-05
      - F1-06
      - F1-07
      - F1-08
      - F1-09
      - F1-10
      - F1-11
      - F1-12
      - F1-13
  - id: 2
    assertions:
      - F2-01
      - F2-02
      - F3-01
      - F3-02
  - id: 3
    assertions:
      - X-01
      - X-02
      - X-03
  - id: 4
    assertions:
      - GATE-01
      - GATE-02
      - GATE-03
      - GATE-04
      - GATE-05
