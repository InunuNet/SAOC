schema: athanor.contract/v1
slug: beta-password-wall
goal: >
  M1/F1 — the Basic Auth wall itself. Brad, after a meeting with Lee-Ann
  (2026-10-06): "we need to put up a password wall for beta.saoc.co.za so the
  search and public don't find it by accident." This feature adds a new
  `proxy.ts` at the repo root (Next 16's canonical, non-deprecated convention —
  confirmed live in node_modules/next 16.2.12:
  node_modules/next/dist/lib/constants.js:287-290 defines both MIDDLEWARE_FILENAME
  ('middleware') and PROXY_FILENAME ('proxy') as equally resolvable filenames, but
  node_modules/next/dist/server/web/types.d.ts tags NextMiddleware/MiddlewareConfig
  `@deprecated` in favour of NextProxy/ProxyConfig; node_modules/next/dist/server/next-server.js:1193's
  loader accepts `middlewareModule.proxy || middlewareModule.middleware`, so the
  exported function must be named `proxy`, not `middleware`). It runs on literally
  every request (no `config.matcher` — Next's own documented default when one is
  absent is "every path"), satisfying "every page and asset" literally.

  DESIGN DECISION — HOST-AGNOSTIC, NOT A PRODUCTION-HOST ALLOWLIST (team-lead
  override, 2026-10-06, superseding this feature's own first draft): the wall,
  the X-Robots-Tag header, and robots.ts's disallow-all apply IDENTICALLY on
  every host this backend answers on — beta.saoc.co.za, any *.hosted.app
  preview origin, AND the real saoc.co.za apex — with zero host-matching logic
  anywhere. The first draft of this contract keyed all three off a
  `saoc.co.za`/`www.saoc.co.za` allowlist that auto-lifted the moment DNS
  migrated the real apex onto this backend. Rejected: the DNS/Resend migration
  (project memory project_domain_migration_resend_sequencing) can land before
  the council actually decides to launch publicly, and a host-based auto-lift
  would have silently removed every protection at that exact moment — precisely
  the accidental exposure this mission exists to prevent. Launch must be a
  deliberate act, never a side effect of an unrelated DNS/email sequencing
  change.

  DESIGN DECISION — the one explicit launch switch: new `lib/beta-public-launch.ts`
  exports `isPubliclyLaunched(flagValue)`, an EXACT, case-sensitive match
  against the literal string `'true'` for a new `SITE_PUBLIC_LAUNCH` env var.
  `'TRUE'`, `'1'`, an empty string, and unset all mean "stay walled" — fail
  closed, same principle as the credentials-unset branch below. This one plain
  RUNTIME env var (not a secret) is absent from apphosting.yaml entirely until
  the day the council decides to go public; F2 does not add it. `proxy.ts` (the
  wall + the X-Robots-Tag header) and the rewritten `app/robots.ts`
  (disallow-all vs. the real rules) both read this ONE function, so all three
  protections can only ever lift together, by the same one explicit action.

  DESIGN DECISION — fail-closed vs. bypass: `decideBasicAuth()` (the pure,
  NextRequest-free decision function, unit-tested directly by this feature's
  golden spec) treats "credentials not configured"
  (BETA_BASIC_AUTH_USER/PASSWORD unset) as DENY when `NODE_ENV === 'production'`
  (no credential could ever satisfy an unconfigured secret — this is what "fail
  closed" means here, not a special-cased error branch) and as ALLOW otherwise,
  so `pnpm dev` / `pnpm dev:secure` (NODE_ENV=development) and the Playwright e2e
  suite's webServer (also `next dev`, per playwright.config.ts's own header
  comment) keep working with zero setup, exactly per the mission's "local dev and
  Playwright e2e must keep working" requirement. This bypass is independent of
  `isPubliclyLaunched` and is NOT itself a way to ever lift the wall in
  production — it only ever applies when NODE_ENV !== 'production'.

  DESIGN DECISION — constant-time compare on the Edge runtime: `proxy.ts` has no
  `runtime: 'nodejs'` escape hatch available (confirmed:
  node_modules/next/dist/build/segment-config/middleware/middleware-config.d.ts's
  MiddlewareConfigInput exposes only `matcher`/`regions`/`unstable_allowDynamic`),
  so `node:crypto`'s `timingSafeEqual` is not available. `constantTimeEqual()`
  instead SHA-256-digests both inputs via Web Crypto (`crypto.subtle.digest`,
  available on the Edge runtime) to a fixed 32-byte length, then XOR-accumulates
  over every byte with no early return — the loop's timing depends only on the
  fixed digest length, never on the length or content of either input.

  DESIGN DECISION — exact-match exemption only: the 6 machine-to-machine webhook
  routes (PayFast/Ozow ITN x2 each, the Sanity revalidate webhook, the Cloud
  Scheduler reconcile-orders route — confirmed to exist at exactly these paths by
  `test -f` during contract authoring) are matched by `Set.has()` against the
  exact pathname, never a prefix/startsWith check, so a near-miss like
  `/api/tickets/itn-evil` or a traversal attempt is never accidentally exempted
  (WHATWG URL parsing already resolves `..` segments before `request.nextUrl.pathname`
  is read, so `/api/revalidate/../admin` normalises to `/api/admin`, which is not
  in the exempt set either way). This exemption is unconditional — it applies
  even when the site is publicly launched, since these routes' own
  signature/secret checks are the real gate either way.

  COPY RULED (team-lead, 2026-10-06): the 401 response's realm string (`Basic
  realm="SAOC Beta"`) and body (`Authentication required.`) are protocol
  boilerplate, not institutional copy — no further sign-off needed; keep as
  written in the golden below.

  RETRY 1 (2026-10-06) — CDN CACHE BYPASS, CRITICAL. @qa (deployed, F2) watched
  an UNAUTHENTICATED `curl https://beta.saoc.co.za/` return the full homepage
  (200, `cdn-cache-status: hit`, no challenge) for ~60s after one authenticated
  load. Firebase App Hosting fronts Cloud Run with Cloud CDN; proxy() passed the
  ISR page's own `Cache-Control: s-maxage=60, stale-while-revalidate=31535940`
  through untouched, the CDN stored the authenticated 200, and a cache hit never
  reaches proxy() at all. Reproduced at the origin against a local `next start`
  of the pre-fix build: `/` -> `s-maxage=60, ...`, `/privacy` ->
  `s-maxage=31536000` (one year), `/_next/static/*` -> `public, max-age=31536000,
  immutable`, robots/sitemap/favicon/og -> `public, max-age=0, must-revalidate`,
  remote `/_next/image` -> `public, max-age=2592000`.

  DESIGN DECISION — make every walled response unstorable at the edge, with two
  independent mechanisms from Cloud CDN's documented never-cache list
  (https://firebase.google.com/docs/app-hosting/optimize-cache, read via Alembic):
    1. `Cache-Control: private, no-store, max-age=0` set in proxy(). Proven to
       survive: Next copies proxy headers onto the response BEFORE rendering
       (node_modules/next/dist/server/lib/router-server.js:331-333 via
       resolve-routes.js:441-461) and only writes its own Cache-Control when none
       exists (server/send-payload.js:60, router-server.js:394). Verified on ISR,
       RSC payload, static, SSG, dynamic, robots, sitemap, API, public files and
       build chunks. 404s get Next's own `private, no-cache, no-store, ...`
       (base-server.js:1657) — equally unstorable.
    2. A `Set-Cookie: saoc_beta_wall=1` marker on every walled response. Needed
       because two paths overwrite Cache-Control after proxy runs: the image
       optimizer always writes `public, max-age=...`
       (server/image-optimizer.js:1180), and a route handler's own headers win
       (app/og ImageResponse ends up `private, no-store, max-age=0, public,
       max-age=0, must-revalidate`). Cloud CDN never caches a response carrying
       Set-Cookie, whatever its Cache-Control says.
  Both lift together with SITE_PUBLIC_LAUNCH at RUNTIME (verified: a launched
  `next start` of the same build serves `/` with Next's own `s-maxage=60, ...`
  restored and no marker cookie).

  OPTIONS REJECTED:
    (a-Vary) `Vary: Authorization`: Next REPLACES Vary on every page
      (build/templates/app-page.js:446) and image response
      (image-optimizer.js:1179), so it would be absent exactly where it matters.
    (b) next.config `headers()`: applied by the same pre-render header copy, so it
      is no stronger than setting it in proxy — and it cannot be conditional on a
      runtime env var without a rebuild, and A5 forbids touching next.config.ts.
    (c) force-dynamic everywhere: `dynamic` is a build-time segment config, so it
      cannot lift with the runtime SITE_PUBLIC_LAUNCH flag, and it would not
      cover static files, chunks or the image optimizer anyway.
    (d) `CDN-Cache-Control`: not among the directives App Hosting documents as
      honoured; the documented `private`/`no-store`/`Set-Cookie` rules are used
      instead.

  STATIC ASSETS: `/_next/static/*` stays walled AND private — not publicly cached.
  Build chunks carry client-component copy (unreleased page text), and Brad's
  instruction was "every page and asset". The cost is that beta testers' browsers
  re-download chunks on full page loads (client-side navigation keeps loaded chunks
  in memory). That is accepted for a pre-launch site and lifts with the flag.

  KNOWN LIMITATION, NOT FIXED HERE (reported separately to the orchestrator):
  `next/image` with a LOCAL src (e.g. the header logo /images/saoc-logo-ink-paper.png)
  returns 400 while walled — the optimizer's internal self-fetch
  (image-optimizer.js:994-1004, a mocked request with no headers) hits the wall
  and gets the 401 body. Verified: same build with SITE_PUBLIC_LAUNCH='true'
  serves it 200. Remote (cdn.sanity.io) sources are unaffected. Fixing it means
  exempting some asset paths from the wall, which is a scope decision, not part of
  this cache fix.

  CDN PURGE ON DEPLOY: none needed and none available — App Hosting has no purge
  API (docs/f1-cdn-purge-api-findings.md); a rollout is the purge. Entries stored
  before the fix carry `s-maxage=60` and Cloud CDN does not serve s-maxage entries
  stale, so nothing pre-fix survives the rollout.

  WHO WRITES WHAT: this contract's 4 golden files (`lib/beta-public-launch.ts`,
  `proxy.ts`, `app/robots.ts`, `e2e/beta-password-wall-decision.spec.ts`) are
  written directly by @architect, byte-for-byte, and stored under this spec's
  `goldens/` list. @dev's job for F1 is exactly four `cp` operations to the real
  target paths, nothing re-typed from prose — removing transcription risk
  entirely for a security-sensitive file. If @dev believes a golden is wrong,
  escalate to @architect rather than editing it.

  TRIAD PLACEMENT: this contract does NOT itself declare `codex_qa` or
  `browser_deployed_check` — F1 alone has nothing live to verify (deployment and
  the "401 unauthenticated / 200 authenticated / exempt webhooks untouched"
  proof is F2's own explicit scope). Per the same single-end-of-mission
  precedent menu-system-layout4/contract-f11.yaml set (one triad declaration
  covering that mission's whole tail, not one per feature), contract-f2.yaml
  carries the mission's one real `codex_qa` pass (scoped to BOTH features'
  combined diff) and the one real `browser_deployed_check` manifest, plus the
  explicit `gws_inbox_check` not-applicable statement. Not duplicated here —
  token-budget.md: "a second reviewer is not diligence, it is the same question
  asked again at full price."
created_at: '2026-10-06'
autonomy: high
features:
  - id: F1
    name: >-
      proxy.ts Basic Auth wall (host-agnostic) + lib/beta-public-launch.ts
      SITE_PUBLIC_LAUNCH switch + app/robots.ts disallow-all + golden
      decision-function test suite. Zero judgment calls left to @dev — four
      golden files, copied verbatim.
    status: pending
goldens:
  - .agent/memory/project/specs/beta-password-wall/goldens/lib-beta-public-launch.ts
  - .agent/memory/project/specs/beta-password-wall/goldens/proxy.ts
  - .agent/memory/project/specs/beta-password-wall/goldens/app-robots.ts
  - .agent/memory/project/specs/beta-password-wall/goldens/e2e-beta-password-wall-decision.spec.ts
  - .agent/memory/project/specs/beta-password-wall/goldens/check-cache-headers.mjs
assertions:
  phase: 4
  checks:
    - id: A1
      description: >
        lib/beta-public-launch.ts exists and is byte-identical to the golden
        @architect wrote. @dev's only job for this file is to copy it to
        exactly this path — no edits.
      command: >-
        test -f lib/beta-public-launch.ts
        && diff -q .agent/memory/project/specs/beta-password-wall/goldens/lib-beta-public-launch.ts lib/beta-public-launch.ts
      required: true

    - id: A2
      description: >
        proxy.ts exists at the repo root (NOT middleware.ts — the deprecated
        pre-Next-16 alias; see this contract's goal section for the exact
        source citation) and is byte-identical to the golden.
      command: >-
        test -f proxy.ts
        && diff -q .agent/memory/project/specs/beta-password-wall/goldens/proxy.ts proxy.ts
      required: true

    - id: A2b
      description: >
        REGRESSION GUARD: the deprecated middleware.ts filename was never
        created alongside (or instead of) proxy.ts — Next resolves whichever
        file exists first in its own internal order, and having both would be
        a silent footgun for whichever one Next picks.
      command: "! test -f middleware.ts"
      required: true

    - id: A3
      description: >
        app/robots.ts is byte-identical to the golden (replaces the existing
        static-rules file with the SITE_PUBLIC_LAUNCH-conditional,
        force-dynamic version).
      command: >-
        diff -q .agent/memory/project/specs/beta-password-wall/goldens/app-robots.ts app/robots.ts
      required: true

    - id: A4
      description: >
        e2e/beta-password-wall-decision.spec.ts exists and is byte-identical
        to the golden test file @architect wrote — @dev implements proxy.ts,
        lib/beta-public-launch.ts and app/robots.ts against this spec; the
        spec itself is not @dev's to edit.
      command: >-
        test -f e2e/beta-password-wall-decision.spec.ts
        && diff -q .agent/memory/project/specs/beta-password-wall/goldens/e2e-beta-password-wall-decision.spec.ts e2e/beta-password-wall-decision.spec.ts
      required: true

    - id: A5
      description: >
        SCOPE GUARD: none of the 6 exempt webhook route handlers, next.config.ts,
        or package.json are touched by this feature — the wall needs zero
        changes to the routes it exempts (each already does its own
        signature/secret check) and zero new dependencies (constant-time
        compare uses only built-in Web Crypto, never a new npm package). A
        whole-repo "nothing else changed" check is deliberately NOT used here:
        this branch already carries substantial unrelated, pre-existing
        uncommitted work (other missions' specs, mission bookkeeping files,
        an unrelated ticket-router feature) that such a check would falsely
        flag.
      command: >-
        git diff --quiet HEAD -- next.config.ts package.json
        app/api/tickets/itn/route.ts app/api/tickets/ozow-itn/route.ts
        app/api/vendors/stand-payment/payfast-itn/route.ts app/api/vendors/stand-payment/ozow-itn/route.ts
        app/api/revalidate/route.ts app/api/admin/reconcile-orders/route.ts
      required: true

    - id: A6
      description: >
        The full golden decision-function test suite passes against the real
        implementation — every unit-style case: exempt paths always allowed;
        near-miss paths (itn-evil, the traversal shape) NOT exempt;
        SITE_PUBLIC_LAUNCH exact-match semantics (only the literal 'true'
        lifts the wall; 'TRUE'/'1'/empty/unset all stay walled); fail-closed
        in production when credentials are unset; bypass outside production
        when unset; no/wrong/malformed Authorization header denied; correct
        credentials allowed; constant-time compare correctness including
        different-length inputs; and the end-to-end proxy() response shape
        (401 + WWW-Authenticate + noindex when denied, 200 + noindex when
        allowed-but-not-launched, 200 + no noindex/challenge once
        SITE_PUBLIC_LAUNCH='true' even on the real production host with no
        Authorization header at all, and still walled when the flag is
        'TRUE' with the wrong case).
      command: "npx playwright test e2e/beta-password-wall-decision.spec.ts"
      required: true

    - id: A7
      description: >
        Project-wide type-check stays green — the two new files and the
        robots.ts rewrite introduce no type errors (new `@/lib/beta-public-launch`
        import resolves via the existing `@/*` tsconfig path alias; confirmed
        present at tsconfig.json:26-27 during contract authoring).
      command: "pnpm type-check"
      required: true

    - id: A8
      description: >
        Lint stays green on the 3 new/changed source files (not the generated
        test file, which ESLint's own config may legitimately treat
        differently — scoping this check to exactly what @dev wrote avoids a
        false negative from pre-existing, unrelated lint debt elsewhere in the
        repo).
      command: "npx eslint proxy.ts lib/beta-public-launch.ts app/robots.ts contracts/checks/beta-password-wall/check-cache-headers.mjs"
      required: true

    - id: A9
      description: >
        RETRY 1: the production header checker exists at
        contracts/checks/beta-password-wall/check-cache-headers.mjs and is
        byte-identical to the golden (@dev copies it; @dev does not edit it).
      command: >-
        test -f contracts/checks/beta-password-wall/check-cache-headers.mjs
        && diff -q .agent/memory/project/specs/beta-password-wall/goldens/check-cache-headers.mjs contracts/checks/beta-password-wall/check-cache-headers.mjs
      required: true

    - id: A10
      description: >
        RETRY 1 — PRODUCTION-SERVER HEADER PROOF. Builds, then starts a real
        `next start` twice on a free port (throwaway random credentials, never
        printed; the server is always killed) and asserts: (walled) every
        authenticated and anonymous response across ISR, RSC, static, SSG,
        dynamic, 404, robots, sitemap, API, public file, favicon, build chunk,
        local + remote /_next/image and /og carries the Set-Cookie marker and
        X-Robots-Tag noindex; every path whose Cache-Control Next honours ends
        private + no-store with no public/s-maxage; every anonymous response is
        401 + Basic challenge + the wall's exact Cache-Control; (launched,
        SITE_PUBLIC_LAUNCH='true') `/` is 200 with Next's own s-maxage restored
        and no marker or noindex. Negative control, run during design against the
        pre-fix proxy: exit 1, 28 problems. The build log goes to .tmp/ so a build
        failure is still visible.
      command: "pnpm build > .tmp/beta-wall-build.log 2>&1 && node contracts/checks/beta-password-wall/check-cache-headers.mjs"
      required: true
