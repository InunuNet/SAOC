schema: athanor.contract/v1
slug: saoc-content-standard
goal: Rename the Constitution to Memorandum of Incorporation with a 308 redirect, and remove site-written society copy and the 21-societies figures that are not Lee-Ann's.
created_at: '2026-10-25'
autonomy: high
features:
  - id: F2
    name: Lee-Ann SAOC copy fixes (MOI rename, society copy removal, 21 figure removal)
