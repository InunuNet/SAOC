assertions:
  phase: 4
  checks:
    - id: A1
      description: f4 check scripts and goldens are unmodified since @architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/nos-critique-r9/goldens/checks-f4.sha256
    - id: A2
      description: Footprint (stacked branch) - f1..f4 paths and docs/nos-critique-r9.md only; nothing off limits
