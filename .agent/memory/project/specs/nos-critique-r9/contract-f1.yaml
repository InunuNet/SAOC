# Sources: Codi FINAL lockup delivery ruling relayed by the lead (2026-10-17), measurements in goldens/f1-baseline.json. No new copy.
schema: athanor.contract/v1
slug: nos-critique-r9
goal: >-
  Cut the eager NOS lockup download from 537KB to at most 80KB on a fresh /national-show load at 1280 and 390 in .tmp/sandbox/critique-r9, changing delivery only (next/image header kept eager and high priority, ONE lazy picture in the footer with the vertical at 700px and below), with the artwork, boxes, aspect ratios and alt text unchanged.
  Exit criterion (Brad via the lead; design-cb's rulings are final): this feature loops build, critique, fix until impeccable scores >= 39/40 with
  P0/P1/P2 = 0 AND design-cb PASSes. The lead runs that loop and relays the PASS; the gate below stays mechanical.
created_at: '2026-10-17'
autonomy: high
exclusions:
  - item: 'every file but NosHeader.tsx, NosFooter.tsx, nos-chrome.css'
    reason: 'Enforced by A2 (stacked footprint, goldens/f1-footprint.json). branding/ and public/images/nos are read-only.'
features:
  - id: F1
    name: Lockup image delivery in nos-chrome
    status: pending
goldens:
  - .agent/memory/project/specs/nos-critique-r9/goldens/f1-spec.md
  - .agent/memory/project/specs/nos-critique-r9/goldens/f1-baseline.json
  - .agent/memory/project/specs/nos-critique-r9/goldens/f1-footprint.json
  - .agent/memory/project/specs/nos-critique-r9/goldens/checks-f1.sha256
assertions:
  phase: 4
  checks:
    - id: A1
      description: f1 check scripts and goldens are unmodified since @architect wrote them
      command: shasum -a 256 -c .agent/memory/project/specs/nos-critique-r9/goldens/checks-f1.sha256
    - id: A2
      description: Footprint (stacked branch) - f1..f4 paths and docs/nos-critique-r9.md only; nothing off limits
      command: node .agent/memory/project/specs/nos-critique-r9/checks/f1-footprint.mjs
    - id: A3
      description: Static S1-S5 - header uses next/image with priority and sizes, footer is ONE picture with a max-width 700px source and a lazy async img with no fetchPriority, source paths and alt unchanged, docs exist
      command: node .agent/memory/project/specs/nos-critique-r9/checks/f1-static.mjs
    - id: A4
      description: TypeScript compiles and ESLint is clean with zero warnings
      command: sh -c 'pnpm --dir .tmp/sandbox/critique-r9 type-check && pnpm --dir .tmp/sandbox/critique-r9 exec eslint --max-warnings 0 components/nos-chrome components/nos components/show "app/(marketing)/national-show"'
    - id: A5
      description: Production build passes (input for the rendered check)
      command: pnpm --dir .tmp/sandbox/critique-r9 build
    - id: A6
      description: Rendered on next start 3010-3019 (public) at 1280, 701, 700 and 390 - header lockup only before scroll, exactly one footer lockup after scroll, at most 80KB total, no original PNG, same boxes and aspect and alt, header eager and high, footer lazy and async, no lockup layout shift
      command: node .agent/memory/project/specs/nos-critique-r9/checks/f1-rendered.mjs
