schema: athanor.contract/v1
spec: .agent/memory/project/specs/2026-05-11-example-feature.md
created_at: 2026-05-11T12:00:00Z
assertions:
  - id: A1
    description: "make test exits 0 after feature is implemented"
    severity: blocker
    rationale: "Existing tests must still pass"
    verify:
      kind: shell
      cmd: "make test"
      expect_exit: 0
  - id: A2
    description: "New schema file exists at expected path"
    severity: blocker
    verify:
      kind: file_exists
      path: ".agent/schemas/validation_contract.v1.json"
  - id: A3
    description: "QA handoff contains assertions array"
    severity: major
    verify:
      kind: handoff_field
      jsonpath: "$.assertions"
  - id: A4
    description: "Spec workflow requires contract before approval gate"
    severity: major
    verify:
      kind: agent_review
      rubric: |
        Read .agent/workflows/spec.md. Confirm Phase 2.5 exists as a mandatory
        step that calls contract.py validate before proceeding. PASS only if the
        validate call is present and the workflow states failure halts the spec.
phases:
  - id: 1
    name: "Schema and CLI"
    assertions: [A1, A2]
  - id: 2
    name: "Workflow and agent integration"
    assertions: [A3, A4]
coverage:
  all_assertions_have_phase: true
