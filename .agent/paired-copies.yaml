# Paired copies — pairs are DATA, not code.
#
# BINDING RULING (Brad, 2026-09-01): "AGENTS.md should be the default and all
# others cloned from it." Each `copy` below is a REAL FILE regenerated
# byte-for-byte from its `source` by `make sync-clones`
# (execution/paired_copies.py). Never edit a copy: the generator refuses to
# overwrite a locally edited one, and the gate fails it by name.
#
# `enforce: clone` means byte-identical and is the only mode implemented. An
# unknown mode is an ERROR, never a silent skip — a pair that appears covered
# and is not is worse than an uncovered one.
#
# Adding a row requires NO code change. `enforce: mirror` pairs two
# DIRECTORIES: every file present under both must be byte-identical, and a
# file on one side only is allowed (template/ carries a subset). Mirrors bind
# the harness checkout only. Registered 2026-09-29 after the execution/ ->
# template/execution/ copy was missed at least 7 times, each caught by chance.
schema: athanor.paired-copies/v1
pairs:
  - copy: CLAUDE.md
    source: AGENTS.md
    enforce: clone
  # Root rules.md pair retired 2026-09-18 (make-audit-restore F2): the root
  # copy was an orphaned stale-partial duplicate, not a real clone target —
  # deleted along with the other stray root files. No paired copy remains
  # to register; the canonical file lives only at
  # .agent/memory/project/rules.md.
  - copy: template/execution
    source: execution
    enforce: mirror
