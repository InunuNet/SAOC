name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily detection backstop for dataset-residue-guard: main has no branch
    # protection, so a red push/PR job blocks nothing, and residue written outside a
    # PR (e.g. by a check's mutation path, as in the 2026-08-15 incident) would
    # otherwise sit undetected until someone next opens a PR. Daily is sufficient —
    # this is a backstop, not a real-time monitor. See
    # contracts/golden/dataset-residue-guard/README.md.
    - cron: '0 3 * * *'

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      # Must mirror apphosting.yaml's BUILD-availability variables — no more, no less.
      # If CI has credentials the App Hosting builder lacks, a green CI says nothing
      # about whether the deploy will succeed. That is not hypothetical: /tickets
      # prerendered against the Firebase Admin SDK (RUNTIME-only creds) and broke every
      # deploy from early August to 2026-08-13 while CI stayed green throughout.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      # A literal, not a secret: the dataset name is public and is already plaintext in
      # apphosting.yaml. It was previously read from a secret that had never been created,
      # so it resolved to "" — and `dataset ?? 'production'` does NOT fall back on an empty
      # string, so every sanityFetch in CI threw, salesOpen resolved false, and the admin
      # call behind `if (salesOpen)` was never reached. CI was too broken to see the bug.
      NEXT_PUBLIC_SANITY_DATASET: production
      # The remaining BUILD-availability entries from apphosting.yaml, as literals for the
      # same reason: all are NEXT_PUBLIC_* and already plaintext there. Deliberately absent,
      # because the builder does not get them either: FIREBASE_ADMIN_*, SANITY_API_TOKEN,
      # SANITY_REVALIDATE_SECRET, SITE_URL and the PAYFAST_* secrets are all RUNTIME-only.
      # Do not "fix" a CI failure by adding one of those here — that hides a real deploy break.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAfJhvCRX705OYTH6CN7WqfGO5DDpnss6Y
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: saoc-webapp.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: saoc-webapp
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: saoc-webapp.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1003063203247"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1003063203247:web:77f89e8963900274060b5a"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Match apphosting.yaml's runConfig.runtime (nodejs22). CI previously ran 20,
          # so it exercised a different Node than the builder and the deployed server.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      # ADDED 2026-09-08 (mission ticketing-complete M1/F7) — folds the Playwright
      # self-test harness into CI so it doesn't join the pile of specs that exist on
      # disk and never run again after their author's one-time invocation (see the
      # backlog item "nothing in this repo runs the contract checks"). Landed
      # alongside lint/type-check/build, not replacing them. DETECTION-ONLY: `main`
      # carries no branch protection today, so a red step here blocks nothing until
      # Brad turns branch protection on — see goldens/f7-README.md §8.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      # ADDED 2026-09-08 (mission ticketing-complete M1/F7, contract-f7.yaml A20/A25/
      # A29), corrected 2026-09-08 after a Codex GPT-5.5 review caught this comment
      # over-claiming — see contract-f7.yaml A30. This step is an INVENTORY ratchet,
      # not an assertion-execution gate: it walks every contracts/*.yaml AND
      # .agent/memory/project/specs/**/contract*.yaml file and counts two kinds of
      # coverage debt WITHOUT running any assertion's actual command —
      # (1) "missing": a shell assertion whose referenced check script under
      # contracts/checks/ doesn't exist on disk, and (2) "parse-error": a whole
      # contract file that fails to parse as YAML, so every assertion inside it has
      # never run and never will. RATCHET, not hard-fail on either count: fails only
      # if missing OR parse-error EXCEEDS the committed baseline
      # (contracts/checks/_shared/missing-baseline.json) — existing debt is
      # tolerated, new debt is impossible. Output is NEVER suppressed (no /dev/null,
      # no --quiet) so every currently-missing id and every currently-unparseable
      # file is visible in this step's own log even when it passes — a count alone
      # tells nobody which coverage is imaginary.
      #
      # WHAT THIS STEP DOES NOT DO: it does not execute a single contract assertion's
      # command, so it can never produce a `fail` status and never catches a real,
      # currently-failing contract assertion — that would mean running ~2000+ shell
      # commands in CI, some of which invoke `pnpm build` or hit live endpoints, which
      # is not viable here. If a real fail-detecting gate is ever wanted, that is a
      # separate feature with its own contract, not a silent scope-creep of this one.
      - name: Contract-check inventory ratchet (missing scripts + unparseable contracts)
        run: node contracts/checks/_shared/run_contract_suite.mjs --check-ratchet contracts/checks/_shared/missing-baseline.json

  dataset-residue-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan live Sanity dataset for test residue
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: pnpm exec tsx scripts/scan-dataset-residue.ts

  firestore-residue-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Firestore admin secrets are configured
        id: creds
        run: |
          if [ -n "${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan live Firestore for test residue
        if: steps.creds.outputs.present == 'true'
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
        run: pnpm exec tsx scripts/scan-firestore-residue.ts
      - name: No Firestore admin secrets — scan not run
        if: steps.creds.outputs.present == 'false'
        run: |
          echo "::warning::firestore-residue-guard SKIPPED — FIREBASE_ADMIN_PROJECT_ID/_CLIENT_EMAIL/_PRIVATE_KEY are not configured as repo secrets (verified via 'gh secret list' 2026-08-16). This is NOT a clean scan result. Add these three secrets to enable live Firestore residue detection in CI. See contracts/golden/firestore-residue-guard/README.md."
