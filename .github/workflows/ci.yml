name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily detection backstop for dataset-residue-guard: main has no branch
    # protection, so a red push/PR job blocks nothing, and residue written outside a
    # PR (e.g. by a check's mutation path, as in the 2026-08-15 incident) would
    # otherwise sit undetected until someone next opens a PR. Daily is sufficient —
    # this is a backstop, not a real-time monitor. See
    # contracts/golden/dataset-residue-guard/README.md.
    - cron: '0 3 * * *'

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      # Must mirror apphosting.yaml's BUILD-availability variables — no more, no less.
      # If CI has credentials the App Hosting builder lacks, a green CI says nothing
      # about whether the deploy will succeed. That is not hypothetical: /tickets
      # prerendered against the Firebase Admin SDK (RUNTIME-only creds) and broke every
      # deploy from early August to 2026-08-13 while CI stayed green throughout.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      # A literal, not a secret: the dataset name is public and is already plaintext in
      # apphosting.yaml. It was previously read from a secret that had never been created,
      # so it resolved to "" — and `dataset ?? 'production'` does NOT fall back on an empty
      # string, so every sanityFetch in CI threw, salesOpen resolved false, and the admin
      # call behind `if (salesOpen)` was never reached. CI was too broken to see the bug.
      NEXT_PUBLIC_SANITY_DATASET: production
      # The remaining BUILD-availability entries from apphosting.yaml, as literals for the
      # same reason: all are NEXT_PUBLIC_* and already plaintext there. Deliberately absent,
      # because the builder does not get them either: FIREBASE_ADMIN_*, SANITY_API_TOKEN,
      # SANITY_REVALIDATE_SECRET, SITE_URL and the PAYFAST_* secrets are all RUNTIME-only.
      # Do not "fix" a CI failure by adding one of those here — that hides a real deploy break.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAfJhvCRX705OYTH6CN7WqfGO5DDpnss6Y
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: saoc-webapp.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: saoc-webapp
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: saoc-webapp.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1003063203247"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1003063203247:web:77f89e8963900274060b5a"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Match apphosting.yaml's runConfig.runtime (nodejs22). CI previously ran 20,
          # so it exercised a different Node than the builder and the deployed server.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

  dataset-residue-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan live Sanity dataset for test residue
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: node --import tsx/esm scripts/scan-dataset-residue.ts
