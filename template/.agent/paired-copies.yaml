# Paired copies — pairs are DATA, not code.
#
# Each `copy` below is a REAL FILE regenerated byte-for-byte from its `source`
# by `make sync-clones` (execution/paired_copies.py). Never edit a copy: the
# generator refuses to overwrite a locally edited one, and `make audit` fails it
# by name.
#
# They are real files rather than symlinks because a tracked symlink checks out
# as a small text stub on any default Windows clone (Git for Windows ships
# core.symlinks=false at SYSTEM scope) with `git status` reporting nothing —
# costing the agent its whole instruction file, silently.
#
# `enforce: clone` means byte-identical and is the only mode implemented. An
# unknown mode is an ERROR, never a silent skip. Adding a row requires NO code
# change.
schema: athanor.paired-copies/v1
pairs:
  - copy: CLAUDE.md
    source: AGENTS.md
    enforce: clone
  - copy: GEMINI.md
    source: AGENTS.md
    enforce: clone
